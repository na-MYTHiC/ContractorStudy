pic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"63"}],"exp":"When an account can't be collected, **reverse the income** you previously recorded by writing it off as bad debt.","ref":["Builders Guide to Accounting  ·  63"]},{"id":"2-69","exam":2,"num":69,"stem":"What must an owner do if a change of ownership occurs for an entity with a Fictitious Name?","options":["Advise the Department of Professional Regulations within 30 days of change","Establish a new Fictious Name within 45 days","Record a cancelation and registration of the name within 30 days of change","Advise the Department of Professional Regulations within 10 days of change"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"If ownership of a fictitious-name business changes, **cancel the old registration and register the name again within 30 days**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14","2017: 1-15"]},{"id":"2-70","exam":2,"num":70,"stem":"An applicant must have at least __________ years' experience for a limited license.","options":["Ten","Five","Twenty","Fifteen"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"A limited license under §455.214 requires at least **10 years** of licensure.","ref":["Florida Statute 455  ·  455.214(2)"]},{"id":"2-71","exam":2,"num":71,"stem":"Which of the following is not true regarding the requirement to notify the Board?","options":["Notification of address change must be made within 15 days","Notification of address change must be made within 30 days","Notification of termination of affiliation of a qualifying agent with a business organization within 30 days","Notification of any changes required on the application for qualification of a business organization within 45 days"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-173","stat":"61G4-15.007"},{"book":"FCM","eds":["2021"],"loc":"2-133","stat":"61G4-15.007"},{"book":"FCM","eds":["2017"],"loc":"2-159","stat":"61G4-15.007"}],"exp":"Per the answer key (61G4-15.007), **\"address change within 15 days\" is the statement that is NOT true**. The rule's notification deadlines quoted in the manual are 30 days and 45 days.","ref":["Florida Contractors Manual  ·  2025: 2-173, 61G4-15.007","2021: 2-133, 61G4-15.007","2017: 2-159, 61G4-15.007"]},{"id":"2-72","exam":2,"num":72,"stem":"When using Declining Balance depreciation what is depreciated on a 200 percent declining balance with a remaining balance of an average of four years?","options":["Light trucks","Machinery and equipment and small tools","Computers and office equipment","Residential property"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"166"}],"exp":"Per the Builder's Guide, the 200% declining balance class with an average 4-year remaining life covers **machinery, equipment and small tools**.","ref":["Builders Guide to Accounting  ·  166"]},{"id":"2-73","exam":2,"num":73,"stem":"When a contractor performs three categories of work how many qualifying agents are required?","options":["Only one qualifying agent is required per business","Three, one for each category of work","Two, one for the core business and one for the total of work categories","Four, one for the core business and one for each of the work categories"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-23","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2025"],"loc":"2-99","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-22","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-76","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-20","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-87","stat":"489.119(3)(a)"}],"exp":"Per the manual's reading of §489.119, a business performing work in three license categories needs **a qualifying agent for each category, so three**.","ref":["Florida Contractors Manual  ·  2025: 2-23, 2-99, 489.119(3)(a)","2021: 2-22, 2-76, 489.119(3)(a)","2017: 2-20, 2-87, 489.119(3)(a)"]},{"id":"2-74","exam":2,"num":74,"stem":"The purpose of the subsidiary ledger is to __________.","options":["Track all subsidized income sources","Keep the main ledger uncluttered and provide useful information","Track expenses that are billed","Track back ordered inventory"],"answer":1,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-45"}],"exp":"Subsidiary ledgers (accounts receivable, accounts payable, job cost) hold the detail so the **general ledger stays uncluttered** but the information is still available.","ref":["Florida Contractors Manual  ·  3-45"]},{"id":"2-75","exam":2,"num":75,"stem":"When selling an item to a company that is not tax exempt for $200 and the sales tax rate is 7% what will be reflected on the journal?","options":["Two separate credit entries, one of $200 and the other for $14.00","One credit entry of $214.00","One credit entry of $200 and one debit entry of $14.00","Two separate debit entries of $200 and $14.00"],"answer":0,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-64"}],"exp":"A $200 taxable sale at 7%: debit cash or accounts receivable $214. Then **two credits: Sales $200 and Sales Tax Payable $14**. The tax is a liability you owe the state, not revenue.","ref":["Florida Contractors Manual  ·  3-64"]},{"id":"2-76","exam":2,"num":76,"stem":"Which of the following are eligible for limited licenses?","options":["Limited licenses may be granted to out of state contractors after a hurricane","There is no provision for the issuance of limited licenses","Limited licenses may only be obtained by specialty contractors","Limited licenses may be granted to retired professionals in good standing to serve the indigent and underserved"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(1)"}],"exp":"§455.214: limited licenses go to **retired professionals in good standing who will serve indigent and underserved** populations.","ref":["Florida Statute 455  ·  455.214(1)"]},{"id":"2-77","exam":2,"num":77,"stem":"If a contractor makes a false statement of insurance coverage, and this is his third offense, the minimum punishment is ________________________.","options":["$2,500 fine","$2,500 fine and/or probation or suspension","$5,000 fine","$5,000 fine and/or probation or suspension"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-205","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2021"],"loc":"2-160","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2017"],"loc":"2-186","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2017"],"loc":"2-187","stat":"61G4-17.001(k)2."}],"exp":"61G4-17.001: a **third** offense of falsely stating insurance coverage carries a minimum penalty of a **$5,000 fine and/or probation or suspension**.","ref":["Florida Contractors Manual  ·  2025: 2-205, 61G4-17.001(k)2.","2021: 2-160, 61G4-17.001(k)2.","2017: 2-186, 2-187, 61G4-17.001(k)2."]},{"id":"2-78","exam":2,"num":78,"stem":"When the Department designates mediation for a licensee, how many days following resolution of the complaint by the complainant and the licensee must the mediator be advised of the resolution?","options":["14 days after contact by the mediator","21 days after contact by the mediator","30 days after contact by the mediator","60 days after contact by the mediator"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2235(2)"}],"exp":"§455.2235(2): when a complaint is resolved through DBPR-designated mediation, the parties must tell the mediator within **14 days** after the mediator contacts them.","ref":["Florida Statute 455  ·  455.2235(2)"]},{"id":"2-79","exam":2,"num":79,"stem":"Proper inventory control planning can do which of the following?","options":["Increase accounts receivables","Increase volume of work","Allow multiple jobs of different scope","Eliminate unneeded working capital expenditures"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"119"}],"exp":"Good inventory control planning **eliminates unneeded working capital spending**, so cash isn't tied up in stock.","ref":["Builders Guide to Accounting  ·  119"]},{"id":"2-80","exam":2,"num":80,"stem":"Which of the following is not true concerning a S Corporation?","options":["They have multiple classes of stock","20% or more of revenue must be domestically generated","Only estates or individual can be shareholders","It must be a domestic entity"],"answer":0,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-11"},{"book":"FCM","eds":["2025"],"loc":"1-12"},{"book":"FCM","eds":["2021"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"An S corporation can have **only one class of stock**, so \"multiple classes of stock\" is false. It must also be domestic and have limited, eligible shareholders.","ref":["Florida Contractors Manual  ·  2025: 1-11, 1-12","2021: 1-12","2017: 1-13"]},{"id":"2-81","exam":2,"num":81,"stem":"For what period must examination scores for each applicant be maintained by the Department?","options":["No less than three years immediately following the examination","No less than two years immediately following the examination","No less than one year immediately following the examination","No less than five years immediately following the examination"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.217(4)"}],"exp":"§455.217(4): DBPR keeps each applicant's exam scores for at least **2 years** after the exam.","ref":["Florida Statute 455  ·  455.217(4)"]},{"id":"2-82","exam":2,"num":82,"stem":"___________ is the purpose of the accrual accounting method.","options":["To record revenue when earned","To record expense when incurred","To track the timely payment of accounts receivables","Both A and B"],"answer":3,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-17"}],"exp":"The accrual method **records revenue when earned and expenses when incurred**, whether or not cash has moved. Both A and B.","ref":["Florida Contractors Manual  ·  3-17"],"lock":1},{"id":"2-83","exam":2,"num":83,"stem":"Who assumes responsibility for the accuracy of the shop drawings and samples once submitted by the contractor to the architect for review?","options":["The architect","Review by the architect does not release the contractor from the responsibility","Both the contractor and architect since they have both reviewed the submissions","The owner as well as his contractor and architect since they all have reviewed the submissions"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"4.2.7"}],"exp":"A201 §4.2.7: the Architect's review of shop drawings and samples **doesn't relieve the Contractor** of responsibility for their accuracy.","ref":["AIA Document A201, 2017  ·  4.2.7"]},{"id":"2-84","exam":2,"num":84,"stem":"__________ are all types of assets.","options":["Fixed, current and tangible","Fixed, intangible and current","Fixed, variable, tangible","Fixed, variable and current"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"252-253"}],"exp":"The asset types are **fixed, intangible and current**. \"Variable\" describes expenses, not assets.","ref":["Builders Guide to Accounting  ·  252-253"]},{"id":"2-85","exam":2,"num":85,"stem":"__________ is the act of setting up a piece of equipment on your general ledger.","options":["Establishing the depreciation schedule","Establishing the amortization schedule","Converting a long-term asset to a current asset","Capitalizing the expense"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"155"}],"exp":"**Capitalizing the expense** means putting equipment on the books as a fixed asset instead of expensing it, and then depreciating it.","ref":["Builders Guide to Accounting  ·  155"]},{"id":"2-86","exam":2,"num":86,"stem":"__________ overhead costs vary related to sales volume.","options":["Commission","Advertising","Phone Service","Utilities"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"141"}],"exp":"**Commissions** go up and down with sales volume. Advertising, phone and utilities are relatively fixed.","ref":["Builders Guide to Accounting  ·  141"]},{"id":"2-87","exam":2,"num":87,"stem":"Which of the following are advantages of Corporations?","options":["They are closely regulated","Stockholders are not exempt from liability","They are taxed only once","Fringe benefits are tax deducible"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-11"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A corporate advantage: **fringe benefits are tax-deductible** to the corporation. Heavy regulation and double taxation are disadvantages, and stockholders do have limited liability.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-11","2017: 1-13"]},{"id":"2-88","exam":2,"num":88,"stem":"In what time period must the Department issue a citation after the filing of a complaint against a licensee?","options":["Thirty days","Two months","One year","Six months"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.224(4)"}],"exp":"§455.224(4): a citation must be issued within **6 months** after the complaint is filed.","ref":["Florida Statute 455  ·  455.224(4)"]},{"id":"2-89","exam":2,"num":89,"stem":"What can a high inventory ratio indicate about your business?","options":["You practice First In, First Out inventory controls","Your inventory is too low and could adversely affect sales","Your average inventory is too high","You inventory levels are higher than those of your competitors"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"A high inventory turnover ratio means inventory is moving fast and may be **too low**, so you could run short and lose sales.","tip":"High ratio = low inventory.","ref":["Builders Guide to Accounting  ·  121"]},{"id":"2-90","exam":2,"num":90,"stem":"Which of the following accounting methods is used to allocate costs and expenses incurred to a project to determine if the budget is met?","options":["Project cost method","Accrual method","Cost accounting","Cash flow analysis method"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-65"},{"book":"FCM","eds":null,"loc":"3-106"}],"exp":"**Cost accounting** assigns costs and expenses to each project so you can compare actual costs with the budget.","ref":["Florida Contractors Manual  ·  3-65, 3-106"]},{"id":"2-91","exam":2,"num":91,"stem":"Who prepares and signs all change orders?","options":["Only the architect is required to prepare and sign change orders","The architect prepares and the owner signs off on the change","The architect prepares and signs and then the owner and contractor sign","The contractor prepares and the owner and architect sign"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: the **Architect prepares and signs the change order, then the Owner and Contractor sign** it.","ref":["AIA Document A201, 2017  ·  7.2.1"]},{"id":"2-92","exam":2,"num":92,"stem":"Which of the following steps are included in the preparation of a company's payroll?","options":["Determining each employees' gross earnings","Determining each employee's deductions","Calculating the employer's associated payroll expenses","All the above"],"answer":3,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-47"},{"book":"FCM","eds":null,"loc":"3-48"}],"exp":"Payroll preparation includes figuring each employee's gross pay, each employee's deductions, and the employer's own payroll expenses. **All of the above**.","ref":["Florida Contractors Manual  ·  3-47, 3-48"],"lock":1},{"id":"2-93","exam":2,"num":93,"stem":"When is it a good idea to remove a fully depreciated asset from your book?","options":["At the end of its economic life","When you can afford to buy additional but not replacement equipment","Only when the equipment is sold, abandoned or traded","When you have exhausted all tax credits"],"answer":2,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"170"}],"exp":"Keep a fully depreciated asset on the books **until it's sold, abandoned or traded**.","ref":["Builders Guide to Accounting  ·  170"]},{"id":"2-94","exam":2,"num":94,"stem":"The Department can __________ with the $5.00 fee that is included in the current licensee fee.","options":["Educate the public regarding unlicensed activity","Transfer the funds to the State of Florida's general budget account","Subsidize the application fee for applicants from the indigent community","Reimburse the public when damaged by unlicensed workers"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2281"}],"exp":"§455.2281: the $5 unlicensed activity fee pays for **educating the public about unlicensed activity** and for enforcement against it.","ref":["Florida Statute 455  ·  455.2281"]},{"id":"2-95","exam":2,"num":95,"stem":"Which of the following is true about depreciation?","options":["It only applies to property that appreciates in value","You cannot depreciate intangible property","You may change the method by which you calculate depreciation with your Accountant's written explanation to the IRS","Obsolescence is of no consequence when determining how to depreciate assets"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"162"}],"exp":"Per the Builder's Guide, **intangible property can't be depreciated** (it is amortized instead). Changing depreciation methods requires IRS approval.","ref":["Builders Guide to Accounting  ·  162"]},{"id":"2-96","exam":2,"num":96,"stem":"How many days prior to the date established for payment shall the contractor submit a request for payment and to whom?","options":["14 days submitting to the owner for payment","14 days submitting to the architect","10 days submitting to the owner for payment","10 days submitting to the architect for payment"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.3.1"}],"exp":"A201 §9.3.1: submit the Application for Payment **10 days** before the payment date, **to the Architect**.","ref":["AIA Document A201, 2017  ·  9.3.1"]},{"id":"2-97","exam":2,"num":97,"stem":"Which of the following are reasons to maintain employee timecards?","options":["Employees can use them to file their taxes with the IRS","Can be used in unemployment disputes","They can be used to calculate annual bonus amounts","The IRS requires they be kept for 5 years"],"answer":1,"topic":"tax","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"127"}],"exp":"Timecards prove hours worked, so they're useful evidence in **unemployment claims and disputes**.","ref":["Builders Guide to Accounting  ·  127"]},{"id":"2-98","exam":2,"num":98,"stem":"How long is a Fictious Name valid for and when do they expire?","options":["3 years and expire on December 31st of the third year","5 years and expire on December 31st of the fifth year","10 years and expire on the anniversary date of filing","They never expire nor need renewing if the entity remains active"],"answer":1,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-15"},{"book":"FCM","eds":["2021"],"loc":"1-15"},{"book":"FCM","eds":["2017"],"loc":"1-14"}],"exp":"A fictitious name registration is valid **5 years and expires December 31 of the fifth year**.","ref":["Florida Contractors Manual  ·  2025: 1-15","2021: 1-15","2017: 1-14"]},{"id":"2-99","exam":2,"num":99,"stem":"Which one of the following is not accomplished through good inventory controls?","options":["Reduces the need for storage","Reduces taxes and insurance and other costs","Reduces exposure of materials to theft","Reduces the need to backorder inventory"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"Good inventory control reduces storage, carrying costs (taxes, insurance) and theft exposure. **Reducing the need to backorder is not** one of its results.","ref":["Builders Guide to Accounting  ·  121"]},{"id":"2-100","exam":2,"num":100,"stem":"The current ratio is calculated by __________.","options":["Adding cash and accounts receivable and dividing by liabilities","Dividing current liabilities by current assets","Dividing current assets by current liabilities","Comparing the total loan debt to current income"],"answer":2,"topic":"ratio","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-89"}],"exp":"Current ratio = **current assets ÷ current liabilities**.","ref":["Florida Contractors Manual  ·  3-89"]},{"id":"2-101","exam":2,"num":101,"stem":"The __________ lists all checks cashed and who cashed them.","options":["Cash Register","Check Ledger","Check Register","Subsidiary Ledger"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"101"}],"exp":"The **check register** lists every check written, who it was paid to and the amount.","ref":["Builders Guide to Accounting  ·  101"]},{"id":"2-102","exam":2,"num":102,"stem":"__________ are the minimum levels of coverage of public liability and property damage insurance General Contractors must carry.","options":["$100,000 liability and $25,000 property damage","$500,000 liability and $100,000 property damage","$300,000 liability and $50,000 property damage","$150,000 liability and $50,000 property damages"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2025"],"loc":"2-172","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-131","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-19","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-157","stat":"61G4-15.003"}],"exp":"61G4-15.003: general, building and residential contractors need **$300,000 public liability and $50,000 property damage** coverage.","ref":["Florida Contractors Manual  ·  2025: 2-16, 2-172, 61G4-15.003","2021: 2-16, 2-131, 61G4-15.003","2017: 2-19, 2-157, 61G4-15.003"]},{"id":"2-103","exam":2,"num":103,"stem":"OSHA records are to be located __________ when employees are not associated with a fixed establishment.","options":["At the nearest fixed location","At field offices or mobile base operation locations","At the corporate office","Where the employees report to work each day"],"answer":1,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-15"}],"exp":"When employees don't work at a fixed establishment, keep OSHA records **at the field office or mobile base of operations**.","ref":["Florida Contractors Manual  ·  7-15"]},{"id":"2-104","exam":2,"num":104,"stem":"Which of the following are not required recordable injuries?","options":["Injuries requiring first aid treatment only","Removing foreign items from the eye with tweezers","Use of prescription medications","Application of bandages by medical personnel"],"answer":0,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-22"},{"book":"FCM","eds":null,"loc":"7-23"},{"book":"FCM","eds":null,"loc":"7-24"}],"exp":"**First-aid-only** injuries aren't recordable (bandages, tweezer removal of objects from the eye, non-prescription medicine at non-prescription strength). Prescription medication makes a case recordable.","ref":["Florida Contractors Manual  ·  7-22, 7-23, 7-24"]},{"id":"2-105","exam":2,"num":105,"stem":"Which of the following are not the owner's responsibility to pay?","options":["Easements","Use or occupancy of permanent structures","Permits and fees assigned to the contractor under the contract documents","Permanent changes to existing facilities"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.3"}],"exp":"A201 §2.3: the Owner pays for easements, zoning approvals, permanent structures and permanent changes to facilities. **Permits and fees the contract assigns to the Contractor** are the Contractor's cost.","ref":["AIA Document A201, 2017  ·  2.3"]},{"id":"2-106","exam":2,"num":106,"stem":"To whom and on what schedule shall bonds related to a bid be delivered by the bidder?","options":["To the architect no later than three days after contract execution","To the architect no later than five days after contract execution","To the owner no later than five days after contract execution","To the owner no later than three days after contract execution"],"answer":3,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.2"}],"exp":"A701 §7.2: bonds go **to the Owner within 3 days** after the contract is executed.","ref":["AIA Document A701, 2018  ·  7.2"]},{"id":"2-107","exam":2,"num":107,"stem":"What is an example of an incentive discount offered to customers to pay open invoices?","options":["2% - 10- days, net 30","Never offer a discount and insist your customers pay the full price","10% off on all orders over $1,000","None of the above"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"**\"2% 10, net 30\"** is the classic incentive discount for paying open invoices early.","ref":["Builders Guide to Accounting  ·  59"],"lock":1},{"id":"2-108","exam":2,"num":108,"stem":"What penalty is imposed for failure or refusal of an employer or carrier to report any form or notice associated with a death as required by Chapter 440, Workers Compensation Laws?","options":["Fine not to exceed $1000","Fine not to exceed $1500","Fine not to exceed $500","Fine not to exceed $500 for the first failure and not to exceed $2000 for each subsequent failure"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"6-121","stat":"440.185(8)"},{"book":"FCM","eds":["2021"],"loc":"6-113","stat":"440.185(8)"},{"book":"FCM","eds":["2017"],"loc":"6-165","stat":"440.185(8)"}],"exp":"§440.185(8): an employer or carrier that fails to file required workers' comp reports or notices can be fined **up to $500 for each failure**.","ref":["Florida Contractors Manual  ·  2025: 6-121. 440.185(8)","2021: 6-113, 440.185(8)","2017: 6-165, 440.185(8)"]},{"id":"2-109","exam":2,"num":109,"stem":"When preparing an estimate, __________ would be included as a fixed overhead expense.","options":["Equipment costs","Corporate office personnel payroll costs","Direct labor and payroll taxes","Material costs"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142"},{"book":"BGA","eds":null,"loc":"143"},{"book":"BGA","eds":null,"loc":"227"}],"exp":"**Corporate office personnel payroll** is a fixed overhead expense. Equipment, direct labor and materials are job costs.","ref":["Builders Guide to Accounting  ·  142, 143 & 227"]},{"id":"2-110","exam":2,"num":110,"stem":"__________ is/are not components of a safety program.","options":["A policy statement regarding safety","Safety Rules","Workers' Compensation Guidelines","Employee Orientation program"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-36"},{"book":"FCM","eds":null,"loc":"7-37"},{"book":"FCM","eds":null,"loc":"7-38"},{"book":"FCM","eds":null,"loc":"7-39"}],"exp":"A safety program includes a safety policy statement, safety rules and employee orientation. **Workers' comp guidelines** aren't part of it.","ref":["Florida Contractors Manual  ·  7-36, 7-37, 7-38, 7-39"]},{"id":"2-111","exam":2,"num":111,"stem":"Which of the following is not true regarding posting a Notice of Commencement?","options":["When a loan exists, it is the contractor's responsibly to post the notice","It may be posted no sooner than 90 days prior to the start of work at the site","The owner is obligated to post a copy at the site","The posted notice always needs to remain on site"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-12"},{"book":"FCM","eds":["2017"],"loc":"9-11"}],"exp":"The **Owner**, not the contractor, records the Notice of Commencement and posts a copy at the job site. \"When a loan exists, the contractor posts it\" is the false statement.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-12","2017: 9-11"]},{"id":"2-112","exam":2,"num":112,"stem":"__________ must be kept separate from other assets when calculating depreciation.","options":["Land","Office Furniture and Equipment","Truck and Autos","On site equipment"],"answer":0,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"162"}],"exp":"**Land** isn't depreciable, so it must be kept separate from depreciable assets such as buildings.","ref":["Builders Guide to Accounting  ·  162"]},{"id":"2-113","exam":2,"num":113,"stem":"Under what circumstance may a foreign trained professional be allowed to take the examination for construction licensing?","options":["If the applicant immigrated to the US for political reasons","If the applicant successfully completed an approved course prior to 1990","If the applicant immigrated to the US for political reason from a county located in the Western Hemisphere lacking diplomatic relations with the US","There is no special circumstance under which an applicant may take the exam and they must adhere to the same rules as all other applicants"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.218(a)"}],"exp":"§455.218: a foreign-trained professional may sit for the exam if they **immigrated for political reasons from a Western Hemisphere country that lacks diplomatic relations with the U.S.**","ref":["Florida Statute 455  ·  455.218(a)"]},{"id":"2-114","exam":2,"num":114,"stem":"When should you provide an incentive discount to customers based on receivables?","options":["When they can refer you other business","When you want to increase sales","When you want them to pay their open invoice quickly","When they have an \"A\" credit rating"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"Incentive discounts on receivables are offered **to get customers to pay open invoices quickly**.","ref":["Builders Guide to Accounting,  ·  59"]},{"id":"2-115","exam":2,"num":115,"stem":"When a subcontractor defaults on work in accordance with agreement with a contractor which of the following are allowable remedies for the contractor?","options":["The contactor may correct the default if the subcontractor has failed to do so within 10 days after the subcontractor received notice from the contractor","Architect may hire a new subcontractor if the subcontractor has failed to correct the default within 5 days after receipt of notice from the contractor","Contactor may correct the default if the subcontractor has failed to do so within 5 days after the subcontractor received notice from the contractor","Architect may hire a new subcontractor if the subcontractor has failed to correct the default within 10 days after receipt of notice from the contractor"],"answer":2,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"3.5"}],"exp":"A401 §3.5: if the Sub defaults and doesn't start correcting within **5 days** of the Contractor's notice, the **Contractor** may correct the work and charge the Sub. The architect plays no role in the subcontract.","tip":"A401 contractor vs. sub = 5 days. A201 owner vs. contractor = 10 days.","ref":["AIA Document A401, 2017  ·  3.5"]},{"id":"2-116","exam":2,"num":116,"stem":"The total maximum allowable penalty for an employer who committed a willful or repeated violation of OSHA regulations and failed to comply with OSHA mandated posting requirements is __________.","options":["$136,942","$148,431","$149,413","$177,454"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-31"}],"exp":"The answer depends on your manual's edition. **2025 FCM:** willful or repeated $161,323 + posting $16,131 = **$177,454**. 2021: $134,937 + $13,494 = $148,431. 2017: $124,471 + $12,471 = $136,942. Use the penalty table in the edition you'll bring to the exam.","calc":1,"ref":["Florida Contractors Manual  ·  7-31","There are two different answers depending which edition of the book you have:","2025: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $161,323","Posting Requirements - $16,131","$161,323 + $16,131 = $177,454","[B] 2021: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $134,937","Posting Requirements - $13,494","$134,937 + $13,494 = $148,431","[A] 2017: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $124,471","Posting Requirements - $12,471","$124,471 + $12,471 = $136,942"],"lock":1,"edAns":{"2025":3,"2021":1,"2017":0}},{"id":"2-117","exam":2,"num":117,"stem":"Which of the following should be considered when deciding on the man-hour range to use when creating an estimate?","options":["Weather conditions","Time allowed for project completion","Skill and experience of the craftsman","All the above"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-30"}],"exp":"Man-hour ranges depend on weather, the time allowed for the project, and crew skill. **All of the above**.","ref":["Florida Contractors Manual  ·  10-30"],"lock":1},{"id":"2-118","exam":2,"num":118,"stem":"How many copies of the contract documents must the owner provide the contractor?","options":["Two signed originals and one copy","One signed original and one copy","One signed original and one copy","One"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.3.6"}],"exp":"A201 §2.3.6: the Owner furnishes **one copy** of the contract documents free of charge, for the Contractor to reproduce.","ref":["AIA Document A201, 2017  ·  2.3.6"]},{"id":"2-119","exam":2,"num":119,"stem":"The contractor will submit a certificate for payments within __________ days after the work is complete.","options":["7","10","3","None of the above"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.4.1"}],"exp":"A201 §9.4.1: the *Architect*, not the contractor, issues the Certificate for Payment, within 7 days of receiving the application. So **none of the above**.","ref":["AIA Document A201, 2017  ·  9.4.1"],"lock":1},{"id":"2-120","exam":2,"num":120,"stem":"Where and for what period must OSHA 300/300A and any supplementary reports be maintained by the employer?","options":["Retained in the corporate headquarters office for 5 calendar years following the end of the year to which they relate","Retained in the corporate headquarters office for 3 calendar years following the end of the year to which they relate","Retained in each establishment for 5 calendar years following the end of the year to which they relate","Retained in each establishment for 3 calendar years following the end of the year to which they relate"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-16"}],"exp":"OSHA 300, 300A and 301 records are kept **at each establishment for 5 years** after the end of the year they cover.","ref":["Florida Contractors Manual  ·  7-16"]},{"id":"2-121","exam":2,"num":121,"stem":"Unless otherwise provided for in the contract documents, the contractor will pay for which of the following?","options":["It is the owner's responsibility to pay for all permits, not the contractor","Building permits, fees, inspections by the local building department","Only permits when issued in their name excluding work performed by contractors","Only building permits"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.7.1"}],"exp":"A201 §3.7.1: unless the contract says otherwise, the Contractor pays for **building permits, fees, licenses and government inspections**.","ref":["AIA Document A201, 2017  ·  3.7.1"]},{"id":"2-122","exam":2,"num":122,"stem":"Which of the following does not affect the productivity rate of equipment?","options":["Experience of the operator","Overruns of Equipment","Climate and weather conditions","Permissible speeds"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"},{"book":"FCM","eds":null,"loc":"10-28"}],"exp":"Equipment productivity depends on operator experience, climate and weather, and permissible speeds. **\"Overruns of equipment\"** isn't a productivity factor.","ref":["Florida Contractors Manual  ·  10-27 & 10-28"]},{"id":"2-123","exam":2,"num":123,"stem":"Which of the following is not true regarding filing a Notice to Owner?","options":["Must be filed before commencing or no later than 45 days after completing work","Must be filed before the owner's disbursement of final payment","Must be filed before commencing or no later than 45 days after commencing work","Must be filed regardless of the method of payment by the owner"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-75"},{"book":"FCM","eds":["2021"],"loc":"9-72","stat":"713.06(2)(a)"},{"book":"FCM","eds":["2017"],"loc":"9-76","stat":"713.06(2)(a)"}],"exp":"§713.06(2)(a): a Notice to Owner is served before work starts, or **within 45 days of starting** work, not within 45 days of *completing* it. \"After completing\" is the false statement.","tip":"NTO = 45 days from first furnishing.","ref":["Florida Contractors Manual  ·  2025: 9-75","2021: 9-72, 713.06(2)(a)","2017: 9-76 , 713.06(2)(a)"]},{"id":"2-124","exam":2,"num":124,"stem":"Which of the following must the contractor make available at the site?","options":["Change orders, product data and samples","Change orders, product data, samples and proof of liability coverage","Contract documents and proof of liability coverage","None of the above, these are the responsibility of the architect to make available"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.11"}],"exp":"A201 §3.11: the Contractor keeps at the site the drawings, specifications, addenda, **change orders**, approved shop drawings, **product data and samples**.","ref":["AIA Document A201, 2017  ·  3.11"],"lock":1},{"id":"2-125","exam":2,"num":125,"stem":"Real turnover is an example of a __________ ratio.","options":["Combined","Current","Accrual","Balanced"],"answer":0,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"270-271"}],"exp":"Real turnover (cost of sales ÷ inventory) mixes an income statement figure with a balance sheet figure, so it's a **combined** ratio.","ref":["Builders Guide to Accounting  ·  270-271"]},{"id":"3-1","exam":3,"num":1,"stem":"How many days prior to the date established in a contract for progress payments shall a contractor submit to the architect application for payment?","options":["3","5","7","10"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.3.1"}],"exp":"A201 §9.3.1: the Application for Payment goes to the Architect at least **10 days** before the payment date.","ref":["AIA Document A201, 2017  ·  9.3.1"],"lock":1},{"id":"3-2","exam":3,"num":2,"stem":"Which is a method of improving cash flow?","options":["Maintaining a high inventory","Taking advantage of discounts","Converting all cash sales to accounts receivable","Paying off liabilities"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"262"}],"exp":"**Taking advantage of discounts** improves cash flow. High inventory and turning cash sales into receivables tie cash up.","ref":["Builder's Guide to Accounting  ·  262"],"dupes":["1-90"]},{"id":"3-3","exam":3,"num":3,"stem":"A subcontractor has a \"Standard Form of Agreement Between Contractor and Subcontractor\" with the prime contractor on a project. The ONLY way the subcontractor can assign work on the subcontract is with written __________.","options":["Consent of the owner or architect","Consent of the contractor","Notification to the owner or architect","Notification to the contractor"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"7.4.2"}],"exp":"A401 §7.4.2: the Sub may assign the subcontract only with the **Contractor's written consent**.","ref":["AIA Document A401, 2017  ·  7.4.2"],"dupes":["1-91"]},{"id":"3-4","exam":3,"num":4,"stem":"Who is eligible for Small Business Association loans?","options":["All building contractors in the Unites States","Only company presidents","Applicants who cannot obtain a loan from local banks","Applicants who are recommended by a local bank"],"answer":2,"topic":"org","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"318-319"}],"exp":"SBA loans are for **applicants who can't get a loan from local banks** on reasonable terms.","ref":["Builder's Guide to Accounting  ·  318-319"]},{"id":"3-5","exam":3,"num":5,"stem":"When can a Notice of Commencement be extended past one year?","options":["If it is written into the Notice of Commencement","If the job proceeds past one year","When there is an architectural change order","Never"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-83","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2021"],"loc":"9-78","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2017"],"loc":"9-88","stat":"713.13(1)(c)"}],"exp":"§713.13(1)(c): an NOC expires after 1 year **unless the notice states a different expiration date**.","ref":["Florida Contractors Manual  ·  2025: 9-83: 713.13(1)(c)","2021: 9-78: 713.13(1)(c)","2017: 9-88: 713.13(1)(c)"],"dupes":["1-93"]},{"id":"3-6","exam":3,"num":6,"stem":"The bidder making a bid represents that he or she __________.","options":["Is familiar with local conditions under which the work is to be performed","Is making a bid contingent on standard codes and conditions","Will adjust accordingly if the bid is accepted if an addendum is made","Will provide specifications for all materials"],"answer":0,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"2.1.4"}],"exp":"A701 §2.1: by bidding, the bidder represents that it **is familiar with the local conditions** where the work will be done (and visited the site and read the documents).","ref":["AIA Document A701, 2018  ·  2.1.4"]},{"id":"3-7","exam":3,"num":7,"stem":"A contractor receives payment from the owner of a construction project. The contractor shall pay the subcontractor each progress payment within __________.","options":["3 working days","3 days (including Saturday and Sunday)","5 working days","7 working days"],"answer":3,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"11.3"}],"exp":"A401 §11.3 and A201 §9.6.2: pay the Sub within **7 working days** of receiving the Owner's payment.","ref":["AIA Document A401, 2017  ·  11.3"],"dupes":["1-95"]},{"id":"3-8","exam":3,"num":8,"stem":"Which is NOT a delay factor when determining production efficiency percentages?","options":["Accessibility of site","Financial incentives","Poorly trained personnel","Weather conditions"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-30"},{"book":"FCM","eds":null,"loc":"10-31"}],"exp":"Site access, poorly trained personnel and weather all slow production. **Financial incentives** aren't a delay factor (they usually raise productivity).","ref":["Florida Contractors Manual  ·  10-30, 10-31"]},{"id":"3-9","exam":3,"num":9,"stem":"When a piece of equipment is sold, why is it necessary to book the transaction separate from regular sales?","options":["It is treated as a variable expense","It receives different tax treatment","The transaction is not taxable","Gains or losses must be used to adjust gross profits"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"170"}],"exp":"Equipment sales **receive different tax treatment** (gain or loss, depreciation recapture), so they're recorded separately from regular sales.","ref":["Builder's Guide to Accounting  ·  170"],"dupes":["1-96"]},{"id":"3-10","exam":3,"num":10,"stem":"According to Fair Labor Standards Act, which will eliminate the contractor's liability for paying overtime pay?","options":["An agreement that only 8 hours per day or 40 hours per week will be counted as working time","An outside salesperson who works on straight commission and qualifies as exempt status","An announcement by an employer that overtime work will only be paid for if authorized in advance","An announcement by an employer that no overtime work will be permitted"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-17"}],"exp":"Only a real FLSA exemption, such as an **exempt outside salesperson on straight commission**, removes the overtime obligation. If overtime is worked, it must be paid, whatever the employer has announced.","ref":["Florida Contractors Manual  ·  5-17"]},{"id":"3-11","exam":3,"num":11,"stem":"Which is an advantage of leasing?","options":["Lowers overall cash flows more than purchasing","Reduced front-end cash outlays","Generates depreciation for tax purposes","Cheaper than owning in the long run"],"answer":1,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-93"}],"exp":"The main advantage of leasing is **lower up-front cash outlay**. Owning usually costs less over the long run, and only owned equipment generates depreciation.","ref":["Florida Contractors Manual  ·  3-93"]},{"id":"3-12","exam":3,"num":12,"stem":"A change of a business address must be mailed to the Department of Business and Professional Regulation within how many days of the change?","options":["30","45","60","90"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-31"},{"book":"FCM","eds":["2021"],"loc":"2-29"},{"book":"FCM","eds":["2017"],"loc":"2-22"}],"exp":"A change of business address (part of the business organization's qualification information) must be reported to DBPR within **45 days** (61G4-15.007).","ref":["Florida Contractors Manual  ·  2025: 2-31","2021: 2-29","2017: 2-22"],"lock":1},{"id":"3-13","exam":3,"num":13,"stem":"All chains being used as a sling, should be inspected once a __________ by a competent inspector.","options":["Day","Week","Month","Year"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-89"}],"exp":"Per the manual (FCM 7-89), chains used as slings should get a thorough inspection by a competent inspector once a **month**, in addition to the daily pre-use check.","ref":["Florida Contractors Manual  ·  7-89"]},{"id":"3-14","exam":3,"num":14,"stem":"Which of the following is NOT a prohibited agreement under the Florida's Right to Work Law?","options":["Union shop agreements","Agency shop agreements","Federal enclaves' agreements","Maintenance of membership agreements"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"},{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"Florida's Right to Work law prohibits union shop, agency shop and maintenance-of-membership agreements. **Federal enclaves** (federal property) aren't covered by state law, so agreements there aren't prohibited.","ref":["Florida Contractors Manual  ·  5-14, 5-15"]},{"id":"3-15","exam":3,"num":15,"stem":"Which of the following is an example of an accrual entry?","options":["Depreciation and amortization entries","Entries to record payroll taxes","Entries to record automatic loan payments","Entries to record purchase of material stored at a jobsite"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"237"}],"exp":"Per the Builder's Guide, **recording material purchased and stored at the jobsite** is an accrual entry.","ref":["Builder's Guide to Accounting  ·  237"]},{"id":"3-16","exam":3,"num":16,"stem":"To establish an hourly cost for a piece of equipment the contractor needs to consider all the following except __________.","options":["Estimated life of the equipment","Cost of the equipment, less salvage value","Replacement cost of the equipment","Estimated average hours of use"],"answer":2,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159-160"}],"exp":"Hourly equipment cost uses estimated life, cost less salvage and average hours of use. **Replacement cost** isn't included.","ref":["Builder's Guide to Accounting  ·  159 - 160"],"dupes":["1-99"]},{"id":"3-17","exam":3,"num":17,"stem":"Failure of a certificate holder or registrant to apply for renewal of an active certificate at the time of biennial renewal shall cause the certificate to become __________.","options":["Suspended","Permanently suspended","Voluntarily inactive","Delinquent"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-95","stat":"489.116(4)"},{"book":"FCM","eds":["2021"],"loc":"2-74","stat":"489.116(4)"},{"book":"FCM","eds":["2017"],"loc":"2-84","stat":"489.116(4)"}],"exp":"§489.116(4): failing to renew an active certificate at biennial renewal makes it **delinquent**.","ref":["Florida Contractors Manual  ·  2025: 2-95: 489.116(4)","2021: 2-74: 489.116(4)","2017: 2-84: 489.116(4)"],"dupes":["1-100"]},{"id":"3-18","exam":3,"num":18,"stem":"Which of the following best describes the accrual method of accounting?","options":["Transactions are recorded when cash is received or paid","No receivables or payables are recorded on the balance sheet","Revenues are recognized when earned even though no cash has been received","Payables are recorded before receivables are received"],"answer":2,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"237"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"Under the accrual method, **revenue is recognized when earned, even if no cash has been received** (and expenses when incurred).","ref":["Builder's Guide to Accounting  ·  11 or 237","Florida Contractors Manual  ·  3-105"]},{"id":"3-19","exam":3,"num":19,"stem":"Which of the following is not a depreciation method?","options":["Declining balance depreciation","Accumulated cost depreciation","Sum of the years' digits depreciation","Straight line depreciation"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"Straight line, declining balance and sum-of-the-years' digits are real methods. **\"Accumulated cost depreciation\" doesn't exist**. (Accumulated *depreciation* is an account, not a method.)","ref":["Builder's Guide to Accounting  ·  163","Note: there is no such thing as accumulated cost depreciation","Sum-of-the-years depreciation is one of the methods still being used under the old rules"]},{"id":"3-20","exam":3,"num":20,"stem":"Claims arising from damages that resulted from a contractor's work that already has been finished would be covered by a __________.","options":["Completion bond","Completed operations liability policy","Builder's risk insurance policy","Manufacturer's and contractor's liability policy"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-9"}],"exp":"**Completed operations** liability coverage handles claims for damage caused by work that's already finished.","ref":["Florida Contractors Manual  ·  4-9"]},{"id":"3-21","exam":3,"num":21,"stem":"What is the purpose of the Lien Law payment bond?","options":["To exempt the contractor from construction liens","To exempt the subcontractor from construction liens","To protect the owner's property from construction liens","To allow easy payments to subcontractors"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-47"},{"book":"FCM","eds":["2025","2021"],"loc":"9-57"},{"book":"FCM","eds":["2017"],"loc":"9-46"},{"book":"FCM","eds":["2017"],"loc":"9-56"}],"exp":"§713.23: a lien law payment bond **protects the owner's property from construction liens**. Lienors claim against the bond instead of the property.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-47, 9-57","2017: 9-46, 9-56"]},{"id":"3-22","exam":3,"num":22,"stem":"Under the Civil Rights Act of 1964 (Title VII) the Americans with Disabilities Act and the Rehabilitation Act of 1973, the maximum compensatory and punitive damages a plaintiff may recover from an employer of 95 people is __________.","options":["$24,000","$50,000","$100,000","$250,000"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-35"}],"exp":"Combined compensatory and punitive damage caps under Title VII and the ADA: 15–100 employees **$50,000**; 101–200 $100,000; 201–500 $200,000; more than 500 $300,000. An employer of 95 falls in the first tier.","ref":["Florida Contractors Manual  ·  5-35"],"lock":1},{"id":"3-23","exam":3,"num":23,"stem":"A contractor's worker's compensation premiums can be reduced by any of the following, except ________________.","options":["Participating in a co-insurance program","Joining an insurance pool","Participating in a deductible program","Requiring the employee to pay part of the premium"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-7"},{"book":"FCM","eds":null,"loc":"6-8"},{"book":"FCM","eds":null,"loc":"6-9"}],"exp":"**Making employees pay part of the workers' comp premium is illegal** in Florida. Co-insurance, pools and deductible programs are legitimate ways to lower premiums.","ref":["Florida Contractors Manual  ·  6-7, 6-8 & 6-9"]},{"id":"3-24","exam":3,"num":24,"stem":"Under the Florida Civil Rights Act of 1992, (Chapter 760, FL. Statue) back pay liability is limited to __________ months prior to filing of complaint unless willful violation is found.","options":["6","18","24","36"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-36"}],"exp":"Under the Florida Civil Rights Act (Ch. 760), back pay is limited to **24 months (2 years)** before the complaint was filed, unless the violation was willful.","ref":["Florida Contractors Manual  ·  5-36"],"lock":1},{"id":"3-25","exam":3,"num":25,"stem":"An employer with 100 employees is cited by OSHA for a high severity, greater probability violation. The employer has had one other citation in the last 3 years. Using ONLY the information given, what would be the proposed penalty for this violation? (Select the closet answer)","options":["$5,000","$8,730","$10,795","$12,905"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"7-32"},{"book":"FCM","eds":["2025"],"loc":"7-33"},{"book":"FCM","eds":["2021"],"loc":"7-32","alt":"C"},{"book":"FCM","eds":["2021"],"loc":"7-33","alt":"C"},{"book":"FCM","eds":["2017"],"loc":"7-32","alt":"B"},{"book":"FCM","eds":["2017"],"loc":"7-33","alt":"B"}],"exp":"The answer depends on your manual's edition. **2025 FCM:** high severity, greater probability = $16,131 base; 51–100 employees = 20% reduction; no 10% history reduction (prior citation within 3 years). $16,131 × 0.80 = **$12,905**. 2021: $13,494 × 0.80 = $10,795. 2017: $12,471 × 0.70 = $8,730.","tip":"Base penalty × (1 − size reduction). The history reduction only applies with no citations in the last 3 years.","calc":1,"ref":["2025 Florida Contractors Manual:  ·  2025: 7-32 - 7-33 high severity, greater probability = base penalty of $16,131 adjustment factor = -20% for 51 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $16,131 x .80 (100% - 20%) = $12,904.80 proposed penalty","[C] 2021 Florida Contractors Manual:  ·  2021: 7-32 - 7-33 high severity, greater probability = base penalty of $13,494 adjustment factor = -20% for 51 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $13,494 x .80 (100% - 20%) = $10,795.20 proposed penalty","[B] 2017 Florida Contractors Manual:  ·  2017: 7-32 - 7-33 high severity, greater probability = base penalty of $12,471 adjustment factor = -30% for 26 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $12,471 x .70 (100% - 30%) = $8,729.70 proposed penalty"],"lock":1,"edAns":{"2025":3,"2021":2,"2017":1}},{"id":"3-26","exam":3,"num":26,"stem":"How long after the subcontractor's final furnishing of labor, services or material for a job does the subcontractor have to record a valid Claim of Lien?","options":["45 days","60 days","90 days","One year"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-28"},{"book":"FCM","eds":["2017"],"loc":"9-27"}],"exp":"§713.08(5): a claim of lien must be recorded within **90 days after the final furnishing** of labor, services or materials.","tip":"NTO 45 days from first furnishing. Lien 90 days from last.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-28","2017: 9-27"]},{"id":"3-27","exam":3,"num":27,"stem":"The quarterly Federal Tax Form 941 summarizes tax liability for the employer and includes __________.","options":["Liability insurance","Federal income taxes withheld","Workers compensation insurance","Federal unemployment insurance tax"],"answer":1,"topic":"tax","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"137-138"},{"book":"FCM","eds":["2025","2021"],"loc":"1-26"},{"book":"FCM","eds":["2025","2021"],"loc":"3-48"},{"book":"FCM","eds":["2017"],"loc":"1-23"},{"book":"FCM","eds":["2017"],"loc":"3-48"}],"exp":"Form 941 includes **federal income tax withheld**, plus Social Security and Medicare.","ref":["Builder's Guide to Accounting  ·  137 - 138","Florida Contractors Manual  ·  2025 & 2021: 1-26, 3-48","2017: 1-23, 3-48"],"dupes":["1-101"]},{"id":"3-28","exam":3,"num":28,"stem":"A properly registered fictitious name is valid for __________ year(s).","options":["1","2","3","5"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"A fictitious name is valid for **5 years**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14","2017: 1- 15"],"lock":1},{"id":"3-29","exam":3,"num":29,"stem":"Which type of bond is a guarantee to the owner that the project will be completed according to the terms and conditions specified in the contract?","options":["Payment bond","Bid bond","Performance bond","Completion bond"],"answer":2,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-14"},{"book":"FCM","eds":null,"loc":"10-75"}],"exp":"A **performance bond** guarantees the owner that the project will be completed according to the contract. A payment bond guarantees subs and suppliers get paid. A bid bond guarantees the low bidder will sign.","ref":["Florida Contractors Manual  ·  4-14, 10-75"]},{"id":"3-30","exam":3,"num":30,"stem":"According to the Internal Revenue Service, employers must keep all employment tax records for at least how many years?","options":["2 years","4 years","5 years","7 years"],"answer":1,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"3-142"},{"book":"FCM","eds":["2021"],"loc":"3-160"},{"book":"FCM","eds":["2021"],"loc":"3-158"},{"book":"FCM","eds":["2017"],"loc":"3-154"}],"exp":"The IRS requires employment tax records to be kept at least **4 years**.","ref":["Florida Contractors Manual  ·  2025: 3-142 (2025 IRS Circ. E)","2021: 3-160 (2nd printing / 2021 IRS Circ. E)","2021: 3-158 (1st printing / 2016 IRS Circ. E)","2017: 3-154 (2016 IRS Circ. E)"],"lock":1},{"id":"3-31","exam":3,"num":31,"stem":"For purposes of unemployment compensation, misconduct connected with work does not include __________.","options":["Wrongful intent or evil design","Deliberate disregard of employee duties","Deliberate disregard of behavior standards","Isolated instances of negligence and poor judgment"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-52"},{"book":"FCM","eds":["2025","2021"],"loc":"5-53"},{"book":"FCM","eds":["2017"],"loc":"5-52"}],"exp":"Unemployment law treats intentional wrongdoing and deliberate disregard of duties or standards as misconduct. **Isolated negligence or poor judgment is not misconduct**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-52, 5-53","2017: 5-52"]},{"id":"3-32","exam":3,"num":32,"stem":"Which of the following companies would be required to have Worker's Compensation Insurance?","options":["A company that is not in the construction business that leases 2 employees","A company in the construction business that hires employees","A corporation in the construction business with 2 employees who are both officers of the corporation and have certificates of election to be exempt","A corporation that is not in the construction business with 2 employees who are both officers of the corporation and have certificates of election to be exempt"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-5"}],"exp":"**A construction company with any employees** must carry workers' comp (1 or more employees). Corporate officers with valid exemptions don't count as employees.","ref":["Florida Contractors Manual  ·  6-5"]},{"id":"3-33","exam":3,"num":33,"stem":"A Notice to Owner from a non-privity lienor must be sent within __________ days after the first furnishing of labor or materials.","options":["30","45","72","90"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-22"},{"book":"FCM","eds":["2017"],"loc":"9-21"}],"exp":"A non-privity lienor (a sub or supplier with no direct contract with the owner) must serve the Notice to Owner within **45 days** of first furnishing.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-22","2017: 9-21"],"lock":1},{"id":"3-34","exam":3,"num":34,"stem":"What financial information summarizes the existing conditions of a business?","options":["The balance sheet","The cash flow statement","The income statement","The statement of retained earnings"],"answer":0,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"247"}],"exp":"The **balance sheet** summarizes the existing condition of a business on a specific date.","ref":["Builder's Guide to Accounting  ·  247"],"dupes":["1-102"]},{"id":"3-35","exam":3,"num":35,"stem":"On a multi-contractor job which of the following is true regarding the posting of OSHA posters?","options":["Poster must be posted on all job site where employees can see them","Each contractor on the project must display their own posters","Only the contractor deemed project manage must post the posters","A & B above"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-6"}],"exp":"On a multi-contractor job, posters must be where employees can see them, and **each contractor posts its own**. A and B are both true.","ref":["Florida Contractors Manual  ·  7-6"],"lock":1},{"id":"3-36","exam":3,"num":36,"stem":"When progress billings bring in more income than costs incurred during the early stages of a contract the contractor is using __________.","options":["A draw system","A pre-qualified payment method","Front end loading","The critical path method"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-108"},{"book":"FCM","eds":null,"loc":"10-74"},{"book":"FCM","eds":null,"loc":"10-75"}],"exp":"**Front-end loading** puts extra value in early pay items so early billings exceed costs incurred, which improves the contractor's early cash flow.","ref":["Florida Contractors Manual  ·  3-108, 10-74, 10-75"]},{"id":"3-37","exam":3,"num":37,"stem":"When preparing a bid, the contractor notes that the specifications require one type of equipment, but the plans show a different type. The contractor should __________.","options":["Bid based on using the least expensive of the two","Follow the plans","Submit a request for information","Substitute comparable equipment"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-6"}],"exp":"When the specifications and plans conflict, **submit a Request for Information (RFI)**. Don't guess, and don't substitute.","ref":["Florida Contractors Manual  ·  10-6"]},{"id":"3-38","exam":3,"num":38,"stem":"The OSHA citation must be prominently displayed at or near the place of alleged violation for __________ day (s), or until it is corrected, whichever is later, to warn employees of dangers that may exist there.","options":["One","Two","Three","Five"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-31"}],"exp":"An OSHA citation is posted at or near the violation for **3 working days or until the violation is corrected, whichever is later**.","ref":["Florida Contractors Manual  ·  7-31"]},{"id":"3-39","exam":3,"num":39,"stem":"A member, during active duty and for a period of __________ year (s) after discharge from active duty, engaged in his or her licensed profession or occupation in the private sector for profit in this state must complete all license renewal provisions except remitting the license renewal fee, which shall be waived by the department.","options":["1","2","3","4"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.02"}],"exp":"§455.02: during active duty and for **2 years** after discharge, a service member practicing a licensed profession in Florida completes the renewal requirements but has the renewal fee waived.","ref":["Florida Statute 455  ·  455.02"],"lock":1},{"id":"3-40","exam":3,"num":40,"stem":"What is required to file a construction claim of lien?","options":["Permission from the owner","A court order","A direct contract with the owner","The claim must be recorded with the clerk of the court"],"answer":3,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-80","stat":"713.08(5)"},{"book":"FCM","eds":["2021"],"loc":"9-76","stat":"713.08(5)"},{"book":"FCM","eds":["2017"],"loc":"9-84","stat":"713.08(5)"}],"exp":"A construction claim of lien must be **recorded with the clerk of the court** in the county where the property is located.","ref":["Florida Contractors Manual  ·  2025: 9-80: 713.08(5)","2021: 9-76: 713.08(5)","2017: 9-84: 713.08(5)"],"dupes":["1-105"]},{"id":"3-41","exam":3,"num":41,"stem":"What ratios compare accounts on the balance sheet to accounts on the income statement?","options":["Quick assets","Combined","Income","Current"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"270"}],"exp":"**Combined ratios** compare balance sheet accounts with income statement accounts.","ref":["Builder's Guide to Accounting  ·  270"],"dupes":["1-106"]},{"id":"3-42","exam":3,"num":42,"stem":"Which is a requirement for an employee to recover under a compulsory State Workers' Compensation Statute?","options":["The injury must occur while the employee is engaged in interstate commerce","The injury must arise out of and in the course of employment","The injury must arise out of the negligence of the employer or fellow employee","The injured employee must be a permanent full-time employee"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"6-27"},{"book":"FCM","eds":["2021","2017"],"loc":"6-26"}],"exp":"To recover under workers' comp, the injury must **arise out of and in the course of employment**. It's no-fault, so the employer's negligence doesn't matter.","ref":["Florida Contractors Manual  ·  2025: 6-27","2021 & 2017:6-26"]},{"id":"3-43","exam":3,"num":43,"stem":"What type of cost basis inventory valuation method uses the current market value of material as used?","options":["Specific cost","First in-first out","Last in-first out","Cost-plus inflation"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"120"}],"exp":"**LIFO** charges the latest costs, close to current market value, to material as it is used.","ref":["Builder's Guide to Accounting  ·  120"],"dupes":["1-108"]},{"id":"3-44","exam":3,"num":44,"stem":"Which is not used when calculating goods sold to average inventory ratio?","options":["Labor","Materials purchased","All other direct costs","Total monthly averages"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"**\"Total monthly averages\"** isn't used in the goods sold to average inventory ratio. COGS includes labor, materials and other direct costs.","ref":["Builder's Guide to Accounting  ·  121"],"dupes":["1-109"]},{"id":"3-45","exam":3,"num":45,"stem":"The Drug-Free Workplace Act of 1988 __________.","options":["Does not require drug testing","Always applies to subcontractors","Applies to contractors in foreign countries","Applies only to contractors with more than 50 workers"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-50"},{"book":"FCM","eds":["2017"],"loc":"5-49"}],"exp":"The Drug-Free Workplace Act of 1988 requires covered federal contractors and grantees to keep a drug-free workplace policy, but it **does not require drug testing**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-50","2017: 5-49"]},{"id":"3-46","exam":3,"num":46,"stem":"Which of the following can be added to a Builder's Risk policy by means of an extended coverage endorsement?","options":["Vandalism coverage","Malpractice coverage","Materials in transit","Catastrophic flood coverage"],"answer":2,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-7"}],"exp":"An extended coverage endorsement on a builder's risk policy can add **materials in transit** (and storage away from the site).","ref":["Florida Contractors Manual  ·  4-7"]},{"id":"3-47","exam":3,"num":47,"stem":"Which bond requires a low bidding contractor who fails to enter into a contract to pay a penalty equal to the amount of the bid?","options":["Performance bond","Forfeiture obligation","Difference in bid","Payment"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-13"}],"exp":"A bid bond can be written as a **forfeiture obligation**: if the low bidder won't sign, the full penal amount is forfeited. The other form, \"difference in bid,\" pays only the gap to the next bidder.","ref":["Florida Contractors Manual  ·  4-13"]},{"id":"3-48","exam":3,"num":48,"stem":"The Statute of limitations requires that an action for breach of an unwritten contract must be brought within a maximum of __________ years.","options":["2","4","5","7"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-23"}],"exp":"Florida statute of limitations: **4 years** for an unwritten (oral) contract and 5 years for a written contract.","tip":"Oral = 4, written = 5.","ref":["Florida Contractors Manual  ·  8-23"],"lock":1},{"id":"3-49","exam":3,"num":49,"stem":"Which of the following wages would not be subject to Federal Unemployment tax paid by the employer?","options":["Wages paid to a Canadian who frequently enters the U.S. to work as a carpenter","Severance pay","Wages paid to a deceased worker's estate in the same calendar year as the date of the worker's death","Wages paid to the employer's spouse"],"answer":3,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-253"},{"book":"FCM","eds":["2025"],"loc":"5-266"},{"book":"FCM","eds":["2025"],"loc":"3-181"},{"book":"FCM","eds":["2021"],"loc":"5-277"},{"book":"FCM","eds":["2021"],"loc":"5-289"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2021"],"loc":"3-193"},{"book":"FCM","eds":["2021"],"loc":"3-188"},{"book":"FCM","eds":["2017"],"loc":"5-292"},{"book":"FCM","eds":["2017"],"loc":"3-184"}],"exp":"FUTA doesn't apply to family employment such as **wages paid to the employer's spouse** (by a sole proprietor). Severance pay and wages to foreign workers in the U.S. are generally subject to it.","ref":["Florida Contractors Manual  ·  2025: 5-253, 5-266, 3-181: (2025 IRS Circ. E)","2021: 5-277, 5-289, 5-290, 3-193 (2nd printing /","2021 IRS Circ. E)","2021: 5-277, 5-289, 5-290, 3-188 (1st printing /","2016 IRS Circ. E)","2017: 5-292, 3-184 (2016 IRS Circ. E)"]},{"id":"3-50","exam":3,"num":50,"stem":"How may a contractor required to carry Worker's Compensation insurance fulfill the law?","options":["Obtaining liability insurance at three times the coverage generally required","Seek individual self-insured status through the Department of Labor and Employment Security","Obtaining major medical insurance for all employees","Obtaining life insurance policies for all employees"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-9"}],"exp":"An employer can meet the workers' comp requirement by buying a policy or by **qualifying as an individual self-insurer** (approved by the state). Liability, health or life insurance doesn't count.","ref":["Florida Contractors Manual  ·  6-9"]},{"id":"3-51","exam":3,"num":51,"stem":"Under a contract which does NOT require written notice in order to file a claim for additional cost?","options":["Minor change in the work","Work performed because of a concealed condition","Damages caused by the architect","Work performed because of an emergency endangering the owner's property"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"15.1.5"}],"exp":"A201 §15.1.5 and §10.4: work done because of an **emergency endangering the owner's property** doesn't require written notice before claiming additional cost.","ref":["AIA Document A201, 2017  ·  15.1.5"],"dupes":["1-110"]},{"id":"3-52","exam":3,"num":52,"stem":"A board member or former board member serving on a probable cause panel shall be compensated __________ for each day in attendance at an official meeting of the board and for each day of participation in any other business involving the board.","options":["$25","$50","$75","$100"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.207(4)"}],"exp":"§455.207(4): board members serving on a probable cause panel are paid **$50 a day** for each day of meetings or board business.","ref":["Florida Statute 455  ·  455.207(4)"],"lock":1},{"id":"3-53","exam":3,"num":53,"stem":"When is an oral contract valid?","options":["When an unlicensed contractor agrees to perform construction services","When the contract can be performed in less than one year","When the Statute of Limitations has expired","When the sale of goods is more than $500"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-6"}],"exp":"Under the Statute of Frauds, contracts that **can be performed within one year** may be oral. Contracts that can't be performed within a year, and sales of goods of $500 or more, must be written.","ref":["Florida Contractors Manual  ·  8-6"]},{"id":"3-54","exam":3,"num":54,"stem":"Current liabilities include the portion of long-term debt for equipment purchases payable within __________ days.","options":["30","90","180","365"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"155"}],"exp":"Current liabilities include the portion of long-term equipment debt due **within 365 days**.","ref":["Builder's Guide to Accounting  ·  155"],"lock":1,"dupes":["1-112"]},{"id":"3-55","exam":3,"num":55,"stem":"What activity must precede project scheduling?","options":["Development of a logic table","Final project design","Project planning","Shop drawings"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-58"}],"exp":"**Project planning** comes before scheduling. You decide *what* and *how* first, then *when*.","ref":["Florida Contractors Manual  ·  10-58"]},{"id":"3-56","exam":3,"num":56,"stem":"In reference to 42 U.S.C, the initials ADA are used to indicate __________.","options":["American Drug Association","American Diabetes Association","Association of Disabled Americans","Americans with Disabilities Act"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-12"},{"book":"FCM","eds":null,"loc":"5-41"}],"exp":"42 U.S.C. §12101 et seq. is the **Americans with Disabilities Act** (ADA).","ref":["Florida Contractors Manual  ·  5-12, 5-41"]},{"id":"3-57","exam":3,"num":57,"stem":"Chapter 489 of the Florida Statutes deals with licensing and regulating __________.","options":["All contractors and property owners","Bridge, tank and tower structures","Commercial buildings and bridges","Construction contracting, electrical and alarm systems contracting, and septic tank contracting"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"2-5"}],"exp":"Chapter 489 has three parts: **construction contracting (Part I), electrical and alarm system contracting (Part II), and septic tank contracting (Part III)**.","ref":["Florida Contractors Manual  ·  2-5"]},{"id":"3-58","exam":3,"num":58,"stem":"To procure long lead items, it is recommended that the items be __________.","options":["Identified and ordered early","Ordered when funds are available","Identified and ordered when needed","Ordered according to product availability"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-24"}],"exp":"Long-lead items should be **identified and ordered early** so they don't hold up the schedule.","ref":["Florida Contractors Manual  ·  10-24"]},{"id":"3-59","exam":3,"num":59,"stem":"What does Sales less the Cost of Goods Sold equal?","options":["Gross profit","Net profit","Income from operations","Net sales"],"answer":0,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"248"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"Sales − cost of goods sold = **gross profit**.","ref":["Builder's Guide to Accounting  ·  248","Florida Contractors Manual  ·  3-108"]},{"id":"3-60","exam":3,"num":60,"stem":"What is the sum of assets minus liabilities?","options":["Net profit","Net worth","Gross sales","Gross profit"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"247"}],"exp":"Assets − liabilities = **net worth**.","ref":["Builder's Guide to Accounting  ·  247"]},{"id":"3-61","exam":3,"num":61,"stem":"The department is authorized to impose a fine of not more than __________ and assess reasonable investigative and legal costs for prosecution when it appears that any uncertified or unregistered person is associated with a contracting firm.","options":["$500","$1,500","$2,500","$5,000"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-114","stat":"489.132(3)"},{"book":"FCM","eds":["2021"],"loc":"2-88","stat":"489.132(3)"},{"book":"FCM","eds":["2017"],"loc":"2-101","stat":"489.132(3)"}],"exp":"§489.132(3): DBPR may fine up to **$5,000**, plus investigative and legal costs, when an uncertified or unregistered person is associated with a contracting firm.","ref":["Florida Contractors Manual  ·  2025: 2-114: 489.132(3)","2021: 2-88: 489.132(3)","2017: 2-101: 489.132(3)"],"lock":1},{"id":"3-62","exam":3,"num":62,"stem":"All employers are required to report accidents to the Area Office resulting in one or more fatalities within __________ hours of learning of the incident.","options":["8","14","24","30"],"answer":0,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-28"}],"exp":"Report a work-related **fatality** to OSHA within **8 hours**. Repor
