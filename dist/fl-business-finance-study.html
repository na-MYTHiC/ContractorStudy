t an inpatient hospitalization, amputation or loss of an eye within 24 hours.","tip":"Death = 8 hours. Hospitalization, amputation or eye = 24 hours.","ref":["Florida Contractors Manual  ·  7-28"],"lock":1},{"id":"3-63","exam":3,"num":63,"stem":"All the following would be considered variable overhead expenses except __________.","options":["Payroll taxes on office salaries","Field office trailer rental","Worker's compensation insurance","Bad debts"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142-143"}],"exp":"**Payroll taxes on office salaries** are a fixed expense. Field office trailer rental, workers' comp and bad debts vary with work volume.","ref":["Builder's Guide to Accounting  ·  142 - 143","Payroll taxes on office salaries is a fixed expense"]},{"id":"3-64","exam":3,"num":64,"stem":"When the contract is made with a husband or wife who is not separated and living apart and the property is owned by the other or of both, the spouse who contracts shall be deemed to be the agent of the other unless such other shall, with __________ days after learning of such contract, give the contractor and record in the clerk's office, notice of his or her objection.","options":["5","7","10","14"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-77","stat":"713.12"},{"book":"FCM","eds":["2021"],"loc":"9-77","stat":"713.12"},{"book":"FCM","eds":["2017"],"loc":"9-87","stat":"713.12"}],"exp":"§713.12: when one spouse contracts for work on property owned by the other or by both, the contracting spouse is the other's agent unless the other spouse **records an objection within 10 days** of learning of the contract.","ref":["Florida Contractors Manual  ·  2025: 9-77: 713.12","2021: 9-77: 713.12","2017: 9-87: 713.12"],"lock":1},{"id":"3-65","exam":3,"num":65,"stem":"OSHA regulations require that records be kept a minimum of how many years after an incident occurs?","options":["1 year from the end of the year in which the incident occurred","5 years from the end of the year in which the incident occurred","7 years from the end of the year in which the incident occurred","Indefinitely"],"answer":1,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-16"}],"exp":"OSHA injury and illness records are kept **5 years** after the end of the year the incident occurred.","ref":["Florida Contractors Manual  ·  7-16"]},{"id":"3-66","exam":3,"num":66,"stem":"Successful builders control their costs BEST at which time?","options":["At the end of each week","During each phase of the work","Immediately prior to approving invoices","In bi-weekly meetings with the owner present"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"189"}],"exp":"Costs are controlled best **during each phase of the work**, while there's still time to fix overruns.","ref":["Builder's Guide to Accounting  ·  189"]},{"id":"3-67","exam":3,"num":67,"stem":"A company's initial record of all its business transactions is known as a __________.","options":["Ledger","Journal","Balance sheet","Financial statement"],"answer":1,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-25"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"The **journal** is the book of original entry: every transaction is recorded there first, then posted to the ledger.","tip":"Journal first, then ledger.","ref":["Florida Contractors Manual  ·  3-25, 3-108"]},{"id":"3-68","exam":3,"num":68,"stem":"An indicator of how well a company can meet its current obligations is the company's __________.","options":["Expense ratio","Debt to capitalization ratio","Current ratio","Income to net worth ratio"],"answer":2,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"269"}],"exp":"The **current ratio** shows how well a company can meet its current obligations.","ref":["Builder's Guide to Accounting  ·  269"]},{"id":"3-69","exam":3,"num":69,"stem":"Which of the following is not in accordance with requirements for an executive being granted an exemption from the Fair Labor Standards Act?","options":["Person whose primary duty if to manage a company subdivision","The person regularly directs 3 to 4 employees","The person receives a salary of $150 or more per week","The person regularly exercises discretionary power"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"**$150 a week** isn't the salary test for the executive exemption (the current federal standard is $684 a week). Managing a subdivision, directing 2 or more employees and using discretion are all real requirements.","ref":["Florida Contractors Manual  ·  5-15"]},{"id":"3-70","exam":3,"num":70,"stem":"Which of the following production factors would not be considered by the estimator when calculating equipment cost estimates?","options":["Climate","Experience of the operators","Highway or street speed limits","Original purchase price of the equipment"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"Production factors are climate, operator experience and speed limits. The **original purchase price** is a cost factor, not a production factor.","ref":["Florida Contractors Manual  ·  10-27"]},{"id":"3-71","exam":3,"num":71,"stem":"Master activities are a group of activities with no activity representing more than __________ of the project.","options":["10%","20%","25%","30%"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-58"}],"exp":"In a schedule, master activities are grouped so that no single activity is more than **10%** of the project.","ref":["Florida Contractors Manual  ·  10-58"],"lock":1},{"id":"3-72","exam":3,"num":72,"stem":"Requests for translated examinations, except for those in Spanish, must be on file in the board office, or with the department when there is no board, at least __________ days (months) prior to the scheduled examination.","options":["6","14","21","45"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.217(6)"}],"exp":"§455.217(6): requests for a translated exam (in a language other than Spanish) must be on file at least **6 months** before the exam. The question's \"days (months)\" means months.","ref":["Florida Statute 455  ·  455.217(6)"],"lock":1},{"id":"3-73","exam":3,"num":73,"stem":"The Florida Civil Rights Act of 1992, (Chapter 760, FL. Stat.), does not protect against discrimination for which of the following?","options":["Age","Religion","Alcoholism","Drug abuse"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-36"}],"exp":"The Florida Civil Rights Act protects age, religion and handicap (alcoholism can count as a handicap). **Current illegal drug abuse is not protected**.","ref":["Florida Contractors Manual  ·  5-36"]},{"id":"3-74","exam":3,"num":74,"stem":"When preparing financial statements, accruals are used to record __________.","options":["Lump sum payments","Income earned but not yet received","Cash transactions","Prepayments on a future contract"],"answer":1,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"106-107"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"Accruals record **income earned but not yet received**: revenue when earned, expenses when incurred.","ref":["Builder's Guide to Accounting  ·  106 - 107","Under the accrual method of accounting, revenue is considered earned when services are rendered, and expenses are incurred when services are received.","Florida Contractors Manual  ·  3-105"],"dupes":["1-119"]},{"id":"3-75","exam":3,"num":75,"stem":"In order to comply with FDEP asbestos regulations, when demolishing commercial, industrial, publicly owned building, or residential structures with more than four dwelling units, notification must be sent to FDEP at least how many working days prior to beginning the demolition?","options":["7","10","14","20"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-97"}],"exp":"FDEP asbestos rule: notify at least **10 working days** before demolishing commercial, industrial or public buildings, or residential buildings with more than 4 units.","ref":["Florida Contractors Manual  ·  10-97"],"lock":1},{"id":"3-76","exam":3,"num":76,"stem":"According to Florida Unemployment Compensation Employer Handbook, tax rates are referred to as __________ ratings.","options":["Cost","Experience","Records","Required"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-271"},{"book":"FCM","eds":["2021"],"loc":"5-293"},{"book":"FCM","eds":["2017"],"loc":"5-296"}],"exp":"Florida reemployment tax rates are **experience ratings**. Employers with fewer claims charged pay lower rates.","ref":["Florida Contractors Manual  ·  2025: 5-271","2021: 5-293","2017: 5-296"]},{"id":"3-77","exam":3,"num":77,"stem":"On which of the following items must Florida sales tax be paid by a prime contractor, if it is not included on the invoice?","options":["Invoice from a concrete supplier","Invoice from a temporary help agency","Invoice from a block mason for labor only","Invoice from a non-exempt subcontractor"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-63"},{"book":"FCM","eds":null,"loc":"3-64"}],"exp":"Florida sales tax applies to **materials** (tangible goods), so the **concrete supplier's invoice** is taxable. Labor-only services and temporary help aren't. Labor is taxed only when an item is fabricated in a shop and sold.","ref":["Florida Contractors Manual  ·  3-63, 3-64","Answers B, C, & D are wrong because sales tax is only charged on materials. The only time that sales tax is computed on labor and material both is when the product is fabricated in a shop, such as a sheet metal shop, and then sold to the public."]},{"id":"3-78","exam":3,"num":78,"stem":"According to Florida Unemployment Compensation Employer Handbook, an unemployed worker __________.","options":["Cannot qualify for benefits","Qualifies for benefits only if paid minimum wage","Qualifies for benefits if employed for one quarter of the base period","Qualifies for benefits if employed for two quarters"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-279"},{"book":"FCM","eds":["2021"],"loc":"5-299"},{"book":"FCM","eds":["2017"],"loc":"5-301"}],"exp":"An unemployed worker qualifies only if they were **paid wages in 2 or more quarters of the base period**.","ref":["Florida Contractors Manual  ·  2025: 5-279","2021: 5-299","2017: 5-301","Qualifies for benefits if he/she has been paid wages in 2 or more quarters in the base period.","1 quarter = 3 months, therefore 2 quarters = 6 months."]},{"id":"3-79","exam":3,"num":79,"stem":"The Civil Rights Act of 1866 applies __________.","options":["Only to public employees","Only to employees of the Federal Government","Only to minority employees","To all employees"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-37"}],"exp":"The Civil Rights Act of 1866 (42 U.S.C. §1981) applies to **all employers and all employees**, with no minimum employee count.","ref":["Florida Contractors Manual  ·  5-37"]},{"id":"3-80","exam":3,"num":80,"stem":"With respect to an applicant for a certificate, the initial application fee may not exceed __________.","options":["$100","$125","$135","$150"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-85","stat":"489.109(1)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-67","stat":"489.109(1)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-75","stat":"489.109(1)(a)"}],"exp":"§489.109(1)(a): the initial application fee for a certificate may not exceed **$150**.","ref":["Florida Contractors Manual  ·  2025: 2-85: 489.109(1)(a)","2021: 2-67: 489.109(1)(a)","2017: 2-75: 489.109(1)(a)"],"lock":1},{"id":"3-81","exam":3,"num":81,"stem":"Which jobs would not require use of the percentage of completion method?","options":["Jobs longer than two years in duration","Jobs by firms that require periodic, progressive recognition of profit from their jobs","Construction jobs producing annual revenue greater than $10 million","Jobs costing $1,000 - $5,000 which take approximately one week to complete"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"25"}],"exp":"Short, small jobs (**$1,000–$5,000, about a week**) don't need the percentage of completion method.","ref":["Builder's Guide to Accounting  ·  25"]},{"id":"3-82","exam":3,"num":82,"stem":"After a licensee's completion of a continuing education course, the information must be submitted to the department electronically no later than __________ calendar days.","options":["7","14","30","45"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2178(1)"}],"exp":"§455.2178(1): CE providers must submit course completions to DBPR electronically within **30 days**.","ref":["Florida Statute 455  ·  455.2178(1)"],"lock":1},{"id":"3-83","exam":3,"num":83,"stem":"All the following are procedures included in the budget process except __________.","options":["Analyzing the results","Consulting with your accountant","Preparing the budget","Acting to control expenses"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"144"}],"exp":"The budget process is prepare, analyze results and act to control expenses. **Consulting your accountant** isn't a step.","ref":["Builder's Guide to Accounting  ·  144"],"dupes":["1-123"]},{"id":"3-84","exam":3,"num":84,"stem":"According to the Veteran's Re-employment Laws, military leave of absence must be granted to any permanent full time or permanent part-time employee who enlists or is drafted into active duty in the armed forces. Discharging an employee without cause, who has been rehired and is covered under the law, is prohibited for a period of __________ if the employee's military service period was less than 180 days and more than 30 days.","options":["6 months","1 year","1 year and 6 months","2 years"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-45"}],"exp":"Per the manual's text on veterans' reemployment law (FCM 5-45), the answer is **1 year**. Note that current federal USERRA law protects a rehired employee who served 31 to 180 days for **180 days**, and one who served more than 180 days for 1 year. The exam is built on the manual, so answer from the book and double-check the wording on FCM 5-45.","ref":["Florida Contractors Manual  ·  5-45"]},{"id":"3-85","exam":3,"num":85,"stem":"When figuring overhead, which is a fixed expense?","options":["Small tools","Operating supplies","Equipment rental","Advertising"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142"}],"exp":"Per the Builder's Guide, **advertising** is treated as a fixed overhead expense. Small tools, operating supplies and equipment rental vary with work volume.","ref":["Builder's Guide to Accounting  ·  142"]},{"id":"3-86","exam":3,"num":86,"stem":"The best way to control equipment costs is good __________.","options":["Maintenance","Scheduling","Financing","Reports"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"228"}],"exp":"Good **scheduling** is the best way to control equipment costs.","ref":["Builder's Guide to Accounting  ·  228"],"dupes":["1-124"]},{"id":"3-87","exam":3,"num":87,"stem":"In order to establish an hourly cost for a bulldozer for job allocations, which of the following would NOT apply?","options":["Cost of equipment less salvage value","Operating costs involving gas, oil, and accessories","Repairing and maintenance costs","Unpredictable job site conditions"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159"},{"book":"BGA","eds":null,"loc":"160"}],"exp":"**Unpredictable job site conditions** can't be built into an hourly equipment rate.","ref":["Builder's Guide to Accounting  ·  159, 160"],"dupes":["1-125"]},{"id":"3-88","exam":3,"num":88,"stem":"Adjustment of the contract sum using a change order must be established based on __________.","options":["An agreement between the owner, contractor and architect","The unit prices as stated in the contract documents","Labor, material and equipment costs","The architect's recommendation"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: a change order's adjustment to the contract sum is set by **agreement among the Owner, Contractor and Architect**.","ref":["AIA Document A201, 2017  ·  7.2.1"]},{"id":"3-89","exam":3,"num":89,"stem":"When preparing a financial statement for a lender before applying for a loan, it is best to __________.","options":["Accumulate current assets to improve the cash position","Reduce current liabilities","Try to decrease the current ratio","Try to increase the volume of business"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"174"}],"exp":"Before applying for a loan, **reduce current liabilities** to improve your current ratio and how strong your balance sheet looks.","ref":["Builder's Guide to Accounting  ·  174"]},{"id":"3-90","exam":3,"num":90,"stem":"Your contractor's license number must appear in or on all the following advertisements except __________.","options":["Free yellow Page listings","Coupons","Business proposals","Business cards"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-165","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-124","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-149","stat":"61G4-12.011(3)"}],"exp":"61G4-12.011(3): the license number must appear in advertising, but **free Yellow Pages listings** (free directory listings) are exempt.","ref":["Florida Contractors Manual  ·  2025: 2-165: 61G4-12.011(3)","2021: 2-124: 61G4-12.011(3)","2017: 2-149: 61G4-12.011(3)"]},{"id":"3-91","exam":3,"num":91,"stem":"Every certified and registered contractor must complete a minimum of __________ hours of continuing education during every two-year license cycle.","options":["3","7","14","16"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-17"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"Contractors need **14 hours** of CE every 2-year cycle.","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-17","2017: 2-19"],"lock":1},{"id":"3-92","exam":3,"num":92,"stem":"All current liabilities include equipment that is payable within __________ days.","options":["30","90","180","365"],"answer":3,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"253"},{"book":"FCM","eds":null,"loc":"3-107"}],"exp":"Current liabilities = payable within **365 days**.","ref":["Builder's Guide to Accounting  ·  253","Florida Contractors Manual  ·  3-107"],"lock":1},{"id":"3-93","exam":3,"num":93,"stem":"Which item below is not a fixed asset?","options":["Inventory","Land","Equipment","Trucks"],"answer":0,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"252"},{"book":"BGA","eds":null,"loc":"327"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"**Inventory** is a current asset. Land, equipment and trucks are fixed (long-term) assets.","ref":["Builder's Guide to Accounting  ·  252 or 327","Florida Contractors Manual  ·  3-108 (Long-Term Assets) Fixed assets are also referred to as long-term assets."]},{"id":"3-94","exam":3,"num":94,"stem":"According to Florida Unemployment Compensation Employer Handbook, Cafeteria Payment plans are exempt if they are __________.","options":["For Federal employees","Not Federally subsidized","Not reported to the Internal Revenue Service","Reported to the Internal Revenue Service"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-266"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"Per the Reemployment Tax handbook, cafeteria plan payments are exempt from reemployment tax if they're **not reported to the IRS** as wages.","ref":["Florida Contractors Manual  ·  2025: 5-266","2021: 5-290","2017: 5-292"]},{"id":"3-95","exam":3,"num":95,"stem":"When using the inventory ratio method, a high ratio indicates __________.","options":["Average inventory","High inventory","High market average","Low inventory"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"A high inventory turnover ratio means **low inventory**.","ref":["Builder's Guide to Accounting  ·  121"]},{"id":"3-96","exam":3,"num":96,"stem":"An equipment schedule shows that 60 dump trucks will be required in September and 15 dump trucks during October and November. You have 30 dump trucks available. You should attempt to __________.","options":["Simply let the contract extend over the required completion time","Buy 30 new dump trucks","Revise the project schedule to distribute the dump trucks evenly over the months so that 30 dump trucks are required","Work 30 trucks overtime during September using a second or third shift"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"Total truck-months needed = 60 + 15 + 15 = 90. Spread over 3 months, that's 30 a month, exactly the 30 trucks you have. **Revise the schedule to level the demand to 30 trucks**.","calc":1,"ref":["Florida Contractors Manual  ·  10-27","30 (Sept.) + 15 (Oct.) + 15 (Nov.) = 60/3 months = 30 trucks per month"]},{"id":"3-97","exam":3,"num":97,"stem":"An employee discloses an employer's violations of law, which may pose a danger to public, health, safety, or welfare. The employee is protected from retaliation by the __________.","options":["Employees Legal Defense Fund","Federal Employees Act","Graham Employees Act","Public Whistle-blowers Act"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-45"}],"exp":"Florida's **Whistle-blower's Act** protects employees who disclose violations of law that endanger public health, safety or welfare from retaliation.","ref":["Florida Contractors Manual  ·  5-45"]},{"id":"3-98","exam":3,"num":98,"stem":"The Florida Aids Statute (FS 760.50) prohibits AIDS/HIV discrimination, and provides that persons with AIDS, ARC or HIV have the same protection as other disabled persons. This law applies to __________.","options":["All employers","Employers with 2 or more employees","Employers with 6 or more employees","Employers with 15 or more employees"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-44"}],"exp":"FS 760.50, Florida's AIDS/HIV discrimination law, applies to **all employers**, regardless of size.","ref":["Florida Contractors Manual  ·  5-44"]},{"id":"3-99","exam":3,"num":99,"stem":"Which activity is a construction job, as that term is used in the Worker's Compensation Statute?","options":["Roof replacement","A homeowner's building their own premises","Well drilling on land containing existing structures","Manufacturing of materials used in construction work"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-6"}],"exp":"**Roof replacement** is construction work for workers' comp purposes. Homeowners building their own homes, manufacturing materials, and well drilling on land with existing structures are excluded.","ref":["Florida Contractors Manual  ·  6-6"]},{"id":"3-100","exam":3,"num":100,"stem":"If an owner makes payment to a contractor, without requiring waiver or release by a lienor who has filed a Notice to Owner, the payments are considered __________ payments.","options":["Improper","Refused","Unrecoverable","Non-essential"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-75","stat":"713.06(2)(a)(c)"},{"book":"FCM","eds":["2021"],"loc":"9-72","stat":"713.06(2)(a)(c)"},{"book":"FCM","eds":["2017"],"loc":"9-76","stat":"713.06(2)(a)(c)"}],"exp":"§713.06: payments to the contractor without getting lien releases from lienors who served a Notice to Owner are **improper payments**. The owner may have to pay twice.","ref":["Florida Contractors Manual  ·  2025: 9-75: 713.06(2)(a)(c)","2021: 9-72: 713.06(2)(a)(c)","2017: 9-76: 713.06(2)(a)(c)"]},{"id":"3-101","exam":3,"num":101,"stem":"Given: A pick-up truck was originally purchased for $16,900.00. The accumulated depreciation of the pick-up truck shown on the books to date is $4,200.00. The pick-up truck was sold for $11,500.00. The resulting loss (or profit) from the sales of the pick-up truck that will be shown on the books is a __________.","options":["Loss of $1,200.00","Loss of $5,400.00","Profit of $5,600.00","Profit of $12,700.00"],"answer":0,"topic":"dep","books":["FCM","BGA"],"cites":[{"book":"FCM","eds":null,"loc":"3-34"},{"book":"BGA","eds":null,"loc":"162"}],"exp":"Book value = cost − accumulated depreciation = $16,900 − $4,200 = $12,700. Sold for $11,500, which is less than book value: **loss of $1,200**.","tip":"Sale price minus book value: positive is a gain, negative is a loss.","calc":1,"ref":["Florida Contractors Manual  ·  3-34","Builder's Guide to Accounting  ·  162"]},{"id":"3-102","exam":3,"num":102,"stem":"Any certified contractor who allows his/her certificate to be used by an uncertified person with the intent to evade the provisions of this law may be fined a maximum of __________.","options":["$1,000.00","$5,000.00","$7,500.00","$10,000.00"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-202"},{"book":"FCM","eds":["2021"],"loc":"2-158"},{"book":"FCM","eds":["2017"],"loc":"2-184"}],"exp":"Letting an uncertified person use your certificate to evade the law can bring the maximum administrative fine of **$10,000**.","ref":["Florida Contractors Manual  ·  2025: 2-202","2021: 2-158","2017: 2-184"],"lock":1},{"id":"3-103","exam":3,"num":103,"stem":"If a corporation meets all the requirements specified by the Internal Revenue Service and elect to be taxed as a partnership rather than a corporation, the company is referred to as a (an) __________.","options":["Limited partnership","Employee stock Ownership Corporation","S Corporation","Joint Venture"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-11"},{"book":"FCM","eds":["2021"],"loc":"1-11"},{"book":"FCM","eds":["2021"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A corporation that meets IRS requirements and elects to be taxed like a partnership (pass-through) is an **S Corporation**.","ref":["Florida Contractors Manual  ·  2025: 1-11","2021: 1-11, 1-12","2017: 1-13"]},{"id":"3-104","exam":3,"num":104,"stem":"According to the Florida Construction Industry Licensing Law, each certified contractor shall display in all advertising medium used by the contractor his/her __________ number.","options":["Employer Identification","Insurance Policy","Certification","State Sales Tax"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-31","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2025"],"loc":"2-165","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-29","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-124","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-22","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-149","stat":"61G4-12.011(3)"}],"exp":"61G4-12.011: every certified contractor's advertising must show the **certificate (or registration) number**.","ref":["Florida Contractors Manual  ·  2025: 2-31, 2-165: 61G4-12.011(3)","2021: 2-29, 2-124: 61G4-12.011(3)","2017: 2-22, 2-149: 61G4-12.011(3)"]},{"id":"3-105","exam":3,"num":105,"stem":"Service of a Notice to Owner or a preliminary Notice to Contractor is effective as of the date of mail if the Notice is mailed within __________ days after the date the lienor first furnishes labor, services, or materials.","options":["10","20","30","40"],"answer":3,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-92","stat":"713.18(2)(b)"},{"book":"FCM","eds":["2021"],"loc":"9-84","stat":"713.18(2)(b)"},{"book":"FCM","eds":["2017"],"loc":"9-101","stat":"713.18(2)(b)"}],"exp":"§713.18: a Notice to Owner or preliminary notice to contractor is effective on the mailing date if mailed within **40 days** of first furnishing. It must still be served within 45 days.","ref":["Florida Contractors Manual  ·  2025: 9-92: 713.18(2)(b)","2021: 9-84: 713.18(2)(b)","2017: 9-101: 713.18(2)(b)"],"lock":1},{"id":"3-106","exam":3,"num":106,"stem":"Given: A contractor hires a day laborer at a rate of $35.00 for one day's work. The contractor uses the laborer for six days in one workweek. The laborer average 8-1/2 hours of work per day. The laborer is entitled to __________. Select the closest answer.","options":["A gross pay of $199.45 for the six days of work","A gross pay of $210.00 for the six days of work","A gross pay of $232.66 for the six days of work","A gross pay of $409.63 for the six days of work"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-21"}],"exp":"The day rate gives $210 for 51 hours = $4.12/hr, which is below the $7.25 minimum wage. So pay at minimum wage: 40 hrs × $7.25 = $290, plus overtime of 11 hrs × $7.25 × 1.5 = $119.63. Total **$409.63**.","tip":"Check the regular rate against minimum wage before figuring overtime.","calc":1,"ref":["Florida Contractor's Manual  ·  5-21","Total pay for 6 days x $35.00 = $210.00","Total hours worked 6 days x 8.5 hours = 51 hours","Employee's regular rate of pay - $210.00","$210.00 ÷ 51 hours = $4.12 per hour","Note: Federal minimum wage of $7.25 applies","Regular Pay = 40 hours x $7.25 = $290.00","Overtime = 11 hours x $7.25 x 1.5 = $119.63","Total pay = $290.00 + $119.63 = $409.63"]},{"id":"3-107","exam":3,"num":107,"stem":"Which of the following is considered a type of accrual?","options":["Cash or other payments received","Billings mailed out, but not yet paid","Anticipated profit from uncompleted work","Estimated cost of work not yet completed"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"237"}],"exp":"**Billings mailed but not yet paid** (accounts receivable) are an accrual. The revenue is earned, but the cash hasn't come in.","ref":["Builder's Guide to Accounting  ·  11 or 237"]},{"id":"3-108","exam":3,"num":108,"stem":"The ratios used to judge the cash position of a company are called __________.","options":["Balance Ratios","Accruals","Combination Ratios","Liquidity Tests"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"174"}],"exp":"Ratios that judge cash position are **liquidity tests** (current ratio, quick ratio).","ref":["Builder's Guide to Accounting  ·  174"]},{"id":"3-109","exam":3,"num":109,"stem":"A company has estimated net income of $1,200,000.00. In order to achieve a margin of profit of 37%, the company's sales should be __________.","options":["$2,702,000.00","$2,444,000.00","$1,444,000.00","$3,243,243.00"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"272"}],"exp":"Profit margin = net income ÷ sales, so sales = net income ÷ margin = $1,200,000 ÷ 0.37 = **$3,243,243**.","calc":1,"ref":["Builder's Guide to Accounting  ·  272","Net Income/Sales = Margin of profit","$1,200,000 / x = 37% = $3,243,243"],"lock":1},{"id":"3-110","exam":3,"num":110,"stem":"What is the term for the effective annual interest charged on the principal borrowed?","options":["Discount","Rate","Loan","Finance charge"],"answer":1,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-73"}],"exp":"The effective annual interest charged on the principal borrowed is the **rate**.","ref":["Florida Contractors Manual  ·  3-73"]},{"id":"3-111","exam":3,"num":111,"stem":"According to the Florida \"Statute of Frauds\", the following contracts must be in writing to be enforceable except __________.","options":["A lease of real property for less than 1 year","A contract for the sale of real property","A contract that cannot be performed in less than one year","An agreement to submit disputes to arbitration"],"answer":0,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-7"}],"exp":"Florida's Statute of Frauds requires writing for real estate sales, contracts that can't be done within a year, and arbitration agreements. **A lease of real property for less than 1 year** can be oral.","ref":["Florida Contractors Manual  ·  8-7"]},{"id":"3-112","exam":3,"num":112,"stem":"The break-even point __________.","options":["Distinguishes between the various yields of the different jobs and job types","Can help the contractor decide what kinds of work he or she needs to reach a volume goal","Encourages growth","Indicates the minimum sales you need to break even"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"179"}],"exp":"The breakeven point **shows the minimum sales you need to break even** (no profit, no loss).","ref":["Builder's Guide to Accounting  ·  179"]},{"id":"3-113","exam":3,"num":113,"stem":"When a business is structured as a joint venture __________.","options":["An oral agreement between the parties is recommended","There must be a formal partnership agreement","Its activity is generally limited to a single transaction","Venture members have limited personal liability"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-11"},{"book":"FCM","eds":["2017"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A joint venture's activity is generally **limited to a single transaction or project**.","ref":["Florida Contractors Manual  ·  2025: 1-10","2021: 1-10, 1-11","2017: 1-12, 1-13"]},{"id":"3-114","exam":3,"num":114,"stem":"A bid bond guarantees that when the contract is awarded, the bidder will __________.","options":["Submit a breakdown of the bid together with a list of subcontractors","Enter the contract at the bid price","Submit copies of all bid documents for the owner's review","Submit a statement of the contractor's qualifications and past performance"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-105"},{"book":"FCM","eds":null,"loc":"4-13"},{"book":"FCM","eds":null,"loc":"10-73"}],"exp":"A bid bond guarantees the bidder will **enter into the contract at the bid price** (and provide the required bonds).","ref":["Florida Contractors Manual  ·  3-105, 4-13, 10-73"]},{"id":"3-115","exam":3,"num":115,"stem":"Which one of the following is an incentive to pay an invoice early or when due?","options":["Credit","Rebate","Discount","Additional contracts"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"A **discount** for prompt payment is the incentive to pay early or on time.","ref":["Builder's Guide to Accounting  ·  59"]},{"id":"3-116","exam":3,"num":116,"stem":"All the following are examples of types of offers in construction contracts except __________.","options":["Bids","Purchase orders","Proposals","Negotiations"],"answer":3,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-5"}],"exp":"Bids, purchase orders and proposals are all offers. **Negotiations** are discussions, not offers.","ref":["Florida Contractors Manual  ·  8-5"]},{"id":"3-117","exam":3,"num":117,"stem":"A concrete subcontractor is asked to provide a cost estimate to extend a concrete foundation from 60' x 80' to 80' x 100'. The contractor determines that the 60' x 80' foundation cost $4,500 and that the additional work would cost $1.25/sq. ft. extra. This method of estimating is called the __________.","options":["Approximate estimated method","Detailed survey method","Square footage method","Unit price method"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-12"}],"exp":"Pricing the extra work by area ($1.25 per added square foot) is the **square footage method**.","ref":["Florida Contractors Manual  ·  10-12"]},{"id":"3-118","exam":3,"num":118,"stem":"CSI Master Format divides the specifications into how many specific divisions?","options":["15","50","18","40"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-7"}],"exp":"CSI MasterFormat (2004 and later) has **50 divisions** (00–49). The old format had 16.","ref":["Florida Contractors Manual  ·  10-7"],"lock":1},{"id":"3-119","exam":3,"num":119,"stem":"Which is the best method to check an estimate in order to eliminate as many errors as possible?","options":["Have another estimator take the original estimate and recheck the figures and computations","Compare the original estimate with an estimate from a similar project","Perform the estimating process a second time and compare it with the initial estimate","Have another estimator make an independent estimate and compare it to the original estimate"],"answer":1,"topic":"est","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"225"}],"exp":"Per the Builder's Guide (p. 225), the recommended check is to **compare the estimate with one from a similar project**.","ref":["Builder's Guide to Accounting  ·  11 or 225"]},{"id":"3-120","exam":3,"num":120,"stem":"The maximum penalty for knowingly making false statements, representations, or certification in any application, record, report, plan or other document filed as part of the OSHA requirements is a fine and term of imprisonment of not more than __________.","options":["$1,000 and 60 days","$5,000 and 6 months","$10,000 and 6 months","$100,000 and 1 year"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-17"}],"exp":"Knowingly making false statements in OSHA records or reports: up to **$10,000 and 6 months in jail**.","ref":["Florida Contractors Manual  ·  7-17"]},{"id":"3-121","exam":3,"num":121,"stem":"What is the MAJOR difference between the various types of negotiated contracts, such as lump-sum, cost-plus or guaranteed maximum price?","options":["The relationship between the owner and the contractor","The relationship between the architect and the contractor","The provision regarding liability of the contractor","The provision regarding compensation of the contractor"],"answer":3,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-35"}],"exp":"Lump-sum, cost-plus and GMP contracts differ mainly in **how the contractor is paid** (compensation).","ref":["Florida Contractors Manual  ·  10-35"]},{"id":"3-122","exam":3,"num":122,"stem":"Some types of cost-plus contracts could be ___________________.","options":["Cost plus interest and cost-plus allowances","Cost plus fixed fee and cost-plus percentage of reimbursable costs","Cost plus inflation and cost-plus markup","Cost plus damages and cost-plus profit"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-79"}],"exp":"Cost-plus contracts include **cost plus a fixed fee and cost plus a percentage of reimbursable costs**.","ref":["Florida Contractors Manual  ·  3-79"]},{"id":"3-123","exam":3,"num":123,"stem":"The complaint and all information obtained pursuant to the investigation by the department are confidential until __________ days after probable cause has been found to exist by the probable cause panel or by the department.","options":["5","10","15","20"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.225(10)"}],"exp":"§455.225(10): the complaint and investigation records stay confidential until **10 days** after probable cause is found.","ref":["Florida Statute 455  ·  455.225(10)"],"lock":1},{"id":"3-124","exam":3,"num":124,"stem":"A (An) ____________ loan accrues interest until maturity and is paid in one payment which covers the principal and interest at the maturity date of the loan.","options":["Project","Term","Interest","Subordinated loan"],"answer":1,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-73"}],"exp":"Per the manual, a **term loan** accrues interest until maturity and is repaid in one payment of principal and interest on the maturity date.","ref":["Florida Contractors Manual  ·  3-73"]},{"id":"3-125","exam":3,"num":125,"stem":"A claim for a contract adjustment, because of concealed conditions, must be made within __________.","options":["Ten days after the first observance of the condition","Fourteen days after the first observance of the condition","Ten days after the date the architect has seen the condition","Twenty-one days after the architect has given notice of the decision"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.7.4"}],"exp":"A201 §3.7.4: claims for concealed conditions must be made within **14 days** of first observing the condition.","ref":["AIA Document A201, 2017  ·  3.7.4"]}];

  var LOGO = '<svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="5" width="26" height="31" rx="3" fill="var(--blue)"/><rect x="29" y="9" width="8" height="7" rx="1.5" fill="var(--hi)"/><rect x="29" y="18" width="8" height="7" rx="1.5" fill="var(--tab-bga)"/><rect x="29" y="27" width="8" height="6" rx="1.5" fill="var(--tab-aia)"/><path d="M9 14h14M9 20h14M9 26h9" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/></svg>';

  /* ------------------------------------------------------------------ question model */

  /* ------------------------------------------------------------------ stats */

    if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { render(); }); } catch (e) { /* old browsers */ } }
  }

  function boot() {
    main = document.getElementById("main");
    bind();
    var v = (location.hash || "").replace("#", "");
    if (v && VIEWS[v] && v !== "session" && v !== "topic") state.view = v;
    render(true);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
