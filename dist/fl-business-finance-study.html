<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FL Business &amp; Finance Prep</title>
<meta name="description" content="Study app for the Florida contractor Business and Finance exam: 375 practice questions with explanations, timed exams, spaced review, flashcards, math lab and a book-tab guide.">
<meta name="theme-color" content="#1d4f9c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: app shell. Sidebar nav on wide screens, bottom tab bar on phones; one content column ~760px.
   Visual idea: blueprint ink on drafting paper, highlighter yellow for the one thing to remember,
   and colored book tabs (like the tabs candidates stick in their reference books). */
:root {
  --paper: #f3f6fa;
  --surface: #ffffff;
  --surface-2: #e9eef5;
  --ink: #132136;
  --muted: #5b6779;
  --line: #d6dee9;
  --blue: #1d4f9c;
  --blue-soft: #e3ecf9;
  --hi: #f4c534;
  --hi-soft: #fdf2c4;
  --hi-ink: #3d2f00;
  --ok: #1b7a50;
  --ok-soft: #dff3e8;
  --bad: #b5372a;
  --bad-soft: #fbe5e1;
  --warn: #a8640a;
  --tab-fcm: #1d4f9c;
  --tab-bga: #2a7d4f;
  --tab-aia: #c0561b;
  --tab-fs: #6a4bb0;
  --shadow: 0 1px 2px rgba(19, 33, 54, .06), 0 4px 16px rgba(19, 33, 54, .06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d141f; --surface: #152031; --surface-2: #1c293d; --ink: #e5ebf4; --muted: #95a3b8; --line: #2a3a52;
    --blue: #79a3ec; --blue-soft: #1c2e4b; --hi: #e9bb2b; --hi-soft: #3a3110; --hi-ink: #fbe8a6;
    --ok: #46be86; --ok-soft: #133426; --bad: #ef7a67; --bad-soft: #3d1b17; --warn: #e3a23f;
    --tab-fcm: #79a3ec; --tab-bga: #5cc58a; --tab-aia: #f08b52; --tab-fs: #a88cf0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d141f; --surface: #152031; --surface-2: #1c293d; --ink: #e5ebf4; --muted: #95a3b8; --line: #2a3a52;
  --blue: #79a3ec; --blue-soft: #1c2e4b; --hi: #e9bb2b; --hi-soft: #3a3110; --hi-ink: #fbe8a6;
  --ok: #46be86; --ok-soft: #133426; --bad: #ef7a67; --bad-soft: #3d1b17; --warn: #e3a23f;
  --tab-fcm: #79a3ec; --tab-bga: #5cc58a; --tab-aia: #f08b52; --tab-fs: #a88cf0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
mark, .hl { background: linear-gradient(transparent 38%, var(--hi-soft) 38%); color: inherit; padding: 0 .1em; }
strong { font-weight: 700; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 2.2rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; font-weight: 600; color: var(--muted); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.sidebar { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.brand-sub { font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.topbar .spacer { flex: 1; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }

main {
  width: 100%; max-width: 820px; margin: 0 auto;
  padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; min-width: 0;
}

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.bottomnav button { background: none; border: 0; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--muted); cursor: pointer; height: var(--nav-h); justify-content: center; }
.bottomnav button svg { width: 22px; height: 22px; }
.bottomnav button[aria-current="page"] { color: var(--blue); font-weight: 600; }
.bottomnav .badge { position: absolute; transform: translate(14px, -6px); }

@media (min-width: 960px) {
  .shell { grid-template-columns: 240px 1fr; }
  .sidebar {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 18px 12px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .sidebar .brand { padding: 4px 8px 16px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar .navgroup { margin-top: 14px; padding: 0 10px 4px; }
  .navlink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--ink); text-align: left; font-size: .95rem; width: 100%; }
  .navlink svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .navlink:hover { background: var(--surface-2); }
  .navlink[aria-current="page"] { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .navlink[aria-current="page"] svg { color: var(--blue); }
  .navlink .badge { margin-left: auto; }
  .topbar, .bottomnav { display: none; }
  main { padding-bottom: 48px; padding-top: 32px; }
}

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tight { padding: 14px 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack.lg { gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 560px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head p { margin: 0; color: var(--muted); max-width: 62ch; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 16px; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.2; min-height: 42px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.hi { background: var(--hi); border-color: var(--hi); color: #241b00; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: .875rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .875rem; line-height: 1.2;
}
.chip[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 700; font-family: var(--font-mono); }
.badge.blue { background: var(--blue); color: var(--surface); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.hi { background: var(--hi-soft); color: var(--hi-ink); border-color: transparent; }
.pill.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }

/* Book tabs — the little colored index tabs */
.tab { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .75rem; font-weight: 600; padding: 3px 8px 3px 10px; border-radius: 3px 8px 8px 3px; color: var(--surface); background: var(--tab-fcm); white-space: nowrap; }
.tab.bga { background: var(--tab-bga); }
.tab.aia { background: var(--tab-aia); }
.tab.fs { background: var(--tab-fs); }
.tab.outline { background: none; border: 1.5px solid currentColor; color: var(--tab-fcm); }
.tab.outline.bga { color: var(--tab-bga); }
.tab.outline.aia { color: var(--tab-aia); }
.tab.outline.fs { color: var(--tab-fs); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-display); }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 42px;
}
textarea { min-height: 80px; resize: vertical; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--blue); }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > span { display: block; height: 100%; background: var(--blue); border-radius: inherit; }
.bar.ok > span { background: var(--ok); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }

.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.stat .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .78rem; color: var(--muted); }

hr.rule { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.scroll-x { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; color: var(--muted); font-weight: 600; }
table.t td.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; justify-items: start; } }
.gauge { width: 150px; height: 150px; }
.gauge text { font-family: var(--font-display); fill: var(--ink); }
.gauge .sub { font-family: var(--font-body); fill: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
.check { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.check:last-child { border-bottom: 0; }
.check .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 2px; }
.check.done .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.check .box svg { width: 14px; height: 14px; }
.next-step { border-left: 6px solid var(--hi); }
.countdown { font-family: var(--font-display); font-size: 1rem; font-weight: 600; }

/* ---------- question card ---------- */
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.q-progress { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.q-scenario { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: .95rem; border-left: 4px solid var(--blue); }
.q-stem { font-size: 1.15rem; line-height: 1.5; font-weight: 500; margin: 0; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); margin: 0 .15em; transform: translateY(-.15em); }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 54px; width: 100%;
}
.opt:hover:not([disabled]) { border-color: var(--blue); background: var(--blue-soft); }
.opt .letter { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; background: var(--surface-2); }
.opt.selected { border-color: var(--blue); background: var(--blue-soft); }
.opt.selected .letter { background: var(--blue); color: var(--surface); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .letter { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.opt .mark svg { width: 20px; height: 20px; }
.opt.correct .mark { color: var(--ok); }
.opt.wrong .mark { color: var(--bad); }
.verdict { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.explain p { margin: 0; max-width: 68ch; }
.tipbox { background: var(--hi-soft); color: var(--hi-ink); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; }
.tipbox b { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; padding-top: 2px; }
.where { border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.where .cites { display: flex; flex-wrap: wrap; gap: 6px; }
details.keyref summary { cursor: pointer; font-size: .85rem; color: var(--muted); }
details.keyref pre { white-space: pre-wrap; font-family: var(--font-mono); font-size: .78rem; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; overflow-x: auto; }
.q-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.flag-on { color: var(--warn); border-color: var(--warn); }
.kbd { font-family: var(--font-mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }
.edition-note { font-size: .85rem; background: var(--blue-soft); color: var(--ink); border-radius: 8px; padding: 8px 12px; }

/* ---------- exam ---------- */
.exam-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px); z-index: 10; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); }
@media (min-width: 960px) { .exam-bar { top: 12px; } }
.timer { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.pace { font-size: .78rem; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.qgrid button { height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: .78rem; cursor: pointer; position: relative; }
.qgrid button.answered { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
.qgrid button.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.qgrid button.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.qgrid button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.qgrid button.miss { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.result-big { font-family: var(--font-display); font-size: 4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.passfail { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 4px 14px; border-radius: 6px; }
.passfail.pass { background: var(--ok-soft); color: var(--ok); }
.passfail.fail { background: var(--bad-soft); color: var(--bad); }

/* ---------- topics ---------- */
.topic-row { display: grid; grid-template-columns: 1fr 120px 52px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.topic-row:last-child { border-bottom: 0; }
.topic-row:hover .tname { color: var(--blue); }
.topic-row .num { font-family: var(--font-mono); font-size: .85rem; text-align: right; }
@media (max-width: 480px) { .topic-row { grid-template-columns: 1fr 70px 46px; } }
.dotline { display: flex; flex-wrap: wrap; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.dot.b1 { background: var(--bad); border-color: var(--bad); }
.dot.b2 { background: var(--hi); border-color: var(--hi); }
.dot.b3, .dot.b4, .dot.b5 { background: var(--ok); border-color: var(--ok); }

/* ---------- flashcards ---------- */
.flash { perspective: 1200px; }
.flash-inner { position: relative; min-height: 240px; transition: transform .45s; transform-style: preserve-3d; cursor: pointer; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 26px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: auto; }
.flash-face.back { transform: rotateY(180deg); background: var(--hi-soft); color: var(--hi-ink); border-color: transparent; }
.flash-face .big { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.flash-face .prompt { font-size: 1.2rem; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .flash-inner { transition: none; } }

/* ---------- tabs guide ---------- */
.tabrow { display: grid; grid-template-columns: 26px 92px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tabrow:last-child { border-bottom: 0; }
.tabrow input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ok); }
.tabrow .loc { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; }
.tabrow .what { font-size: .88rem; min-width: 0; }
.tabrow.done .what { color: var(--muted); }
.qlinks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.qlink { font-family: var(--font-mono); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: none; cursor: pointer; color: var(--muted); }
.qlink:hover { color: var(--blue); border-color: var(--blue); }

/* ---------- browse ---------- */
.qitem { border-bottom: 1px solid var(--line); padding: 12px 0; }
.qitem:last-child { border-bottom: 0; }
.qitem summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
.qitem summary::-webkit-details-marker { display: none; }
.qitem .qid { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); padding-top: 3px; }
.qitem .body { padding: 10px 0 4px 62px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 480px) { .qitem .body { padding-left: 0; } }
.optlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.optlist li.ans { font-weight: 700; color: var(--ok); }

/* ---------- math ---------- */
.formula { display: grid; grid-template-columns: minmax(150px, 1fr) 2fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.formula:last-child { border-bottom: 0; }
.formula .fx { font-family: var(--font-mono); font-size: .84rem; }
@media (max-width: 560px) { .formula { grid-template-columns: 1fr; gap: 2px; } }
.work { font-family: var(--font-mono); font-size: .86rem; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; overflow-x: auto; }

/* ---------- misc ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(8, 14, 24, .55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border-radius: 14px; max-width: 460px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: 90vh; overflow: auto; }
.sheet-list { display: flex; flex-direction: column; gap: 4px; }
.sheet-list button { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
.sheet-list button:hover { background: var(--surface-2); }
.sheet-list svg { width: 20px; height: 20px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (min-width: 960px) { .toast { bottom: 24px; } }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--blue); stroke-width: 2.5; }
.chart .area { fill: var(--blue-soft); }
.chart .pass { stroke: var(--ok); stroke-dasharray: 4 4; stroke-width: 1.5; }
.chart .pt { fill: var(--surface); stroke: var(--blue); stroke-width: 2.5; }
.chart .barr { fill: var(--blue); }
.chart .barr.goal { fill: var(--ok); }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose li { margin-bottom: 6px; }
.prose h3 { margin-top: 8px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps > div { display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
.steps > div::before { counter-increment: s; content: counter(s); width: 32px; height: 32px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.steps > div.now::before { background: var(--hi); color: #241b00; }
.steps > div.done::before { background: var(--ok); color: #fff; content: "✓"; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
.verdict svg { width: 26px; height: 26px; flex: none; }
.btn svg, .chip svg { flex: none; }
.btn.primary .kbd, .btn.danger .kbd { color: inherit; border-color: currentColor; opacity: .8; }

</style>

<script>
/* Generated by tools/build_data.py from the three 1 Exam Prep practice tests. Do not edit by hand. */
window.QUESTIONS = [{"id":"1-1","exam":1,"num":1,"stem":"\"Hard Records\", such as payroll, employment contracts, sales & purchase records must be retained for __________ years.","options":["2","3","4","5"],"answer":1,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-30"},{"book":"FCM","eds":["2017"],"loc":"5-30"}],"exp":"\"Hard records\" (payroll, employment contracts, sales and purchase records) are kept **3 years**. \"Soft records\" such as timecards and time sheets only need **2 years**.","tip":"Hard = 3, Soft = 2. Hard records are harder to replace, so they're kept longer.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-30  ·  Recordkeeping - Payroll","2017: 5-30  ·  Payroll - Records"],"lock":1},{"id":"1-2","exam":1,"num":2,"stem":"\"Soft Records\", such as timecards and time sheets must be retained for __________ years.","options":["2","3","4","5"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-30"},{"book":"FCM","eds":["2017"],"loc":"5-30"}],"exp":"Soft records (timecards, time sheets) are kept **2 years**. Hard records (payroll, contracts, sales and purchase records) are kept 3.","tip":"Hard = 3, Soft = 2.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-30  ·  Recordkeeping - Payroll","2017: 5-30  ·  Payroll - Records"],"lock":1},{"id":"1-3","exam":1,"num":3,"stem":"FS §489 requires complete financial and business records to be retained for __________ years.","options":["2","3","4","5"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-102","stat":"489.124(1)"},{"book":"FCM","eds":["2021"],"loc":"2-78","stat":"489.124(1)"},{"book":"FCM","eds":["2017"],"loc":"2-20"},{"book":"FCM","eds":["2017"],"loc":"2-90","stat":"489.124(1)"}],"exp":"§489.124(1) requires licensed contractors to keep complete financial and business records for the immediately preceding **3 years**. Expect this one in several forms.","tip":"Chapter 489 records = 3 years. IRS employment tax = 4. OSHA logs = 5.","ref":["Florida Contractors Manual  ·  2025: 2-102  ·  Licensing - Record Keeping","§489.124(1)","2021: 2-78  ·  Licensing - Record Keeping","§489.124(1)","2017: 2-20, 2-90  ·  Recordkeeping - Licensing, Const","§489.124(1)"],"lock":1},{"id":"1-4","exam":1,"num":4,"stem":"OSHA logs 300/300A must be retained for __________ calendar years.","options":["2","3","4","5"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-16"},{"book":"FCM","eds":["2017"],"loc":"7-16"}],"exp":"OSHA 300 logs, the 300A summary and the 301 forms are kept **5 years** after the end of the calendar year they cover, at each establishment.","tip":"OSHA = 5 years. Picture the 5 in \"300\".","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-16  ·  OSHA - Recordkeeping","2017: 7-16  ·  OSHA - Retention of Records"],"lock":1},{"id":"1-5","exam":1,"num":5,"stem":"Per the IRS, records of employment taxes must be retained for __________ years.","options":["2","3","4","5"],"answer":2,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"3-142"},{"book":"FCM","eds":["2021"],"loc":"3-160"},{"book":"FCM","eds":["2017"],"loc":"3-154"}],"exp":"The IRS requires employment tax records to be kept at least **4 years** after the tax is due or paid, whichever is later.","tip":"Records ladder: soft 2 → hard 3 → Ch. 489 3 → IRS 4 → OSHA 5.","ref":["Florida Contractors Manual  ·  2025: 3-142  ·  Recordkeeping - IRS, Taxes","2021: 3-160  ·  Recordkeeping - IRS, Taxes","2017: 3-154  ·  Record Retention - IRS"],"lock":1},{"id":"1-6","exam":1,"num":6,"stem":"The Department, for the boards under its jurisdiction, shall have the authority to close and terminate deficient license application files __________ year (s) after the board or the department notifies the applicant of the deficiency.","options":["1","2","3","4"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.203(10)(a)"}],"exp":"Under §455.203(10), DBPR may close and terminate a deficient license application file **2 years** after it notifies the applicant of the deficiency.","ref":["Florida Statute 455  ·  §455.203(10)(a)  ·  TOC: Department; Power & Duties"],"lock":1},{"id":"1-7","exam":1,"num":7,"stem":"I-9 Forms must be retained __________.","options":["3 years from date of hire","1 year from date employment ends","3 years from date employment ends","Either A or B, whichever is the latest date"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-58"},{"book":"FCM","eds":["2017"],"loc":"5-58"}],"exp":"Keep an I-9 for **3 years after the date of hire or 1 year after employment ends, whichever is later**. Both clocks apply, so the answer is \"either A or B, whichever is the latest date.\"","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-58  ·  Recordkeeping- Immigration Reform","2017: 5-58  ·  Forms - IRS - I-9"],"lock":1},{"id":"1-8","exam":1,"num":8,"stem":"Tests, inspections, and approvals of work shall be paid for by the __________; if tests are failed, additional costs shall be borne by __________.","options":["Owner, Owner","Owner, Contractor","Owner, Architect","Contractor, Contractor"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"13.4.1"},{"book":"A201","eds":null,"loc":"13.4.3"}],"exp":"A201 §13.4.1: the **Owner** pays for the tests, inspections and approvals the contract documents require. §13.4.3: if a test shows the work fails, the **Contractor** pays the extra costs.","tip":"The owner pays to look. The contractor pays when it fails.","ref":["AIA Document A201, 2017  ·  13.4.1, 13.4.3  ·  Optional TAB: Tests and Inspections"]},{"id":"1-9","exam":1,"num":9,"stem":"The maximum hours of work allowed per week for a 16-year-old while school is in session is __________ hours.","options":["12","18","20","30"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-32"}],"exp":"Florida child labor law: 16- and 17-year-olds may work up to **30 hours a week** while school is in session (and no more than 8 hours on a day before a school day).","tip":"16 and 17 both get 30 hours per school week.","ref":["Florida Contractors Manual  ·  5-32  ·  Child Labor (See) - Laws - Child labor"],"lock":1},{"id":"1-10","exam":1,"num":10,"stem":"A job has a cost to date of $34,000. The cost to complete is estimated to be $91,000. If the contractor wanted to make a 12% profit, the contract price would be __________.","options":["$125,000","$127,400","$140,000","$157,340"],"answer":2,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"87"}],"exp":"Total cost = cost to date + cost to complete = $34,000 + $91,000 = $125,000. Add the 12% profit: $125,000 × 1.12 = **$140,000**.","tip":"Total cost first, then multiply by (1 + profit %).","calc":1,"ref":["Builder's Guide to Accounting  ·  87","$34,000 + $91,000 = $125,000 (cost to date + cost to complete = total cost)","$125,000 x 1.12 (12%) = $140,000 total contract"],"lock":1},{"id":"1-11","exam":1,"num":11,"stem":"The __________ regulates the FLSA.","options":["Department of Labor","Department of Business and Professional Regulation","Construction Industry Licensing Board","Florida Department of State"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"The Fair Labor Standards Act (minimum wage, overtime, child labor) is enforced by the U.S. **Department of Labor** through its Wage and Hour Division. DBPR and the CILB regulate licensing, not wages.","ref":["Florida Contractors Manual  ·  5-15  ·  Acts - FLSA"]},{"id":"1-12","exam":1,"num":12,"stem":"An advantage of a bad debt reserve is that _________________________________.","options":["It reduces tax liability for earned profit","It increases assets","It increases profits","It simplifies accounting procedures"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"64"}],"exp":"Per the Builder's Guide, a bad debt reserve lets you write off expected uncollectible accounts against earnings, which **reduces tax liability on earned profit**. It does not increase assets or profit, and it adds an accounting step.","ref":["Builder's Guide to Accounting  ·  64  ·  Bad Debt Accounting - estimating"]},{"id":"1-13","exam":1,"num":13,"stem":"Employees __________ would probably not be subject to the overtime regulations.","options":["With fluctuating workweeks","Who are employed in the capacity of outside salesman","Who are piece workers","Who are salaried"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-17"}],"exp":"**Outside salespeople** are exempt from FLSA overtime. Being salaried alone does not make someone exempt; they must also pass the duties tests. Piece workers and employees on a fluctuating workweek still earn overtime.","tip":"Salaried ≠ exempt. Outside sales = exempt.","ref":["Florida Contractors Manual  ·  5-17  ·  Overtime Pay"]},{"id":"1-14","exam":1,"num":14,"stem":"The Buy American Act does not include __________.","options":["Mexico","Canada","Brazil","Europe"],"answer":2,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-88"}],"exp":"The manual lists Mexico, Canada and European countries as covered by trade agreements under the Buy American Act. **Brazil** is the one that is not included.","ref":["Florida Contractors Manual  ·  10-88  ·  TAB: Buy American Act"]},{"id":"1-15","exam":1,"num":15,"stem":"Per FLSA, an executive employee __________.","options":["Whose primary duty is management of the enterprise in which the employee is employed or of a customarily recognized department or subdivision","Customarily directs the work of 2 or more employees","Has the authority to hire or fire other employees","All of the above"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-19"},{"book":"FCM","eds":["2017"],"loc":"5-19"}],"exp":"The FLSA executive exemption requires **all** of these: the primary duty is managing the enterprise or a recognized department, the employee customarily directs 2 or more employees, and they can hire or fire (or their recommendations carry weight). There is also a salary test.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-19  ·  TOC: FLSA - Test for Executive","Exemption","2017: 5-19  ·  Employee - Executive"],"lock":1},{"id":"1-16","exam":1,"num":16,"stem":"An individual who smokes in a non-smoking area is subject to a fine of __________ for a repeat offense.","options":["$100","$250","$500","$1,000"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-49"}],"exp":"Under the Florida Clean Indoor Air Act, smoking in a no-smoking area carries a fine of up to $100 for a first violation and up to **$500 for each repeat violation**.","ref":["Florida Contractors Manual  ·  5-49  ·  TAB: Clean Indoor Air Act"],"lock":1},{"id":"1-17","exam":1,"num":17,"stem":"A __________ would be most likely to receive a Limited License.","options":["Retired professional","Professional from another state","Trainee immediately following a natural disaster","Person who has failed the state test 5 times"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"§455.214 limited licenses go to **retired professionals** (licensed at least 10 years) who will serve indigent, underserved or critical-need populations. They are not for trainees, out-of-state professionals, or people who keep failing the exam.","ref":["Florida Statute 455  ·  §455.214(2)  ·  TOC: Limited Licenses"]},{"id":"1-18","exam":1,"num":18,"stem":"__________ is responsible to post OSHA posters on a multi-contractor project.","options":["The Owner","The General Contractor","Each Contractor","The Project Superintendent"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"On a multi-contractor project, **each contractor** (each employer) must post the required OSHA posters for its own employees. One GC can't post for everyone.","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"]},{"id":"1-19","exam":1,"num":19,"stem":"When __________, duly authorized agents and employees of DBPR may inspect premises of any establishment at all reasonable hours.","options":["There is a suspected OSHA violation","There are minors working on the premises","The services offered at the premises include authorization to prescribe controlled substances","Alcohol is served"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.243"}],"exp":"§455.243 lets DBPR agents inspect, at reasonable hours, any establishment whose **services include authority to prescribe controlled substances**. It's an odd fit for a contractor exam, but that's what the statute says.","ref":["Florida Statute 455  ·  §455.243  ·  TOC: Authority to Inspect"]},{"id":"1-20","exam":1,"num":20,"stem":"Unless an applicant notifies the department at least __________ days prior to an examination hearing of the applicant's inability to attend, the department may require an applicant to pay reasonable attorney's fees, costs, and court costs of the department for the examination hearing.","options":["3","4","5","7"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.229(3)"}],"exp":"§455.229(3): if an applicant doesn't notify DBPR at least **5 days** before an examination hearing that they can't attend, the department may charge them attorney's fees and costs.","ref":["Florida Statute 455  ·  §455.229(3)  ·  TOC: ... examination hearing"],"lock":1},{"id":"1-21","exam":1,"num":21,"stem":"If the circumstance of the violation meets the standard of a minor violation and __________ year (s) have passed since the issuance of a final order imposing discipline; the department shall reclassify that violation as inactive.","options":["1","2","3","5"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2255(1)"}],"exp":"§455.2255: a minor violation is reclassified as inactive once **2 years** have passed since the final order imposing discipline.","ref":["Florida Statute 455  ·  §455.2255(1)  ·  TOC: Classification of Disciplinary","Actions"],"lock":1},{"id":"1-22","exam":1,"num":22,"stem":"The real turnover ratio is __________.","options":["Cost of sales over inventory at cost","Cost of sales minus retail sales","Retail sales over breakeven point","Overhead plus all costs"],"answer":0,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"271"}],"exp":"Real turnover ratio = **cost of sales ÷ inventory at cost**. It shows how many times inventory turns over. Because it uses an income statement figure (cost of sales) and a balance sheet figure (inventory), it is a \"combined\" ratio.","ref":["Builder's Guide to Accounting  ·  271  ·  Real Turnover Ratio"]},{"id":"1-23","exam":1,"num":23,"stem":"In order to obtain a limited license, a person should have been licensed for at least __________ years in any jurisdiction in the United States.","options":["3","5","7","10"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"A limited license (§455.214) requires a person to have been licensed for at least **10 years** in any U.S. jurisdiction.","tip":"Limited license = retired + 10 years + serving the indigent.","ref":["Florida Statute 455  ·  §455.214(2)  ·  TOC: Limited Licenses"],"lock":1},{"id":"1-24","exam":1,"num":24,"stem":"A request for additional investigative information shall be made within __________ days from the date of receipt by the probable cause panel of the investigative report of the department.","options":["5","10","15","30"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.225(4)"}],"exp":"§455.225(4): the probable cause panel must request more investigative information within **15 days** of receiving the department's investigative report.","ref":["Florida Statute 455  ·  §455.225(4)  ·  TOC: Disciplinary Proceedings"],"lock":1},{"id":"1-25","exam":1,"num":25,"stem":"The theft or reproduction of an examination constitutes a __________.","options":["Misdemeanor","Felony of the first degree","Felony of the second degree","Felony of the third degree"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2175"}],"exp":"§455.2175: stealing or reproducing an examination is a **felony of the third degree**.","ref":["Florida Statute 455  ·  §455.2175  ·  TOC: Penalty for theft or reproduction"]},{"id":"1-26","exam":1,"num":26,"stem":"__________ is a foreseen condition that would not have an effect on production efficiency.","options":["Weather","Workload","Deadlines","Site Area"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-31"},{"book":"FCM","eds":null,"loc":"10-32"}],"exp":"In the manual's production-efficiency table (Fig. 12), weather, workload and site area all change productivity. **Deadlines** are the foreseen condition that does not.","ref":["Florida Contractors Manual  ·  10-31, 10-32  ·  Production Efficiency","Figure 12"]},{"id":"1-27","exam":1,"num":27,"stem":"Florida Diggers bought a tractor for $210,000. Its useful life is 12 years, and it has a salvage value of $30,000. If the tractor is sold at the end of year 6, the total depreciation would be __________.","options":["$90,000","$45,000","$60,000","$112,000"],"answer":0,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163-164"}],"exp":"Straight line: ($210,000 − $30,000 salvage) ÷ 12 years = $15,000 a year. After 6 years: $15,000 × 6 = **$90,000** total depreciation.","tip":"Always subtract salvage first.","calc":1,"ref":["Builder's Guide to Accounting  ·  163-164  ·  Depreciation - Methods","Purchase value minus salvage value: $210,000 - $30,000 = $180,000","Note: when calculating depreciation with salvage value, always subtract salvage value from purchase price before starting calculations.","This value is used to determine annual depreciation (12) years: $180,000 ÷ 12 = $15,000 per year","Total depreciation after 6 years: $15,000 x 6 = $90,000"],"lock":1},{"id":"1-28","exam":1,"num":28,"stem":"The Bidder shall deliver the required bonds to the Owner not later than __________ following the date of execution of the Contract.","options":["24 hours","3 days","3 working days","7 days"],"answer":1,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.2.1"}],"exp":"A701 §7.2.1: the bidder delivers the required bonds to the **Owner** no later than **3 days** after the contract is executed.","tip":"Bonds go to the Owner in 3 days.","ref":["AIA Document A701, 2018  ·  7.2.1  ·  TOC: Performance bond and payment bond"]},{"id":"1-29","exam":1,"num":29,"stem":"\"2% - 10 days, net 30\" is __________.","options":["An extra charge for shipping","A incentive discount of 2% if the customer pays the invoice within 10 days of the billing date","An incentive discount of 2% if the customer pays the invoice within 30 days of the billing date","An incentive discount or a penalty of 2%, depending on the date the invoice is paid"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"\"2% 10, net 30\" means the customer can take a **2% discount by paying within 10 days**. Otherwise the full amount is due in 30 days. It's an incentive, not a penalty.","ref":["Builder's Guide to Accounting  ·  59  ·  Optional TAB: Discounts"]},{"id":"1-30","exam":1,"num":30,"stem":"Florida's Right to Work Laws __________.","options":["Prevent discrimination based on race, creed, or color","Allow non-resident aliens with proper documentation the right to work","Prevent employees from being forced to join a union","All of the above"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"}],"exp":"Florida's Right to Work law (Art. I §6 of the Florida Constitution) **keeps employees from being forced to join, or pay, a union** as a condition of employment.","ref":["Florida Contractors Manual  ·  5-14  ·  Laws - Florida Right to Work"],"lock":1},{"id":"1-31","exam":1,"num":31,"stem":"Under the Florida Worker's Compensation Act, a contractor may recover __________ from a subcontractor who has elected exemption from Chapter 440 if the subcontractor's exemption is invalid and has caused liability to the contractor or an employee.","options":["Benefits paid and interest due","A minimum of $1,500 and interest","Penalties up to 100% of their contract","A maximum of $2,500 per occurrence"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"6-5"},{"book":"FCM","eds":["2017"],"loc":"6-5"}],"exp":"If a subcontractor's workers' comp exemption is invalid and that creates liability for the contractor, the contractor may recover the **benefits paid plus interest** from the subcontractor.","ref":["Florida Contractors Manual  ·  2025 & 2021: 6-5  ·  Workers Compensation -","Exemptions","2017: 6-5  ·  Acts - Workers Compensation"]},{"id":"1-32","exam":1,"num":32,"stem":"Construction project schedules should have progress posted at least __________.","options":["Daily","Weekly","Biweekly","Monthly"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-63"}],"exp":"Post schedule progress at least **weekly**. Short-term schedules look 2 weeks ahead.","ref":["Florida Contractors Manual  ·  10-63  ·  Scheduling - Guidelines"]},{"id":"1-33","exam":1,"num":33,"stem":"A fine of up to ___________ can be imposed on a contractor for finishing a job without pulling a permit if it is their first offense","options":["$1,000","$3,000","$5,000","$10,000"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-206"},{"book":"FCM","eds":["2021"],"loc":"2-31"},{"book":"FCM","eds":["2021"],"loc":"2-158"},{"book":"FCM","eds":["2017"],"loc":"2-24"},{"book":"FCM","eds":["2017"],"loc":"2-184"}],"exp":"Under the CILB disciplinary guidelines (61G4-17), a first offense of completing a job without pulling a required permit can carry a fine of up to **$5,000**.","ref":["Florida Contractors Manual  ·  2025: 2-206 (o)  ·  Penalties - Licensing, Construction","2021: 2-31, 2-158 (o) Penalties - Licensing, Construction","2017: 2-24, 2-184 (o) Penalties - Licensing"],"lock":1},{"id":"1-34","exam":1,"num":34,"stem":"An OSHA 300 safety log must be maintained by employers with at least __________ employees.","options":["5","7","10","11"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"Employers with **more than 10 employees (11 or more)** must keep OSHA 300 logs. Employers with 10 or fewer are partially exempt.","tip":"10 or fewer = exempt. 11 or more = keep the log.","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"],"lock":1},{"id":"1-35","exam":1,"num":35,"stem":"Bidders and Sub-bidders requiring clarification of the Bidding Documents shall make a written request which shall reach the Architect at least __________ day(s) prior to the date for receipt of bids.","options":["10","3","5","7"],"answer":3,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"3.2.2"}],"exp":"A701 §3.2.2: written requests for clarification must reach the Architect at least **7 days** before bids are due.","tip":"Questions in 7 days before bids. Owner-financing request 14 days. Clerical error notice 2 days.","ref":["AIA Document A701, 2018  ·  3.2.2  ·  TOC: Bidding Document"],"lock":1},{"id":"1-36","exam":1,"num":36,"stem":"__________ is a correct accounting formula.","options":["Assets - Liabilities = Equity","Assets + Liabilities = Owner's Equity","Assets = Owner's Equity - Depreciation","Owner's Equity = Liabilities - Depreciation"],"answer":0,"topic":"acct","books":["FCM","BGA"],"cites":[{"book":"FCM","eds":null,"loc":"3-12"},{"book":"BGA","eds":null,"loc":"247"}],"exp":"The accounting equation is Assets = Liabilities + Owner's Equity. Rearranged: **Assets − Liabilities = Equity** (net worth).","ref":["Florida Contractors Manual  ·  3-12  ·  CM: Accounting - Equation","247  ·  BGA: Financial Statements","Assets = Liabilities + Equity - therefore, Assets - Liabilities = Equity"]},{"id":"1-37","exam":1,"num":37,"stem":"The __________ method is an estimating method that is NOT recommended for lump sum contracts.","options":["Approximate estimated","Detailed survey","Square footage","Unit price"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-12"}],"exp":"The **square footage method** is a quick conceptual estimate. It's too rough for a lump-sum contract, which needs a detailed quantity takeoff.","ref":["Florida Contractors Manual  ·  10-12  ·  Types of: Estimates"]},{"id":"1-38","exam":1,"num":38,"stem":"The three Cs of underwriting that the surety industry considers before a contractor can acquire a bond are __________.","options":["Character, cash, and contracts","Completion percentage, completed contracts and cash","Cash, completion, and contracts","Capital, character, and capacity"],"answer":3,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-15"}],"exp":"The surety's three Cs of underwriting are **Capital, Character and Capacity**: financial strength, reputation and integrity, and the ability to perform the work.","ref":["Florida Contractors Manual  ·  4-15  ·  Bonds - Three C's of underwriting"]},{"id":"1-39","exam":1,"num":39,"stem":"The Florida sales tax is reported on form __________.","options":["DR-15-CS and paid on a monthly basis","DR-15-CS and paid on a quarterly basis","941 and paid on a monthly basis","941 and paid on a quarterly basis"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-27"},{"book":"FCM","eds":["2017"],"loc":"1-23"}],"exp":"Florida sales and use tax is reported on **Form DR-15** (DR-15CS in older materials) and is generally paid **monthly**. Form 941 is the federal quarterly payroll return.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-27  ·  Forms - DR-15","2017: 1-23  ·  Taxes - State Sales"]},{"id":"1-40","exam":1,"num":40,"stem":"Expanding a business usually requires a great deal of capital to purchase new equipment, buildings, or to obtain long term financing. To qualify for expansion financing, financial institutes typically require that you have been in business at least __________ years, while __________ years is preferred.","options":["2; 4","2; 5","3; 5","3; 6"],"answer":1,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"3-72"},{"book":"FCM","eds":["2017"],"loc":"3-72"}],"exp":"For expansion financing, lenders typically want at least **2 years** in business and prefer **5**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 3-72  ·  Capital - Sources of","2017: 3-72  ·  Types of Capital"],"lock":1},{"id":"1-41","exam":1,"num":41,"stem":"If an employer conducts business in more than one location in Florida, completion of the Multiple Worksite Report BLS-3020 will be required on a __________ basis.","options":["Weekly","Monthly","Quarterly","Annual"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-267"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"Employers operating at more than one Florida location file the Multiple Worksite Report (BLS-3020) **quarterly**, separately from the RT-6.","ref":["Florida Contractors Manual  ·  2025: 5-267  ·  Optional TAB: Multiple Worksite","2021: 5-290  ·  Forms - Multiple worksite","2017: 5-292"]},{"id":"1-42","exam":1,"num":42,"stem":"A __________ is a special combination of two or more persons or entities jointly seeking a profit in some specific venture or for a specific job or undertaking without an actual partnership or corporate designation.","options":["Special limited partnership","S-type business","Joint venture","Sole proprietorship"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-10"},{"book":"FCM","eds":["2017"],"loc":"1-12"}],"exp":"A **joint venture** is two or more people or entities teaming up for profit on one specific project, without forming a partnership or corporation.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-10  ·  Types of: Business","2017: 1-12"]},{"id":"1-43","exam":1,"num":43,"stem":"Fictitious names are valid for __________ years.","options":["2","3","4","5"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"A Florida fictitious name registration is valid **5 years** and expires December 31 of the fifth year.","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14  ·  Fictitious Name","2017: 1-15"],"lock":1},{"id":"1-44","exam":1,"num":44,"stem":"Which of the following agreements are prohibited by Florida's Right to Work Laws?","options":["Union Shop","Agency Shop","Maintenance of Membership","All the above are prohibited"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"},{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"Florida's Right to Work law prohibits union shop, agency shop and maintenance-of-membership agreements. **All of them** are prohibited.","ref":["Florida Contractors Manual  ·  5-14, 5-15  ·  Laws - Florida Right to Work"],"lock":1},{"id":"1-45","exam":1,"num":45,"stem":"When making a claim of lien, you must send a sworn statement of account within ___________.","options":["90 days after demand of statement has been made","30 days after demand of statement has been made","45 days before demand of statement has been made","15 days before demand of statement has been made"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-36"},{"book":"FCM","eds":["2017"],"loc":"9-35"}],"exp":"§713.16: a lienor must send a sworn statement of account within **30 days after the demand** is made. Failing to do so can cost the lienor its lien rights.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-36  ·  TOC: Requests for Sworn Statement","2017: 9-35  ·  Liens- Sworn Statements"]},{"id":"1-46","exam":1,"num":46,"stem":"If the contractor defaults or neglects to carry out the Work and fails to do so within __________ of receipt of written notice from the Owner, the Owner may correct such deficiencies.","options":["10 days","7 business days","7 calendar days","3 days"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.5"}],"exp":"A201 §2.5: if the Contractor defaults and doesn't begin correcting it within **10 days** of the Owner's written notice, the Owner may correct the work itself.","tip":"Owner vs. contractor = 10 days (A201). Contractor vs. sub = 5 days (A401).","ref":["AIA Document A201, 2017  ·  2.5  ·  Owners right to carry out the work"]},{"id":"1-47","exam":1,"num":47,"stem":"The best way to accurately control petty cash is through a(n) __________.","options":["Imprest system","Separate bank account","A dedicated entry group within an accounting system","Lock box"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"208"}],"exp":"An **imprest system** keeps petty cash at a fixed amount. It is replenished for exactly the amount of the receipts turned in, so cash plus receipts always equals the fund total.","ref":["Builder's Guide to Accounting  ·  208  ·  Petty cash - imprest system"]},{"id":"1-48","exam":1,"num":48,"stem":"OSHA 300/300A, the Log on Summary of Occupational Injuries and Illnesses, is used to record __________.","options":["Accident investigations","All health claims","Incidents resulting in loss of consciousness","Non-work restricting injuries"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"The OSHA 300 log records work-related injuries and illnesses that are serious enough to report. **Loss of consciousness** is one of the recording criteria. First-aid-only cases are not recorded.","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"]},{"id":"1-49","exam":1,"num":49,"stem":"ABC Construction buys a tractor for $157,000. They can depreciate the tractor over seven years. Using the straight-line method, the depreciation in the seventh year is __________.","options":["$10,575","$22,500","$16,275","$33,000"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"Straight-line depreciation is the same every year: $157,000 ÷ 7 ≈ $22,429. The closest choice is **$22,500**. (The official key shows $157,500 ÷ 7, a typo, but the answer is the same.)","tip":"Under straight line, year 7 equals year 1.","calc":1,"ref":["Builder's Guide to Accounting  ·  163  ·  Depreciation - straight line","$157,500 ÷ 7 = $22,429"],"lock":1},{"id":"1-50","exam":1,"num":50,"stem":"When a contractor must perform extra work for a subcontractor or material vendor, the contractor may proceed to recover the cost in the form of a(n) __________.","options":["Addendum","Back charge","Change order","Lien"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-67"}],"exp":"A **back charge** recovers the cost of work the contractor had to do on behalf of a subcontractor or vendor. A change order changes the owner's contract. An addendum changes the bid documents.","ref":["Florida Contractors Manual  ·  10-67  ·  Optional TAB: Backcharge"]},{"id":"1-51","exam":1,"num":51,"stem":"According to the Contractor's Manual, under the completed contract method, a contract is recognized as complete when it is in excess of __________ complete.","options":["75% to 80%","90%","98% or 99%","none of the above"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-80"}],"exp":"Under the completed contract method (per the manual), a contract counts as complete when it is **98% to 99%** done.","ref":["Florida Contractors Manual  ·  3-80  ·  Completed contract"],"lock":1},{"id":"1-52","exam":1,"num":52,"stem":"A Change Order is a written instrument prepared by the Architect and signed by the __________.","options":["Owner","Architect","Owner and the Architect","Owner, Contractor, and Architect"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: the Architect prepares a Change Order, and it is signed by the **Owner, Contractor and Architect**. A Construction Change Directive needs only the Owner and Architect.","tip":"CO = 3 signatures. CCD = 2 (no contractor).","ref":["AIA Document A201, 2017  ·  7.2.1  ·  Change orders - Definition of"]},{"id":"1-53","exam":1,"num":53,"stem":"What percentage of the job is complete?","options":["66.67%","60%","75.5%","less than 50%"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Percent complete = cost to date ÷ total estimated cost = $210,000 ÷ ($210,000 + $105,000) = $210,000 ÷ $315,000 = **66.67%**.","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","$210,000 + $105,000 = $315,000","$210,000 ÷ $315,000 = .667 (66.67%)"]},{"id":"1-54","exam":1,"num":54,"stem":"Which of the following is the nearest to the amount of money that has been earned on this job?","options":["$129,870","$255,719","$260,013","$215,303"],"answer":2,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Earned revenue = % complete × contract price = 0.6667 × $390,000 ≈ **$260,013**.","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","Apply percentage complete to contract price - $.6667 x $390,000 = $260,013"],"lock":1},{"id":"1-55","exam":1,"num":55,"stem":"Which of the following is true?","options":["You have unearned income","You have earned more than you've been paid","You have earned exactly what you were paid","You have earned less than you have been paid"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Earned $260,013 but paid (billed) $220,000, so you've **earned more than you've been paid**. That's an underbilling, recorded as an asset (\"costs and earnings in excess of billings\").","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","Paid $220,000 Earned $260,013"]},{"id":"1-56","exam":1,"num":56,"stem":"The federal minimum wage is __________ per hour.","options":["$5.15","$7.25","$10.75","$12.35"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"The **federal** minimum wage is **$7.25** an hour and has been since 2009. Florida's state minimum wage is higher and goes up every September 30, but if a question says \"federal,\" answer $7.25.","ref":["Florida Contractors Manual  ·  5-15  ·  Minimum wage"],"lock":1},{"id":"1-57","exam":1,"num":57,"stem":"The job responsibilities of a Superintendent include __________.","options":["Actively participate in creation of a project schedule","Maintain change order log","Prepare back charges","Both A & C"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-72"}],"exp":"The manual says a superintendent **actively helps create the project schedule and prepares back charges**. Keeping the change order log is a project manager or office task.","ref":["Florida Contractors Manual  ·  10-72  ·  Job responsibilities"],"lock":1},{"id":"1-58","exam":1,"num":58,"stem":"Within 3 business days of the date the Contractor becomes aware of an impending or actual cancellation or expiration of any insurance, the Contractor shall provide notice to the __________.","options":["Subcontractor","Owner","Architect","Florida Department of Insurance Compliance"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"11.1.4"}],"exp":"A201 §11.1.4: within 3 business days of learning of an impending or actual cancellation or expiration of required insurance, the Contractor notifies the **Owner**.","ref":["AIA Document A201, 2017  ·  11.1.4  ·  Insurance - Notice of Cancellation or Expiration"]},{"id":"1-59","exam":1,"num":59,"stem":"Contractors must send a notice of all demolition projects to Florida Department of Environmental Protection __________ working days before demolition, even if there is no asbestos containing material present.","options":["10","15","5","30"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"10-97"},{"book":"FCM","eds":["2017"],"loc":"10-97"}],"exp":"FDEP must be notified at least **10 working days** before any demolition, even when no asbestos is present.","ref":["Florida Contractors Manual  ·  2025 & 2021:10-97  ·  Asbestos","2017:10-97  ·  Environmental compliance"],"lock":1},{"id":"1-60","exam":1,"num":60,"stem":"The check register shows at a glance __________.","options":["What expense categories you have and where your money goes","Your income and expense items by category","Your available balance on a cash basis","The income, expenses, and equity of your company"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"101"}],"exp":"Per the Builder's Guide, the check register shows **what expense categories you have and where your money goes**.","ref":["Builder's Guide to Accounting  ·  101  ·  Check register"]},{"id":"1-61","exam":1,"num":61,"stem":"When estimating speeds of equipment for production purposes, they will usually average __________ percent of the speed limit.","options":["70 - 80","70 - 75","40 - 65","75 - 90"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"For production estimates, equipment usually averages **40% to 65%** of the posted speed limit.","ref":["Florida Contractors Manual  ·  10-27  ·  Equipment - Productivity"],"lock":1},{"id":"1-62","exam":1,"num":62,"stem":"After the date and time designated for receipt of bids, a Bidder who discovers that it made a clerical error in its Bid shall notify the Architect of such error within __________ day (s).","options":["One","Two","Three","Four"],"answer":1,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"4.4.3"}],"exp":"A701 §4.4.3: a bidder who finds a clerical error in its bid after bids open must notify the Architect within **2 days**.","ref":["AIA Document A701, 2018  ·  4.4.3  ·  TOC: Bidding Procedures"]},{"id":"1-63","exam":1,"num":63,"stem":"A Plumbing Contractor would be required to carry Liability and Property insurance in the respective amounts of __________ and __________.","options":["300,000; 50,000","300,000; 100,000","100,000; 50,000","100,000; 25,000"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-16"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"61G4-15.003: specialty trades such as plumbing carry **$100,000 public liability and $25,000 property damage**. General, building and residential contractors carry $300,000 and $50,000.","tip":"GC/building/residential = 300/50. Other trades = 100/25.","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-16  ·  Licensing - Public liability","2017: 2-19  ·  Public liability insurance"],"lock":1},{"id":"1-64","exam":1,"num":64,"stem":"An(a) __________ is a valid oral contract.","options":["Two-year apartment rental agreement","Agreement to buy a lawnmower for $475.00","Agreement to buy 3 pallets of bricks for $515.00","Five-year building lease agreement"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-6"},{"book":"FCM","eds":null,"loc":"8-7"}],"exp":"Under the Statute of Frauds (UCC), a sale of goods for **$500 or more** must be in writing. The $475 lawnmower is under the limit, so an oral contract is valid. The $515 bricks and leases over 1 year need a written contract.","ref":["Florida Contractors Manual  ·  8-6, 8-7  ·  Contracts - Written or oral"]},{"id":"1-65","exam":1,"num":65,"stem":"The Current Ratio gives a good idea of a __________.","options":["Company's amount of fixed asset investments","Company's ability to meet current obligations with current assets","Company's collection processes","Debt to profit comparison"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"269"}],"exp":"Current ratio = current assets ÷ current liabilities. It measures **the company's ability to pay current obligations with current assets** (liquidity).","ref":["Builder's Guide to Accounting  ·  269  ·  Current Ratio"]},{"id":"1-66","exam":1,"num":66,"stem":"___________ and ___________ are two types of manpower estimates.","options":["Comparative and historical","Graphic and detailed","Preliminary and detailed","Preliminary and historical"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"10-28"},{"book":"FCM","eds":["2017"],"loc":"10-28"}],"exp":"The two types of manpower (labor) estimates are **preliminary** and **detailed**.","ref":["Florida Contractors Manual  ·  2025 & 2021: 10-28 Estimates - Labor Estimates","2017: 10-28  ·  Estimates - Manpower"]},{"id":"1-67","exam":1,"num":67,"stem":"According to Florida Unemployment Compensation Laws, an employer who fails to file RT-6 reports when due will be assessed a penalty of ___________ for each month (or fraction thereof) that the report is delinquent.","options":["$25","$50","$75","$100"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-269"},{"book":"FCM","eds":["2021"],"loc":"5-291"},{"book":"FCM","eds":["2017"],"loc":"5-294"}],"exp":"An employer who files the RT-6 reemployment tax report late is penalized **$25 for each month, or part of a month**, that it is late.","ref":["Florida Contractors Manual  ·  2025: 5-269  ·  Unemployment - Recordkeeping","2021: 5-291  ·  Forms - SUTA Quarterly Report (RT6)","2017: 5-294"],"lock":1},{"id":"1-68","exam":1,"num":68,"stem":"A purchase order form will help you control __________.","options":["Inventory sales","Your payment terms","Actual inventory in a LIFO system","Unauthorized purchases"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"116"}],"exp":"Purchase orders require approval before buying, so they help control **unauthorized purchases**.","ref":["Builder's Guide to Accounting  ·  116  ·  Purchase order"]},{"id":"1-69","exam":1,"num":69,"stem":"Interpretations, corrections, and changes of the Bidding Documents shall be made by __________.","options":["Addendum","The Architect","Change Order","The Owner"],"answer":0,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"3.2.3"}],"exp":"A701 §3.2.3: interpretations, corrections and changes to the bidding documents are made only by **Addendum**. A Change Order changes the contract after it is signed.","tip":"Before the contract = Addendum. After = Change Order.","ref":["AIA Document A701, 2018  ·  3.2.3  ·  TOC: Bidding documents"]},{"id":"1-70","exam":1,"num":70,"stem":"Each continuing education provider shall retain all records relating to a licensee's completion of continuing education courses for at least __________ years after completion of a course.","options":["2","3","4","5"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2178(2)"}],"exp":"§455.2178: continuing education providers keep records of each licensee's course completion for at least **4 years**.","ref":["Florida Statute 455  ·  §455.2178(2)  ·  TOC: Continuing education provider"],"lock":1},{"id":"1-71","exam":1,"num":71,"stem":"If the Contractor does not pay the Subcontractor through no fault of the Subcontractor, within seven days of the time payment should be made as provided on their Agreement, the Subcontractor may, upon __________ additional days written notice to the Contractor, stop the Work of the Subcontract.","options":["14","7","5","3"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"4.8"}],"exp":"A401 §4.8: if the Contractor doesn't pay the Sub within 7 days of the due date, through no fault of the Sub, the Sub may stop work after **7 more days' written notice**.","tip":"7 + 7.","ref":["AIA Document A401, 2017  ·  4.8  ·  Subcontractor"],"lock":1},{"id":"1-72","exam":1,"num":72,"stem":"The purpose of Supplementary Record of Occupational Injuries and Illnesses (OHSA No. 301) is to ___________.","options":["Provide additional information about the employer listed in the log","Report the safety measures taken to prevent future accidents","Summarize the information that has been recorded in the log","Provide additional information on each case that has been recorded in the log"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-11"},{"book":"FCM","eds":["2017"],"loc":"7-11"}],"exp":"The OSHA 301 (Injury and Illness Incident Report) **gives more detail on each case recorded on the 300 log**. The 300A is the annual summary.","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-11  ·  TOC: The Supplementary Record of","Occupational Injuries and Illnesses","(OSHA No. 301)","2017: 7-11  ·  OSHA - 301 Form"]},{"id":"1-73","exam":1,"num":73,"stem":"Periodic progress reports on the Work shall be provided by the __________ to the __________ as mutually agreed.","options":["Contractor, Owner","Contractor, Architect","Subcontractor, Owner","Subcontractor, Contractor"],"answer":3,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"4.2.4"}],"exp":"A401 §4.2.4: the **Subcontractor** gives periodic progress reports to the **Contractor**. The sub's contract is with the contractor, not the owner.","ref":["AIA Document A401, 2017  ·  4.2.4  ·  Subcontractor"]},{"id":"1-74","exam":1,"num":74,"stem":"For the purpose of required Workers Compensation coverage, __________ is NOT exempt from being considered a construction job.","options":["Landscaping for existing buildings","Fencing for existing building","Swimming pool repairs at an existing building","Well drilling on land not containing any other existing structures"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-6"}],"exp":"Per the manual's workers' comp definitions, landscaping, fencing and pool repair at existing buildings are excluded from \"construction.\" **Well drilling on land with no existing structures** still counts as a construction job.","ref":["Florida Contractors Manual  ·  6-6  ·  Workers Compensation - Exemption"]},{"id":"1-75","exam":1,"num":75,"stem":"__________ is (are) considered to be a variable expense.","options":["Postage","Rent","Depreciation","Collections"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"147"}],"exp":"A variable expense changes with sales volume. **Collections** costs vary. Rent and depreciation are fixed.","ref":["Builder's Guide to Accounting  ·  147  ·  Expenses - variables"]},{"id":"1-76","exam":1,"num":76,"stem":"The Bidder shall furnish Performance Bonds and Payment Bonds covering __________.","options":["The faithful performance of the contract and payments of all obligations arising thereunder","The full amount of the total cost of the job including change orders","The cost of the contract and attorney fees to enforce the contract if they do not perform","All jobs with costs over $250,000"],"answer":0,"topic":"ins","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.1.1"}],"exp":"A701 §7.1.1: the bidder furnishes Performance and Payment Bonds covering **faithful performance of the contract and payment of all obligations under it**.","ref":["AIA Document A701, 2018  ·  7.1.1  ·  TOC: Performance & Payment Bond"]},{"id":"1-77","exam":1,"num":77,"stem":"__________ insurance covers the structure being constructed and may be extended to cover materials while in transit or at temporary storage facilities.","options":["Umbrella","Inland marine","Fidelity","Builders risk"],"answer":3,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-7"}],"exp":"**Builder's risk** insurance covers the structure under construction and can be extended to materials in transit or in temporary storage.","ref":["Florida Contractors Manual  ·  4-7 (See Item #7)  ·
