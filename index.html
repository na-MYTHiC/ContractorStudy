Two-year apartment rental agreement","Agreement to buy a lawnmower for $475.00","Agreement to buy 3 pallets of bricks for $515.00","Five-year building lease agreement"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-6"},{"book":"FCM","eds":null,"loc":"8-7"}],"exp":"Under the Statute of Frauds (UCC), a sale of goods for **$500 or more** must be in writing. The $475 lawnmower is under the limit, so an oral contract is valid. The $515 bricks and leases over 1 year need a written contract.","laws":[["Fla. Stat. § 672.201","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0600-0699/0672/Sections/0672.201.html"]],"plain":"Buying goods for $500 or more needs a written contract. The $475 lawnmower is under that, so a handshake deal is fine.","look":"Contracts – Written or Oral","ref":["Florida Contractors Manual  ·  8-6, 8-7  ·  Contracts - Written or oral"]},{"id":"1-65","exam":1,"num":65,"stem":"The Current Ratio gives a good idea of a __________.","options":["Company's amount of fixed asset investments","Company's ability to meet current obligations with current assets","Company's collection processes","Debt to profit comparison"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"269"}],"exp":"Current ratio = current assets ÷ current liabilities. It measures **the company's ability to pay current obligations with current assets** (liquidity).","plain":"The current ratio shows whether what you have on hand can cover the bills coming due.","look":"Current Ratio","ref":["Builder's Guide to Accounting  ·  269  ·  Current Ratio"]},{"id":"1-66","exam":1,"num":66,"stem":"___________ and ___________ are two types of manpower estimates.","options":["Comparative and historical","Graphic and detailed","Preliminary and detailed","Preliminary and historical"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"10-28"},{"book":"FCM","eds":["2017"],"loc":"10-28"}],"exp":"The two types of manpower (labor) estimates are **preliminary** and **detailed**.","plain":"Manpower estimates come in two flavors: preliminary (rough) and detailed.","look":"Estimates – Labor / Manpower","ref":["Florida Contractors Manual  ·  2025 & 2021: 10-28 Estimates - Labor Estimates","2017: 10-28  ·  Estimates - Manpower"]},{"id":"1-67","exam":1,"num":67,"stem":"According to Florida Unemployment Compensation Laws, an employer who fails to file RT-6 reports when due will be assessed a penalty of ___________ for each month (or fraction thereof) that the report is delinquent.","options":["$25","$50","$75","$100"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-269"},{"book":"FCM","eds":["2021"],"loc":"5-291"},{"book":"FCM","eds":["2017"],"loc":"5-294"}],"exp":"An employer who files the RT-6 reemployment tax report late is penalized **$25 for each month, or part of a month**, that it is late.","laws":[["Fla. Stat. § 443.141","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0443/Sections/0443.141.html"]],"plain":"Late on your RT-6 unemployment report? $25 penalty for every month it's late.","look":"Unemployment – Recordkeeping (RT-6)","ref":["Florida Contractors Manual  ·  2025: 5-269  ·  Unemployment - Recordkeeping","2021: 5-291  ·  Forms - SUTA Quarterly Report (RT6)","2017: 5-294"],"lock":1},{"id":"1-68","exam":1,"num":68,"stem":"A purchase order form will help you control __________.","options":["Inventory sales","Your payment terms","Actual inventory in a LIFO system","Unauthorized purchases"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"116"}],"exp":"Purchase orders require approval before buying, so they help control **unauthorized purchases**.","plain":"Purchase orders stop people from buying stuff nobody approved.","look":"Purchase Order","ref":["Builder's Guide to Accounting  ·  116  ·  Purchase order"]},{"id":"1-69","exam":1,"num":69,"stem":"Interpretations, corrections, and changes of the Bidding Documents shall be made by __________.","options":["Addendum","The Architect","Change Order","The Owner"],"answer":0,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"3.2.3"}],"exp":"A701 §3.2.3: interpretations, corrections and changes to the bidding documents are made only by **Addendum**. A Change Order changes the contract after it is signed.","plain":"Changes to bid documents go out by addendum. Before the contract it's an addendum, after it's a change order.","look":"A701 3.2 – Bidding Documents","tip":"Before the contract = Addendum. After = Change Order.","ref":["AIA Document A701, 2018  ·  3.2.3  ·  TOC: Bidding documents"]},{"id":"1-70","exam":1,"num":70,"stem":"Each continuing education provider shall retain all records relating to a licensee's completion of continuing education courses for at least __________ years after completion of a course.","options":["2","3","4","5"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2178(2)"}],"exp":"§455.2178: continuing education providers keep records of each licensee's course completion for at least **4 years**.","laws":[["Fla. Stat. § 455.2178(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2178.html"]],"plain":"Schools that teach your CE keep their records 4 years.","look":"Continuing Education Provider (§455.2178)","ref":["Florida Statute 455  ·  §455.2178(2)  ·  TOC: Continuing education provider"],"lock":1},{"id":"1-71","exam":1,"num":71,"stem":"If the Contractor does not pay the Subcontractor through no fault of the Subcontractor, within seven days of the time payment should be made as provided on their Agreement, the Subcontractor may, upon __________ additional days written notice to the Contractor, stop the Work of the Subcontract.","options":["14","7","5","3"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"4.8"}],"exp":"A401 §4.8: if the Contractor doesn't pay the Sub within 7 days of the due date, through no fault of the Sub, the Sub may stop work after **7 more days' written notice**.","plain":"Sub not paid 7 days past due? Give 7 more days' written notice, then the sub can stop work.","look":"A401 – Subcontractor (stop work)","tip":"7 + 7.","ref":["AIA Document A401, 2017  ·  4.8  ·  Subcontractor"],"lock":1},{"id":"1-72","exam":1,"num":72,"stem":"The purpose of Supplementary Record of Occupational Injuries and Illnesses (OHSA No. 301) is to ___________.","options":["Provide additional information about the employer listed in the log","Report the safety measures taken to prevent future accidents","Summarize the information that has been recorded in the log","Provide additional information on each case that has been recorded in the log"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-11"},{"book":"FCM","eds":["2017"],"loc":"7-11"}],"exp":"The OSHA 301 (Injury and Illness Incident Report) **gives more detail on each case recorded on the 300 log**. The 300A is the annual summary.","laws":[["29 CFR § 1904.29","https://www.ecfr.gov/current/title-29/section-1904.29"]],"plain":"The 301 form is the detail sheet for each injury listed on the 300 log.","look":"OSHA 301 – Incident Report","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-11  ·  TOC: The Supplementary Record of","Occupational Injuries and Illnesses","(OSHA No. 301)","2017: 7-11  ·  OSHA - 301 Form"]},{"id":"1-73","exam":1,"num":73,"stem":"Periodic progress reports on the Work shall be provided by the __________ to the __________ as mutually agreed.","options":["Contractor, Owner","Contractor, Architect","Subcontractor, Owner","Subcontractor, Contractor"],"answer":3,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"4.2.4"}],"exp":"A401 §4.2.4: the **Subcontractor** gives periodic progress reports to the **Contractor**. The sub's contract is with the contractor, not the owner.","plain":"The sub reports progress to the contractor, because the contractor is who the sub works for.","look":"A401 – Subcontractor (progress reports)","ref":["AIA Document A401, 2017  ·  4.2.4  ·  Subcontractor"]},{"id":"1-74","exam":1,"num":74,"stem":"For the purpose of required Workers Compensation coverage, __________ is NOT exempt from being considered a construction job.","options":["Landscaping for existing buildings","Fencing for existing building","Swimming pool repairs at an existing building","Well drilling on land not containing any other existing structures"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-6"}],"exp":"Per the manual's workers' comp definitions, landscaping, fencing and pool repair at existing buildings are excluded from \"construction.\" **Well drilling on land with no existing structures** still counts as a construction job.","laws":[["Fla. Stat. § 440.02","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.02.html"]],"plain":"Drilling a well on bare land counts as construction for comp. Landscaping, fences and pool repair at existing buildings were the exceptions listed.","look":"Workers' Compensation – Exemption","ref":["Florida Contractors Manual  ·  6-6  ·  Workers Compensation - Exemption"]},{"id":"1-75","exam":1,"num":75,"stem":"__________ is (are) considered to be a variable expense.","options":["Postage","Rent","Depreciation","Collections"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"147"}],"exp":"A variable expense changes with sales volume. **Collections** costs vary. Rent and depreciation are fixed.","plain":"Collections costs go up and down with your volume, so they're variable. Rent and depreciation stay the same, so they're fixed.","look":"Expenses – Variable","ref":["Builder's Guide to Accounting  ·  147  ·  Expenses - variables"]},{"id":"1-76","exam":1,"num":76,"stem":"The Bidder shall furnish Performance Bonds and Payment Bonds covering __________.","options":["The faithful performance of the contract and payments of all obligations arising thereunder","The full amount of the total cost of the job including change orders","The cost of the contract and attorney fees to enforce the contract if they do not perform","All jobs with costs over $250,000"],"answer":0,"topic":"ins","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.1.1"}],"exp":"A701 §7.1.1: the bidder furnishes Performance and Payment Bonds covering **faithful performance of the contract and payment of all obligations under it**.","plain":"The bonds cover doing the job right and paying everybody you owe on it.","look":"A701 Art. 7 – Performance & Payment Bond","ref":["AIA Document A701, 2018  ·  7.1.1  ·  TOC: Performance & Payment Bond"]},{"id":"1-77","exam":1,"num":77,"stem":"__________ insurance covers the structure being constructed and may be extended to cover materials while in transit or at temporary storage facilities.","options":["Umbrella","Inland marine","Fidelity","Builders risk"],"answer":3,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-7"}],"exp":"**Builder's risk** insurance covers the structure under construction and can be extended to materials in transit or in temporary storage.","plain":"Builder's risk insures the building while it goes up, and can cover materials on the truck or in storage.","look":"Insurance – Builder's Risk","ref":["Florida Contractors Manual  ·  4-7 (See Item #7)  ·  Insurance"]},{"id":"1-78","exam":1,"num":78,"stem":"If not exempt from local sales tax, the __________ will pay the sales tax.","options":["Manufacturer","State","Purchaser","Licensee"],"answer":2,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"3-64"},{"book":"FCM","eds":["2017"],"loc":"3-65"}],"exp":"Sales tax is paid by the **purchaser** (the end consumer) unless exempt. The seller only collects it and sends it to the state.","laws":[["Fla. Stat. § 212.07","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0200-0299/0212/Sections/0212.07.html"]],"plain":"The buyer pays the sales tax. The seller just collects it for the state.","look":"Taxes – Sales Tax","ref":["Florida Contractors Manual  ·  2025 & 2021: 3-64  ·  Taxes - State Sales Tax","2017: 3-65  ·  Taxes - Local Sales"]},{"id":"1-79","exam":1,"num":79,"stem":"A loan for $150,000 is made at a 9% interest rate. If it is paid back after 6 months. __________ in interest will be paid.","options":["$15,000","$13,500","$6,750","$10,125"],"answer":2,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-74"}],"exp":"Simple interest = principal × rate × time = $150,000 × 0.09 × (6 ÷ 12) = **$6,750**.","plain":"Interest = loan × rate × time. $150,000 × 9% × half a year = $6,750.","look":"Loans – Interest","calc":1,"ref":["Florida Contractors Manual  ·  3-74  ·  Loans - Types of","$150,000 x .09 (9%) x 6 months/12 months in a year = $6,750"],"lock":1},{"id":"1-80","exam":1,"num":80,"stem":"The volume of business that must be maintained in order to avoid a loss is the ___________.","options":["Percentage of sales","Net worth","Available cash","Breakeven point"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"179"}],"exp":"The **breakeven point** is the sales volume where revenue exactly covers costs. Below it you lose money.","plain":"Break-even is the amount of work you need just to not lose money.","look":"Break-Even Point","ref":["Builder's Guide to Accounting  ·  179  ·  Break-even point"]},{"id":"1-81","exam":1,"num":81,"stem":"If a contractor becomes liable for the payment of compensation to the employees of a subcontractor who has failed to secure such payment in violation of §440., the contractor shall be entitled to recover from the subcontractor __________.","options":["All benefits paid","All benefits paid or payable plus interest","150% of all benefits paid","Nothing"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"6-85","stat":"440.10(1)(d)1"},{"book":"FCM","eds":["2021"],"loc":"6-78","stat":"440.10(1)(d)1"},{"book":"FCM","eds":["2017"],"loc":"6-92","stat":"440.10(1)(d)1"}],"exp":"§440.10(1)(d): a contractor who has to pay comp to an uninsured subcontractor's employees may recover **all benefits paid or payable, plus interest**, from that subcontractor.","laws":[["Fla. Stat. § 440.10(1)(d)1","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.10.html"]],"plain":"If you end up paying comp for an uninsured sub's worker, you can get back everything paid or owed, plus interest.","look":"Liability for Compensation (§440.10)","ref":["Florida Contractors Manual  ·  2025: 6-85:  ·  TOC: Liability for Compensation","§440.10(1)(d)1","2021: 6-78: §440.10(1)(d)1","2017: 6-92: §440.10(1)(d)1"]},{"id":"1-82","exam":1,"num":82,"stem":"Under the Equal Pay Act, if the violation is willful, a court or jury may award up to __________ in back pay wages.","options":["Three years","Two years","Two years, not to exceed $5,000","Two years, plus interest"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-39"}],"exp":"Equal Pay Act: back pay normally covers 2 years, or **3 years** if the violation was willful.","laws":[["29 U.S.C. § 255","https://www.law.cornell.edu/uscode/text/29/255"]],"plain":"Unequal pay for the same job: normally 2 years of back pay, 3 years if it was on purpose (willful).","look":"Acts – Equal Pay","ref":["Florida Contractors Manual  ·  5-39  ·  Acts - Equal Pay"]},{"id":"1-83","exam":1,"num":83,"stem":"The Contractor shall not contract with a proposed person or entity to whom __________ has made reasonable or timely objection.","options":["Only the Architect","Only the Owner","The Architect or Owner","The Architect or Engineer"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"5.2.2"}],"exp":"A201 §5.2.2: the Contractor may not use a proposed subcontractor or supplier that the **Owner or Architect** has reasonably and timely objected to.","plain":"If the owner or the architect objects to a sub, you can't use that sub.","look":"A201 5.2 – Subcontractors","ref":["AIA Document A201, 2017  ·  5.2.2  ·  Subcontractors"]},{"id":"1-84","exam":1,"num":84,"stem":"__________ may NOT be depreciated.","options":["A tractor","A building","Equipment","Land"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"162"}],"exp":"**Land** is never depreciated because it doesn't wear out. Buildings, tractors and equipment are.","plain":"You can't depreciate land. Dirt doesn't wear out.","look":"Depreciation","ref":["Builder's Guide to Accounting  ·  162  ·  Depreciation"]},{"id":"1-85","exam":1,"num":85,"stem":"A bidder to whom award of a Contract is under consideration may request in writing, __________ days prior to the expiration of the time for withdrawal of Bids, that the Owner furnish to the Bidder reasonable evidence that financial arrangements have been made to fulfill the Owner's obligations under the Contract.","options":["Three","Seven","Ten","Fourteen"],"answer":3,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"6.2"}],"exp":"A701 §6.2: a bidder under consideration may ask in writing, **14 days** before the bid withdrawal period ends, for proof of the owner's financing. The owner then has 7 days to provide it.","plain":"A bidder can ask the owner to prove the job is funded, 14 days before the bid hold period ends.","look":"A701 Art. 6 – Post-Bid Information","tip":"Bidder asks at 14 days. Owner answers in 7.","ref":["AIA Document A701, 2018  ·  6.2  ·  TOC: Post-Bid Information"]},{"id":"1-86","exam":1,"num":86,"stem":"Contractor's claims for the cost of services or materials provided due to the Subcontractor's failure to execute the Work shall require __________ days written notice prior to the Contractor's providing services or materials.","options":["2","3","5 working","7"],"answer":3,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"3.4.2"}],"exp":"A401: before the Contractor supplies services or materials because the Sub failed to perform, and back-charges for them, the Contractor must give **7 days' written notice**.","plain":"Before the GC steps in to do a sub's work and bills them for it, the GC gives 7 days' written notice.","look":"A401 – Contractor (remedies)","ref":["AIA Document A401, 2017  ·  3.4.2 (1)  ·  TOC: Contractor"],"lock":1},{"id":"1-87","exam":1,"num":87,"stem":"A secondary qualifier is never responsible for __________.","options":["Obtaining permits","Safety on the jobsite","Financial matters having to do with his/her jobsite","Quality of the work done on his/her jobsite"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-24"},{"book":"FCM","eds":["2025"],"loc":"2-101","stat":"489.1195(2)(e)"},{"book":"FCM","eds":["2021"],"loc":"2-22"},{"book":"FCM","eds":["2021"],"loc":"2-78","stat":"489.1195(2)(e)"},{"book":"FCM","eds":["2017"],"loc":"2-21","stat":"489.1195(2)(e)"},{"book":"FCM","eds":["2017"],"loc":"2-89","stat":"489.1195(2)(e)"}],"exp":"§489.1195: the **primary** qualifying agent is responsible for financial matters. A secondary qualifier is responsible only for supervising field work (permits, safety, quality) and **never for financial matters**.","laws":[["Fla. Stat. § 489.1195(2)(e)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.1195.html"]],"plain":"The secondary qualifier handles the field work: permits, safety, quality. Money matters belong to the primary qualifier.","look":"Qualifying Agent (§489.1195)","ref":["Florida Contractors Manual  ·  2025: 2-24, 2-101:  ·  Qualifying Agent","§489.1195(2)(e)","2021: 2-22, 2-78:","§489.1195(2)(e)","2017: 2-21, 2-89: §489.1195(2)(e)"]},{"id":"1-88","exam":1,"num":88,"stem":"__________ will NOT be allowed to be included in the requested amount of a construction change directive.","options":["Labor","Rental cost of hand tools","Rental cost of machinery","Supplies"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.3.4"}],"exp":"A201 §7.3.4: CCD and change order costs may include labor, materials, supplies and rental of machinery and equipment, **but not hand tools**.","plain":"Labor, materials and rented machinery can go in a change. Hand tools can't.","look":"A201 7.3 – Construction Change Directives","tip":"Hand tools are never in a change.","ref":["AIA Document A201, 2017  ·  7.3.4  ·  Construction Change Directives"]},{"id":"1-89","exam":1,"num":89,"stem":"A Contractor shall submit to the Architect his or her application for payment __________ days prior to the date established in a contract for progress payments.","options":["3","5","7","10"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.3.1"}],"exp":"A201 §9.3.1: the Contractor submits its Application for Payment to the **Architect** at least **10 days** before the payment date.","plain":"Pay apps go to the architect 10 days before payday.","look":"A201 9.3 – Applications for Payment","tip":"Pay app: 10 days, to the Architect.","ref":["AIA Document A201, 2017  ·  9.3.1  ·  Applications for Payment"],"lock":1},{"id":"1-90","exam":1,"num":90,"stem":"__________ is a method of improving cash flow.","options":["Maintaining a high inventory","Taking advantage of discounts","Converting all cash sales to accounts receivable","Paying off liabilities"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"262"}],"exp":"**Taking discounts** (such as 2/10 net 30) lowers costs and improves cash flow. High inventory and converting cash sales to receivables tie up cash.","plain":"Taking early-pay discounts saves money and helps cash flow.","look":"Cash Flow – Controlling","ref":["Builder's Guide to Accounting  ·  262  ·  Cashflow - Controlling"],"dupes":["3-2"]},{"id":"1-91","exam":1,"num":91,"stem":"A Subcontractor has a \"Standard Form of Agreement Between Contractor and Subcontractor\" with the prime Contractor on a project. The ONLY way the Subcontractor can assign work on the Subcontract is with the written __________.","options":["Consent of the Owner or Architect","Consent of the Contractor","Notification to the Owner or Architect","Notification to the Contractor"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"7.4.2"}],"exp":"A401 §7.4.2: the Subcontractor may not assign the subcontract without the **Contractor's written consent**.","plain":"A sub can't hand its contract to someone else without the GC's written OK.","look":"A401 Art. 7 – Assignment of the Subcontract","ref":["AIA Document A401, 2017  ·  7.4.2  ·  TOC: Termination, suspension or assignment of the subcontract"],"dupes":["3-3"]},{"id":"1-92","exam":1,"num":92,"stem":"__________ are eligible for Small Business Administration loans.","options":["All building contractors in the United States","Only company presidents","Applicants who cannot obtain a loan from local banks","Applicants who are recommended by a local bank"],"answer":2,"topic":"org","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"318"},{"book":"BGA","eds":null,"loc":"319"}],"exp":"SBA loans are for **applicants who can't get reasonable credit from local banks** or other conventional lenders.","plain":"SBA loans are for folks who couldn't get a loan from a regular bank.","look":"Small Business Administration Loans","ref":["Builder's Guide to Accounting  ·  318, 319  ·  Small Business Administration Loans"]},{"id":"1-93","exam":1,"num":93,"stem":"A Notice of Commencement can be extended past one year __________.","options":["If it is written into the Notice of Commencement","If the job proceeds past one year","When there is an architectural change order","Never"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-83","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2021"],"loc":"9-78","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2017"],"loc":"9-88","stat":"713.13(1)(c)"}],"exp":"§713.13(1)(c): a Notice of Commencement expires **1 year after recording unless the notice itself states a different expiration date**.","laws":[["Fla. Stat. § 713.13(1)(c)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.13.html"]],"plain":"An NOC lasts 1 year unless the NOC itself lists a different expiration date.","look":"Notice of Commencement (§713.13)","ref":["Florida Contractors Manual  ·  2025: 9-83:  ·  Notices - Notice of Commencement","§713.13(1)(c)","2021: 9-78:","§713.13(1)(c)","2017: 9-88:","§713.13(1)(c)"],"dupes":["3-5"]},{"id":"1-94","exam":1,"num":94,"stem":"Which of the following will the bidder not represent when he or she submits a bid?","options":["That the provision for liquidated damages will be waived","Has visited the site and is familiar with local conditions under which the work is to be performed","Has read and understands the bidding documents","That the bid will be based upon materials and equipment required in the bid documents"],"answer":0,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"2.1"}],"exp":"A701 §2.1: by bidding, the bidder represents that it read the bidding documents, visited the site, and based the bid on the specified materials. It **never represents that liquidated damages will be waived**.","plain":"Bidding means you read the documents, saw the site, and priced the specified materials. It doesn't mean liquidated damages get waived.","look":"A701 Art. 2 – Bidder's Representations","ref":["AIA Document A701, 2018  ·  2.1  ·  TOC: Bidders Representation"]},{"id":"1-95","exam":1,"num":95,"stem":"A Contractor receives payment from the Owner of a construction project. The Contractor shall pay the Subcontractor each progress payment within __________.","options":["3 working days","3 days (including Saturday and Sunday)","5 working days","7 working days"],"answer":3,"topic":"aia","books":["A401","A201"],"cites":[{"book":"A401","eds":null,"loc":"11.1.3"},{"book":"A201","eds":null,"loc":"9.6.2"}],"exp":"A401 §11.1.3 (with A201 §9.6.2): the Contractor pays each Subcontractor within **7 working days** of receiving payment from the Owner.","plain":"When the GC gets paid, the GC has 7 working days to pay the subs.","look":"A401 Art. 11 – Payments","ref":["AIA Document A401, 2017  ·  11.1.3  ·  TOC: Payments","AIA Document A201, 2017  ·  9.6.2"],"dupes":["3-7"]},{"id":"1-96","exam":1,"num":96,"stem":"When a piece of equipment is sold, it is necessary to book the transaction separate from regular sales because __________.","options":["It is treated as a variable expense","It receives different tax treatment","The transaction is not taxable","The gains or losses must be used to adjust gross profits"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"170"}],"exp":"Selling equipment can produce a capital gain or loss and depreciation recapture. Because it **receives different tax treatment**, it's recorded separately from regular sales.","plain":"Selling equipment is taxed differently (gain, loss, recapture), so you book it separately from regular sales.","look":"Equipment – Sales","ref":["Builder's Guide to Accounting  ·  170  ·  Equipment - sales"],"dupes":["3-9"]},{"id":"1-97","exam":1,"num":97,"stem":"A certificate holder or registrant must inform the Board, by mail, within __________ calendar days, of changes in any information required to be stated on the application for qualification of a business organization.","options":["30","45","60","90"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-173","stat":"61G4-15.007(2)"},{"book":"FCM","eds":["2021"],"loc":"2-133","stat":"61G4-15.007(2)"},{"book":"FCM","eds":["2017"],"loc":"2-159","stat":"61G4-15.007(2)"}],"exp":"61G4-15.007(2): changes to any information required on the business organization's qualification application must be reported within **45 calendar days**.","laws":[["Fla. Admin. Code R. 61G4-15.007(2)","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-15.007"]],"plain":"Change anything on your company's qualification paperwork? Tell the board within 45 days.","look":"Licensing – Notices of Changes (61G4-15.007)","ref":["Florida Contractors Manual  ·  2025: 2-173:  ·  Licensing - Notices of Changes","61G4-15.007(2)","2021: 2-133:","61G4-15.007(2)","2017: 2-159:  ·  Licensing - Change in Information","61G4-15.007(2)"],"lock":1},{"id":"1-98","exam":1,"num":98,"stem":"__________ is (are) examples of an accrual entry.","options":["Depreciation and amortization entries","Entries to record payroll taxes","Entries to record automatic loan payments","Entries to record purchase of material stored at the jobsite"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"237"}],"exp":"Per the Builder's Guide, recording **material purchased and stored at the jobsite** (not yet installed) is an accrual entry.","plain":"Material bought and sitting on the jobsite but not installed yet gets an accrual entry.","look":"Accruals","ref":["Builder's Guide to Accounting  ·  237  ·  Accruals"]},{"id":"1-99","exam":1,"num":99,"stem":"To establish an hourly cost for a piece of equipment, the contractor needs to consider all the following except the __________.","options":["Estimated life of the equipment","Cost of the equipment, less salvage value","Replacement cost of the equipment","Estimated average hours of use"],"answer":2,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159"},{"book":"BGA","eds":null,"loc":"160"}],"exp":"Hourly equipment cost uses cost less salvage, estimated life, and average hours of use. **Replacement cost** is not part of the calculation.","plain":"To figure an hourly equipment rate, use cost minus salvage, life and hours. Replacement cost doesn't go in.","look":"Equipment – Cost Assignment","ref":["Builders Guide to Accounting  ·  159, 160  ·  Equipment - Cost assignment"],"dupes":["3-16"]},{"id":"1-100","exam":1,"num":100,"stem":"Failure of a certificate holder or registrant to apply for renewal of an active certificate at the time of biennial renewal shall cause the certificate to become __________.","options":["Temporarily suspended","Permanently suspended","Voluntarily inactive","Delinquent"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-95","stat":"489.116(4)"},{"book":"FCM","eds":["2021"],"loc":"2-74","stat":"489.116(4)"},{"book":"FCM","eds":["2017"],"loc":"2-84","stat":"489.116(4)"}],"exp":"§489.116(4): if a certificate holder doesn't apply to renew an active certificate at the biennial renewal, the certificate becomes **delinquent**.","laws":[["Fla. Stat. § 489.116(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.116.html"]],"plain":"Miss your renewal and your license goes delinquent.","look":"Licensing – Renewal (§489.116)","ref":["Florida Contractors Manual  ·  2025: 2-95:  ·  Licensing - Renewal","§489.116(4)","2021: 2-74:","§489.116(4)","2017: 2-84:","§489.116(4)"],"dupes":["3-17"]},{"id":"1-101","exam":1,"num":101,"stem":"The quarterly Federal Tax Form 941 summarizes tax liability for the employer which includes __________.","options":["Liability insurance","Federal income taxes withheld","Workers compensation insurance","Federal unemployment insurance tax"],"answer":1,"topic":"tax","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"137"},{"book":"BGA","eds":null,"loc":"138"}],"exp":"Form 941 (quarterly) reports **federal income tax withheld**, plus Social Security and Medicare taxes. FUTA goes on Form 940. Workers' comp isn't a federal tax.","plain":"Form 941 is the quarterly report of federal income tax you withheld from paychecks, plus Social Security and Medicare.","look":"Forms, Tax – 941","tip":"941 = withholding + FICA. 940 = FUTA.","ref":["Builder's Guide to Accounting  ·  137, 138  ·  Forms, Tax - 941"],"dupes":["3-27"]},{"id":"1-102","exam":1,"num":102,"stem":"The __________ summarizes the existing conditions of a business.","options":["Balance sheet","Statement of cash flows","Income statement","Statement of retained earnings"],"answer":0,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"247"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"The **balance sheet** is a snapshot of a business's existing condition (assets, liabilities, net worth) on one date. The income statement covers a period of time.","plain":"The balance sheet is a snapshot of where the business stands today.","look":"Financial Statements – Balance Sheet","ref":["Builder's Guide to Accounting  ·  247  ·  Financial Statements","Florida Contractors Manual  ·  3-105  ·  Chapter 3 - Definitions"],"dupes":["3-34"]},{"id":"1-103","exam":1,"num":103,"stem":"Having received the list of subcontractors, the architect immediately objects to the use of Allstate Plumbing Company. The general contractor then proposes and uses Atlas Plumbing Company at a higher cost of $5,000. The general contractor is entitled to __________.","options":["Nothing","A time extension only","$5,000 plus a proven time extension","Re-negotiate the contract with the owner"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"5.2.3"}],"exp":"A201 §5.2.3: when the Owner or Architect rejects a reasonably capable proposed sub, the contract sum and time are adjusted for the difference. The GC gets the **$5,000 plus any proven time extension**.","plain":"Architect rejects your sub and the replacement costs $5,000 more? You get the $5,000 plus any time you can prove you lost.","look":"A201 5.2 – Subcontractors (substitution)","ref":["AIA Document A201, 2017  ·  5.2.3  ·  Subcontractors"]},{"id":"1-104","exam":1,"num":104,"stem":"The term \"lapping\" refers to __________ taken from the business by moving outstanding balances from one customer account to another.","options":["Cash","Equity","Liabilities","Receivables"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"181"}],"exp":"Lapping is fraud: **cash** is stolen and hidden by applying later customers' payments to earlier customers' balances.","plain":"Lapping is stealing cash and covering it by shifting customer payments around.","look":"Lapping","ref":["Builder's Guide to Accounting  ·  181  ·  Optional TAB: Lapping"]},{"id":"1-105","exam":1,"num":105,"stem":"__________ is required to file a construction Claim of Lien.","options":["Permission from the owner","A court order","A direct contract with the owner","The claim must be recorded with the clerk of the court"],"answer":3,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-80","stat":"713.08(5)"},{"book":"FCM","eds":["2021"],"loc":"9-76","stat":"713.08(5)"},{"book":"FCM","eds":["2017"],"loc":"9-84","stat":"713.08(5)"}],"exp":"§713.08(5): a claim of lien must be **recorded with the clerk of the circuit court**. It doesn't need owner permission or a court order, and sub-tier lienors don't need a direct contract with the owner.","laws":[["Fla. Stat. § 713.08(5)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.08.html"]],"plain":"A lien has to be recorded with the clerk of court. You don't need the owner's permission or a judge.","look":"Lien – Claim of Lien (§713.08)","ref":["Florida Contractors Manual  ·  2025: 9-80:  ·  Lien - Claim of Lien","§713.08(5)","2021: 9-76:","§713.08(5)","2017: 9-84:","§713.08(5)"],"dupes":["3-40"]},{"id":"1-106","exam":1,"num":106,"stem":"__________ ratios compare accounts on the balance sheet to accounts on the income statement.","options":["Quick assets","Combined","Income account","Current"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"270"}],"exp":"**Combined ratios** compare a balance sheet account to an income statement account, for example real turnover (cost of sales ÷ inventory) or return on net worth.","plain":"\"Combined\" ratios use one number from the balance sheet and one from the income statement.","look":"Financial Ratios – Combined","ref":["Builder's Guide to Accounting  ·  270  ·  Financial Ratios"],"dupes":["3-41"]},{"id":"1-107","exam":1,"num":107,"stem":"The Florida's Workers' Compensation Act is applicable to an employer in the construction industry who employs __________ or more full or part time employees.","options":["1","2","3","10"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"6-5"},{"book":"FCM","eds":["2025","2021"],"loc":"5-54"},{"book":"FCM","eds":["2017"],"loc":"6-5"},{"book":"FCM","eds":["2017"],"loc":"5-54"}],"exp":"In the **construction industry**, Florida workers' comp applies to employers with **1 or more** employees. Non-construction employers need 4 or more.","laws":[["Fla. Stat. § 440.02","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.02.html"]],"plain":"In construction, even 1 employee means you need workers' comp.","look":"Workers' Compensation – When Needed","tip":"Construction = 1. Non-construction = 4.","ref":["Florida Contractors Manual  ·  2025 & 2021: 6-5  ·  Workers Compensation- when","& 5-54  ·  needed","2017: 6-5, 5-54  ·  Acts: Workers Compensation"],"lock":1},{"id":"1-108","exam":1,"num":108,"stem":"__________ is a type of cost basis inventory valuation method which uses the current market value of material as it is used.","options":["Specific cost","First in-first out","Last in-first out","Cost-plus"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"120"}],"exp":"**LIFO (last in, first out)** charges the most recent costs to jobs first, so material used is valued close to current market price.","plain":"LIFO (last in, first out) charges material at the newest price, close to today's market.","look":"Inventory – LIFO","ref":["Builder's Guide to Accounting  ·  120  ·  Inventory"],"dupes":["3-43"]},{"id":"1-109","exam":1,"num":109,"stem":"__________ is NOT used when calculating goods sold to average inventory ratio.","options":["Labor","Materials purchased","All other direct costs","Total monthly averages"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"The goods sold to average inventory ratio uses cost of goods sold (labor, materials, other direct costs) and average inventory. **\"Total monthly averages\"** isn't part of it.","plain":"The inventory ratio uses labor, materials and direct costs. \"Total monthly averages\" is the made-up choice.","look":"Inventory Ratio","ref":["Builder's Guide to Accounting  ·  121  ·  Inventory"],"dupes":["3-44"]},{"id":"1-110","exam":1,"num":110,"stem":"__________ does NOT require a written notice in order to file a claim for additional cost.","options":["A minor change in the work","Work performed because of a concealed condition","Damages caused by the architect","Work performed because of an emergency endangering the owner's property"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"15.1.5"}],"exp":"A201 §15.1.5 and §10.4: in an **emergency endangering persons or property**, the Contractor acts first, so written notice isn't required before claiming the extra cost.","plain":"In an emergency you act first. You don't need written notice before claiming the extra cost.","look":"A201 15.1 – Claims for Additional Cost","ref":["AIA Document A201, 2017  ·  Section 15.1.5  ·  Claims for additional costs"],"dupes":["3-51"]},{"id":"1-111","exam":1,"num":111,"stem":"All of the following are generally included in an invoice except __________.","options":["A description of materials","The sales price of the materials","The terms of the invoice","The balance of the customer's account"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"44"}],"exp":"An invoice covers one sale: description, price and terms. **The customer's account balance** goes on a statement, not an invoice.","plain":"An invoice covers one sale. The customer's running balance goes on a statement, not the invoice.","look":"Invoice – Illustrated","ref":["Builder's Guide to Accounting  ·  44, Figure 3-6  ·  Invoice - Illustrated"]},{"id":"1-112","exam":1,"num":112,"stem":"Current liabilities include the portion of long-term debt for equipment purchases that is payable within __________ days.","options":["30","90","180","365"],"answer":3,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"155"},{"book":"FCM","eds":null,"loc":"3-107"}],"exp":"Current liabilities are obligations due **within one year (365 days)**, including the current portion of long-term equipment debt.","plain":"Current liabilities are bills due within a year (365 days).","look":"Current Liabilities","ref":["Builder's Guide to Accounting  ·  155  ·  Current Liabilities","Florida Contractors Manual  ·  3-107  ·  Chapter 3 - Definitions"],"lock":1,"dupes":["3-54"]},{"id":"1-113","exam":1,"num":113,"stem":"Gross sales less direct costs equals __________.","options":["Gross profit","Net profit","Income from operations","Net sales"],"answer":0,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"248"}],"exp":"Gross sales − direct costs (cost of goods sold) = **gross profit**. Subtract overhead from gross profit to get net profit.","plain":"Sales minus direct job costs = gross profit. Take overhead out after that to get net profit.","look":"Financial Statements – Gross Profit","ref":["Builder's Guide to Accounting  ·  248  ·  Financial Statements"]},{"id":"1-114","exam":1,"num":114,"stem":"Assets minus liabilities equals __________.","options":["Net profit","Net worth","Gross sales","Gross profit"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"247"}],"exp":"Assets − liabilities = **net worth** (owner's equity).","plain":"What you own minus what you owe = net worth.","look":"Financial Statements – Net Worth","ref":["Builder's Guide to Accounting  ·  247  ·  Financial Statements"]},{"id":"1-115","exam":1,"num":115,"stem":"Upon initial signing of an agreement or contract with a homeowner, a contractor must deliver a written statement explaining the construction industry recovery fund. This action applies to all repairs, renovations, or construction over __________ in value.","options":["$500","$3,500","$2,500","$1,000"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-118","stat":"489.1425"},{"book":"FCM","eds":["2021"],"loc":"2-90","stat":"489.1425"},{"book":"FCM","eds":["2017"],"loc":"2-105","stat":"489.1425"}],"exp":"§489.1425: residential contracts **over $2,500** must include the written Florida Homeowners' Construction Recovery Fund notice.","laws":[["Fla. Stat. § 489.1425","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.1425.html"]],"plain":"Residential contract over $2,500? Include the written Recovery Fund notice.","look":"Homeowners' Recovery Fund (§489.1425)","ref":["Florida Contractors Manual  ·  2025: 2-118:  ·  Licensing -","§489.1425  ·  Homeowners Recovery Fund","2021: 2-90:  ·  Licensing -","§489.1425  ·  Homeowners Recovery Fund","2017: 2-105:  ·  Homeowners Recovery Fund","§489.1425  ·  payment"],"lock":1},{"id":"1-116","exam":1,"num":116,"stem":"An owner may terminate a Notice of Commencement by executing a Notice of Termination that contains all of the following except __________.","options":["Recording office document book and Page reference numbers and date of Notice of Commencement","Two copies of a Notice Direct Contract","Statement that lienors have been paid in full","Statement specifying that notice applies to all real property subject to Notice of Commencement"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-85","stat":"713.132(1)"},{"book":"FCM","eds":["2021"],"loc":"9-79","stat":"713.132(1)"},{"book":"FCM","eds":["2017"],"loc":"9-91","stat":"713.132(1)"}],"exp":"§713.132(1): a Notice of Termination includes the NOC's recording information, a statement that all lienors have been paid in full, and that it applies to all property in the NOC. **Two copies of a \"notice direct contract\"** is not a requirement.","laws":[["Fla. Stat. § 713.132(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.132.html"]],"plain":"A Notice of Termination needs the NOC info, a statement that everyone's paid, and the property it covers. \"Two copies of a notice direct contract\" is made up.","look":"Notice of Termination (§713.132)","ref":["Florida Contractors Manual  ·  2025: 9-85:  ·  TOC - Notice of Termination","§713.132(1)","2021: 9-79:  ·  TOC - Notice of Termination","§713.132(1)","2017: 9-91:  ·  Notices - Notice of Termination","§713.132(1)"]},{"id":"1-117","exam":1,"num":117,"stem":"Short term schedules on construction projects are a detailed explanation of the next ___________.","options":["7 days","2 weeks","4 weeks","6 weeks"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"10-64"},{"book":"FCM","eds":["2017"],"loc":"10-64"}],"exp":"Short-term schedules give a detailed look at the **next 2 weeks** of work.","plain":"Short-term schedules plan the next 2 weeks in detail.","look":"Project Schedules – Short Term","ref":["Florida Contractors Manual  ·  2025 & 2021: 10-64 TOC - Project Schedules - Short","Term Schedules","2017: 10-64  ·  Scheduling - Short Term"]},{"id":"1-118","exam":1,"num":118,"stem":"During the year, a firm used several independent contractors to perform various services. Each of these services involved payments in excess of $600 to the independent contractor performing the services. The independent contractors were not employees of the company. The company's responsibility for reporting the earnings of these contractors to the Internal Revenue Service (IRS) is that the company __________.","options":["Must immediately file a Form W-4 for these independent contractors","Must file Form 1099-NEC/1099-MISC to report total payments of $600 or more to these contractors","Must carry the contractors as employees and report their earnings along with the company's hourly or salaried personal","Has no responsibility. The independent contractors are responsible for reporting their earnings to the IRS."],"answer":1,"topic":"tax","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"138"},{"book":"FCM","eds":["2025"],"loc":"3-140"},{"book":"FCM","eds":["2021"],"loc":"3-158"},{"book":"FCM","eds":["2021"],"loc":"3-156"},{"book":"FCM","eds":["2017"],"loc":"3-152"}],"exp":"Payments of $600 or more to a non-employee in a year are reported on **Form 1099-NEC** (or 1099-MISC). W-4 is an employee withholding form. Federal law raised this threshold for payments made in 2026 and later, but the exam references use **$600**.","laws":[["26 U.S.C. § 6041","https://www.law.cornell.edu/uscode/text/26/6041"]],"plain":"Paid a non-employee $600 or more in a year? File a 1099. The W-4 is for employees.","look":"Independent Contractors (1099)","ref":["Builder's Guide to Accounting  ·  138  ·  Optional TAB: Independent","Florida Contractors Manual  ·  2025: 3-140  ·  Contractors","2021: 3-158 (2nd printing / 2021 IRS Circ. E)","2021: 3-156 (1st printing / 2016 IRS Circ. E)","2017: 3-152 (2016 IRS Circ. E)"]},{"id":"1-119","exam":1,"num":119,"stem":"When preparing financial statements, accruals are used to record __________.","options":["Lump sum payments","Income earned but not yet received","Cash transactions","Prepayments on a future contract"],"answer":1,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"106"},{"book":"BGA","eds":null,"loc":"107"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"Accruals record **income earned but not yet received** (and expenses incurred but not yet paid) in the period they belong to.","plain":"An accrual records money you've earned but haven't collected yet.","look":"Accruals / Definitions","ref":["Builder's Guide to Accounting  ·  106, 107","Florida Contractors Manual  ·  3-105  ·  Chapter 3 - Definitions"],"dupes":["3-74"]},{"id":"1-120","exam":1,"num":120,"stem":"Any contractor who collects a deposit of more than 10% of the contract price for any repairs, renovations, or construction to residential real property must apply for a permit within __________ days of payment.","options":["7","10","30","45"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-102","stat":"489.126(2)(a)1."},{"book":"FCM","eds":["2021"],"loc":"2-79","stat":"489.126(2)(a)1."},{"book":"FCM","eds":["2017"],"loc":"2-90","stat":"489.126(2)(a)"}],"exp":"§489.126: a contractor who takes a deposit of more than 10% on a residential job must apply for permits within **30 days** and start work within 90 days after the permit is issued.","laws":[["Fla. Stat. § 489.126(2)(a)1","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.126.html"]],"plain":"Took more than a 10% deposit on a home job? Apply for the permit within 30 days.","look":"Licensing – Money Received (§489.126)","tip":"More than 10% deposit → permit in 30 days → start in 90.","ref":["Florida Contractors Manual  ·  2025: 2-102:  ·  Licensing - Money Received","§489.126(2)(a)1.","2021: 2-79:","§489.126(2)(a)1.","2017: 2-90:","§489.126(2)(a)"],"lock":1},{"id":"1-121","exam":1,"num":121,"stem":"In which of the following situations would the percentage of completion method not be recommended?","options":["Jobs longer than two years in duration","Firms that require periodic, progressive recognition of profit from their jobs","Construction jobs producing revenue greater than $10 million","Jobs costing $1,000 - $5,000 which take approximately one week to complete"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"25"}],"exp":"Percentage of completion is meant for long, large jobs. A **$1,000–$5,000 job that takes about a week** is simpler to account for with the completed contract method.","plain":"Percentage of completion is for big, long jobs. A one-week, $5,000 job doesn't need it.","look":"Percentage of Completion Accounting","ref":["Builder's Guide to Accounting  ·  25  ·  Percentage of completion accounting"]},{"id":"1-122","exam":1,"num":122,"stem":"One of the most practical and useful cash controls available is __________.","options":["A daily cash summary","A quarterly cash summary","A secure petty cash box","Keeping petty cash receipts"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"180"}],"exp":"A **daily cash summary** is one of the most practical cash controls: each day's receipts and disbursements get reconciled right away.","plain":"A daily cash summary is one of the best ways to keep an eye on your money.","look":"Cash Control","ref":["Builder's Guide to Accounting  ·  180  ·  Cash control"]},{"id":"1-123","exam":1,"num":123,"stem":"All the following are procedures included in the budget process except __________.","options":["Analyzing the results","Consulting with your accountant","Preparing the budget","Taking action to control expenses"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"144"}],"exp":"The budget process: prepare the budget, analyze results, and take action to control expenses. **Consulting your accountant** isn't one of the steps.","plain":"Budgeting is prepare, analyze, control. \"Consult your accountant\" isn't a step.","look":"Budget – Analysis","ref":["Builder's Guide to Accounting  ·  144  ·  Budget - analysis"],"dupes":["3-83"]},{"id":"1-124","exam":1,"num":124,"stem":"The best way to control equipment costs is good __________.","options":["Maintenance","Scheduling","Financing","Reports"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"228"}],"exp":"Per the Builder's Guide, good **scheduling** is the best way to control equipment costs, because it keeps equipment working instead of sitting idle.","plain":"Good scheduling keeps equipment working instead of sitting, and that's the best cost control.","look":"Equipment – Estimating / Scheduling","ref":["Builder's Guide to Accounting  ·  228  ·  Equipment - estimating"],"dupes":["3-86"]},{"id":"1-125","exam":1,"num":125,"stem":"In order to establish an hourly cost for a bulldozer for job allocations, the __________ would NOT apply.","options":["Cost of equipment less salvage value","Operating costs involving gas, oil, and accessories","Repairing and maintenance costs","Unpredictable job site conditions"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159"},{"book":"BGA","eds":null,"loc":"160"}],"exp":"Hourly equipment cost uses cost less salvage, operating costs (fuel, oil), and repair and maintenance. **Unpredictable job site conditions** can't be built into a rate.","plain":"You can't put a number on unpredictable site conditions, so they don't go into an hourly equipment rate.","look":"Equipment – Cost Summary","ref":["Builder's Guide to Accounting  ·  159, 160  ·  Equipment - cost summary"],"dupes":["3-87"]},{"id":"2-1","exam":2,"num":1,"stem":"Using straight line depreciation, the annual allowable depreciation for a tractor trailer worth $23,000 with an estimated useful life of ten years and anticipated salvage value of $2,000 is ___________.","options":["$2,100","$2,300","$1,800","$2,500"],"answer":0,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"Straight line: (cost − salvage) ÷ useful life = ($23,000 − $2,000) ÷ 10 = $21,000 ÷ 10 = **$2,100** a year.","plain":"Price minus salvage: $23,000 − $2,000 = $21,000. Spread over 10 years = $2,100 a year.","look":"Depreciation – Straight Line","calc":1,"ref":["Builders Guide to Accounting  ·  163 (cost of asset−salvage value)","= annual depreciation expense useful life of asset","$23,000 - $2,000 = $21,000","$21,000 ÷ 10 = $2,100"],"lock":1},{"id":"2-2","exam":2,"num":2,"stem":"__________ is true of joint ventures.","options":["They are generally created for a single business transaction","Generally, they must adhere to a written joint venture agreement","Both A and B","None of the above"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-11"},{"book":"FCM","eds":["2017"],"loc":"1-12"}],"exp":"Joint ventures are usually formed for a **single project or transaction** and are generally governed by a **written joint venture agreement**. Both statements are true.","plain":"A joint venture is usually for one job, and you put the deal in writing. Both are true.","look":"Types of Business – Joint Venture","ref":["Florida Contractors Manual  ·  2025: 1-10","2021: 1-10, 1-11","2017: 1-12"],"lock":1},{"id":"2-3","exam":2,"num":3,"stem":"___________, a type of financial and business record, are NOT required to be maintained by a licensed contractor for the preceding three years.","options":["Telephone records","Employee timecards","Letters of complaints","Minutes of corporate meetings"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-18","stat":"489.124(1)"},{"book":"FCM","eds":["2025"],"loc":"2-102","stat":"489.124(1)"},{"book":"FCM","eds":["2021"],"loc":"2-22","stat":"489.124(1)"},{"book":"FCM","eds":["2021"],"loc":"2-78","stat":"489.124(1)"},{"book":"FCM","eds":["2021"],"loc":"2-79","stat":"489.124(1)"},{"book":"FCM","eds":["2017"],"loc":"2-20","stat":"489.124(1)"},{"book":"FCM","eds":["2017"],"loc":"2-90","stat":"489.124(1)"}],"exp":"Per the manual's list of financial and business records under §489.124, **employee timecards** are not among the records a contractor must keep for 3 years. Timecards fall under the 2-year \"soft record\" rule.","laws":[["Fla. Stat. § 489.124(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.124.html"]],"plain":"Timecards aren't on the state's 3-year list. They're \"soft\" records (2 years).","look":"Licensing – Record Keeping (§489.124)","ref":["Florida Contractors Manual  ·  2025: 2-18, 2-102, 489.124(1)","2021: 2-22, 2-78, 2-79, 489.124(1)","2017: 2-20, 2-90, 489.124(1)"]},{"id":"2-4","exam":2,"num":4,"stem":"After receiving a citation from the Board, a licensee has __________ days to dispute the citation before it becomes a final order.","options":["15","60","30","10"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.224(1)"}],"exp":"§455.224: a licensee has **30 days** after receiving a citation to dispute it. If they don't, it becomes a final order.","laws":[["Fla. Stat. § 455.224(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.224.html"]],"plain":"Got a citation? You have 30 days to fight it, or it becomes final.","look":"Citations (§455.224)","ref":["Florida Statute 455  ·  455.224(1)"],"lock":1},{"id":"2-5","exam":2,"num":5,"stem":"When a contractor performs obligations after receiving additional clarification that he requested from the architect for perceived needs for additional costs, when is the contractor liable for damages resulting from the work, he performed which is consistent with errors or omissions in the contract documents?","options":["The contractor would not be liable","In all instances as the contractor should have refused to do the work if he felt the documents included errors or omissions","Only if the work performed proved to be inconsistent with local building codes","Only if the work was performed by subcontractors working for the contractor"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.2.4"}],"exp":"A201 §3.2.4: if the Contractor asked for clarification and then followed the Architect's response, **the Contractor is not liable** for damage caused by errors or omissions in the contract documents.","plain":"If you asked the architect, got an answer and built it that way, you're not on the hook for their mistake.","look":"A201 3.2 – Review of Contract Documents","ref":["AIA Document A201, 2017  ·  3.2.4 Index: Claims and Disputes"]},{"id":"2-6","exam":2,"num":6,"stem":"Form 940 used to report _____________.","options":["FUTA Taxable Wages to the IRS","Wages for Federal Unemployed Trainees","Wages for Workers Compensation rate calculations","None of the above"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-26"},{"book":"FCM","eds":["2025"],"loc":"3-48"},{"book":"FCM","eds":["2025"],"loc":"3-176"},{"book":"FCM","eds":["2021"],"loc":"1-26"},{"book":"FCM","eds":["2021"],"loc":"3-48"},{"book":"FCM","eds":["2021"],"loc":"3-191"},{"book":"FCM","eds":["2017"],"loc":"1-23"},{"book":"FCM","eds":["2017"],"loc":"3-48"},{"book":"FCM","eds":["2017"],"loc":"3-182"}],"exp":"Form **940** is the employer's annual return that reports **FUTA** (federal unemployment) taxable wages and tax to the IRS.","plain":"Form 940 is the yearly federal unemployment (FUTA) tax form.","look":"Forms – 940 (FUTA)","tip":"940 = FUTA, filed annually. 941 = withholding and FICA, filed quarterly.","ref":["Florida Contractors Manual  ·  2025: 1-26, 3-48, 3-176 (2025 IRS Circ. E)","2021: 1-26, 3-48, 3-191 (2021 IRS Circ. E)","2017: 1-23, 3-48, 3-182 (2017 IRS Circ. E)"],"lock":1},{"id":"2-7","exam":2,"num":7,"stem":"According to child labor laws, a seventeen-year-old can work no more than ___________ during the school session.","options":["40 hours per month","30 hours per week","10 hours in any one day","20 hours per week"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-32"}],"exp":"16- and 17-year-olds may work up to **30 hours a week** while school is in session.","laws":[["Fla. Stat. § 450.081","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0450/Sections/0450.081.html"]],"plain":"A 17-year-old can work 30 hours a week during the school year. Same as a 16-year-old.","look":"Laws – Child Labor","ref":["Florida Contractors Manual  ·  5-32"]},{"id":"2-8","exam":2,"num":8,"stem":"__________ are properties of a Balance Sheet.","options":["Assets, liabilities, net worth","Profit, loss, net worth","Assets, debts, receivables","Income, collections, overhead"],"answer":0,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"17"}],"exp":"A balance sheet has three parts: **assets, liabilities and net worth** (equity). Profit and income belong on the income statement.","plain":"A balance sheet has three things: assets, liabilities and net worth.","look":"Balance Sheet","ref":["Builders Guide to Accounting  ·  17"]},{"id":"2-9","exam":2,"num":9,"stem":"A reserve of bad debt is __________.","options":["A reduction in your current assets","A general ledger entry that reflects a budgeted reserve for bad debts","A loss of cash on hand","Both A and B"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"68"}],"exp":"A bad debt reserve (allowance for doubtful accounts) **reduces current assets** (it offsets receivables) and is **a general ledger entry for a budgeted reserve**. Both are true.","plain":"A bad debt reserve lowers your current assets on paper, and it's a ledger entry for money you expect to lose. Both are true.","look":"Bad Debt Reserve","ref":["Builders Guide to Accounting  ·  68"],"lock":1},{"id":"2-10","exam":2,"num":10,"stem":"It is the contractor's responsibility should he discover concealed or unknown conditions subsurface or otherwise to _____________.","options":["Provide notice to the Owner within 10 days of discovery of the conditions","Provide notice to the Architect and Owner within 10 days of discovery of the conditions","Provide notice to the Architect and Owner within 14 days of discovery of the conditions","Advise the building inspector within 3 days of perceived unsafe conditions"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.7.4"}],"exp":"A201 §3.7.4: when concealed or unknown conditions are found, the Contractor notifies **both the Owner and the Architect** before disturbing them, and no later than **14 days** after first observing them.","plain":"Hit something hidden in the ground or walls? Tell the owner AND the architect within 14 days.","look":"A201 3.7.4 – Concealed or Unknown Conditions","tip":"Concealed conditions = 14 days. Claims = 21 days.","ref":["AIA Document A201, 2017  ·  3.7.4"]},{"id":"2-11","exam":2,"num":11,"stem":"__________ is a way cash can be stolen by taking sums from one customer account and applying it to another's and writing off the amount of cash taken as bad debt.","options":["Falsifying sales records","Falsifying discounts","Lapping","Client transfer processing"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"181"}],"exp":"**Lapping** is stealing cash from one customer's payment and covering it with later payments from other customers. The shortfall is eventually written off as bad debt.","plain":"Lapping is taking one customer's payment, covering it with the next customer's money, and hiding the hole as bad debt.","look":"Lapping","ref":["Builders Guide to Accounting  ·  181"]},{"id":"2-12","exam":2,"num":12,"stem":"What is the maximum number of times a licensee may go through the mediation process pertaining to complaints made against him without Board approval?","options":["The mediation process can only be used once every five years","No more than three times","There is no limit to the number of times mediation can by employed","The mediation process can only be used once every ten years"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2235(4)"}],"exp":"§455.2235(4): a licensee may go through mediation **no more than 3 times** without Board approval.","laws":[["Fla. Stat. § 455.2235(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2235.html"]],"plain":"You can use mediation up to 3 times before you need the board's OK.","look":"Mediation (§455.2235)","ref":["Florida Statute 455  ·  455.2235(4)"]},{"id":"2-13","exam":2,"num":13,"stem":"What guaranty does a contractor make through the issuance of a surety bond?","options":["He will complete the project as per the contract documents","He will hold the architect harmless for delays","He will assign any benefits awarded under the bond to his subcontractors","He will reimburse the surety company if he fails to perform according to contract"],"answer":3,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-12"}],"exp":"A surety bond is not insurance for the contractor. By signing the indemnity agreement, the contractor promises to **reimburse the surety** for anything the surety pays out because the contractor failed to perform.","plain":"A bond protects the owner, not you. If the surety pays out because of you, you pay the surety back.","look":"Bonds – Surety","ref":["Florida Contractors Manual  ·  4-12"]},{"id":"2-14","exam":2,"num":14,"stem":"Which of the following describes a Payroll Register?","options":["It is the same as a check register but includes details related to payroll checks","It is a system used to record only salaried workers wages","It is used to transfer check amounts to the General Ledger","It is the best way to control payroll costs"],"answer":0,"topic":"tax","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"130"}],"exp":"A **payroll register** is like a check register with payroll detail added (gross pay, deductions, net pay for each check).","plain":"A payroll register is a check register with the payroll details added: gross, deductions, net.","look":"Payroll Register","ref":["Builders Guide to Accounting  ·  130"]},{"id":"2-15","exam":2,"num":15,"stem":"The minimum levels of coverage of public liability and personal damage insurance that state contractor licensees must carry is ____________.","options":["That they are the same for all trades and General Contractors","$500,000 liability and $100,000 property damage","$100,000 liability and $25,000 property damage for all trades other than General and Building Contractors and Electrical or Alarm contractors","No minimum requirements just suggested coverages"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2025"],"loc":"2-172","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-131","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-19","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-157","stat":"61G4-15.003"}],"exp":"61G4-15.003: all trades **except general, building and residential contractors** need **$100,000 liability and $25,000 property damage**. GC, building and residential need $300,000 and $50,000. (Electrical and alarm contractors are licensed under a different board.)","laws":[["Fla. Admin. Code R. 61G4-15.003","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-15.003"]],"plain":"Specialty trades carry $100,000 / $25,000. General, building and residential contractors carry $300,000 / $50,000.","look":"Licensing – Public Liability Insurance (61G4-15.003)","ref":["Florida Contractors Manual  ·  2025: 2-16, 2-172, 61G4-15.003","2021: 2-16, 2-131, 61G4-15.003","2017: 2-19, 2-157, 61G4-15.003"]},{"id":"2-16","exam":2,"num":16,"stem":"A(an) __________ asset is goodwill.","options":["Intangible","Current","Fixed","Contingent"],"answer":0,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"253"}],"exp":"Goodwill is an **intangible asset**: it has value but no physical form, like patents and trademarks.","plain":"Goodwill is valuable but you can't touch it. That makes it an intangible asset.","look":"Assets – Intangible","ref":["Builders Guide to Accounting  ·  253"]},{"id":"2-17","exam":2,"num":17,"stem":"__________ expenses are considered direct costs rather than variable overhead expenses.","options":["Labor","Union welfare","Equipment rental","Small tools"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"141"}],"exp":"**Labor** on the job is a direct cost charged to that job. Union welfare, equipment rental and small tools are treated as variable overhead in this context.","plain":"Labor on the job is a direct cost. It goes straight to that job.","look":"Direct Costs","ref":["Builders Guide to Accounting  ·  141"]},{"id":"2-18","exam":2,"num":18,"stem":"What information will a bank require to approve financing to a business?","options":["How much money is needed","How long will the money be needed","How will the loan be repaid","All of the above"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-73"}],"exp":"A lender wants to know **how much you need, how long you need it, and how you'll repay it**. That's all of the above.","plain":"The bank asks how much, how long and how you'll pay it back. All three.","look":"Loans – Bank Requirements","ref":["Florida Contractors Manual  ·  3-73"],"lock":1},{"id":"2-19","exam":2,"num":19,"stem":"Which of the following is not true regarding the ownership of drawings, specifications and other instruments of service?","options":["The architect and their consultants are deemed to be the authors","The owner retains ownership as they paid to have the documents prepared","Suppliers shall not own or claim a copyright interest on any of these documents","The architect retains ownership of these documents"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"1.5"}],"exp":"A201 §1.5: the Architect and its consultants are the authors and owners of the drawings and specifications and keep the copyrights. **The Owner does NOT own them just because it paid for them**, so that's the statement that's not true.","plain":"The architect owns the drawings, not the owner, even though the owner paid. So \"the owner owns them\" is the false statement.","look":"A201 1.5 – Ownership of Instruments of Service","ref":["AIA Document A201, 2017  ·  1.5"]},{"id":"2-20","exam":2,"num":20,"stem":"At time of renewal, an applicant submitting proof of completed classroom continuing education, must provide proof of a minimum of __________ actual time of classroom instruction.","options":["14 hours","11 hours and 40 minutes","11 hours","50 minutes"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-93","stat":"489.115(4)(b)1."},{"book":"FCM","eds":["2021"],"loc":"2-73","stat":"489.115(4)(b)1."},{"book":"FCM","eds":["2017"],"loc":"2-82","stat":"489.115(4)(b)1."}],"exp":"§489.115(4)(b): contractors must complete **14 hours** of continuing education per biennial cycle. The exam counts \"hours\" as 50-minute contact hours.","laws":[["Fla. Stat. § 489.115(4)(b)1","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.115.html"]],"plain":"You need 14 hours of continuing education every renewal.","look":"Continuing Education (§489.115)","ref":["Florida Contractors Manual  ·  2025: 2-93, 489.115(4)(b)1.","2021: 2-73, 489.115(4)(b)1.","2017: 2-82, 489.115(4)(b)1."]},{"id":"2-21","exam":2,"num":21,"stem":"Why should all sales on account be accrued?","options":["This method is more accurate than any other method","Sales should not be accrued","Sales are a variable asset and therefore an accrued posting","No cash changes hands so therefore it is an accrued item"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"239"}],"exp":"Sales on account are accrued because **no cash has changed hands** yet. The revenue is earned and recorded as a receivable.","plain":"A sale on account gets accrued because no cash changed hands yet.","look":"Accruals – Sales on Account","ref":["Builders Guide to Accounting  ·  239"]},{"id":"2-22","exam":2,"num":22,"stem":"What two accounting tools are the most efficient way to monthly track accounts payable?","options":["Check registers for both current month and previous month billings","Profit & Loss and Balance Sheet","Two separate checking accounts","Account Payable and Account Aging registers"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"108"}],"exp":"Per the Builder's Guide, the most efficient monthly tool for tracking accounts payable is **check registers for both the current month and the previous month's billings**.","plain":"The Builder's Guide tracks payables with check registers for this month and last month's bills.","look":"Accounts Payable","ref":["Builders Guide to Accounting  ·  108"]},{"id":"2-23","exam":2,"num":23,"stem":"The owner has __________ days to provide a bidder to a contract proof that the owner has made financial arrangements to fulfill their obligations under the contact.","options":["5","7","10","3"],"answer":1,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"6.2"}],"exp":"A701 §6.2: once a bidder asks for proof of financing, the Owner has **7 days** to provide it. The bidder must ask at least 14 days before the bid withdrawal period ends.","plain":"Once a bidder asks, the owner has 7 days to show the job is funded.","look":"A701 Art. 6 – Post-Bid Information","ref":["AIA Document A701, 2018  ·  6.2"],"lock":1},{"id":"2-24","exam":2,"num":24,"stem":"A construction firm should seek professional services from, a(an) _________ when developing a budget, cash-flow forecasts or employee benefits packages.","options":["Certified Public Bookkeeper","Accountant","Certified Public Accountant","Attorney"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-9"}],"exp":"For budgets, cash-flow forecasts and employee benefit packages, the manual recommends a **Certified Public Accountant (CPA)**.","plain":"For budgets, cash-flow forecasts and benefit plans, get a CPA.","look":"Professional Services – CPA","ref":["Florida Contractors Manual  ·  3-9"]},{"id":"2-25","exam":2,"num":25,"stem":"The maximum number of days after filing any mediation proceeding involving a contractor that a dispute may be stayed is __________.","options":["60","60 unless the court orders a longer period","45 days","30 days unless agreed to by both parties"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"15.3.2"}],"exp":"A201 §15.3.2: once mediation is filed, related proceedings may be stayed for **60 days, unless a court orders a longer period** (or the parties agree to one).","plain":"Mediation puts the dispute on hold for 60 days, unless a court orders longer.","look":"A201 15.3 – Mediation","ref":["AIA Document A201, 2017  ·  15.3.2"]},{"id":"2-26","exam":2,"num":26,"stem":"Which of the following is not correct about Project Schedules?","options":["They should be informally reviewed and updated every 30 days","They should be jointly prepared with a material and equipment schedule","They should include enough detail to allow adequate project control","The schedule progress should be posted at least weekly"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-63"}],"exp":"Schedules should be updated continuously and progress posted at least weekly. **\"Informally reviewed every 30 days\" is not correct**.","plain":"Schedules get updated constantly and posted weekly. \"Informally reviewed every 30 days\" is the wrong one.","look":"Scheduling – Guidelines","ref":["Florida Contractors Manual  ·  10-63"]},{"id":"2-27","exam":2,"num":27,"stem":"A __________ ratio best illustrates the overall health of a business.","options":["Capital to Current Liabilities","Debt to Asset Ratio","Working Capital to Funded Debt","Current Ratio"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"268"}],"exp":"Per the Builder's Guide, the **current ratio** is the single best indicator of a business's overall financial health.","plain":"The current ratio is the best single check on a company's health.","look":"Current Ratio","ref":["Builders Guide to Accounting  ·  268"]},{"id":"2-28","exam":2,"num":28,"stem":"Which of the following are not ways to prevent bad debt in the form of open collectables?","options":["Ask for credit references from new clients","Do not take on any new clients until you can collect all current outstanding debts","Do not extend credit unless a credit application is on file","Call customers to ask them to commit to a date to pay their outstanding sums"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"55"}],"exp":"Credit references, credit applications and getting customers to commit to a payment date all prevent bad debt. **Refusing all new clients until every debt is collected** isn't a prevention method. It would just stop the business.","plain":"Credit checks and payment commitments prevent bad debt. Refusing all new customers until everyone pays doesn't. That just shuts you down.","look":"Bad Debt – Prevention","ref":["Builders Guide to Accounting  ·  55"]},{"id":"2-29","exam":2,"num":29,"stem":"Which of the following is not considered a Fixed Overhead Expense?","options":["Salaried employee working at the corporate office","Small tools","Payroll taxes for office personnel","Printing of letterhead and envelopes"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"143"}],"exp":"**Small tools** are a variable overhead expense because they're consumed with work volume. Office salaries, office payroll taxes and letterhead printing are fixed overhead.","plain":"Small tools get used up as you work, so they're a variable cost. Office salaries and letterhead are fixed.","look":"Overhead – Fixed vs. Variable","ref":["Builders Guide to Accounting  ·  143"]},{"id":"2-30","exam":2,"num":30,"stem":"What does an Aging List accomplish?","options":["It indicates the percentage of receivables that are current","It indicates the percentage of receivables that are uncollected","It is used to control the collections of accounts receivables","All of the above"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"46"}],"exp":"An aging list shows the percentage of receivables that are current and the percentage that are past due, and it's used to manage collections. **All of the above**.","plain":"An aging list shows what's current, what's late, and helps you collect. All of the above.","look":"Aging List","ref":["Builders Guide to Accounting  ·  46"],"lock":1},{"id":"2-31","exam":2,"num":31,"stem":"___________ costs are freight charges on material shipped to a job by the supplier.","options":["Direct","Incidental","Indirect","Overhead"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"115"}],"exp":"Freight charged by the supplier to ship material to a job is a **direct cost** of that job, just like the material.","plain":"Freight to ship material to the job is a direct job cost, same as the material.","look":"Direct Costs – Freight","ref":["Builders Guide to Accounting  ·  115"]},{"id":"2-32","exam":2,"num":32,"stem":"Which o
