f the following is an allowable rule regarding approved continuing education hours?","options":["16 hours of continuing education are required at the time of renewal","60 minutes constitutes each hour of required continuing education","Up to a maximum of 50% of the continuing education may be fulfilled through pro bono services to the indigent or underserved populations","Continuing education can be performed in the classroom or via interactive distance learning"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-17"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"CE may be taken **in a classroom or through interactive distance learning**. The other choices are wrong: contractors need 14 hours (not 16), and a CE \"hour\" is 50 minutes (not 60).","laws":[["Fla. Stat. § 489.115","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.115.html"]],"plain":"CE can be done in a classroom or online (interactive distance learning). It's 14 hours, and a CE \"hour\" is 50 minutes.","look":"Continuing Education – Rules","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-17","2017: 2-19"]},{"id":"2-33","exam":2,"num":33,"stem":"When is an employer liable for the payment of state re-employment tax?","options":["When he has had at least one employee for at least one day of work","When he has paid at least $1,000 in wages and has had at least one employee for a minimum of ten weeks","When he has paid at least $1,500 in wages and has had at least one employee for a minimum of twenty weeks","When they have laid off at least one employee in a quarter"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-52"},{"book":"FCM","eds":["2025"],"loc":"5-258"},{"book":"FCM","eds":["2021"],"loc":"5-52"},{"book":"FCM","eds":["2021"],"loc":"5-282"},{"book":"FCM","eds":["2017"],"loc":"5-52"},{"book":"FCM","eds":["2017"],"loc":"5-284"}],"exp":"An employer owes Florida reemployment (unemployment) tax after paying **$1,500 or more in wages in a calendar quarter** or employing at least one person in each of **20 weeks** in a calendar year.","laws":[["Fla. Stat. § 443.036","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0443/Sections/0443.036.html"]],"plain":"You owe state unemployment tax once you pay $1,500 in a quarter or have someone working 20 weeks in a year.","look":"Reemployment Tax – Liability","tip":"$1,500 in a quarter or 20 weeks.","ref":["Florida Contractors Manual  ·  2025: 5-52, 5-258","2021: 5-52, 5-282","2017: 5-52, 5-284"]},{"id":"2-34","exam":2,"num":34,"stem":"Which of the following would be the most desirable current ratio?","options":["3 to 1","1 to 1","2 to 1","4 to 1"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"268"}],"exp":"The current ratio measures liquidity, and the higher it is, the safer. Of these choices, **4 to 1** is the most desirable. (2 to 1 is the usual minimum target.)","plain":"For the current ratio, higher is safer. 4 to 1 beats the others listed.","look":"Current Ratio","ref":["Builders Guide to Accounting  ·  268"],"lock":1},{"id":"2-35","exam":2,"num":35,"stem":"Which of the following is not true regarding Form 940, Employers Annual Unemployment Tax Return?","options":["It is used to report and pay federal unemployment tax","It is used to report and pay state unemployment tax on an annual basis","It is not required if you have no employees","The amount of tax paid is based on the number of employees and wages"],"answer":1,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-26"},{"book":"FCM","eds":["2025"],"loc":"3-177"},{"book":"FCM","eds":["2021"],"loc":"1-26"},{"book":"FCM","eds":["2021"],"loc":"3-192"},{"book":"FCM","eds":["2017"],"loc":"1-23"},{"book":"FCM","eds":["2017"],"loc":"3-183"}],"exp":"Form 940 is **federal** unemployment tax only. State reemployment tax is reported quarterly on the Florida RT-6, so \"reports state unemployment tax annually\" is the false statement.","plain":"Form 940 is federal only. State unemployment goes on the RT-6, quarterly.","look":"Forms – 940","ref":["Florida Contractors Manual  ·  2025: 1-26 & 3-177 (2025 IRS Circ. E)","2021: 1-26 & 3-192 (2021 IRS Circ. E)","2017: 1-23 & 3-183 (2016 IRS Circ. E)"]},{"id":"2-36","exam":2,"num":36,"stem":"A contractor must pay the subcontractor after ____________ days the contractor is paid by the owner.","options":["10","7","5","14"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"11.1.3"}],"exp":"A401 §11.1.3: the Contractor pays the Subcontractor within **7 days** of receiving payment from the Owner.","plain":"The GC pays the sub within 7 days of getting paid.","look":"A401 Art. 11 – Payments","ref":["AIA Document A401, 2017  ·  11.1.3"],"lock":1},{"id":"2-37","exam":2,"num":37,"stem":"In what instance is form OSHA 301 required?","options":["Any time an injury or illness is reported on OSHA 300","Only if an injury resulting in death occurs","Only if an injury is considered of lesser severity","No such OSHA form exists"],"answer":0,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-11"}],"exp":"An OSHA **301** report must be completed for **every** injury or illness recorded on the 300 log, within 7 calendar days.","laws":[["29 CFR § 1904.29","https://www.ecfr.gov/current/title-29/section-1904.29"]],"plain":"Every injury on the 300 log needs its own 301 detail form.","look":"OSHA 301 – Incident Report","ref":["Florida Contractors Manual  ·  7-11"]},{"id":"2-38","exam":2,"num":38,"stem":"Which of the following approaches is associated with Network Analysis?","options":["Critical Path Analysis (CPA)","Critical Path Method (CPM)","Project Evaluations and Review Technique (PERT)","All above are approaches associated with Network Analysis"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-57"}],"exp":"Network analysis includes the **Critical Path Method (CPM), Critical Path Analysis and PERT**. All of the above.","plain":"CPM, PERT and critical path analysis are all network scheduling. All of the above.","look":"Network Analysis – CPM / PERT","ref":["Florida Contractors Manual  ·  10-57"],"lock":1},{"id":"2-39","exam":2,"num":39,"stem":"Privity in lien law means __________.","options":["The names of all parties to a contract are to remain private and confidential","The relationship between two or more parties to a contract","All parties to a contract that have lien rights","The requirement to mediate in the case of a contract dispute"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-22"},{"book":"FCM","eds":["2017"],"loc":"9-21"}],"exp":"**Privity** is a direct contractual relationship between parties. Lienors not in privity with the owner (subs, suppliers) must serve a Notice to Owner.","laws":[["Fla. Stat. § 713.01","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.01.html"]],"plain":"Privity means a direct contract between two parties. No privity with the owner? Send a Notice to Owner.","look":"Privity","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-22","2017: 9-21"]},{"id":"2-40","exam":2,"num":40,"stem":"__________ are the two methods of allowable depreciation.","options":["Straight line and Curved line","Declining Balance and Increasing Value","Increasing Balance and Curved line","Straight line and Declining balance"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"The two allowable depreciation methods in the reference text are **straight line and declining balance**.","plain":"The two methods: straight line and declining balance.","look":"Depreciation – Methods","ref":["Builders Guide to Accounting  ·  163"]},{"id":"2-41","exam":2,"num":41,"stem":"A condition giving rise to a dispute occurs on May 1st and is discovered by the contractor on May 5th, the contractor must initiate the claim by __________.","options":["May 21","May 22","May 26","May 27"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"15.1.3"}],"exp":"A201 §15.1.3: claims must be started within **21 days** of the event or of when the claimant first recognizes the condition, **whichever is later**. Discovered May 5, so May 5 + 21 = **May 26**.","plain":"Claims are due 21 days after you discover the problem, if that's later than when it happened. May 5 + 21 = May 26.","look":"A201 15.1 – Claims","tip":"21 days from the later of the event or discovery.","calc":1,"ref":["AIA Document A201, 2017  ·  15.1.3"]},{"id":"2-42","exam":2,"num":42,"stem":"The ___________ accounting method recognizes income most exactly.","options":["Percentage - of - Completion","Completed - Contract","Capitalized Cost Method","Earned Income"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"25"}],"exp":"The **completed contract** method recognizes income most exactly because profit is booked only when the job is done and the actual numbers are known. Percentage of completion relies on estimates.","plain":"Completed contract books profit when the job is done and the numbers are real. That's the most exact method.","look":"Completed Contract","ref":["Builders Guide to Accounting  ·  25"]},{"id":"2-43","exam":2,"num":43,"stem":"What is one of the rules that may be provided regarding approved continuing education hours?","options":["16 hours of continuing education are required at the time of renewal","60 minutes constitutes each hour of required continuing education","Continuing education is required to be completed every three years","Continuing education can be performed in the classroom or via interactive distance learning"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-17"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"CE may be completed **in a classroom or through interactive distance learning**. The cycle is biennial (every 2 years), the requirement is 14 hours, and an hour means 50 minutes.","laws":[["Fla. Stat. § 489.115","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.115.html"]],"plain":"CE can be classroom or online. It's every 2 years, 14 hours, 50-minute hours.","look":"Continuing Education – Rules","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-17","2017: 2-19"]},{"id":"2-44","exam":2,"num":44,"stem":"The __________ method allows a business to take advantage of discounts offered by their suppliers for early payment of invoices.","options":["Prepayment ledger","Quantity discounts","Open invoice method","Discount invoice accounting method"],"answer":2,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-47"}],"exp":"The **open invoice method** keeps unpaid invoices on file by due date so you can pay in time to take early-payment discounts.","plain":"Keeping unpaid bills filed by due date lets you pay early and grab the discount.","look":"Open Invoice Method","ref":["Florida Contractors Manual  ·  3-47"]},{"id":"2-45","exam":2,"num":45,"stem":"Contractors must maintain complete financial, sales and business records __________.","options":["For the immediately preceding five years","For the immediately preceding ten years","For the immediately preceding seven years","For the immediately preceding three years"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-18"},{"book":"FCM","eds":["2021"],"loc":"2-17"},{"book":"FCM","eds":["2017"],"loc":"2-20"}],"exp":"§489.124: contractors keep complete financial, sales and business records for the **immediately preceding 3 years**.","laws":[["Fla. Stat. § 489.124","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.124.html"]],"plain":"Business records: keep the last 3 years.","look":"Licensing – Record Keeping","ref":["Florida Contractors Manual  ·  2025: 2-18","2021: 2-17","2017: 2-20"]},{"id":"2-46","exam":2,"num":46,"stem":"Which of the following is true when a temporary certificate of registration is allowed for an organization who lost its qualifying agent?","options":["The organization may proceed with contracts for incomplete work projects","There is no provision for a temporary certificate of registration, and all must work must cease until a new qualifying agent is approved","The organization may proceed with both new and incomplete contracts","None of the above are true"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-23","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2025"],"loc":"2-99","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-22","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-76","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-20","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-87","stat":"489.119(3)(a)"}],"exp":"§489.119(3)(a): when a business loses its qualifier, DBPR may issue a temporary nonrenewable certificate so it can **finish incomplete contracts only**. It can't take new work until a new qualifier is approved, and the business has 60 days to replace the qualifier.","laws":[["Fla. Stat. § 489.119(3)(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.119.html"]],"plain":"Lose your qualifier and a temporary certificate lets you finish jobs in progress only. No new work.","look":"Qualifying Agent – Loss of (§489.119)","ref":["Florida Contractors Manual  ·  2025: 2-23, 2-99, 489.119(3)(a)","2021: 2-22, 2-76, 489.119(3)(a)","2017: 2-20, 2-87, 489.119(3)(a)"],"lock":1},{"id":"2-47","exam":2,"num":47,"stem":"At least _________ days before the end of a licensure cycle, the department shall forward a licensure renewal notification to an active or inactive licensee at the licensee's last known address of record or email address provided to the department.","options":["60","30","90","120"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.273(1)"}],"exp":"§455.273: DBPR sends the renewal notice at least **90 days** before the licensure cycle ends.","laws":[["Fla. Stat. § 455.273(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.273.html"]],"plain":"The state sends your renewal notice at least 90 days before the license expires.","look":"Renewal Notification (§455.273)","ref":["Florida Statute 455  ·  455.273(1)"],"lock":1},{"id":"2-48","exam":2,"num":48,"stem":"Which of the following are not considered taxable wages and are not included when calculating unemployment benefits paid by an employer?","options":["Wages paid to employees working at a convention","Excess employee discounts","Cash value of automobiles for personal use","Bonuses based on performance"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-261"},{"book":"FCM","eds":["2025"],"loc":"5-266"},{"book":"FCM","eds":["2021"],"loc":"5-284"},{"book":"FCM","eds":["2021"],"loc":"5-289"},{"book":"FCM","eds":["2017"],"loc":"5-279"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"Per the reemployment tax material in the manual, **wages paid to employees working at a convention** are not taxable wages for unemployment purposes. Discounts, personal use of a company car and bonuses are taxable.","plain":"Pay for working a convention isn't counted as taxable wages for unemployment.","look":"Reemployment Tax – Taxable Wages","ref":["Florida Contractors Manual  ·  2025: 5-261, 5-266","2021: 5-284, 5-289","2017: 5-279, 5-292"]},{"id":"2-49","exam":2,"num":49,"stem":"What is the distinction between a work-related injury and an illness?","options":["An injury requires immediate medical attention","An illness does not require entry on OSHA logs","They are considered the same for the purpose of OSHA reporting","Illnesses do not result from instantaneous events"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-20"}],"exp":"An injury comes from a single instantaneous event (a cut, a fall). An **illness does not come from an instantaneous event**. It develops from exposure, like hearing loss or a respiratory condition.","plain":"An injury happens in an instant (a cut, a fall). An illness builds up over time (hearing loss, lungs).","look":"OSHA – Injury vs. Illness","ref":["Florida Contractors Manual  ·  7-20"]},{"id":"2-50","exam":2,"num":50,"stem":"____________ methods are used for inventory control.","options":["First in, first out","First in, discount last","Last in, first out","Both A & C"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"120"}],"exp":"The two inventory control methods are **FIFO (first in, first out) and LIFO (last in, first out)**.","plain":"Inventory is tracked FIFO (first in, first out) or LIFO (last in, first out).","look":"Inventory – FIFO / LIFO","ref":["Builders Guide to Accounting  ·  Pg. 120"],"lock":1},{"id":"2-51","exam":2,"num":51,"stem":"___________ is used to report and pay monthly sales tax collected.","options":["DR 15-CS Sales and Use Tax Report","DR-405 Tangible Personal Property Tax Report","ST 10- TX Sales Tax Report","Corporate Quarterly Sales Tax Report"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-27"},{"book":"FCM","eds":["2017"],"loc":"1-23"}],"exp":"Florida sales tax collected is reported and paid on the **DR-15 Sales and Use Tax Return**. DR-405 is the tangible personal property tax return.","laws":[["Fla. Stat. § 212.11","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0200-0299/0212/Sections/0212.11.html"]],"plain":"Monthly Florida sales tax goes on form DR-15.","look":"Forms – DR-15","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-27","2017: 1-23"]},{"id":"2-52","exam":2,"num":52,"stem":"Compounded interest is __________.","options":["Computed monthly and added to the principal","Computed annually and added to the principal","Computed monthly and subtracted from the principal","Computed monthly and credited towards the principal"],"answer":0,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-74"}],"exp":"Compound interest is **calculated each period (e.g. monthly) and added to the principal**, so later interest is charged on earlier interest too.","plain":"Compound interest is figured each period and added to the balance, so you pay interest on interest.","look":"Interest – Compound","ref":["Florida Contractors Manual  ·  3-74"]},{"id":"2-53","exam":2,"num":53,"stem":"Which of the following is not true regarding an Employer-Multi-unit Report?","options":["It is required if an employer conducts business in more than one location in Florida","It is filed on a quarterly basis","It is mailed separately from the Employers Quarterly Report","It is mailed with the Employer's Quarterly Report"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-267"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"The Multiple Worksite Report is required for multiple Florida locations and is filed quarterly, but it's **mailed separately** from the Employer's Quarterly Report (RT-6). \"Mailed with\" is the false statement.","plain":"The multiple worksite report is quarterly but mailed separately from the RT-6. \"Mailed with\" is the false one.","look":"Forms – Multiple Worksite Report","ref":["Florida Contractors Manual  ·  2025: 5-267","2021: 5-290","2017: 5-292"]},{"id":"2-54","exam":2,"num":54,"stem":"When should a sling angle be kept at greater than 45 degrees?","options":["Only when lifting a 1000 pound or greater load","Only when using multiple slings to lift a load","Only when sling legs are at an angle of 60\" vertical","Whenever possible"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-90"}],"exp":"Sling angles below 45° greatly increase the stress on the sling legs. Keep the angle **above 45° whenever possible**.","laws":[["29 CFR § 1926.251","https://www.ecfr.gov/current/title-29/section-1926.251"]],"plain":"Keep sling angles over 45° whenever you can. Flatter angles overload the legs.","look":"Rigging – Sling Angles","ref":["Florida Contractors Manual  ·  7-90"]},{"id":"2-55","exam":2,"num":55,"stem":"__________ are typically not included in shop drawings.","options":["Plans","Manufacturer suggested pricing","Elevations","Diagrams"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"1.1.5"}],"exp":"Shop drawings show how the contractor will build or fabricate part of the work (drawings, diagrams, elevations, schedules). They **never include pricing**.","plain":"Shop drawings show how you'll build it. They never show prices.","look":"A201 – Shop Drawings","ref":["AIA Document A201, 2017  ·  1.1.5"]},{"id":"2-56","exam":2,"num":56,"stem":"The cost related to change orders includes all the following except __________.","options":["Rental cost of machinery","Cost of field office personnel","Cost to rent hand tools","All the costs above may be included in a change order"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.3.4"}],"exp":"A201 §7.3.4: change costs may include rental of machinery and equipment and field office personnel, **but not hand tools**.","plain":"Hand tools never go in a change order.","look":"A201 7.3 – Change Costs","ref":["AIA Document A201, 2017  ·  7.3.4"],"lock":1},{"id":"2-57","exam":2,"num":57,"stem":"The bidder by making a bid represents all the following except ____________.","options":["The bidder has visited the site","The bidder has read and understands all the contract documents","The bid includes materials he believes will result in a lower build cost","The bidder is familiar with local conditions"],"answer":2,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"2.1.1"},{"book":"A701","eds":null,"loc":"2.1.4"}],"exp":"A701 §2.1: the bidder represents that it visited the site, knows local conditions, read the documents, and based the bid on the **specified** materials. Substituting materials it thinks would be cheaper isn't one of the representations.","plain":"You bid the materials that were specified, not cheaper ones you'd rather use.","look":"A701 Art. 2 – Bidder's Representations","ref":["AIA Document A701, 2018  ·  2.1.1-2.1.4"]},{"id":"2-58","exam":2,"num":58,"stem":"__________ are the two ratios most significant in analyzing overhead.","options":["Variables Overhead Expense to Sales and Variable Overhead to Receivables","Fixed Overhead to Sales and Variable Overhead to Profit","Variable Overhead Expense to Sales and Fixed Overhead to Sales","Variable Overhead to Fixed Overhead and Fixed Overhead Receivables"],"answer":2,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"147"},{"book":"BGA","eds":null,"loc":"243"}],"exp":"Overhead is analyzed with two ratios: **variable overhead to sales and fixed overhead to sales**.","plain":"Check overhead two ways: variable overhead to sales, and fixed overhead to sales.","look":"Overhead – Ratios","ref":["Builders Guide to Accounting  ·  147, 243"]},{"id":"2-59","exam":2,"num":59,"stem":"What is the difference between the Accrual and Cash accounting methods?","options":["Only the cash method includes accounts receivables","The cash method is more accurate","The cash method only records transactions when money changes hands","These are the same methods referred to by either name"],"answer":2,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"32"}],"exp":"The **cash method** records transactions only **when money changes hands**. The accrual method records revenue when earned and expenses when incurred.","plain":"Cash method: you record it only when money actually moves.","look":"Cash vs. Accrual Method","ref":["Builders Guide to Accounting  ·  32"]},{"id":"2-60","exam":2,"num":60,"stem":"The board, by rule, may establish delinquency fees for late renewal not to exceed ____.","options":["$25","$50","$100","the applicable renewal fee for renewal applications made after the expiration date of the certificate or registration"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-85","stat":"489.109(c)"},{"book":"FCM","eds":["2021"],"loc":"2-67","stat":"489.109(c)"},{"book":"FCM","eds":["2017"],"loc":"2-75","stat":"489.109(c)"}],"exp":"§489.109: delinquency fees for late renewal can't exceed **the renewal fee** for renewals made after the certificate expires.","laws":[["Fla. Stat. § 489.109(c)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.109.html"]],"plain":"The late renewal fee can't be more than the renewal fee itself.","look":"Licensing – Fees (§489.109)","ref":["Florida Contractors Manual  ·  2025: 2-85, 489.109(c)","2021: 2-67, 489.109(c)","2017: 2-75, 489.109(c)"]},{"id":"2-61","exam":2,"num":61,"stem":"The purpose of the Management Privatization Act is to __________.","options":["Establish a system for the protection of employee's private information","Provide a corporate veil of protections for corporate managers","Outsource management activities to private organizations","Create a model for contracting with nonprofit organizations"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.32(2)"}],"exp":"§455.32, the Management Privatization Act, **creates a model for DBPR to contract with nonprofit organizations** to handle administrative, investigative and exam services.","laws":[["Fla. Stat. § 455.32(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.32.html"]],"plain":"That law lets DBPR hire a nonprofit to handle paperwork and exams.","look":"Management Privatization Act (§455.32)","ref":["Florida Statute 455  ·  455.32(2)"]},{"id":"2-62","exam":2,"num":62,"stem":"A __________ insurance form provides coverage for theft of property insurance.","options":["Special form","Broad form","Loss form","Theft rider form"],"answer":0,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-6"}],"exp":"A **Special Form** (all-risk) property policy covers theft. Basic and broad forms only cover named perils.","plain":"Special form (all-risk) insurance covers theft. Basic and broad forms don't.","look":"Insurance – Special Form","ref":["Florida Contractors Manual  ·  4-6"]},{"id":"2-63","exam":2,"num":63,"stem":"The duties of making sure results do not differ from those originally planned is an example of a ______________responsibility of the business manager.","options":["directing","controlling","assigning","standardizing"],"answer":1,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-20"},{"book":"FCM","eds":["2017"],"loc":"1-10"}],"exp":"Making sure actual results don't drift from what was planned is the **controlling** function of management. Planning, organizing and directing are the other functions.","plain":"Keeping results on plan is the \"controlling\" part of a manager's job.","look":"Management – Controlling","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-20","2017: 1-10"]},{"id":"2-64","exam":2,"num":64,"stem":"At what rate will an employer be billed for an outstanding re-employment tax obligation and after what time period of delinquency?","options":["5.65 % at 30 days late","5.40 % after one year late","6.25% after 90 days late","5% after one year late"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-273"},{"book":"FCM","eds":["2021"],"loc":"5-294"},{"book":"FCM","eds":["2017"],"loc":"5-297"}],"exp":"Per the manual's reemployment tax section, an employer delinquent **for more than one year** is billed at **5.40%**, the maximum rate.","plain":"Over a year behind on unemployment tax? You get billed at 5.4%, the top rate.","look":"Reemployment Tax – Delinquent","ref":["Florida Contractors Manual  ·  2025: 5-273","2021: 5-294","2017: 5-297"]},{"id":"2-65","exam":2,"num":65,"stem":"Employers must display OSHA posters __________.","options":["In the employee breakroom","At the location where employees report to work","In plain view of OSHA inspectors","At each location if multiple locations exist"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-6"}],"exp":"OSHA posters must be displayed **at each location** where employees report, so multiple locations need multiple posters.","laws":[["29 CFR § 1903.2","https://www.ecfr.gov/current/title-29/section-1903.2"]],"plain":"Put up OSHA posters at every location where people work.","look":"OSHA – Posters","ref":["Florida Contractors Manual  ·  7-6"]},{"id":"2-66","exam":2,"num":66,"stem":"The purpose of preparing an Income Statement is __________.","options":["To borrow construction funds or secure personal credit","To divide information into various categories to prepare the inventory flow statement","To show revenues, expenses, and net income for a particular period of time","To predict debts over a specific time period"],"answer":2,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"The income statement shows **revenues, expenses and net income for a period of time**. The balance sheet is a point-in-time snapshot.","plain":"The income statement shows money in, money out and profit over a period of time.","look":"Income Statement","ref":["Florida Contractors Manual  ·  3-108"]},{"id":"2-67","exam":2,"num":67,"stem":"What information do you not need to calculate the unit cost of equipment per hour?","options":["Repair and maintenance cost","OSHA productivity standards","Estimated life of equipment","Nonproductive hours of operation"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159-160"}],"exp":"Hourly equipment cost uses repair and maintenance cost, estimated life, and productive and non-productive hours. **OSHA productivity standards** have nothing to do with it.","plain":"An hourly equipment rate uses repairs, life and hours. \"OSHA productivity standards\" is made up.","look":"Equipment – Hourly Cost","ref":["Builders Guide to Accounting  ·  159-160"]},{"id":"2-68","exam":2,"num":68,"stem":"When a customer account is uncollectable how do you reflect the recorded income?","options":["No action is required until the customer files bankruptcy","File a lien and take them to court","Rebook the income as a special transaction","Reverse the income previously recorded"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"63"}],"exp":"When an account can't be collected, **reverse the income** you previously recorded by writing it off as bad debt.","plain":"Customer will never pay? Reverse (write off) the income you booked.","look":"Bad Debt – Write-off","ref":["Builders Guide to Accounting  ·  63"]},{"id":"2-69","exam":2,"num":69,"stem":"What must an owner do if a change of ownership occurs for an entity with a Fictitious Name?","options":["Advise the Department of Professional Regulations within 30 days of change","Establish a new Fictious Name within 45 days","Record a cancelation and registration of the name within 30 days of change","Advise the Department of Professional Regulations within 10 days of change"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"If ownership of a fictitious-name business changes, **cancel the old registration and register the name again within 30 days**.","laws":[["Fla. Stat. § 865.09","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0800-0899/0865/Sections/0865.09.html"]],"plain":"New owner of a DBA? Cancel and re-register it within 30 days.","look":"Fictitious Name – Change of Ownership","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14","2017: 1-15"]},{"id":"2-70","exam":2,"num":70,"stem":"An applicant must have at least __________ years' experience for a limited license.","options":["Ten","Five","Twenty","Fifteen"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"A limited license under §455.214 requires at least **10 years** of licensure.","laws":[["Fla. Stat. § 455.214(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.214.html"]],"plain":"A limited license needs 10 years of licensed experience.","look":"Limited Licenses (§455.214)","ref":["Florida Statute 455  ·  455.214(2)"]},{"id":"2-71","exam":2,"num":71,"stem":"Which of the following is not true regarding the requirement to notify the Board?","options":["Notification of address change must be made within 15 days","Notification of address change must be made within 30 days","Notification of termination of affiliation of a qualifying agent with a business organization within 30 days","Notification of any changes required on the application for qualification of a business organization within 45 days"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-173","stat":"61G4-15.007"},{"book":"FCM","eds":["2021"],"loc":"2-133","stat":"61G4-15.007"},{"book":"FCM","eds":["2017"],"loc":"2-159","stat":"61G4-15.007"}],"exp":"Per the answer key (61G4-15.007), **\"address change within 15 days\" is the statement that is NOT true**. The rule's notification deadlines quoted in the manual are 30 days and 45 days.","laws":[["Fla. Admin. Code R. 61G4-15.007","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-15.007"]],"plain":"The rule deadlines are 30 and 45 days. \"15 days\" is the wrong one.","look":"Licensing – Notices of Changes (61G4-15.007)","ref":["Florida Contractors Manual  ·  2025: 2-173, 61G4-15.007","2021: 2-133, 61G4-15.007","2017: 2-159, 61G4-15.007"]},{"id":"2-72","exam":2,"num":72,"stem":"When using Declining Balance depreciation what is depreciated on a 200 percent declining balance with a remaining balance of an average of four years?","options":["Light trucks","Machinery and equipment and small tools","Computers and office equipment","Residential property"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"166"}],"exp":"Per the Builder's Guide, the 200% declining balance class with an average 4-year remaining life covers **machinery, equipment and small tools**.","plain":"The 200% declining-balance class with a 4-year average life is machinery, equipment and small tools.","look":"Depreciation – Declining Balance","ref":["Builders Guide to Accounting  ·  166"]},{"id":"2-73","exam":2,"num":73,"stem":"When a contractor performs three categories of work how many qualifying agents are required?","options":["Only one qualifying agent is required per business","Three, one for each category of work","Two, one for the core business and one for the total of work categories","Four, one for the core business and one for each of the work categories"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-23","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2025"],"loc":"2-99","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-22","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-76","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-20","stat":"489.119(3)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-87","stat":"489.119(3)(a)"}],"exp":"Per the manual's reading of §489.119, a business performing work in three license categories needs **a qualifying agent for each category, so three**.","laws":[["Fla. Stat. § 489.119(3)(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.119.html"]],"plain":"Three categories of work means three qualifiers, one per category.","look":"Qualifying Agent (§489.119)","ref":["Florida Contractors Manual  ·  2025: 2-23, 2-99, 489.119(3)(a)","2021: 2-22, 2-76, 489.119(3)(a)","2017: 2-20, 2-87, 489.119(3)(a)"]},{"id":"2-74","exam":2,"num":74,"stem":"The purpose of the subsidiary ledger is to __________.","options":["Track all subsidized income sources","Keep the main ledger uncluttered and provide useful information","Track expenses that are billed","Track back ordered inventory"],"answer":1,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-45"}],"exp":"Subsidiary ledgers (accounts receivable, accounts payable, job cost) hold the detail so the **general ledger stays uncluttered** but the information is still available.","plain":"Subsidiary ledgers hold the details so the main ledger stays clean.","look":"Subsidiary Ledger","ref":["Florida Contractors Manual  ·  3-45"]},{"id":"2-75","exam":2,"num":75,"stem":"When selling an item to a company that is not tax exempt for $200 and the sales tax rate is 7% what will be reflected on the journal?","options":["Two separate credit entries, one of $200 and the other for $14.00","One credit entry of $214.00","One credit entry of $200 and one debit entry of $14.00","Two separate debit entries of $200 and $14.00"],"answer":0,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-64"}],"exp":"A $200 taxable sale at 7%: debit cash or accounts receivable $214. Then **two credits: Sales $200 and Sales Tax Payable $14**. The tax is a liability you owe the state, not revenue.","plain":"A $200 sale with $14 tax: credit Sales $200 and credit Sales Tax Payable $14. Two credits.","look":"Sales Tax – Journal Entry","ref":["Florida Contractors Manual  ·  3-64"]},{"id":"2-76","exam":2,"num":76,"stem":"Which of the following are eligible for limited licenses?","options":["Limited licenses may be granted to out of state contractors after a hurricane","There is no provision for the issuance of limited licenses","Limited licenses may only be obtained by specialty contractors","Limited licenses may be granted to retired professionals in good standing to serve the indigent and underserved"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(1)"}],"exp":"§455.214: limited licenses go to **retired professionals in good standing who will serve indigent and underserved** populations.","laws":[["Fla. Stat. § 455.214(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.214.html"]],"plain":"Limited licenses are for retired pros serving people who can't afford it.","look":"Limited Licenses (§455.214)","ref":["Florida Statute 455  ·  455.214(1)"]},{"id":"2-77","exam":2,"num":77,"stem":"If a contractor makes a false statement of insurance coverage, and this is his third offense, the minimum punishment is ________________________.","options":["$2,500 fine","$2,500 fine and/or probation or suspension","$5,000 fine","$5,000 fine and/or probation or suspension"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-205","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2021"],"loc":"2-160","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2017"],"loc":"2-186","stat":"61G4-17.001(k)2."},{"book":"FCM","eds":["2017"],"loc":"2-187","stat":"61G4-17.001(k)2."}],"exp":"61G4-17.001: a **third** offense of falsely stating insurance coverage carries a minimum penalty of a **$5,000 fine and/or probation or suspension**.","laws":[["Fla. Admin. Code R. 61G4-17.001(k)2","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-17.001"]],"plain":"Third time lying about insurance: $5,000 fine and/or probation or suspension.","look":"Penalties – False Insurance Statement (61G4-17)","ref":["Florida Contractors Manual  ·  2025: 2-205, 61G4-17.001(k)2.","2021: 2-160, 61G4-17.001(k)2.","2017: 2-186, 2-187, 61G4-17.001(k)2."]},{"id":"2-78","exam":2,"num":78,"stem":"When the Department designates mediation for a licensee, how many days following resolution of the complaint by the complainant and the licensee must the mediator be advised of the resolution?","options":["14 days after contact by the mediator","21 days after contact by the mediator","30 days after contact by the mediator","60 days after contact by the mediator"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2235(2)"}],"exp":"§455.2235(2): when a complaint is resolved through DBPR-designated mediation, the parties must tell the mediator within **14 days** after the mediator contacts them.","laws":[["Fla. Stat. § 455.2235(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2235.html"]],"plain":"Settled it in mediation? Tell the mediator within 14 days of being contacted.","look":"Mediation (§455.2235)","ref":["Florida Statute 455  ·  455.2235(2)"]},{"id":"2-79","exam":2,"num":79,"stem":"Proper inventory control planning can do which of the following?","options":["Increase accounts receivables","Increase volume of work","Allow multiple jobs of different scope","Eliminate unneeded working capital expenditures"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"119"}],"exp":"Good inventory control planning **eliminates unneeded working capital spending**, so cash isn't tied up in stock.","plain":"Good inventory planning keeps cash from getting stuck in stock you don't need.","look":"Inventory Control","ref":["Builders Guide to Accounting  ·  119"]},{"id":"2-80","exam":2,"num":80,"stem":"Which of the following is not true concerning a S Corporation?","options":["They have multiple classes of stock","20% or more of revenue must be domestically generated","Only estates or individual can be shareholders","It must be a domestic entity"],"answer":0,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-11"},{"book":"FCM","eds":["2025"],"loc":"1-12"},{"book":"FCM","eds":["2021"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"An S corporation can have **only one class of stock**, so \"multiple classes of stock\" is false. It must also be domestic and have limited, eligible shareholders.","plain":"An S corp can only have one class of stock. \"Multiple classes\" is the false one.","look":"S Corporation","ref":["Florida Contractors Manual  ·  2025: 1-11, 1-12","2021: 1-12","2017: 1-13"]},{"id":"2-81","exam":2,"num":81,"stem":"For what period must examination scores for each applicant be maintained by the Department?","options":["No less than three years immediately following the examination","No less than two years immediately following the examination","No less than one year immediately following the examination","No less than five years immediately following the examination"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.217(4)"}],"exp":"§455.217(4): DBPR keeps each applicant's exam scores for at least **2 years** after the exam.","laws":[["Fla. Stat. § 455.217(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.217.html"]],"plain":"The state keeps exam scores 2 years.","look":"Examinations (§455.217)","ref":["Florida Statute 455  ·  455.217(4)"]},{"id":"2-82","exam":2,"num":82,"stem":"___________ is the purpose of the accrual accounting method.","options":["To record revenue when earned","To record expense when incurred","To track the timely payment of accounts receivables","Both A and B"],"answer":3,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-17"}],"exp":"The accrual method **records revenue when earned and expenses when incurred**, whether or not cash has moved. Both A and B.","plain":"Accrual records income when you earn it and expenses when you incur them. Both.","look":"Accrual Method","ref":["Florida Contractors Manual  ·  3-17"],"lock":1},{"id":"2-83","exam":2,"num":83,"stem":"Who assumes responsibility for the accuracy of the shop drawings and samples once submitted by the contractor to the architect for review?","options":["The architect","Review by the architect does not release the contractor from the responsibility","Both the contractor and architect since they have both reviewed the submissions","The owner as well as his contractor and architect since they all have reviewed the submissions"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"4.2.7"}],"exp":"A201 §4.2.7: the Architect's review of shop drawings and samples **doesn't relieve the Contractor** of responsibility for their accuracy.","plain":"The architect checking your shop drawings doesn't take the responsibility off you.","look":"A201 4.2.7 – Shop Drawing Review","ref":["AIA Document A201, 2017  ·  4.2.7"]},{"id":"2-84","exam":2,"num":84,"stem":"__________ are all types of assets.","options":["Fixed, current and tangible","Fixed, intangible and current","Fixed, variable, tangible","Fixed, variable and current"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"252-253"}],"exp":"The asset types are **fixed, intangible and current**. \"Variable\" describes expenses, not assets.","plain":"The asset types are fixed, intangible and current. \"Variable\" is for expenses.","look":"Assets – Types","ref":["Builders Guide to Accounting  ·  252-253"]},{"id":"2-85","exam":2,"num":85,"stem":"__________ is the act of setting up a piece of equipment on your general ledger.","options":["Establishing the depreciation schedule","Establishing the amortization schedule","Converting a long-term asset to a current asset","Capitalizing the expense"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"155"}],"exp":"**Capitalizing the expense** means putting equipment on the books as a fixed asset instead of expensing it, and then depreciating it.","plain":"Putting equipment on the books as an asset is called capitalizing it.","look":"Capitalizing Equipment","ref":["Builders Guide to Accounting  ·  155"]},{"id":"2-86","exam":2,"num":86,"stem":"__________ overhead costs vary related to sales volume.","options":["Commission","Advertising","Phone Service","Utilities"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"141"}],"exp":"**Commissions** go up and down with sales volume. Advertising, phone and utilities are relatively fixed.","plain":"Commissions go up and down with sales.","look":"Overhead – Variable","ref":["Builders Guide to Accounting  ·  141"]},{"id":"2-87","exam":2,"num":87,"stem":"Which of the following are advantages of Corporations?","options":["They are closely regulated","Stockholders are not exempt from liability","They are taxed only once","Fringe benefits are tax deducible"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-11"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A corporate advantage: **fringe benefits are tax-deductible** to the corporation. Heavy regulation and double taxation are disadvantages, and stockholders do have limited liability.","plain":"Corporations can deduct fringe benefits. That's an advantage.","look":"Corporations – Advantages","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-11","2017: 1-13"]},{"id":"2-88","exam":2,"num":88,"stem":"In what time period must the Department issue a citation after the filing of a complaint against a licensee?","options":["Thirty days","Two months","One year","Six months"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.224(4)"}],"exp":"§455.224(4): a citation must be issued within **6 months** after the complaint is filed.","laws":[["Fla. Stat. § 455.224(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.224.html"]],"plain":"The state has 6 months from the complaint to issue a citation.","look":"Citations (§455.224)","ref":["Florida Statute 455  ·  455.224(4)"]},{"id":"2-89","exam":2,"num":89,"stem":"What can a high inventory ratio indicate about your business?","options":["You practice First In, First Out inventory controls","Your inventory is too low and could adversely affect sales","Your average inventory is too high","You inventory levels are higher than those of your competitors"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"A high inventory turnover ratio means inventory is moving fast and may be **too low**, so you could run short and lose sales.","plain":"A high inventory turnover ratio means your stock may be running low.","look":"Inventory Ratio","tip":"High ratio = low inventory.","ref":["Builders Guide to Accounting  ·  121"]},{"id":"2-90","exam":2,"num":90,"stem":"Which of the following accounting methods is used to allocate costs and expenses incurred to a project to determine if the budget is met?","options":["Project cost method","Accrual method","Cost accounting","Cash flow analysis method"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-65"},{"book":"FCM","eds":null,"loc":"3-106"}],"exp":"**Cost accounting** assigns costs and expenses to each project so you can compare actual costs with the budget.","plain":"Cost accounting tracks every cost to each job so you can compare it to the budget.","look":"Cost Accounting","ref":["Florida Contractors Manual  ·  3-65, 3-106"]},{"id":"2-91","exam":2,"num":91,"stem":"Who prepares and signs all change orders?","options":["Only the architect is required to prepare and sign change orders","The architect prepares and the owner signs off on the change","The architect prepares and signs and then the owner and contractor sign","The contractor prepares and the owner and architect sign"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: the **Architect prepares and signs the change order, then the Owner and Contractor sign** it.","plain":"The architect prepares and signs the change order, then the owner and contractor sign.","look":"A201 7.2 – Change Orders","ref":["AIA Document A201, 2017  ·  7.2.1"]},{"id":"2-92","exam":2,"num":92,"stem":"Which of the following steps are included in the preparation of a company's payroll?","options":["Determining each employees' gross earnings","Determining each employee's deductions","Calculating the employer's associated payroll expenses","All the above"],"answer":3,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-47"},{"book":"FCM","eds":null,"loc":"3-48"}],"exp":"Payroll preparation includes figuring each employee's gross pay, each employee's deductions, and the employer's own payroll expenses. **All of the above**.","plain":"Payroll is gross pay, deductions and the employer's share. All of it.","look":"Payroll – Preparation","ref":["Florida Contractors Manual  ·  3-47, 3-48"],"lock":1},{"id":"2-93","exam":2,"num":93,"stem":"When is it a good idea to remove a fully depreciated asset from your book?","options":["At the end of its economic life","When you can afford to buy additional but not replacement equipment","Only when the equipment is sold, abandoned or traded","When you have exhausted all tax credits"],"answer":2,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"170"}],"exp":"Keep a fully depreciated asset on the books **until it's sold, abandoned or traded**.","plain":"Keep a fully depreciated asset on the books until you sell it, scrap it or trade it.","look":"Fixed Assets – Disposal","ref":["Builders Guide to Accounting  ·  170"]},{"id":"2-94","exam":2,"num":94,"stem":"The Department can __________ with the $5.00 fee that is included in the current licensee fee.","options":["Educate the public regarding unlicensed activity","Transfer the funds to the State of Florida's general budget account","Subsidize the application fee for applicants from the indigent community","Reimburse the public when damaged by unlicensed workers"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2281"}],"exp":"§455.2281: the $5 unlicensed activity fee pays for **educating the public about unlicensed activity** and for enforcement against it.","laws":[["Fla. Stat. § 455.2281","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2281.html"]],"plain":"The $5 fee pays for fighting unlicensed activity and warning the public about it.","look":"Unlicensed Activity Fee (§455.2281)","ref":["Florida Statute 455  ·  455.2281"]},{"id":"2-95","exam":2,"num":95,"stem":"Which of the following is true about depreciation?","options":["It only applies to property that appreciates in value","You cannot depreciate intangible property","You may change the method by which you calculate depreciation with your Accountant's written explanation to the IRS","Obsolescence is of no consequence when determining how to depreciate assets"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"162"}],"exp":"Per the Builder's Guide, **intangible property can't be depreciated** (it is amortized instead). Changing depreciation methods requires IRS approval.","plain":"You can't depreciate intangible property.","look":"Depreciation","ref":["Builders Guide to Accounting  ·  162"]},{"id":"2-96","exam":2,"num":96,"stem":"How many days prior to the date established for payment shall the contractor submit a request for payment and to whom?","options":["14 days submitting to the owner for payment","14 days submitting to the architect","10 days submitting to the owner for payment","10 days submitting to the architect for payment"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.3.1"}],"exp":"A201 §9.3.1: submit the Application for Payment **10 days** before the payment date, **to the Architect**.","plain":"Pay app: 10 days before payday, to the architect.","look":"A201 9.3 – Applications for Payment","ref":["AIA Document A201, 2017  ·  9.3.1"]},{"id":"2-97","exam":2,"num":97,"stem":"Which of the following are reasons to maintain employee timecards?","options":["Employees can use them to file their taxes with the IRS","Can be used in unemployment disputes","They can be used to calculate annual bonus amounts","The IRS requires they be kept for 5 years"],"answer":1,"topic":"tax","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"127"}],"exp":"Timecards prove hours worked, so they're useful evidence in **unemployment claims and disputes**.","plain":"Timecards prove hours, so they help in unemployment disputes.","look":"Timecards","ref":["Builders Guide to Accounting  ·  127"]},{"id":"2-98","exam":2,"num":98,"stem":"How long is a Fictious Name valid for and when do they expire?","options":["3 years and expire on December 31st of the third year","5 years and expire on December 31st of the fifth year","10 years and expire on the anniversary date of filing","They never expire nor need renewing if the entity remains active"],"answer":1,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-15"},{"book":"FCM","eds":["2021"],"loc":"1-15"},{"book":"FCM","eds":["2017"],"loc":"1-14"}],"exp":"A fictitious name registration is valid **5 years and expires December 31 of the fifth year**.","laws":[["Fla. Stat. § 865.09","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0800-0899/0865/Sections/0865.09.html"]],"plain":"A DBA is good for 5 years and expires December 31 of year five.","look":"Fictitious Name","ref":["Florida Contractors Manual  ·  2025: 1-15","2021: 1-15","2017: 1-14"]},{"id":"2-99","exam":2,"num":99,"stem":"Which one of the following is not accomplished through good inventory controls?","options":["Reduces the need for storage","Reduces taxes and insurance and other costs","Reduces exposure of materials to theft","Reduces the need to backorder inventory"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"Good inventory control reduces storage, carrying costs (taxes, insurance) and theft exposure. **Reducing the need to backorder is not** one of its results.","plain":"Good inventory control cuts storage, carrying costs and theft. It doesn't stop backorders.","look":"Inventory Control","ref":["Builders Guide to Accounting  ·  121"]},{"id":"2-100","exam":2,"num":100,"stem":"The current ratio is calculated by __________.","options":["Adding cash and accounts receivable and dividing by liabilities","Dividing current liabilities by current assets","Dividing current assets by current liabilities","Comparing the total loan debt to current income"],"answer":2,"topic":"ratio","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-89"}],"exp":"Current ratio = **current assets ÷ current liabilities**.","plain":"Current ratio = current assets ÷ current liabilities.","look":"Current Ratio","ref":["Florida Contractors Manual  ·  3-89"]},{"id":"2-101","exam":2,"num":101,"stem":"The __________ lists all checks cashed and who cashed them.","options":["Cash Register","Check Ledger","Check Register","Subsidiary Ledger"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"101"}],"exp":"The **check register** lists every check written, who it was paid to and the amount.","plain":"The check register lists every check and who it went to.","look":"Check Register","ref":["Builders Guide to Accounting  ·  101"]},{"id":"2-102","exam":2,"num":102,"stem":"__________ are the minimum levels of coverage of public liability and property damage insurance General Contractors must carry.","options":["$100,000 liability and $25,000 property damage","$500,000 liability and $100,000 property damage","$300,000 liability and $50,000 property damage","$150,000 liability and $50,000 property damages"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2025"],"loc":"2-172","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-16","stat":"61G4-15.003"},{"book":"FCM","eds":["2021"],"loc":"2-131","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-19","stat":"61G4-15.003"},{"book":"FCM","eds":["2017"],"loc":"2-157","stat":"61G4-15.003"}],"exp":"61G4-15.003: general, building and residential contractors need **$300,000 public liability and $50,000 property damage** coverage.","laws":[["Fla. Admin. Code R. 61G4-15.003","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-15.003"]],"plain":"GCs carry $300,000 liability and $50,000 property damage.","look":"Licensing – Public Liability Insurance (61G4-15.003)","ref":["Florida Contractors Manual  ·  2025: 2-16, 2-172, 61G4-15.003","2021: 2-16, 2-131, 61G4-15.003","2017: 2-19, 2-157, 61G4-15.003"]},{"id":"2-103","exam":2,"num":103,"stem":"OSHA records are to be located __________ when employees are not associated with a fixed establishment.","options":["At the nearest fixed location","At field offices or mobile base operation locations","At the corporate office","Where the employees report to work each day"],"answer":1,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-15"}],"exp":"When employees don't work at a fixed establishment, keep OSHA records **at the field office or mobile base of operations**.","laws":[["29 CFR § 1904.30","https://www.ecfr.gov/current/title-29/section-1904.30"]],"plain":"Crew doesn't work from a fixed spot? Keep OSHA records at the field office or mobile base.","look":"OSHA – Recordkeeping Location","ref":["Florida Contractors Manual  ·  7-15"]},{"id":"2-104","exam":2,"num":104,"stem":"Which of the following are not required recordable injuries?","options":["Injuries requiring first aid treatment only","Removing foreign items from the eye with tweezers","Use of prescription medications","Application of bandages by medical personnel"],"answer":0,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-22"},{"book":"FCM","eds":null,"loc":"7-23"},{"book":"FCM","eds":null,"loc":"7-24"}],"exp":"**First-aid-only** injuries aren't recordable (bandages, tweezer removal of objects from the eye, non-prescription medicine at non-prescription strength). Prescription medication makes a case recordable.","laws":[["29 CFR § 1904.7","https://www.ecfr.gov/current/title-29/section-1904.7"]],"plain":"First aid only (band-aids, tweezers for an eye splinter) isn't recordable. A prescription is.","look":"OSHA – Recordable Injuries","ref":["Florida Contractors Manual  ·  7-22, 7-23, 7-24"]},{"id":"2-105","exam":2,"num":105,"stem":"Which of the following are not the owner's responsibility to pay?","options":["Easements","Use or occupancy of permanent structures","Permits and fees assigned to the contractor under the contract documents","Permanent changes to existing facilities"],"answer":2,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.3"}],"exp":"A201 §2.3: the Owner pays for easements, zoning approvals, permanent structures and permanent changes to facilities. **Permits and fees the contract assigns to the Contractor** are the Contractor's cost.","plain":"Permits the contract assigns to the contractor are the contractor's to pay.","look":"A201 2.3 – Owner's Responsibilities","ref":["AIA Document A201, 2017  ·  2.3"]},{"id":"2-106","exam":2,"num":106,"stem":"To whom and on what schedule shall bonds related to a bid be delivered by the bidder?","options":["To the architect no later than three days after contract execution","To the architect no later than five days after contract execution","To the owner no later than five days after contract execution","To the owner no later than three days after contract execution"],"answer":3,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.2"}],"exp":"A701 §7.2: bonds go **to the Owner within 3 days** after the contract is executed.","plain":"Bonds go to the owner within 3 days of signing.","look":"A701 Art. 7 – Bonds","ref":["AIA Document A701, 2018  ·  7.2"]},{"id":"2-107","exam":2,"num":107,"stem":"What is an example of an incentive discount offered to customers to pay open invoices?","options":["2% - 10- days, net 30","Never offer a discount and insist your customers pay the full price","10% off on all orders over $1,000","None of the above"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"**\"2% 10, net 30\"** is the classic incentive discount for paying open invoices early.","plain":"\"2% 10, net 30\" is the classic early-pay discount.","look":"Discounts","ref":["Builders Guide to Accounting  ·  59"],"lock":1},{"id":"2-108","exam":2,"num":108,"stem":"What penalty is imposed for failure or refusal of an employer or carrier to report any form or notice associated with a death as required by Chapter 440, Workers Compensation Laws?","options":["Fine not to exceed $1000","Fine not to exceed $1500","Fine not to exceed $500","Fine not to exceed $500 for the first failure and not to exceed $2000 for each subsequent failure"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"6-121","stat":"440.185(8)"},{"book":"FCM","eds":["2021"],"loc":"6-113","stat":"440.185(8)"},{"book":"FCM","eds":["2017"],"loc":"6-165","stat":"440.185(8)"}],"exp":"§440.185(8): an employer or carrier that fails to file required workers' comp reports or notices can be fined **up to $500 for each failure**.","laws":[["Fla. Stat. § 440.185(8)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.185.html"]],"plain":"Fail to file a comp report? Up to $500 for each one.","look":"Reports – Penalties (§440.185)","ref":["Florida Contractors Manual  ·  2025: 6-121. 440.185(8)","2021: 6-113, 440.185(8)","2017: 6-165, 440.185(8)"]},{"id":"2-109","exam":2,"num":109,"stem":"When preparing an estimate, __________ would be included as a fixed overhead expense.","options":["Equipment costs","Corporate office personnel payroll costs","Direct labor and payroll taxes","Material costs"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142"},{"book":"BGA","eds":null,"loc":"143"},{"book":"BGA","eds":null,"loc":"227"}],"exp":"**Corporate office personnel payroll** is a fixed overhead expense. Equipment, direct labor and materials are job costs.","plain":"Office staff payroll is fixed overhead.","look":"Overhead – Fixed","ref":["Builders Guide to Accounting  ·  142, 143 & 227"]},{"id":"2-110","exam":2,"num":110,"stem":"__________ is/are not components of a safety program.","options":["A policy statement regarding safety","Safety Rules","Workers' Compensation Guidelines","Employee Orientation program"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-36"},{"book":"FCM","eds":null,"loc":"7-37"},{"book":"FCM","eds":null,"loc":"7-38"},{"book":"FCM","eds":null,"loc":"7-39"}],"exp":"A safety program includes a safety policy statement, safety rules and employee orientation. **Workers' comp guidelines** aren't part of it.","plain":"A safety program has a policy, rules and orientation. Workers' comp guidelines aren't part of it.","look":"Safety Program","ref":["Florida Contractors Manual  ·  7-36, 7-37, 7-38, 7-39"]},{"id":"2-111","exam":2,"num":111,"stem":"Which of the following is not true regarding posting a Notice of Commencement?","options":["When a loan exists, it is the contractor's responsibly to post the notice","It may be posted no sooner than 90 days prior to the start of work at the site","The owner is obligated to post a copy at the site","The posted notice always needs to remain on site"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-12"},{"book":"FCM","eds":["2017"],"loc":"9-11"}],"exp":"The **Owner**, not the contractor, records the Notice of Commencement and posts a copy at the job site. \"When a loan exists, the contractor posts it\" is the false statement.","laws":[["Fla. Stat. § 713.13","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.13.html"]],"plain":"The owner records and posts the NOC, not the contractor.","look":"Notice of Commencement – Posting","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-12","2017: 9-11"]},{"id":"2-112","exam":2,"num":112,"stem":"__________ must be kept separate from other assets when calculating depreciation.","options":["Land","Office Furniture and Equipment","Truck and Autos","On site equipment"],"answer":0,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"162"}],"exp":"**Land** isn't depreciable, so it must be kept separate from depreciable assets such as buildings.","plain":"Land can't be depreciated, so keep it separate.","look":"Depreciation – Land","ref":["Builders Guide to Accounting  ·  162"]},{"id":"2-113","exam":2,"num":113,"stem":"Under what circumstance may a foreign trained professional be allowed to take the examination for construction licensing?","options":["If the applicant immigrated to the US for political reasons","If the applicant successfully completed an approved course prior to 1990","If the applicant immigrated to the US for political reason from a county located in the Western Hemisphere lacking diplomatic relations with the US","There is no special circumstance under which an applicant may take the exam and they must adhere to the same rules as all other applicants"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.218(a)"}],"exp":"§455.218: a foreign-trained professional may sit for the exam if they **immigrated for political reasons from a Western Hemisphere country that lacks diplomatic relations with the U.S.**","laws":[["Fla. Stat. § 455.218(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.218.html"]],"plain":"Someone who fled a Western Hemisphere country with no U.S. diplomatic ties (think Cuba) can sit for the exam.","look":"Foreign-Trained Professionals (§455.218)","ref":["Florida Statute 455  ·  455.218(a)"]},{"id":"2-114","exam":2,"num":114,"stem":"When should you provide an incentive discount to customers based on receivables?","options":["When they can refer you other business","When you want to increase sales","When you want them to pay their open invoice quickly","When they have an \"A\" credit rating"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"Incentive discounts on receivables are offered **to get customers to pay open invoices quickly**.","plain":"Offer a discount to get customers to pay quickly.","look":"Discounts – Receivables","ref":["Builders Guide to Accounting,  ·  59"]},{"id":"2-115","exam":2,"num":115,"stem":"When a subcontractor defaults on work in accordance with agreement with a contractor which of the following are allowable remedies for the contractor?","options":["The contactor may correct the default if the subcontractor has failed to do so within 10 days after the subcontractor received notice from the contractor","Architect may hire a new subcontractor if the subcontractor has failed to correct the default within 5 days after receipt of notice from the contractor","Contactor may correct the default if the subcontractor has failed to do so within 5 days after the subcontractor received notice from the contractor","Architect may hire a new subcontractor if the subcontractor has failed to correct the default within 10 days after receipt of notice from the contractor"],"answer":2,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"3.5"}],"exp":"A401 §3.5: if the Sub defaults and doesn't start correcting within **5 days** of the Contractor's notice, the **Contractor** may correct the work and charge the Sub. The architect plays no role in the subcontract.","plain":"Sub doesn't start fixing within 5 days of notice? The GC can fix it and bill the sub.","look":"A401 – Contractor's Remedies","tip":"A401 contractor vs. sub = 5 days. A201 owner vs. contractor = 10 days.","ref":["AIA Document A401, 2017  ·  3.5"]},{"id":"2-116","exam":2,"num":116,"stem":"The total maximum allowable penalty for an employer who committed a willful or repeated violation of OSHA regulations and failed to comply with OSHA mandated posting requirements is __________.","options":["$136,942","$148,431","$149,413","$177,454"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-31"}],"exp":"The answer depends on your manual's edition. **2025 FCM:** willful or repeated $161,323 + posting $16,131 = **$177,454**. 2021: $134,937 + $13,494 = $148,431. 2017: $124,471 + $12,471 = $136,942. Use the penalty table in the edition you'll bring to the exam.","plain":"Add the willful/repeat max and the posting max from YOUR edition's table. 2025 book: $161,323 + $16,131 = $177,454.","look":"OSHA – Civil Penalties","calc":1,"ref":["Florida Contractors Manual  ·  7-31","There are two different answers depending which edition of the book you have:","2025: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $161,323","Posting Requirements - $16,131","$161,323 + $16,131 = $177,454","[B] 2021: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $134,937","Posting Requirements - $13,494","$134,937 + $13,494 = $148,431","[A] 2017: Per the text, the OSHA civil penalties are as followed:","Willful or Repeated Violation - $124,471","Posting Requirements - $12,471","$124,471 + $12,471 = $136,942"],"lock":1,"edAns":{"2025":3,"2021":1,"2017":0}},{"id":"2-117","exam":2,"num":117,"stem":"Which of the following should be considered when deciding on the man-hour range to use when creating an estimate?","options":["Weather conditions","Time allowed for project completion","Skill and experience of the craftsman","All the above"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-30"}],"exp":"Man-hour ranges depend on weather, the time allowed for the project, and crew skill. **All of the above**.","plain":"Weather, schedule and crew skill all change man-hours. All three.","look":"Estimates – Man-Hours","ref":["Florida Contractors Manual  ·  10-30"],"lock":1},{"id":"2-118","exam":2,"num":118,"stem":"How many copies of the contract documents must the owner provide the contractor?","options":["Two signed originals and one copy","One signed original and one copy","One signed original and one copy","One"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.3.6"}],"exp":"A201 §2.3.6: the Owner furnishes **one copy** of the contract documents free of charge, for the Contractor to reproduce.","plain":"The owner gives you one free copy of the contract documents to reproduce.","look":"A201 2.3.6 – Copies of Documents","ref":["AIA Document A201, 2017  ·  2.3.6"]},{"id":"2-119","exam":2,"num":119,"stem":"The contractor will submit a certificate for payments within __________ days after the work is complete.","options":["7","10","3","None of the above"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.4.1"}],"exp":"A201 §9.4.1: the *Architect*, not the contractor, issues the Certificate for Payment, within 7 days of receiving the application. So **none of the above**.","plain":"The architect issues the certificate, not the contractor. \"None of the above.\"","look":"A201 9.4 – Certificates for Payment","ref":["AIA Document A201, 2017  ·  9.4.1"],"lock":1},{"id":"2-120","exam":2,"num":120,"stem":"Where and for what period must OSHA 300/300A and any supplementary reports be maintained by the employer?","options":["Retained in the corporate headquarters office for 5 calendar years following the end of the year to which they relate","Retained in the corporate headquarters office for 3 calendar years following the end of the year to which they relate","Retained in each establishment for 5 calendar years following the end of the year to which they relate","Retained in each establishment for 3 calendar years following the end of the year to which they relate"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-16"}],"exp":"OSHA 300, 300A and 301 records are kept **at each establishment for 5 years** after the end of the year they cover.","laws":[["29 CFR § 1904.33","https://www.ecfr.gov/current/title-29/section-1904.33"]],"plain":"Keep OSHA logs at each worksite for 5 years.","look":"OSHA – Retention of Records","ref":["Florida Contractors Manual  ·  7-16"]},{"id":"2-121","exam":2,"num":121,"stem":"Unless otherwise provided for in the contract documents, the contractor will pay for which of the following?","options":["It is the owner's responsibility to pay for all permits, not the contractor","Building permits, fees, inspections by the local building department","Only permits when issued in their name excluding work performed by contractors","Only building permits"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.7.1"}],"exp":"A201 §3.7.1: unless the contract says otherwise, the Contractor pays for **building permits, fees, licenses and government inspections**.","plain":"Unless the contract says otherwise, the contractor pays for permits, fees and inspections.","look":"A201 3.7 – Permits, Fees, Notices","ref":["AIA Document A201, 2017  ·  3.7.1"]},{"id":"2-122","exam":2,"num":122,"stem":"Which of the following does not affect the productivity rate of equipment?","options":["Experience of the operator","Overruns of Equipment","Climate and weather conditions","Permissible speeds"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"},{"book":"FCM","eds":null,"loc":"10-28"}],"exp":"Equipment productivity depends on operator experience, climate and weather, and permissible speeds. **\"Overruns of equipment\"** isn't a productivity factor.","plain":"Operator skill, weather and speed limits affect equipment output. \"Overruns\" is made up.","look":"Equipment – Productivity","ref":["Florida Contractors Manual  ·  10-27 & 10-28"]},{"id":"2-123","exam":2,"num":123,"stem":"Which of the following is not true regarding filing a Notice to Owner?","options":["Must be filed before commencing or no later than 45 days after completing work","Must be filed before the owner's disbursement of final payment","Must be filed before commencing or no later than 45 days after commencing work","Must be filed regardless of the method of payment by the owner"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-75"},{"book":"FCM","eds":["2021"],"loc":"9-72","stat":"713.06(2)(a)"},{"book":"FCM","eds":["2017"],"loc":"9-76","stat":"713.06(2)(a)"}],"exp":"§713.06(2)(a): a Notice to Owner is served before work starts, or **within 45 days of starting** work, not within 45 days of *completing* it. \"After completing\" is the false statement.","laws":[["Fla. Stat. § 713.06(2)(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.06.html"]],"plain":"NTO is due 45 days after you START work, not after you finish.","look":"Notice to Owner (§713.06)","tip":"NTO = 45 days from first furnishing.","ref":["Florida Contractors Manual  ·  2025: 9-75","2021: 9-72, 713.06(2)(a)","2017: 9-76 , 713.06(2)(a)"]},{"id":"2-124","exam":2,"num":124,"stem":"Which of the following must the contractor make available at the site?","options":["Change orders, product data and samples","Change orders, product data, samples and proof of liability coverage","Contract documents and proof of liability coverage","None of the above, these are the responsibility of the architect to make available"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"3.11"}],"exp":"A201 §3.11: the Contractor keeps at the site the drawings, specifications, addenda, **change orders**, approved shop drawings, **product data and samples**.","plain":"Keep the change orders, product data and samples at the jobsite.","look":"A201 3.11 – Documents and Samples at the Site","ref":["AIA Document A201, 2017  ·  3.11"],"lock":1},{"id":"2-125","exam":2,"num":125,"stem":"Real turnover is an example of a __________ ratio.","options":["Combined","Current","Accrual","Balanced"],"answer":0,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"270-271"}],"exp":"Real turnover (cost of sales ÷ inventory) mixes an income statement figure with a balance sheet figure, so it's a **combined** ratio.","plain":"Real turnover mixes income-statement and balance-sheet numbers, so it's a combined ratio.","look":"Financial Ratios – Combined","ref":["Builders Guide to Accounting  ·  270-271"]},{"id":"3-1","exam":3,"num":1,"stem":"How many days prior to the date established in a contract for progress payments shall a contractor submit to the architect application for payment?","options":["3","5","7","10"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"9.3.1"}],"exp":"A201 §9.3.1: the Application for Payment goes to the Architect at least **10 days** before the payment date.","plain":"Pay apps go to the architect 10 days before payday.","look":"A201 9.3 – Applications for Payment","ref":["AIA Document A201, 2017  ·  9.3.1"],"lock":1},{"id":"3-2","exam":3,"num":2,"stem":"Which is a method of improving cash flow?","options":["Maintain
