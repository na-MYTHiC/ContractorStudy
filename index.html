ing a high inventory","Taking advantage of discounts","Converting all cash sales to accounts receivable","Paying off liabilities"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"262"}],"exp":"**Taking advantage of discounts** improves cash flow. High inventory and turning cash sales into receivables tie cash up.","plain":"Taking early-pay discounts helps cash flow.","look":"Cash Flow – Controlling","ref":["Builder's Guide to Accounting  ·  262"],"dupes":["1-90"]},{"id":"3-3","exam":3,"num":3,"stem":"A subcontractor has a \"Standard Form of Agreement Between Contractor and Subcontractor\" with the prime contractor on a project. The ONLY way the subcontractor can assign work on the subcontract is with written __________.","options":["Consent of the owner or architect","Consent of the contractor","Notification to the owner or architect","Notification to the contractor"],"answer":1,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"7.4.2"}],"exp":"A401 §7.4.2: the Sub may assign the subcontract only with the **Contractor's written consent**.","plain":"A sub needs the GC's written OK to hand its contract to someone else.","look":"A401 Art. 7 – Assignment of the Subcontract","ref":["AIA Document A401, 2017  ·  7.4.2"],"dupes":["1-91"]},{"id":"3-4","exam":3,"num":4,"stem":"Who is eligible for Small Business Association loans?","options":["All building contractors in the Unites States","Only company presidents","Applicants who cannot obtain a loan from local banks","Applicants who are recommended by a local bank"],"answer":2,"topic":"org","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"318-319"}],"exp":"SBA loans are for **applicants who can't get a loan from local banks** on reasonable terms.","plain":"SBA loans are for people the local bank turned down.","look":"Small Business Administration Loans","ref":["Builder's Guide to Accounting  ·  318-319"]},{"id":"3-5","exam":3,"num":5,"stem":"When can a Notice of Commencement be extended past one year?","options":["If it is written into the Notice of Commencement","If the job proceeds past one year","When there is an architectural change order","Never"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-83","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2021"],"loc":"9-78","stat":"713.13(1)(c)"},{"book":"FCM","eds":["2017"],"loc":"9-88","stat":"713.13(1)(c)"}],"exp":"§713.13(1)(c): an NOC expires after 1 year **unless the notice states a different expiration date**.","laws":[["Fla. Stat. § 713.13(1)(c)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.13.html"]],"plain":"An NOC can go past a year if the NOC itself says so.","look":"Notice of Commencement (§713.13)","ref":["Florida Contractors Manual  ·  2025: 9-83: 713.13(1)(c)","2021: 9-78: 713.13(1)(c)","2017: 9-88: 713.13(1)(c)"],"dupes":["1-93"]},{"id":"3-6","exam":3,"num":6,"stem":"The bidder making a bid represents that he or she __________.","options":["Is familiar with local conditions under which the work is to be performed","Is making a bid contingent on standard codes and conditions","Will adjust accordingly if the bid is accepted if an addendum is made","Will provide specifications for all materials"],"answer":0,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"2.1.4"}],"exp":"A701 §2.1: by bidding, the bidder represents that it **is familiar with the local conditions** where the work will be done (and visited the site and read the documents).","plain":"By bidding you're saying you know the local conditions where you'll build.","look":"A701 Art. 2 – Bidder's Representations","ref":["AIA Document A701, 2018  ·  2.1.4"]},{"id":"3-7","exam":3,"num":7,"stem":"A contractor receives payment from the owner of a construction project. The contractor shall pay the subcontractor each progress payment within __________.","options":["3 working days","3 days (including Saturday and Sunday)","5 working days","7 working days"],"answer":3,"topic":"aia","books":["A401"],"cites":[{"book":"A401","eds":null,"loc":"11.3"}],"exp":"A401 §11.3 and A201 §9.6.2: pay the Sub within **7 working days** of receiving the Owner's payment.","plain":"GC gets paid, then pays the subs within 7 working days.","look":"A401 Art. 11 – Payments","ref":["AIA Document A401, 2017  ·  11.3"],"dupes":["1-95"]},{"id":"3-8","exam":3,"num":8,"stem":"Which is NOT a delay factor when determining production efficiency percentages?","options":["Accessibility of site","Financial incentives","Poorly trained personnel","Weather conditions"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-30"},{"book":"FCM","eds":null,"loc":"10-31"}],"exp":"Site access, poorly trained personnel and weather all slow production. **Financial incentives** aren't a delay factor (they usually raise productivity).","plain":"Site access, green crews and weather slow you down. Money incentives don't. They speed crews up.","look":"Production Efficiency – Delay Factors","ref":["Florida Contractors Manual  ·  10-30, 10-31"]},{"id":"3-9","exam":3,"num":9,"stem":"When a piece of equipment is sold, why is it necessary to book the transaction separate from regular sales?","options":["It is treated as a variable expense","It receives different tax treatment","The transaction is not taxable","Gains or losses must be used to adjust gross profits"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"170"}],"exp":"Equipment sales **receive different tax treatment** (gain or loss, depreciation recapture), so they're recorded separately from regular sales.","plain":"Equipment sales get different tax treatment, so book them separately.","look":"Equipment – Sales","ref":["Builder's Guide to Accounting  ·  170"],"dupes":["1-96"]},{"id":"3-10","exam":3,"num":10,"stem":"According to Fair Labor Standards Act, which will eliminate the contractor's liability for paying overtime pay?","options":["An agreement that only 8 hours per day or 40 hours per week will be counted as working time","An outside salesperson who works on straight commission and qualifies as exempt status","An announcement by an employer that overtime work will only be paid for if authorized in advance","An announcement by an employer that no overtime work will be permitted"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-17"}],"exp":"Only a real FLSA exemption, such as an **exempt outside salesperson on straight commission**, removes the overtime obligation. If overtime is worked, it must be paid, whatever the employer has announced.","laws":[["29 U.S.C. § 213","https://www.law.cornell.edu/uscode/text/29/213"]],"plain":"Only a real exemption, like an outside salesperson on straight commission, gets you out of overtime. Saying \"no overtime allowed\" doesn't.","look":"Overtime Pay – Exemptions","ref":["Florida Contractors Manual  ·  5-17"]},{"id":"3-11","exam":3,"num":11,"stem":"Which is an advantage of leasing?","options":["Lowers overall cash flows more than purchasing","Reduced front-end cash outlays","Generates depreciation for tax purposes","Cheaper than owning in the long run"],"answer":1,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-93"}],"exp":"The main advantage of leasing is **lower up-front cash outlay**. Owning usually costs less over the long run, and only owned equipment generates depreciation.","plain":"Leasing means less cash up front. Owning is usually cheaper long term.","look":"Leasing – Advantages","ref":["Florida Contractors Manual  ·  3-93"]},{"id":"3-12","exam":3,"num":12,"stem":"A change of a business address must be mailed to the Department of Business and Professional Regulation within how many days of the change?","options":["30","45","60","90"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-31"},{"book":"FCM","eds":["2021"],"loc":"2-29"},{"book":"FCM","eds":["2017"],"loc":"2-22"}],"exp":"A change of business address (part of the business organization's qualification information) must be reported to DBPR within **45 days** (61G4-15.007).","laws":[["Fla. Admin. Code R. 61G4-15.007","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-15.007"]],"plain":"Business address changed? Tell DBPR within 45 days.","look":"Licensing – Change of Address (61G4-15.007)","ref":["Florida Contractors Manual  ·  2025: 2-31","2021: 2-29","2017: 2-22"],"lock":1},{"id":"3-13","exam":3,"num":13,"stem":"All chains being used as a sling, should be inspected once a __________ by a competent inspector.","options":["Day","Week","Month","Year"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-89"}],"exp":"Per the manual (FCM 7-89), chains used as slings should get a thorough inspection by a competent inspector once a **month**, in addition to the daily pre-use check.","laws":[["29 CFR § 1926.251","https://www.ecfr.gov/current/title-29/section-1926.251"]],"plain":"Per the manual, a competent inspector checks chain slings once a month, plus your daily look-over.","look":"Rigging – Chain Slings","ref":["Florida Contractors Manual  ·  7-89"]},{"id":"3-14","exam":3,"num":14,"stem":"Which of the following is NOT a prohibited agreement under the Florida's Right to Work Law?","options":["Union shop agreements","Agency shop agreements","Federal enclaves' agreements","Maintenance of membership agreements"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"},{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"Florida's Right to Work law prohibits union shop, agency shop and maintenance-of-membership agreements. **Federal enclaves** (federal property) aren't covered by state law, so agreements there aren't prohibited.","laws":[["Fla. Const. Art. I, § 6","https://www.flsenate.gov/Laws/Constitution#A1S06"]],"plain":"Federal enclaves (federal land) aren't covered by Florida's right-to-work ban.","look":"Laws – Florida Right to Work","ref":["Florida Contractors Manual  ·  5-14, 5-15"]},{"id":"3-15","exam":3,"num":15,"stem":"Which of the following is an example of an accrual entry?","options":["Depreciation and amortization entries","Entries to record payroll taxes","Entries to record automatic loan payments","Entries to record purchase of material stored at a jobsite"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"237"}],"exp":"Per the Builder's Guide, **recording material purchased and stored at the jobsite** is an accrual entry.","plain":"Material bought and stored on site but not installed gets an accrual entry.","look":"Accruals","ref":["Builder's Guide to Accounting  ·  237"]},{"id":"3-16","exam":3,"num":16,"stem":"To establish an hourly cost for a piece of equipment the contractor needs to consider all the following except __________.","options":["Estimated life of the equipment","Cost of the equipment, less salvage value","Replacement cost of the equipment","Estimated average hours of use"],"answer":2,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159-160"}],"exp":"Hourly equipment cost uses estimated life, cost less salvage and average hours of use. **Replacement cost** isn't included.","plain":"Replacement cost doesn't go into an hourly equipment rate.","look":"Equipment – Cost Assignment","ref":["Builder's Guide to Accounting  ·  159 - 160"],"dupes":["1-99"]},{"id":"3-17","exam":3,"num":17,"stem":"Failure of a certificate holder or registrant to apply for renewal of an active certificate at the time of biennial renewal shall cause the certificate to become __________.","options":["Suspended","Permanently suspended","Voluntarily inactive","Delinquent"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-95","stat":"489.116(4)"},{"book":"FCM","eds":["2021"],"loc":"2-74","stat":"489.116(4)"},{"book":"FCM","eds":["2017"],"loc":"2-84","stat":"489.116(4)"}],"exp":"§489.116(4): failing to renew an active certificate at biennial renewal makes it **delinquent**.","laws":[["Fla. Stat. § 489.116(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.116.html"]],"plain":"Didn't renew? Your license is delinquent.","look":"Licensing – Renewal (§489.116)","ref":["Florida Contractors Manual  ·  2025: 2-95: 489.116(4)","2021: 2-74: 489.116(4)","2017: 2-84: 489.116(4)"],"dupes":["1-100"]},{"id":"3-18","exam":3,"num":18,"stem":"Which of the following best describes the accrual method of accounting?","options":["Transactions are recorded when cash is received or paid","No receivables or payables are recorded on the balance sheet","Revenues are recognized when earned even though no cash has been received","Payables are recorded before receivables are received"],"answer":2,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"237"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"Under the accrual method, **revenue is recognized when earned, even if no cash has been received** (and expenses when incurred).","plain":"Accrual books income when you earn it, even if you haven't been paid yet.","look":"Accrual Method","ref":["Builder's Guide to Accounting  ·  11 or 237","Florida Contractors Manual  ·  3-105"]},{"id":"3-19","exam":3,"num":19,"stem":"Which of the following is not a depreciation method?","options":["Declining balance depreciation","Accumulated cost depreciation","Sum of the years' digits depreciation","Straight line depreciation"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"Straight line, declining balance and sum-of-the-years' digits are real methods. **\"Accumulated cost depreciation\" doesn't exist**. (Accumulated *depreciation* is an account, not a method.)","plain":"\"Accumulated cost depreciation\" is made up. The others are real methods.","look":"Depreciation – Methods","ref":["Builder's Guide to Accounting  ·  163","Note: there is no such thing as accumulated cost depreciation","Sum-of-the-years depreciation is one of the methods still being used under the old rules"]},{"id":"3-20","exam":3,"num":20,"stem":"Claims arising from damages that resulted from a contractor's work that already has been finished would be covered by a __________.","options":["Completion bond","Completed operations liability policy","Builder's risk insurance policy","Manufacturer's and contractor's liability policy"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-9"}],"exp":"**Completed operations** liability coverage handles claims for damage caused by work that's already finished.","plain":"Completed operations coverage handles claims from work you already finished.","look":"Insurance – Completed Operations","ref":["Florida Contractors Manual  ·  4-9"]},{"id":"3-21","exam":3,"num":21,"stem":"What is the purpose of the Lien Law payment bond?","options":["To exempt the contractor from construction liens","To exempt the subcontractor from construction liens","To protect the owner's property from construction liens","To allow easy payments to subcontractors"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-47"},{"book":"FCM","eds":["2025","2021"],"loc":"9-57"},{"book":"FCM","eds":["2017"],"loc":"9-46"},{"book":"FCM","eds":["2017"],"loc":"9-56"}],"exp":"§713.23: a lien law payment bond **protects the owner's property from construction liens**. Lienors claim against the bond instead of the property.","laws":[["Fla. Stat. § 713.23","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.23.html"]],"plain":"A payment bond keeps liens off the owner's property. Unpaid subs go after the bond instead.","look":"Payment Bond (§713.23)","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-47, 9-57","2017: 9-46, 9-56"]},{"id":"3-22","exam":3,"num":22,"stem":"Under the Civil Rights Act of 1964 (Title VII) the Americans with Disabilities Act and the Rehabilitation Act of 1973, the maximum compensatory and punitive damages a plaintiff may recover from an employer of 95 people is __________.","options":["$24,000","$50,000","$100,000","$250,000"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-35"}],"exp":"Combined compensatory and punitive damage caps under Title VII and the ADA: 15–100 employees **$50,000**; 101–200 $100,000; 201–500 $200,000; more than 500 $300,000. An employer of 95 falls in the first tier.","laws":[["42 U.S.C. § 1981a","https://www.law.cornell.edu/uscode/text/42/1981a"]],"plain":"Employer with 15 to 100 workers: damages capped at $50,000.","look":"Civil Rights – Damages Caps","ref":["Florida Contractors Manual  ·  5-35"],"lock":1},{"id":"3-23","exam":3,"num":23,"stem":"A contractor's worker's compensation premiums can be reduced by any of the following, except ________________.","options":["Participating in a co-insurance program","Joining an insurance pool","Participating in a deductible program","Requiring the employee to pay part of the premium"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-7"},{"book":"FCM","eds":null,"loc":"6-8"},{"book":"FCM","eds":null,"loc":"6-9"}],"exp":"**Making employees pay part of the workers' comp premium is illegal** in Florida. Co-insurance, pools and deductible programs are legitimate ways to lower premiums.","plain":"You can't make workers chip in for comp premiums. It's illegal.","look":"Workers' Compensation – Premiums","ref":["Florida Contractors Manual  ·  6-7, 6-8 & 6-9"]},{"id":"3-24","exam":3,"num":24,"stem":"Under the Florida Civil Rights Act of 1992, (Chapter 760, FL. Statue) back pay liability is limited to __________ months prior to filing of complaint unless willful violation is found.","options":["6","18","24","36"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-36"}],"exp":"Under the Florida Civil Rights Act (Ch. 760), back pay is limited to **24 months (2 years)** before the complaint was filed, unless the violation was willful.","plain":"Back pay is limited to 2 years (24 months) before the complaint.","look":"Florida Civil Rights Act – Back Pay","ref":["Florida Contractors Manual  ·  5-36"],"lock":1},{"id":"3-25","exam":3,"num":25,"stem":"An employer with 100 employees is cited by OSHA for a high severity, greater probability violation. The employer has had one other citation in the last 3 years. Using ONLY the information given, what would be the proposed penalty for this violation? (Select the closet answer)","options":["$5,000","$8,730","$10,795","$12,905"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"7-32"},{"book":"FCM","eds":["2025"],"loc":"7-33"},{"book":"FCM","eds":["2021"],"loc":"7-32","alt":"C"},{"book":"FCM","eds":["2021"],"loc":"7-33","alt":"C"},{"book":"FCM","eds":["2017"],"loc":"7-32","alt":"B"},{"book":"FCM","eds":["2017"],"loc":"7-33","alt":"B"}],"exp":"The answer depends on your manual's edition. **2025 FCM:** high severity, greater probability = $16,131 base; 51–100 employees = 20% reduction; no 10% history reduction (prior citation within 3 years). $16,131 × 0.80 = **$12,905**. 2021: $13,494 × 0.80 = $10,795. 2017: $12,471 × 0.70 = $8,730.","plain":"Base penalty × (1 − size discount). With 100 workers it's 20% off in the 2025 book: $16,131 × 0.80 = $12,905. No history discount because of the earlier citation.","look":"OSHA – Penalty Calculation","tip":"Base penalty × (1 − size reduction). The history reduction only applies with no citations in the last 3 years.","calc":1,"ref":["2025 Florida Contractors Manual:  ·  2025: 7-32 - 7-33 high severity, greater probability = base penalty of $16,131 adjustment factor = -20% for 51 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $16,131 x .80 (100% - 20%) = $12,904.80 proposed penalty","[C] 2021 Florida Contractors Manual:  ·  2021: 7-32 - 7-33 high severity, greater probability = base penalty of $13,494 adjustment factor = -20% for 51 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $13,494 x .80 (100% - 20%) = $10,795.20 proposed penalty","[B] 2017 Florida Contractors Manual:  ·  2017: 7-32 - 7-33 high severity, greater probability = base penalty of $12,471 adjustment factor = -30% for 26 to 100 workers","Note: there is no 10% reduction for good past history because there was one other violation in the last 3 years.","Solution: $12,471 x .70 (100% - 30%) = $8,729.70 proposed penalty"],"lock":1,"edAns":{"2025":3,"2021":2,"2017":1}},{"id":"3-26","exam":3,"num":26,"stem":"How long after the subcontractor's final furnishing of labor, services or material for a job does the subcontractor have to record a valid Claim of Lien?","options":["45 days","60 days","90 days","One year"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-28"},{"book":"FCM","eds":["2017"],"loc":"9-27"}],"exp":"§713.08(5): a claim of lien must be recorded within **90 days after the final furnishing** of labor, services or materials.","laws":[["Fla. Stat. § 713.08","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.08.html"]],"plain":"Record your lien within 90 days after your LAST day of work or delivery.","look":"Lien – Claim of Lien (§713.08)","tip":"NTO 45 days from first furnishing. Lien 90 days from last.","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-28","2017: 9-27"]},{"id":"3-27","exam":3,"num":27,"stem":"The quarterly Federal Tax Form 941 summarizes tax liability for the employer and includes __________.","options":["Liability insurance","Federal income taxes withheld","Workers compensation insurance","Federal unemployment insurance tax"],"answer":1,"topic":"tax","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"137-138"},{"book":"FCM","eds":["2025","2021"],"loc":"1-26"},{"book":"FCM","eds":["2025","2021"],"loc":"3-48"},{"book":"FCM","eds":["2017"],"loc":"1-23"},{"book":"FCM","eds":["2017"],"loc":"3-48"}],"exp":"Form 941 includes **federal income tax withheld**, plus Social Security and Medicare.","plain":"Form 941 reports the federal income tax you withheld.","look":"Forms, Tax – 941","ref":["Builder's Guide to Accounting  ·  137 - 138","Florida Contractors Manual  ·  2025 & 2021: 1-26, 3-48","2017: 1-23, 3-48"],"dupes":["1-101"]},{"id":"3-28","exam":3,"num":28,"stem":"A properly registered fictitious name is valid for __________ year(s).","options":["1","2","3","5"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"A fictitious name is valid for **5 years**.","laws":[["Fla. Stat. § 865.09","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0800-0899/0865/Sections/0865.09.html"]],"plain":"A DBA lasts 5 years.","look":"Fictitious Name","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14","2017: 1- 15"],"lock":1},{"id":"3-29","exam":3,"num":29,"stem":"Which type of bond is a guarantee to the owner that the project will be completed according to the terms and conditions specified in the contract?","options":["Payment bond","Bid bond","Performance bond","Completion bond"],"answer":2,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-14"},{"book":"FCM","eds":null,"loc":"10-75"}],"exp":"A **performance bond** guarantees the owner that the project will be completed according to the contract. A payment bond guarantees subs and suppliers get paid. A bid bond guarantees the low bidder will sign.","plain":"A performance bond guarantees the owner the job gets finished per the contract.","look":"Bonds – Performance","ref":["Florida Contractors Manual  ·  4-14, 10-75"]},{"id":"3-30","exam":3,"num":30,"stem":"According to the Internal Revenue Service, employers must keep all employment tax records for at least how many years?","options":["2 years","4 years","5 years","7 years"],"answer":1,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"3-142"},{"book":"FCM","eds":["2021"],"loc":"3-160"},{"book":"FCM","eds":["2021"],"loc":"3-158"},{"book":"FCM","eds":["2017"],"loc":"3-154"}],"exp":"The IRS requires employment tax records to be kept at least **4 years**.","laws":[["26 CFR § 31.6001-1","https://www.ecfr.gov/current/title-26/section-31.6001-1"]],"plain":"IRS payroll tax records: 4 years.","look":"Recordkeeping – IRS","ref":["Florida Contractors Manual  ·  2025: 3-142 (2025 IRS Circ. E)","2021: 3-160 (2nd printing / 2021 IRS Circ. E)","2021: 3-158 (1st printing / 2016 IRS Circ. E)","2017: 3-154 (2016 IRS Circ. E)"],"lock":1},{"id":"3-31","exam":3,"num":31,"stem":"For purposes of unemployment compensation, misconduct connected with work does not include __________.","options":["Wrongful intent or evil design","Deliberate disregard of employee duties","Deliberate disregard of behavior standards","Isolated instances of negligence and poor judgment"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-52"},{"book":"FCM","eds":["2025","2021"],"loc":"5-53"},{"book":"FCM","eds":["2017"],"loc":"5-52"}],"exp":"Unemployment law treats intentional wrongdoing and deliberate disregard of duties or standards as misconduct. **Isolated negligence or poor judgment is not misconduct**.","laws":[["Fla. Stat. § 443.036","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0443/Sections/0443.036.html"]],"plain":"A one-time mistake or bad call isn't \"misconduct.\" It has to be on purpose.","look":"Reemployment – Misconduct","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-52, 5-53","2017: 5-52"]},{"id":"3-32","exam":3,"num":32,"stem":"Which of the following companies would be required to have Worker's Compensation Insurance?","options":["A company that is not in the construction business that leases 2 employees","A company in the construction business that hires employees","A corporation in the construction business with 2 employees who are both officers of the corporation and have certificates of election to be exempt","A corporation that is not in the construction business with 2 employees who are both officers of the corporation and have certificates of election to be exempt"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-5"}],"exp":"**A construction company with any employees** must carry workers' comp (1 or more employees). Corporate officers with valid exemptions don't count as employees.","laws":[["Fla. Stat. § 440.02","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.02.html"]],"plain":"A construction company with employees has to carry workers' comp.","look":"Workers' Compensation – When Needed","ref":["Florida Contractors Manual  ·  6-5"]},{"id":"3-33","exam":3,"num":33,"stem":"A Notice to Owner from a non-privity lienor must be sent within __________ days after the first furnishing of labor or materials.","options":["30","45","72","90"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-22"},{"book":"FCM","eds":["2017"],"loc":"9-21"}],"exp":"A non-privity lienor (a sub or supplier with no direct contract with the owner) must serve the Notice to Owner within **45 days** of first furnishing.","laws":[["Fla. Stat. § 713.06","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.06.html"]],"plain":"Subs and suppliers with no contract with the owner send the NTO within 45 days of starting.","look":"Notice to Owner (§713.06)","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-22","2017: 9-21"],"lock":1},{"id":"3-34","exam":3,"num":34,"stem":"What financial information summarizes the existing conditions of a business?","options":["The balance sheet","The cash flow statement","The income statement","The statement of retained earnings"],"answer":0,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"247"}],"exp":"The **balance sheet** summarizes the existing condition of a business on a specific date.","plain":"The balance sheet is the snapshot of current condition.","look":"Financial Statements – Balance Sheet","ref":["Builder's Guide to Accounting  ·  247"],"dupes":["1-102"]},{"id":"3-35","exam":3,"num":35,"stem":"On a multi-contractor job which of the following is true regarding the posting of OSHA posters?","options":["Poster must be posted on all job site where employees can see them","Each contractor on the project must display their own posters","Only the contractor deemed project manage must post the posters","A & B above"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-6"}],"exp":"On a multi-contractor job, posters must be where employees can see them, and **each contractor posts its own**. A and B are both true.","laws":[["29 CFR § 1903.2","https://www.ecfr.gov/current/title-29/section-1903.2"]],"plain":"On a multi-contractor job, posters go where workers can see them, and every contractor posts its own. A and B.","look":"OSHA – Posters","ref":["Florida Contractors Manual  ·  7-6"],"lock":1},{"id":"3-36","exam":3,"num":36,"stem":"When progress billings bring in more income than costs incurred during the early stages of a contract the contractor is using __________.","options":["A draw system","A pre-qualified payment method","Front end loading","The critical path method"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-108"},{"book":"FCM","eds":null,"loc":"10-74"},{"book":"FCM","eds":null,"loc":"10-75"}],"exp":"**Front-end loading** puts extra value in early pay items so early billings exceed costs incurred, which improves the contractor's early cash flow.","plain":"Billing heavy up front so early pay beats early cost is front-end loading.","look":"Front End Loading","ref":["Florida Contractors Manual  ·  3-108, 10-74, 10-75"]},{"id":"3-37","exam":3,"num":37,"stem":"When preparing a bid, the contractor notes that the specifications require one type of equipment, but the plans show a different type. The contractor should __________.","options":["Bid based on using the least expensive of the two","Follow the plans","Submit a request for information","Substitute comparable equipment"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-6"}],"exp":"When the specifications and plans conflict, **submit a Request for Information (RFI)**. Don't guess, and don't substitute.","plain":"Specs and plans disagree? Send an RFI. Don't guess.","look":"Request for Information (RFI)","ref":["Florida Contractors Manual  ·  10-6"]},{"id":"3-38","exam":3,"num":38,"stem":"The OSHA citation must be prominently displayed at or near the place of alleged violation for __________ day (s), or until it is corrected, whichever is later, to warn employees of dangers that may exist there.","options":["One","Two","Three","Five"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-31"}],"exp":"An OSHA citation is posted at or near the violation for **3 working days or until the violation is corrected, whichever is later**.","laws":[["29 CFR § 1903.16","https://www.ecfr.gov/current/title-29/section-1903.16"]],"plain":"Post an OSHA citation for 3 days or until it's fixed, whichever is longer.","look":"OSHA – Citations","ref":["Florida Contractors Manual  ·  7-31"]},{"id":"3-39","exam":3,"num":39,"stem":"A member, during active duty and for a period of __________ year (s) after discharge from active duty, engaged in his or her licensed profession or occupation in the private sector for profit in this state must complete all license renewal provisions except remitting the license renewal fee, which shall be waived by the department.","options":["1","2","3","4"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.02"}],"exp":"§455.02: during active duty and for **2 years** after discharge, a service member practicing a licensed profession in Florida completes the renewal requirements but has the renewal fee waived.","laws":[["Fla. Stat. § 455.02","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.02.html"]],"plain":"Active-duty members, and for 2 years after discharge, have the renewal fee waived.","look":"Military Members (§455.02)","ref":["Florida Statute 455  ·  455.02"],"lock":1},{"id":"3-40","exam":3,"num":40,"stem":"What is required to file a construction claim of lien?","options":["Permission from the owner","A court order","A direct contract with the owner","The claim must be recorded with the clerk of the court"],"answer":3,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-80","stat":"713.08(5)"},{"book":"FCM","eds":["2021"],"loc":"9-76","stat":"713.08(5)"},{"book":"FCM","eds":["2017"],"loc":"9-84","stat":"713.08(5)"}],"exp":"A construction claim of lien must be **recorded with the clerk of the court** in the county where the property is located.","laws":[["Fla. Stat. § 713.08(5)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.08.html"]],"plain":"Liens get recorded with the clerk of court.","look":"Lien – Claim of Lien (§713.08)","ref":["Florida Contractors Manual  ·  2025: 9-80: 713.08(5)","2021: 9-76: 713.08(5)","2017: 9-84: 713.08(5)"],"dupes":["1-105"]},{"id":"3-41","exam":3,"num":41,"stem":"What ratios compare accounts on the balance sheet to accounts on the income statement?","options":["Quick assets","Combined","Income","Current"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"270"}],"exp":"**Combined ratios** compare balance sheet accounts with income statement accounts.","plain":"Combined ratios compare balance sheet numbers to income statement numbers.","look":"Financial Ratios – Combined","ref":["Builder's Guide to Accounting  ·  270"],"dupes":["1-106"]},{"id":"3-42","exam":3,"num":42,"stem":"Which is a requirement for an employee to recover under a compulsory State Workers' Compensation Statute?","options":["The injury must occur while the employee is engaged in interstate commerce","The injury must arise out of and in the course of employment","The injury must arise out of the negligence of the employer or fellow employee","The injured employee must be a permanent full-time employee"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"6-27"},{"book":"FCM","eds":["2021","2017"],"loc":"6-26"}],"exp":"To recover under workers' comp, the injury must **arise out of and in the course of employment**. It's no-fault, so the employer's negligence doesn't matter.","laws":[["Fla. Stat. § 440.09","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.09.html"]],"plain":"For comp to pay, the injury has to come from the job, while doing the job.","look":"Workers' Compensation – Compensability","ref":["Florida Contractors Manual  ·  2025: 6-27","2021 & 2017:6-26"]},{"id":"3-43","exam":3,"num":43,"stem":"What type of cost basis inventory valuation method uses the current market value of material as used?","options":["Specific cost","First in-first out","Last in-first out","Cost-plus inflation"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"120"}],"exp":"**LIFO** charges the latest costs, close to current market value, to material as it is used.","plain":"LIFO charges material at the most recent price.","look":"Inventory – LIFO","ref":["Builder's Guide to Accounting  ·  120"],"dupes":["1-108"]},{"id":"3-44","exam":3,"num":44,"stem":"Which is not used when calculating goods sold to average inventory ratio?","options":["Labor","Materials purchased","All other direct costs","Total monthly averages"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"**\"Total monthly averages\"** isn't used in the goods sold to average inventory ratio. COGS includes labor, materials and other direct costs.","plain":"\"Total monthly averages\" isn't part of the inventory ratio.","look":"Inventory Ratio","ref":["Builder's Guide to Accounting  ·  121"],"dupes":["1-109"]},{"id":"3-45","exam":3,"num":45,"stem":"The Drug-Free Workplace Act of 1988 __________.","options":["Does not require drug testing","Always applies to subcontractors","Applies to contractors in foreign countries","Applies only to contractors with more than 50 workers"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-50"},{"book":"FCM","eds":["2017"],"loc":"5-49"}],"exp":"The Drug-Free Workplace Act of 1988 requires covered federal contractors and grantees to keep a drug-free workplace policy, but it **does not require drug testing**.","laws":[["41 U.S.C. § 8102","https://www.law.cornell.edu/uscode/text/41/8102"]],"plain":"The 1988 federal Drug-Free Workplace Act doesn't require drug testing.","look":"Drug-Free Workplace Act","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-50","2017: 5-49"]},{"id":"3-46","exam":3,"num":46,"stem":"Which of the following can be added to a Builder's Risk policy by means of an extended coverage endorsement?","options":["Vandalism coverage","Malpractice coverage","Materials in transit","Catastrophic flood coverage"],"answer":2,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-7"}],"exp":"An extended coverage endorsement on a builder's risk policy can add **materials in transit** (and storage away from the site).","plain":"An extended coverage endorsement can add materials in transit.","look":"Insurance – Builder's Risk","ref":["Florida Contractors Manual  ·  4-7"]},{"id":"3-47","exam":3,"num":47,"stem":"Which bond requires a low bidding contractor who fails to enter into a contract to pay a penalty equal to the amount of the bid?","options":["Performance bond","Forfeiture obligation","Difference in bid","Payment"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-13"}],"exp":"A bid bond can be written as a **forfeiture obligation**: if the low bidder won't sign, the full penal amount is forfeited. The other form, \"difference in bid,\" pays only the gap to the next bidder.","plain":"With a \"forfeiture\" bid bond, the low bidder who backs out loses the whole bond amount.","look":"Bonds – Bid Bond","ref":["Florida Contractors Manual  ·  4-13"]},{"id":"3-48","exam":3,"num":48,"stem":"The Statute of limitations requires that an action for breach of an unwritten contract must be brought within a maximum of __________ years.","options":["2","4","5","7"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-23"}],"exp":"Florida statute of limitations: **4 years** for an unwritten (oral) contract and 5 years for a written contract.","laws":[["Fla. Stat. § 95.11","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0000-0099/0095/Sections/0095.11.html"]],"plain":"You have 4 years to sue over a handshake (oral) contract. Written contracts get 5.","look":"Statute of Limitations","tip":"Oral = 4, written = 5.","ref":["Florida Contractors Manual  ·  8-23"],"lock":1},{"id":"3-49","exam":3,"num":49,"stem":"Which of the following wages would not be subject to Federal Unemployment tax paid by the employer?","options":["Wages paid to a Canadian who frequently enters the U.S. to work as a carpenter","Severance pay","Wages paid to a deceased worker's estate in the same calendar year as the date of the worker's death","Wages paid to the employer's spouse"],"answer":3,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-253"},{"book":"FCM","eds":["2025"],"loc":"5-266"},{"book":"FCM","eds":["2025"],"loc":"3-181"},{"book":"FCM","eds":["2021"],"loc":"5-277"},{"book":"FCM","eds":["2021"],"loc":"5-289"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2021"],"loc":"3-193"},{"book":"FCM","eds":["2021"],"loc":"3-188"},{"book":"FCM","eds":["2017"],"loc":"5-292"},{"book":"FCM","eds":["2017"],"loc":"3-184"}],"exp":"FUTA doesn't apply to family employment such as **wages paid to the employer's spouse** (by a sole proprietor). Severance pay and wages to foreign workers in the U.S. are generally subject to it.","plain":"Wages paid to your spouse aren't subject to FUTA.","look":"FUTA – Exempt Wages","ref":["Florida Contractors Manual  ·  2025: 5-253, 5-266, 3-181: (2025 IRS Circ. E)","2021: 5-277, 5-289, 5-290, 3-193 (2nd printing /","2021 IRS Circ. E)","2021: 5-277, 5-289, 5-290, 3-188 (1st printing /","2016 IRS Circ. E)","2017: 5-292, 3-184 (2016 IRS Circ. E)"]},{"id":"3-50","exam":3,"num":50,"stem":"How may a contractor required to carry Worker's Compensation insurance fulfill the law?","options":["Obtaining liability insurance at three times the coverage generally required","Seek individual self-insured status through the Department of Labor and Employment Security","Obtaining major medical insurance for all employees","Obtaining life insurance policies for all employees"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-9"}],"exp":"An employer can meet the workers' comp requirement by buying a policy or by **qualifying as an individual self-insurer** (approved by the state). Liability, health or life insurance doesn't count.","laws":[["Fla. Stat. § 440.38","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.38.html"]],"plain":"You can buy a comp policy or get approved to self-insure. Health or life insurance doesn't count.","look":"Workers' Compensation – Self-Insurance","ref":["Florida Contractors Manual  ·  6-9"]},{"id":"3-51","exam":3,"num":51,"stem":"Under a contract which does NOT require written notice in order to file a claim for additional cost?","options":["Minor change in the work","Work performed because of a concealed condition","Damages caused by the architect","Work performed because of an emergency endangering the owner's property"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"15.1.5"}],"exp":"A201 §15.1.5 and §10.4: work done because of an **emergency endangering the owner's property** doesn't require written notice before claiming additional cost.","plain":"Emergency work protecting the owner's property doesn't need written notice first.","look":"A201 15.1 – Claims for Additional Cost","ref":["AIA Document A201, 2017  ·  15.1.5"],"dupes":["1-110"]},{"id":"3-52","exam":3,"num":52,"stem":"A board member or former board member serving on a probable cause panel shall be compensated __________ for each day in attendance at an official meeting of the board and for each day of participation in any other business involving the board.","options":["$25","$50","$75","$100"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.207(4)"}],"exp":"§455.207(4): board members serving on a probable cause panel are paid **$50 a day** for each day of meetings or board business.","laws":[["Fla. Stat. § 455.207(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.207.html"]],"plain":"Probable cause panel members get $50 a day.","look":"Board Members – Compensation (§455.207)","ref":["Florida Statute 455  ·  455.207(4)"],"lock":1},{"id":"3-53","exam":3,"num":53,"stem":"When is an oral contract valid?","options":["When an unlicensed contractor agrees to perform construction services","When the contract can be performed in less than one year","When the Statute of Limitations has expired","When the sale of goods is more than $500"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-6"}],"exp":"Under the Statute of Frauds, contracts that **can be performed within one year** may be oral. Contracts that can't be performed within a year, and sales of goods of $500 or more, must be written.","laws":[["Fla. Stat. § 725.01","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0725/Sections/0725.01.html"]],"plain":"An oral contract is OK if the job can be done in under a year.","look":"Contracts – Written or Oral","ref":["Florida Contractors Manual  ·  8-6"]},{"id":"3-54","exam":3,"num":54,"stem":"Current liabilities include the portion of long-term debt for equipment purchases payable within __________ days.","options":["30","90","180","365"],"answer":3,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"155"}],"exp":"Current liabilities include the portion of long-term equipment debt due **within 365 days**.","plain":"Current liabilities are due within 365 days.","look":"Current Liabilities","ref":["Builder's Guide to Accounting  ·  155"],"lock":1,"dupes":["1-112"]},{"id":"3-55","exam":3,"num":55,"stem":"What activity must precede project scheduling?","options":["Development of a logic table","Final project design","Project planning","Shop drawings"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-58"}],"exp":"**Project planning** comes before scheduling. You decide *what* and *how* first, then *when*.","plain":"Planning comes before scheduling: figure out what and how before when.","look":"Project Planning","ref":["Florida Contractors Manual  ·  10-58"]},{"id":"3-56","exam":3,"num":56,"stem":"In reference to 42 U.S.C, the initials ADA are used to indicate __________.","options":["American Drug Association","American Diabetes Association","Association of Disabled Americans","Americans with Disabilities Act"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-12"},{"book":"FCM","eds":null,"loc":"5-41"}],"exp":"42 U.S.C. §12101 et seq. is the **Americans with Disabilities Act** (ADA).","laws":[["42 U.S.C. § 12101","https://www.law.cornell.edu/uscode/text/42/12101"]],"plain":"ADA = Americans with Disabilities Act.","look":"Americans with Disabilities Act","ref":["Florida Contractors Manual  ·  5-12, 5-41"]},{"id":"3-57","exam":3,"num":57,"stem":"Chapter 489 of the Florida Statutes deals with licensing and regulating __________.","options":["All contractors and property owners","Bridge, tank and tower structures","Commercial buildings and bridges","Construction contracting, electrical and alarm systems contracting, and septic tank contracting"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"2-5"}],"exp":"Chapter 489 has three parts: **construction contracting (Part I), electrical and alarm system contracting (Part II), and septic tank contracting (Part III)**.","laws":[["Fla. Stat. § 489.101","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.101.html"]],"plain":"Chapter 489 covers construction, electrical/alarm and septic tank contractors.","look":"Chapter 489 – Scope","ref":["Florida Contractors Manual  ·  2-5"]},{"id":"3-58","exam":3,"num":58,"stem":"To procure long lead items, it is recommended that the items be __________.","options":["Identified and ordered early","Ordered when funds are available","Identified and ordered when needed","Ordered according to product availability"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-24"}],"exp":"Long-lead items should be **identified and ordered early** so they don't hold up the schedule.","plain":"Order long-lead items early so they don't hold up the job.","look":"Long Lead Items","ref":["Florida Contractors Manual  ·  10-24"]},{"id":"3-59","exam":3,"num":59,"stem":"What does Sales less the Cost of Goods Sold equal?","options":["Gross profit","Net profit","Income from operations","Net sales"],"answer":0,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"248"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"Sales − cost of goods sold = **gross profit**.","plain":"Sales minus cost of goods sold = gross profit.","look":"Financial Statements – Gross Profit","ref":["Builder's Guide to Accounting  ·  248","Florida Contractors Manual  ·  3-108"]},{"id":"3-60","exam":3,"num":60,"stem":"What is the sum of assets minus liabilities?","options":["Net profit","Net worth","Gross sales","Gross profit"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"247"}],"exp":"Assets − liabilities = **net worth**.","plain":"Assets minus liabilities = net worth.","look":"Financial Statements – Net Worth","ref":["Builder's Guide to Accounting  ·  247"]},{"id":"3-61","exam":3,"num":61,"stem":"The department is authorized to impose a fine of not more than __________ and assess reasonable investigative and legal costs for prosecution when it appears that any uncertified or unregistered person is associated with a contracting firm.","options":["$500","$1,500","$2,500","$5,000"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-114","stat":"489.132(3)"},{"book":"FCM","eds":["2021"],"loc":"2-88","stat":"489.132(3)"},{"book":"FCM","eds":["2017"],"loc":"2-101","stat":"489.132(3)"}],"exp":"§489.132(3): DBPR may fine up to **$5,000**, plus investigative and legal costs, when an uncertified or unregistered person is associated with a contracting firm.","laws":[["Fla. Stat. § 489.132(3)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.132.html"]],"plain":"An unlicensed person tied to your firm: fine up to $5,000 plus costs.","look":"Unlicensed Persons Associated with a Firm (§489.132)","ref":["Florida Contractors Manual  ·  2025: 2-114: 489.132(3)","2021: 2-88: 489.132(3)","2017: 2-101: 489.132(3)"],"lock":1},{"id":"3-62","exam":3,"num":62,"stem":"All employers are required to report accidents to the Area Office resulting in one or more fatalities within __________ hours of learning of the incident.","options":["8","14","24","30"],"answer":0,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-28"}],"exp":"Report a work-related **fatality** to OSHA within **8 hours**. Report an inpatient hospitalization, amputation or loss of an eye within 24 hours.","laws":[["29 CFR § 1904.39","https://www.ecfr.gov/current/title-29/section-1904.39"]],"plain":"A death on the job must be reported to OSHA within 8 hours.","look":"OSHA – Reporting Fatalities","tip":"Death = 8 hours. Hospitalization, amputation or eye = 24 hours.","ref":["Florida Contractors Manual  ·  7-28"],"lock":1},{"id":"3-63","exam":3,"num":63,"stem":"All the following would be considered variable overhead expenses except __________.","options":["Payroll taxes on office salaries","Field office trailer rental","Worker's compensation insurance","Bad debts"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142-143"}],"exp":"**Payroll taxes on office salaries** are a fixed expense. Field office trailer rental, workers' comp and bad debts vary with work volume.","plain":"Payroll taxes on office salaries are fixed. The others go up and down with the work.","look":"Overhead – Fixed vs. Variable","ref":["Builder's Guide to Accounting  ·  142 - 143","Payroll taxes on office salaries is a fixed expense"]},{"id":"3-64","exam":3,"num":64,"stem":"When the contract is made with a husband or wife who is not separated and living apart and the property is owned by the other or of both, the spouse who contracts shall be deemed to be the agent of the other unless such other shall, with __________ days after learning of such contract, give the contractor and record in the clerk's office, notice of his or her objection.","options":["5","7","10","14"],"answer":2,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-77","stat":"713.12"},{"book":"FCM","eds":["2021"],"loc":"9-77","stat":"713.12"},{"book":"FCM","eds":["2017"],"loc":"9-87","stat":"713.12"}],"exp":"§713.12: when one spouse contracts for work on property owned by the other or by both, the contracting spouse is the other's agent unless the other spouse **records an objection within 10 days** of learning of the contract.","laws":[["Fla. Stat. § 713.12","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.12.html"]],"plain":"A spouse who objects to the contract has 10 days to file the objection.","look":"Spouse as Agent (§713.12)","ref":["Florida Contractors Manual  ·  2025: 9-77: 713.12","2021: 9-77: 713.12","2017: 9-87: 713.12"],"lock":1},{"id":"3-65","exam":3,"num":65,"stem":"OSHA regulations require that records be kept a minimum of how many years after an incident occurs?","options":["1 year from the end of the year in which the incident occurred","5 years from the end of the year in which the incident occurred","7 years from the end of the year in which the incident occurred","Indefinitely"],"answer":1,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-16"}],"exp":"OSHA injury and illness records are kept **5 years** after the end of the year the incident occurred.","laws":[["29 CFR § 1904.33","https://www.ecfr.gov/current/title-29/section-1904.33"]],"plain":"OSHA records: 5 years.","look":"OSHA – Retention of Records","ref":["Florida Contractors Manual  ·  7-16"]},{"id":"3-66","exam":3,"num":66,"stem":"Successful builders control their costs BEST at which time?","options":["At the end of each week","During each phase of the work","Immediately prior to approving invoices","In bi-weekly meetings with the owner present"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"189"}],"exp":"Costs are controlled best **during each phase of the work**, while there's still time to fix overruns.","plain":"Control costs during each phase, while you can still fix things.","look":"Cost Control","ref":["Builder's Guide to Accounting  ·  189"]},{"id":"3-67","exam":3,"num":67,"stem":"A company's initial record of all its business transactions is known as a __________.","options":["Ledger","Journal","Balance sheet","Financial statement"],"answer":1,"topic":"acct","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-25"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"The **journal** is the book of original entry: every transaction is recorded there first, then posted to the ledger.","plain":"The journal is where every transaction gets written down first.","look":"Journal","tip":"Journal first, then ledger.","ref":["Florida Contractors Manual  ·  3-25, 3-108"]},{"id":"3-68","exam":3,"num":68,"stem":"An indicator of how well a company can meet its current obligations is the company's __________.","options":["Expense ratio","Debt to capitalization ratio","Current ratio","Income to net worth ratio"],"answer":2,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"269"}],"exp":"The **current ratio** shows how well a company can meet its current obligations.","plain":"The current ratio shows whether you can pay this year's bills.","look":"Current Ratio","ref":["Builder's Guide to Accounting  ·  269"]},{"id":"3-69","exam":3,"num":69,"stem":"Which of the following is not in accordance with requirements for an executive being granted an exemption from the Fair Labor Standards Act?","options":["Person whose primary duty if to manage a company subdivision","The person regularly directs 3 to 4 employees","The person receives a salary of $150 or more per week","The person regularly exercises discretionary power"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"**$150 a week** isn't the salary test for the executive exemption (the current federal standard is $684 a week). Managing a subdivision, directing 2 or more employees and using discretion are all real requirements.","laws":[["29 CFR § 541.100","https://www.ecfr.gov/current/title-29/section-541.100"]],"plain":"$150 a week isn't the salary test (the federal floor is $684 a week). The other three are real requirements.","look":"FLSA – Executive Exemption","ref":["Florida Contractors Manual  ·  5-15"]},{"id":"3-70","exam":3,"num":70,"stem":"Which of the following production factors would not be considered by the estimator when calculating equipment cost estimates?","options":["Climate","Experience of the operators","Highway or street speed limits","Original purchase price of the equipment"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"Production factors are climate, operator experience and speed limits. The **original purchase price** is a cost factor, not a production factor.","plain":"What you paid for the machine doesn't change how much it moves. That's a cost factor, not a production factor.","look":"Equipment – Production Factors","ref":["Florida Contractors Manual  ·  10-27"]},{"id":"3-71","exam":3,"num":71,"stem":"Master activities are a group of activities with no activity representing more than __________ of the project.","options":["10%","20%","25%","30%"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-58"}],"exp":"In a schedule, master activities are grouped so that no single activity is more than **10%** of the project.","plain":"No single master activity should be more than 10% of the project.","look":"Scheduling – Master Activities","ref":["Florida Contractors Manual  ·  10-58"],"lock":1},{"id":"3-72","exam":3,"num":72,"stem":"Requests for translated examinations, except for those in Spanish, must be on file in the board office, or with the department when there is no board, at least __________ days (months) prior to the scheduled examination.","options":["6","14","21","45"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.217(6)"}],"exp":"§455.217(6): requests for a translated exam (in a language other than Spanish) must be on file at least **6 months** before the exam. The question's \"days (months)\" means months.","laws":[["Fla. Stat. § 455.217(6)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.217.html"]],"plain":"Want the exam in a language other than Spanish? Request it 6 months ahead.","look":"Examinations – Translated (§455.217)","ref":["Florida Statute 455  ·  455.217(6)"],"lock":1},{"id":"3-73","exam":3,"num":73,"stem":"The Florida Civil Rights Act of 1992, (Chapter 760, FL. Stat.), does not protect against discrimination for which of the following?","options":["Age","Religion","Alcoholism","Drug abuse"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-36"}],"exp":"The Florida Civil Rights Act protects age, religion and handicap (alcoholism can count as a handicap). **Current illegal drug abuse is not protected**.","laws":[["Fla. Stat. § 760.10","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0760/Sections/0760.10.html"]],"plain":"Current illegal drug use isn't protected. Age, religion and alcoholism (as a handicap) are.","look":"Florida Civil Rights Act","ref":["Florida Contractors Manual  ·  5-36"]},{"id":"3-74","exam":3,"num":74,"stem":"When preparing financial statements, accruals are used to record __________.","options":["Lump sum payments","Income earned but not yet received","Cash transactions","Prepayments on a future contract"],"answer":1,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"106-107"},{"book":"FCM","eds":null,"loc":"3-105"}],"exp":"Accruals record **income earned but not yet received**: revenue when earned, expenses when incurred.","plain":"Accruals record income you've earned but haven't received.","look":"Accruals","ref":["Builder's Guide to Accounting  ·  106 - 107","Under the accrual method of accounting, revenue is considered earned when services are rendered, and expenses are incurred when services are received.","Florida Contractors Manual  ·  3-105"],"dupes":["1-119"]},{"id":"3-75","exam":3,"num":75,"stem":"In order to comply with FDEP asbestos regulations, when demolishing commercial, industrial, publicly owned building, or residential structures with more than four dwelling units, notification must be sent to FDEP at least how many working days prior to beginning the demolition?","options":["7","10","14","20"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-97"}],"exp":"FDEP asbestos rule: notify at least **10 working days** before demolishing commercial, industrial or public buildings, or residential buildings with more than 4 units.","laws":[["40 CFR § 61.145","https://www.ecfr.gov/current/title-40/section-61.145"]],"plain":"Tell FDEP 10 working days before demolition.","look":"Asbestos – Demolition Notice","ref":["Florida Contractors Manual  ·  10-97"],"lock":1},{"id":"3-76","exam":3,"num":76,"stem":"According to Florida Unemployment Compensation Employer Handbook, tax rates are referred to as __________ ratings.","options":["Cost","Experience","Records","Required"],"answer":1,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-271"},{"book":"FCM","eds":["2021"],"loc":"5-293"},{"book":"FCM","eds":["2017"],"loc":"5-296"}],"exp":"Florida reemployment tax rates are **experience ratings**. Employers with fewer claims charged pay lower rates.","laws":[["Fla. Stat. § 443.131","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0443/Sections/0443.131.html"]],"plain":"Unemployment tax rates are \"experience ratings\": fewer claims means a lower rate.","look":"Reemployment Tax – Rates","ref":["Florida Contractors Manual  ·  2025: 5-271","2021: 5-293","2017: 5-296"]},{"id":"3-77","exam":3,"num":77,"stem":"On which of the following items must Florida sales tax be paid by a prime contractor, if it is not included on the invoice?","options":["Invoice from a concrete supplier","Invoice from a temporary help agency","Invoice from a block mason for labor only","Invoice from a non-exempt subcontractor"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-63"},{"book":"FCM","eds":null,"loc":"3-64"}],"exp":"Florida sales tax applies to **materials** (tangible goods), so the **concrete supplier's invoice** is taxable. Labor-only services and temporary help aren't. Labor is taxed only when an item is fabricated in a shop and sold.","plain":"Sales tax is on materials, so the concrete supplier's bill is taxable. Labor-only bills aren't.","look":"Taxes – Sales Tax on Materials","ref":["Florida Contractors Manual  ·  3-63, 3-64","Answers B, C, & D are wrong because sales tax is only charged on materials. The only time that sales tax is computed on labor and material both is when the product is fabricated in a shop, such as a sheet metal shop, and then sold to the public."]},{"id":"3-78","exam":3,"num":78,"stem":"According to Florida Unemployment Compensation Employer Handbook, an unemployed worker __________.","options":["Cannot qualify for benefits","Qualifies for benefits only if paid minimum wage","Qualifies for benefits if employed for one quarter of the base period","Qualifies for benefits if employed for two quarters"],"answer":3,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-279"},{"book":"FCM","eds":["2021"],"loc":"5-299"},{"book":"FCM","eds":["2017"],"loc":"5-301"}],"exp":"An unemployed worker qualifies only if they were **paid wages in 2 or more quarters of the base period**.","laws":[["Fla. Stat. § 443.091","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0443/Sections/0443.091.html"]],"plain":"A laid-off worker needs wages in 2 or more quarters to qualify.","look":"Reemployment – Eligibility","ref":["Florida Contractors Manual  ·  2025: 5-279","2021: 5-299","2017: 5-301","Qualifies for benefits if he/she has been paid wages in 2 or more quarters in the base period.","1 quarter = 3 months, therefore 2 quarters = 6 months."]},{"id":"3-79","exam":3,"num":79,"stem":"The Civil Rights Act of 1866 applies __________.","options":["Only to public employees","Only to employees of the Federal Government","Only to minority employees","To all employees"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-37"}],"exp":"The Civil Rights Act of 1866 (42 U.S.C. §1981) applies to **all employers and all employees**, with no minimum employee count.","plain":"The 1866 Civil Rights Act covers all employees at any size company.","look":"Civil Rights Act of 1866","ref":["Florida Contractors Manual  ·  5-37"]},{"id":"3-80","exam":3,"num":80,"stem":"With respect to an applicant for a certificate, the initial application fee may not exceed __________.","options":["$100","$125","$135","$150"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-85","stat":"489.109(1)(a)"},{"book":"FCM","eds":["2021"],"loc":"2-67","stat":"489.109(1)(a)"},{"book":"FCM","eds":["2017"],"loc":"2-75","stat":"489.109(1)(a)"}],"exp":"§489.109(1)(a): the initial application fee for a certificate may not exceed **$150**.","laws":[["Fla. Stat. § 489.109(1)(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.109.html"]],"plain":"The initial application fee can't be more than $150.","look":"Licensing – Fees (§489.109)","ref":["Florida Contractors Manual  ·  2025: 2-85: 489.109(1)(a)","2021: 2-67: 489.109(1)(a)","2017: 2-75: 489.109(1)(a)"],"lock":1},{"id":"3-81","exam":3,"num":81,"stem":"Which jobs would not require use of the percentage of completion method?","options":["Jobs longer than two years in duration","Jobs by firms that require periodic, progressive recognition of profit from their jobs","Construction jobs producing annual revenue greater than $10 million","Jobs costing $1,000 - $5,000 which take approximately one week to complete"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"25"}],"exp":"Short, small jobs (**$1,000–$5,000, about a week**) don't need the percentage of completion method.","plain":"A quick little $1,000–$5,000 job doesn't need percentage of completion.","look":"Percentage of Completion","ref":["Builder's Guide to Accounting  ·  25"]},{"id":"3-82","exam":3,"num":82,"stem":"After a licensee's completion of a continuing education course, the information must be submitted to the department electronically no later than __________ calendar days.","options":["7","14","30","45"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2178(1)"}],"exp":"§455.2178(1): CE providers must submit course completions to DBPR electronically within **30 days**.","laws":[["Fla. Stat. § 455.2178(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2178.html"]],"plain":"CE schools report your course to the state within 30 days.","look":"Continuing Education Provider (§455.2178)","ref":["Florida Statute 455  ·  455.2178(1)"],"lock":1},{"id":"3-83","exam":3,"num":83,"stem":"All the following are procedures included in the budget process except __________.","options":["Analyzing the results","Consulting with your accountant","Preparing the budget","Acting to control expenses"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"144"}],"exp":"The budget process is prepare, analyze results and act to control expenses. **Consulting your accountant** isn't a step.","plain":"\"Consult your accountant\" isn't one of the budget steps.","look":"Budget – Analysis","ref":["Builder's Guide to Accounting  ·  144"],"dupes":["1-123"]},{"id":"3-84","exam":3,"num":84,"stem":"According to the Veteran's Re-employment Laws, military leave of absence must be granted to any permanent full time or permanent part-time employee who enlists or is drafted into active duty in the armed forces. Discharging an employee without cause, who has been rehired and is covered under the law, is prohibited for a period of __________ if the employee's military service period was less than 180 days and more than 30 days.","options":["6 months","1 year","1 year and 6 months","2 years"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-45"}],"exp":"Per the manual's text on veterans' reemployment law (FCM 5-45), the answer is **1 year**. Note that current federal USERRA law protects a rehired employee who served 31 to 180 days for **180 days**, and one who served more than 180 days for 1 year. The exam is built on the manual, so answer from the book and double-check the wording on FCM 5-45.","laws":[["38 U.S.C. § 4316","https://www.law.cornell.edu/uscode/text/38/4316"]],"plain":"The book's answer is 1 year. (Current federal USERRA law says 180 days for 31–180 days of service. Go with the book.)","look":"Veterans' Reemployment","ref":["Florida Contractors Manual  ·  5-45"]},{"id":"3-85","exam":3,"num":85,"stem":"When figuring overhead, which is a fixed expense?","options":["Small tools","Operating supplies","Equipment rental","Advertising"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"142"}],"exp":"Per the Builder's Guide, **advertising** is treated as a fixed overhead expense. Small tools, operating supplies and equipment rental vary with work volume.","plain":"Advertising is treated as fixed overhead.","look":"Overhead – Fixed","ref":["Builder's Guide to Accounting  ·  142"]},{"id":"3-86","exam":3,"num":86,"stem":"The best way to control equipment costs is good __________.","options":["Maintenance","Scheduling","Financing","Reports"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"228"}],"exp":"Good **scheduling** is the best way to control equipment costs.","plain":"Good scheduling is the best way to control equipment costs.","look":"Equipment – Estimating / Scheduling","ref":["Builder's Guide to Accounting  ·  228"],"dupes":["1-124"]},{"id":"3-87","exam":3,"num":87,"stem":"In order to establish an hourly cost for a bulldozer for job allocations, which of the following would NOT apply?","options":["Cost of equipment less salvage value","Operating costs involving gas, oil, and accessories","Repairing and maintenance costs","Unpredictable job site conditions"],"answer":3,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"159"},{"book":"BGA","eds":null,"loc":"160"}],"exp":"**Unpredictable job site conditions** can't be built into an hourly equipment rate.","plain":"Unpredictable site conditions don't go into an hourly rate.","look":"Equipment – Cost Summary","ref":["Builder's Guide to Accounting  ·  159, 160"],"dupes":["1-125"]},{"id":"3-88","exam":3,"num":88,"stem":"Adjustment of the contract sum using a change order must be established based on __________.","options":["An agreement between the owner, contractor and architect","The unit prices as stated in the contract documents","Labor, material and equipment costs","The architect's recommendation"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: a change order's adjustment to the contract sum is set by **agreement among the Owner, Contractor and Architect**.","plain":"The contract sum in a change order is agreed by the owner, contractor and architect.","look":"A201 7.2 – Change Orders","ref":["AIA Document A201, 2017  ·  7.2.1"]},{"id":"3-89","exam":3,"num":89,"stem":"When preparing a financial statement for a lender before applying for a loan, it is best to __________.","options":["Accumulate current assets to improve the cash position","Reduce current liabilities","Try to decrease the current ratio","Try to increase the volume of business"],"answer":1,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"174"}],"exp":"Before applying for a loan, **reduce current liabilities** to improve your current ratio and how strong your balance sheet looks.","plain":"Pay down current bills before applying for a loan. It makes your current ratio look better.","look":"Loans – Preparing Financials","ref":["Builder's Guide to Accounting  ·  174"]},{"id":"3-90","exam":3,"num":90,"stem":"Your contractor's license number must appear in or on all the following advertisements except __________.","options":["Free yellow Page listings","Coupons","Business proposals","Business cards"],"answer":0,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-165","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-124","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-149","stat":"61G4-12.011(3)"}],"exp":"61G4-12.011(3): the license number must appear in advertising, but **free Yellow Pages listings** (free directory listings) are exempt.","laws":[["Fla. Admin. Code R. 61G4-12.011(3)","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-12.011"]],"plain":"Your license number goes on ads, except free Yellow Pages listings.","look":"Advertising – License Number (61G4-12.011)","ref":["Florida Contractors Manual  ·  2025: 2-165: 61G4-12.011(3)","2021: 2-124: 61G4-12.011(3)","2017: 2-149: 61G4-12.011(3)"]},{"id":"3-91","exam":3,"num":91,"stem":"Every certified and registered contractor must complete a minimum of __________ hours of continuing education during every two-year license cycle.","options":["3","7","14","16"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-17"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"Contractors need **14 hours** of CE every 2-year cycle.","laws":[["Fla. Stat. § 489.115","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.115.html"]],"plain":"14 hours of CE every 2-year cycle.","look":"Continuing Education","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-17","2017: 2-19"],"lock":1},{"id":"3-92","exam":3,"num":92,"stem":"All current liabilities include equipment that is payable within __________ days.","options":["30","90","180","365"],"answer":3,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"253"},{"book":"FCM","eds":null,"loc":"3-107"}],"exp":"Current liabilities = payable within **365 days**.","plain":"Current = due within 365 days.","look":"Current Liabilities","ref":["Builder's Guide to Accounting  ·  253","Florida Contractors Manual  ·  3-107"],"lock":1},{"id":"3-93","exam":3,"num":93,"stem":"Which item below is not a fixed asset?","options":["Inventory","Land","Equipment","Trucks"],"answer":0,"topic":"acct","books":["BGA","FCM"],"cites":[{"book":"BGA","eds":null,"loc":"252"},{"book":"BGA","eds":null,"loc":"327"},{"book":"FCM","eds":null,"loc":"3-108"}],"exp":"**Inventory** is a current asset. Land, equipment and trucks are fixed (long-term) assets.","plain":"Inventory is a current asset. Land, equipment and trucks are fixed assets.","look":"Assets – Fixed vs. Current","ref":["Builder's Guide to Accounting  ·  252 or 327","Florida Contractors Manual  ·  3-108 (Long-Term Assets) Fixed assets are also referred to as long-term assets."]},{"id":"3-94","exam":3,"num":94,"stem":"According to Florida Unemployment Compensation Employer Handbook, Cafeteria Payment plans are exempt if they are __________.","options":["For Federal employees","Not Federally subsidized","Not reported to the Internal Revenue Service","Reported to the Internal Revenue Service"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-266"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"Per the Reemployment Tax handbook, cafeteria plan payments are exempt from reemployment tax if they're **not reported to the IRS** as wages.","plain":"Cafeteria plan payments are exempt if they aren't reported to the IRS as wages.","look":"Reemployment Tax – Cafeteria Plans","ref":["Florida Contractors Manual  ·  2025: 5-266","2021: 5-290","2017: 5-292"]},{"id":"3-95","exam":3,"num":95,"stem":"When using the inventory ratio method, a high ratio indicates __________.","options":["Average inventory","High inventory","High market average","Low inventory"],"answer":3,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"121"}],"exp":"A high inventory turnover ratio means **low inventory**.","plain":"A high inventory ratio means low inventory.","look":"Inventory Ratio","ref":["Builder's Guide to Accounting  ·  121"]},{"id":"3-96","exam":3,"num":96,"stem":"An equipment schedule shows that 60 dump trucks will be required in September and 15 dump trucks during October and November. You have 30 dump trucks available. You should attempt to __________.","options":["Simply let the contract extend over the required completion time","Buy 30 new dump trucks","Revise the project schedule to distribute the dump trucks evenly over the months so that 30 dump trucks are required","Work 30 trucks overtime during September using a second or third shift"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"Total truck-months needed = 60 + 15 + 15 = 90. Spread over 3 months, that's 30 a month, exactly the 30 trucks you have. **Revise the schedule to level the demand to 30 trucks**.","plain":"60 + 15 + 15 = 90 truck-months ÷ 3 = 30 a month. Spread the schedule so you only need the 30 trucks you have.","look":"Equipment – Leveling","calc":1,"ref":["Florida Contractors Manual  ·  10-27","30 (Sept.) + 15 (Oct.) + 15 (Nov.) = 60/3 months = 30 trucks per month"]},{"id":"3-97","exam":3,"num":97,"stem":"An employee discloses an employer's violations of law, which may pose a danger to public, health, safety, or welfare. The employee is protected from retaliation by the __________.","options":["Employees Legal Defense Fund","Federal Employees Act","Graham Employees Act","Public Whistle-blowers Act"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-45"}],"exp":"Florida's **Whistle-blower's Act** protects employees who disclose violations of law that endanger public health, safety or welfare from retaliation.","plain":"Report your boss for breaking the law, and the Whistle-blower's Act protects your job.","look":"Whistle-blower's Act","ref":["Florida Contractors Manual  ·  5-45"]},{"id":"3-98","exam":3,"num":98,"stem":"The Florida Aids Statute (FS 760.50) prohibits AIDS/HIV discrimination, and provides that persons with AIDS, ARC or HIV have the same protection as other disabled persons. This law applies to __________.","options":["All employers","Employers with 2 or more employees","Employers with 6 or more employees","Employers with 15 or more employees"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-44"}],"exp":"FS 760.50, Florida's AIDS/HIV discrimination law, applies to **all employers**, regardless of size.","laws":[["Fla. Stat. § 760.50","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0760/Sections/0760.50.html"]],"plain":"Florida's AIDS/HIV discrimination law applies to every employer, any size.","look":"AIDS/HIV Discrimination (FS 760.50)","ref":["Florida Contractors Manual  ·  5-44"]},{"id":"3-99","exam":3,"num":99,"stem":"Which activity is a construction job, as that term is used in the Worker's Compensation Statute?","options":["Roof replaceme
