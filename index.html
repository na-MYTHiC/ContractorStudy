nt","A homeowner's building their own premises","Well drilling on land containing existing structures","Manufacturing of materials used in construction work"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"6-6"}],"exp":"**Roof replacement** is construction work for workers' comp purposes. Homeowners building their own homes, manufacturing materials, and well drilling on land with existing structures are excluded.","laws":[["Fla. Stat. § 440.02","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.02.html"]],"plain":"Roof replacement is construction work for comp.","look":"Workers' Compensation – Construction Defined","ref":["Florida Contractors Manual  ·  6-6"]},{"id":"3-100","exam":3,"num":100,"stem":"If an owner makes payment to a contractor, without requiring waiver or release by a lienor who has filed a Notice to Owner, the payments are considered __________ payments.","options":["Improper","Refused","Unrecoverable","Non-essential"],"answer":0,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-75","stat":"713.06(2)(a)(c)"},{"book":"FCM","eds":["2021"],"loc":"9-72","stat":"713.06(2)(a)(c)"},{"book":"FCM","eds":["2017"],"loc":"9-76","stat":"713.06(2)(a)(c)"}],"exp":"§713.06: payments to the contractor without getting lien releases from lienors who served a Notice to Owner are **improper payments**. The owner may have to pay twice.","laws":[["Fla. Stat. § 713.06(2)(a)(c)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.06.html"]],"plain":"Paying the GC without getting lien releases from subs who sent an NTO is an \"improper payment.\" The owner may pay twice.","look":"Improper Payments (§713.06)","ref":["Florida Contractors Manual  ·  2025: 9-75: 713.06(2)(a)(c)","2021: 9-72: 713.06(2)(a)(c)","2017: 9-76: 713.06(2)(a)(c)"]},{"id":"3-101","exam":3,"num":101,"stem":"Given: A pick-up truck was originally purchased for $16,900.00. The accumulated depreciation of the pick-up truck shown on the books to date is $4,200.00. The pick-up truck was sold for $11,500.00. The resulting loss (or profit) from the sales of the pick-up truck that will be shown on the books is a __________.","options":["Loss of $1,200.00","Loss of $5,400.00","Profit of $5,600.00","Profit of $12,700.00"],"answer":0,"topic":"dep","books":["FCM","BGA"],"cites":[{"book":"FCM","eds":null,"loc":"3-34"},{"book":"BGA","eds":null,"loc":"162"}],"exp":"Book value = cost − accumulated depreciation = $16,900 − $4,200 = $12,700. Sold for $11,500, which is less than book value: **loss of $1,200**.","plain":"Book value is $16,900 − $4,200 = $12,700. Sold for $11,500, that's $1,200 less than book. A loss.","look":"Equipment – Sale (Gain/Loss)","tip":"Sale price minus book value: positive is a gain, negative is a loss.","calc":1,"ref":["Florida Contractors Manual  ·  3-34","Builder's Guide to Accounting  ·  162"]},{"id":"3-102","exam":3,"num":102,"stem":"Any certified contractor who allows his/her certificate to be used by an uncertified person with the intent to evade the provisions of this law may be fined a maximum of __________.","options":["$1,000.00","$5,000.00","$7,500.00","$10,000.00"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-202"},{"book":"FCM","eds":["2021"],"loc":"2-158"},{"book":"FCM","eds":["2017"],"loc":"2-184"}],"exp":"Letting an uncertified person use your certificate to evade the law can bring the maximum administrative fine of **$10,000**.","laws":[["Fla. Stat. § 489.129","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.129.html"]],"plain":"Letting someone use your license: fine up to $10,000.","look":"Penalties – Certificate Misuse","ref":["Florida Contractors Manual  ·  2025: 2-202","2021: 2-158","2017: 2-184"],"lock":1},{"id":"3-103","exam":3,"num":103,"stem":"If a corporation meets all the requirements specified by the Internal Revenue Service and elect to be taxed as a partnership rather than a corporation, the company is referred to as a (an) __________.","options":["Limited partnership","Employee stock Ownership Corporation","S Corporation","Joint Venture"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-11"},{"book":"FCM","eds":["2021"],"loc":"1-11"},{"book":"FCM","eds":["2021"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A corporation that meets IRS requirements and elects to be taxed like a partnership (pass-through) is an **S Corporation**.","plain":"A corporation taxed like a partnership is an S corp.","look":"S Corporation","ref":["Florida Contractors Manual  ·  2025: 1-11","2021: 1-11, 1-12","2017: 1-13"]},{"id":"3-104","exam":3,"num":104,"stem":"According to the Florida Construction Industry Licensing Law, each certified contractor shall display in all advertising medium used by the contractor his/her __________ number.","options":["Employer Identification","Insurance Policy","Certification","State Sales Tax"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-31","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2025"],"loc":"2-165","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-29","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2021"],"loc":"2-124","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-22","stat":"61G4-12.011(3)"},{"book":"FCM","eds":["2017"],"loc":"2-149","stat":"61G4-12.011(3)"}],"exp":"61G4-12.011: every certified contractor's advertising must show the **certificate (or registration) number**.","laws":[["Fla. Admin. Code R. 61G4-12.011(3)","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-12.011"]],"plain":"Every ad shows your certificate (license) number.","look":"Advertising – License Number (61G4-12.011)","ref":["Florida Contractors Manual  ·  2025: 2-31, 2-165: 61G4-12.011(3)","2021: 2-29, 2-124: 61G4-12.011(3)","2017: 2-22, 2-149: 61G4-12.011(3)"]},{"id":"3-105","exam":3,"num":105,"stem":"Service of a Notice to Owner or a preliminary Notice to Contractor is effective as of the date of mail if the Notice is mailed within __________ days after the date the lienor first furnishes labor, services, or materials.","options":["10","20","30","40"],"answer":3,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"9-92","stat":"713.18(2)(b)"},{"book":"FCM","eds":["2021"],"loc":"9-84","stat":"713.18(2)(b)"},{"book":"FCM","eds":["2017"],"loc":"9-101","stat":"713.18(2)(b)"}],"exp":"§713.18: a Notice to Owner or preliminary notice to contractor is effective on the mailing date if mailed within **40 days** of first furnishing. It must still be served within 45 days.","laws":[["Fla. Stat. § 713.18(2)(b)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.18.html"]],"plain":"An NTO mailed within 40 days counts from the mailing date.","look":"Notice to Owner – Service by Mail (§713.18)","ref":["Florida Contractors Manual  ·  2025: 9-92: 713.18(2)(b)","2021: 9-84: 713.18(2)(b)","2017: 9-101: 713.18(2)(b)"],"lock":1},{"id":"3-106","exam":3,"num":106,"stem":"Given: A contractor hires a day laborer at a rate of $35.00 for one day's work. The contractor uses the laborer for six days in one workweek. The laborer average 8-1/2 hours of work per day. The laborer is entitled to __________. Select the closest answer.","options":["A gross pay of $199.45 for the six days of work","A gross pay of $210.00 for the six days of work","A gross pay of $232.66 for the six days of work","A gross pay of $409.63 for the six days of work"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-21"}],"exp":"The day rate gives $210 for 51 hours = $4.12/hr, which is below the $7.25 minimum wage. So pay at minimum wage: 40 hrs × $7.25 = $290, plus overtime of 11 hrs × $7.25 × 1.5 = $119.63. Total **$409.63**.","laws":[["29 U.S.C. § 207","https://www.law.cornell.edu/uscode/text/29/207"]],"plain":"$210 ÷ 51 hours is under minimum wage, so pay $7.25: 40 hrs × $7.25 = $290, plus 11 OT hrs × $10.875 = $119.63. Total $409.63.","look":"FLSA – Day Rate / Overtime","tip":"Check the regular rate against minimum wage before figuring overtime.","calc":1,"ref":["Florida Contractor's Manual  ·  5-21","Total pay for 6 days x $35.00 = $210.00","Total hours worked 6 days x 8.5 hours = 51 hours","Employee's regular rate of pay - $210.00","$210.00 ÷ 51 hours = $4.12 per hour","Note: Federal minimum wage of $7.25 applies","Regular Pay = 40 hours x $7.25 = $290.00","Overtime = 11 hours x $7.25 x 1.5 = $119.63","Total pay = $290.00 + $119.63 = $409.63"]},{"id":"3-107","exam":3,"num":107,"stem":"Which of the following is considered a type of accrual?","options":["Cash or other payments received","Billings mailed out, but not yet paid","Anticipated profit from uncompleted work","Estimated cost of work not yet completed"],"answer":1,"topic":"acct","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"237"}],"exp":"**Billings mailed but not yet paid** (accounts receivable) are an accrual. The revenue is earned, but the cash hasn't come in.","plain":"Bills mailed but not paid yet (receivables) are an accrual.","look":"Accruals","ref":["Builder's Guide to Accounting  ·  11 or 237"]},{"id":"3-108","exam":3,"num":108,"stem":"The ratios used to judge the cash position of a company are called __________.","options":["Balance Ratios","Accruals","Combination Ratios","Liquidity Tests"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"174"}],"exp":"Ratios that judge cash position are **liquidity tests** (current ratio, quick ratio).","plain":"Ratios that check your cash position are called liquidity tests.","look":"Liquidity Tests","ref":["Builder's Guide to Accounting  ·  174"]},{"id":"3-109","exam":3,"num":109,"stem":"A company has estimated net income of $1,200,000.00. In order to achieve a margin of profit of 37%, the company's sales should be __________.","options":["$2,702,000.00","$2,444,000.00","$1,444,000.00","$3,243,243.00"],"answer":3,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"272"}],"exp":"Profit margin = net income ÷ sales, so sales = net income ÷ margin = $1,200,000 ÷ 0.37 = **$3,243,243**.","plain":"Sales = profit ÷ margin. $1,200,000 ÷ 0.37 = $3,243,243.","look":"Profit Margin","calc":1,"ref":["Builder's Guide to Accounting  ·  272","Net Income/Sales = Margin of profit","$1,200,000 / x = 37% = $3,243,243"],"lock":1},{"id":"3-110","exam":3,"num":110,"stem":"What is the term for the effective annual interest charged on the principal borrowed?","options":["Discount","Rate","Loan","Finance charge"],"answer":1,"topic":"cash","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-73"}],"exp":"The effective annual interest charged on the principal borrowed is the **rate**.","plain":"The yearly interest charged on what you borrowed is the \"rate.\"","look":"Interest Rate","ref":["Florida Contractors Manual  ·  3-73"]},{"id":"3-111","exam":3,"num":111,"stem":"According to the Florida \"Statute of Frauds\", the following contracts must be in writing to be enforceable except __________.","options":["A lease of real property for less than 1 year","A contract for the sale of real property","A contract that cannot be performed in less than one year","An agreement to submit disputes to arbitration"],"answer":0,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-7"}],"exp":"Florida's Statute of Frauds requires writing for real estate sales, contracts that can't be done within a year, and arbitration agreements. **A lease of real property for less than 1 year** can be oral.","laws":[["Fla. Stat. § 725.01","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0725/Sections/0725.01.html"]],"plain":"A lease under 1 year can be a handshake deal. The rest need to be in writing.","look":"Statute of Frauds","ref":["Florida Contractors Manual  ·  8-7"]},{"id":"3-112","exam":3,"num":112,"stem":"The break-even point __________.","options":["Distinguishes between the various yields of the different jobs and job types","Can help the contractor decide what kinds of work he or she needs to reach a volume goal","Encourages growth","Indicates the minimum sales you need to break even"],"answer":3,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"179"}],"exp":"The breakeven point **shows the minimum sales you need to break even** (no profit, no loss).","plain":"Break-even is the minimum sales you need to cover your costs.","look":"Break-Even Point","ref":["Builder's Guide to Accounting  ·  179"]},{"id":"3-113","exam":3,"num":113,"stem":"When a business is structured as a joint venture __________.","options":["An oral agreement between the parties is recommended","There must be a formal partnership agreement","Its activity is generally limited to a single transaction","Venture members have limited personal liability"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-10"},{"book":"FCM","eds":["2021"],"loc":"1-11"},{"book":"FCM","eds":["2017"],"loc":"1-12"},{"book":"FCM","eds":["2017"],"loc":"1-13"}],"exp":"A joint venture's activity is generally **limited to a single transaction or project**.","plain":"A joint venture is usually for one job.","look":"Joint Venture","ref":["Florida Contractors Manual  ·  2025: 1-10","2021: 1-10, 1-11","2017: 1-12, 1-13"]},{"id":"3-114","exam":3,"num":114,"stem":"A bid bond guarantees that when the contract is awarded, the bidder will __________.","options":["Submit a breakdown of the bid together with a list of subcontractors","Enter the contract at the bid price","Submit copies of all bid documents for the owner's review","Submit a statement of the contractor's qualifications and past performance"],"answer":1,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-105"},{"book":"FCM","eds":null,"loc":"4-13"},{"book":"FCM","eds":null,"loc":"10-73"}],"exp":"A bid bond guarantees the bidder will **enter into the contract at the bid price** (and provide the required bonds).","plain":"A bid bond promises you'll sign the contract at the price you bid.","look":"Bonds – Bid Bond","ref":["Florida Contractors Manual  ·  3-105, 4-13, 10-73"]},{"id":"3-115","exam":3,"num":115,"stem":"Which one of the following is an incentive to pay an invoice early or when due?","options":["Credit","Rebate","Discount","Additional contracts"],"answer":2,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"A **discount** for prompt payment is the incentive to pay early or on time.","plain":"A discount is the reward for paying early or on time.","look":"Discounts","ref":["Builder's Guide to Accounting  ·  59"]},{"id":"3-116","exam":3,"num":116,"stem":"All the following are examples of types of offers in construction contracts except __________.","options":["Bids","Purchase orders","Proposals","Negotiations"],"answer":3,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"8-5"}],"exp":"Bids, purchase orders and proposals are all offers. **Negotiations** are discussions, not offers.","plain":"Bids, POs and proposals are offers. Negotiating is just talking.","look":"Contracts – Offers","ref":["Florida Contractors Manual  ·  8-5"]},{"id":"3-117","exam":3,"num":117,"stem":"A concrete subcontractor is asked to provide a cost estimate to extend a concrete foundation from 60' x 80' to 80' x 100'. The contractor determines that the 60' x 80' foundation cost $4,500 and that the additional work would cost $1.25/sq. ft. extra. This method of estimating is called the __________.","options":["Approximate estimated method","Detailed survey method","Square footage method","Unit price method"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-12"}],"exp":"Pricing the extra work by area ($1.25 per added square foot) is the **square footage method**.","plain":"Pricing the extra slab by the square foot is the square footage method.","look":"Estimates – Square Footage Method","ref":["Florida Contractors Manual  ·  10-12"]},{"id":"3-118","exam":3,"num":118,"stem":"CSI Master Format divides the specifications into how many specific divisions?","options":["15","50","18","40"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-7"}],"exp":"CSI MasterFormat (2004 and later) has **50 divisions** (00–49). The old format had 16.","plain":"MasterFormat has 50 divisions now. The old version had 16.","look":"CSI MasterFormat","ref":["Florida Contractors Manual  ·  10-7"],"lock":1},{"id":"3-119","exam":3,"num":119,"stem":"Which is the best method to check an estimate in order to eliminate as many errors as possible?","options":["Have another estimator take the original estimate and recheck the figures and computations","Compare the original estimate with an estimate from a similar project","Perform the estimating process a second time and compare it with the initial estimate","Have another estimator make an independent estimate and compare it to the original estimate"],"answer":1,"topic":"est","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"11"},{"book":"BGA","eds":null,"loc":"225"}],"exp":"Per the Builder's Guide (p. 225), the recommended check is to **compare the estimate with one from a similar project**.","plain":"The book says check your estimate against one from a similar job.","look":"Estimates – Checking","ref":["Builder's Guide to Accounting  ·  11 or 225"]},{"id":"3-120","exam":3,"num":120,"stem":"The maximum penalty for knowingly making false statements, representations, or certification in any application, record, report, plan or other document filed as part of the OSHA requirements is a fine and term of imprisonment of not more than __________.","options":["$1,000 and 60 days","$5,000 and 6 months","$10,000 and 6 months","$100,000 and 1 year"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"7-17"}],"exp":"Knowingly making false statements in OSHA records or reports: up to **$10,000 and 6 months in jail**.","plain":"Lying on OSHA paperwork: up to $10,000 and 6 months in jail.","look":"OSHA – False Statements","ref":["Florida Contractors Manual  ·  7-17"]},{"id":"3-121","exam":3,"num":121,"stem":"What is the MAJOR difference between the various types of negotiated contracts, such as lump-sum, cost-plus or guaranteed maximum price?","options":["The relationship between the owner and the contractor","The relationship between the architect and the contractor","The provision regarding liability of the contractor","The provision regarding compensation of the contractor"],"answer":3,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-35"}],"exp":"Lump-sum, cost-plus and GMP contracts differ mainly in **how the contractor is paid** (compensation).","plain":"Lump sum, cost-plus and GMP differ in how the contractor gets paid.","look":"Contracts – Types","ref":["Florida Contractors Manual  ·  10-35"]},{"id":"3-122","exam":3,"num":122,"stem":"Some types of cost-plus contracts could be ___________________.","options":["Cost plus interest and cost-plus allowances","Cost plus fixed fee and cost-plus percentage of reimbursable costs","Cost plus inflation and cost-plus markup","Cost plus damages and cost-plus profit"],"answer":1,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-79"}],"exp":"Cost-plus contracts include **cost plus a fixed fee and cost plus a percentage of reimbursable costs**.","plain":"Cost-plus comes as cost plus a fixed fee, or cost plus a percentage.","look":"Contracts – Cost-Plus","ref":["Florida Contractors Manual  ·  3-79"]},{"id":"3-123","exam <script>
/* Study sessions (question by question) and Practice Tests (answers at the end): setup, run engine with time

   challenge codes, and the results screen. */
(function () {
  "use strict";
  var A = window.FBF, esc = A.esc, icon = A.icon, L = A.L, st = A.st, S = function () { return A.S; };

  /* ---------------------------------------------------------------- run lifecycle */
  A.getRun = function (id) { id = id || st.runId; return S().runs.filter(function (r) { return r.id === id; })[0] || null; };
  A.openRuns = function (kind) { return S().runs.filter(function (r) { return !kind || (kind === "study" ? r.mode === "study" : r.mode !== "study"); }); };

  A.newRun = function (o) {
    if (!o.ids || !o.ids.length) { A.toast("No questions match that. Try a different filter.", "info"); return; }
    var r = o.seed != null ? A.rng(o.seed ^ 0x9e3779b9) : null, order = {};
    o.ids.forEach(function (id) { order[id] = A.optOrder(A.QBY[id], o.shuffle == null ? S().settings.shuffle : o.shuffle, r); });
    var run = {
      id: A.uid(), mode: o.mode, title: o.title, ids: o.ids.slice(), order: order, picks: {}, flags: {}, hints: {}, guess: {}, qms: {}, xpQ: {},
      i: 0, limit: o.limit || 0, elapsed: 0, status: "active", created: Date.now(), from: o.from || (o.mode === "study" ? "study" : "test"),
      seed: o.seed == null ? null : o.seed, code: o.code || null, opp: o.opp == null ? null : o.opp, dailyKey: o.dailyKey || null,
      tag: o.tag || null, coach: o.coach == null ? S().settings.coach : o.coach, combo: 0, bestCombo: 0, xp: 0, showGrid: false, practice: !!o.practice
    };
    S().runs.push(run);
    // keep at most 6 unfinished sessions
    while (S().runs.length > 6) S().runs.shift();
    A.save();
    st.runId = run.id; st.runFrom = run.from; st.qStart = Date.now();
    A.go("run");
  };
  A.resumeRun = function (id) {
    var r = A.getRun(id); if (!r) return;
    r.status = "active"; st.runId = id; st.runFrom = r.from; st.qStart = Date.now();
    A.save(); A.go("run");
  };
  function pauseRun(r) {
    r.status = "paused"; r.pausedAt = Date.now(); A.save();

    A.go(r.from);
  }
  function removeRun(r) { S().runs = S().runs.filter(function (x) { return x !== r; }); }

  /** Finish a run: grade (tests), award XP, write history, optionally save unanswered questions as a new session. */
  function endRun(r, how) {

    stopTimer();
    var isStudy = r.mode === "study";
    var answered = r.ids.filter(function (id) { return r.picks[id] != null; });
    var leftover = r.ids.filter(function (id) { return r.picks[id] == null; });
    var complete = how === "submit" || (how === "timeup" && !isStudy) || !leftover.length;
    var right = 0, byTopic = {}, items = [], xp = 0, badgeT = Date.now();
    var scored = complete && !isStudy ? r.ids : answered;
    scored.forEach(function (id) {
      var q = A.QBY[id], p = r.picks[id], ok = p != null && p === A.ansIdx(q);

        else xp += ok ? 10 : 0;
        if (g.fixed) xp += 5;

    });

    if (!isStudy) {
      if (complete && n >= 20) { xp += 25; if (score >= S().settings.passPct / 100) xp += 50; if (score >= A.TARGET) xp += 100; }
      if (r.mode === "daily" && !r.practice && !S().daily[r.dailyKey]) { if (right === n) xp += 50; }
      if (r.mode === "challenge" && r.opp != null && right > r.opp) xp += 30;
      A.addXP(xp, "test");
    }
    var weakest = Object.keys(byTopic).filter(function (t) { return byTopic[t].n >= 2; }).sort(function (a, b) { return byTopic[a].c / byTopic[a].n - byTopic[b].c / byTopic[b].n; })[0];
    var h = {
      id: A.uid(), mode: isStudy ? "study" : "test", kind: r.tag || r.mode, title: r.title, at: Date.now(), n: n, total: r.ids.length, answered: answered.length, right: right, score: score,

  /** A reviewed question: your answer, the right one, plain English, where to find it. Used by results and Missed. */

  };

<script>
/* Math Lab problem generators: fresh numbers every time, each with a worked solution.
   Each make() returns {text, answer, choices (choices[0] is the answer), f (formatter), work}. */
(function () {
  "use strict";
  var A = window.FBF, rnd = A.rnd, pick = A.pick, money = A.money, art = A.art;
  function money0(v) { return money(Math.round(v)); }
  function pctf(v) { return (Math.round(v * 100) / 100).toFixed(2) + "%"; }
  var GEN = {
    sl_annual: { name: "Straight-line depreciation", make: function () {
      var cost = rnd(12, 300) * 1000, salv = Math.round(cost * rnd(5, 20) / 100 / 500) * 500, life = pick([5, 6, 7, 8, 10, 12, 15]);
      var a = (cost - salv) / life;
      return { text: "A piece of equipment costs " + money(cost) + ", has a salvage value of " + money(salv) + " and a useful life of " + life + " years. What is the annual straight-line depreciation?", answer: a, choices: [a, cost / life, (cost + salv) / life, (cost - salv) / (life - 1)], f: money0, work: "(Cost − Salvage) ÷ Life\n(" + money(cost) + " − " + money(salv) + ") ÷ " + life + " = " + money0(a) };
    } },
    sl_total: { name: "Accumulated depreciation", make: function () {
      var cost = rnd(30, 250) * 1000, salv = rnd(2, 30) * 1000, life = pick([8, 10, 12, 15]), yrs = rnd(2, life - 1);
      var a = (cost - salv) / life * yrs;
      return { text: "A tractor bought for " + money(cost) + " has a " + life + "-year life and " + money(salv) + " salvage value. Using straight line, what is total depreciation after " + yrs + " years?", answer: a, choices: [a, cost / life * yrs, (cost - salv) / life, (cost - salv) / life * (yrs + 1)], f: money0, work: "Annual = (" + money(cost) + " − " + money(salv) + ") ÷ " + life + " = " + money0((cost - salv) / life) + "\nTotal = " + money0((cost - salv) / life) + " × " + yrs + " = " + money0(a) };
    } },
    gainloss: { name: "Gain or loss on sale", make: function () {
      var cost = rnd(10, 80) * 1000 + rnd(0, 9) * 100, acc = Math.round(cost * rnd(15, 70) / 100 / 100) * 100, book = cost - acc;
      var sale = Math.round(book * (rnd(70, 130) / 100) / 100) * 100; if (sale === book) sale += 500;
      var g = sale - book;
      var lbl = function (v) { return (v >= 0 ? "Gain of " : "Loss of ") + money(Math.abs(v)); };
      return { text: "A truck was purchased for " + money(cost) + ". Accumulated depreciation on the books is " + money(acc) + ". It sells for " + money(sale) + ". What is the gain or loss?", answer: g, choices: [g, sale - cost, -g, sale - acc], f: lbl, work: "Book value = " + money(cost) + " − " + money(acc) + " = " + money(book) + "\nSale − Book = " + money(sale) + " − " + money(book) + " = " + lbl(g) };
    } },
    poc: { name: "Percentage of completion", make: function () {
      var ctd = rnd(50, 400) * 1000, ctc = rnd(30, 300) * 1000, total = ctd + ctc, price = Math.round(total * (1 + rnd(8, 25) / 100) / 1000) * 1000;
      var billed = Math.round(price * rnd(30, 80) / 100 / 1000) * 1000, p = ctd / total, earned = p * price;
      var kind = pick(["pct", "earned", "over"]);
      if (kind === "pct") return { text: "Cost of work completed is " + money(ctd) + ". Estimated cost to complete is " + money(ctc) + ". What percentage of the job is complete?", answer: p * 100, choices: [p * 100, ctd / price * 100, ctc / total * 100, ctd / ctc * 100 > 100 ? 100 - p * 100 : ctd / ctc * 100], f: pctf, work: "Cost to date ÷ Total estimated cost\n" + money(ctd) + " ÷ (" + money(ctd) + " + " + money(ctc) + ") = " + money(ctd) + " ÷ " + money(total) + " = " + pctf(p * 100) };
      if (kind === "earned") return { text: "Contract price " + money(price) + ". Cost to date " + money(ctd) + ", estimated cost to complete " + money(ctc) + ". Using percentage of completion, how much revenue has been earned?", answer: earned, choices: [earned, ctd, price - ctc, p * total], f: money0, work: "% complete = " + money(ctd) + " ÷ " + money(total) + " = " + pctf(p * 100) + "\nEarned = " + pctf(p * 100) + " × " + money(price) + " = " + money0(earned) };
      var d = billed - earned;
      var lbl = function (v) { return Math.abs(v) < 1 ? "Billed exactly what was earned" : v > 0 ? "Overbilled by " + money0(v) : "Underbilled by " + money0(-v); };
      return { text: "Contract price " + money(price) + ". Cost to date " + money(ctd) + ", estimated cost to complete " + money(ctc) + ". You have billed " + money(billed) + ". Are you over- or underbilled, and by how much?", answer: d, choices: [d, -d, billed - ctd, billed - price * 0.5], f: lbl, work: "Earned = (" + money(ctd) + " ÷ " + money(total) + ") × " + money(price) + " = " + money0(earned) + "\nBilled − Earned = " + money(billed) + " − " + money0(earned) + " → " + lbl(d) + "\n(Overbilled = unearned income, a liability. Underbilled = earned more than paid, an asset.)" };
    } },
    markup: { name: "Contract price with profit", make: function () {
      var a = rnd(20, 200) * 1000, b = rnd(20, 200) * 1000, p = pick([8, 10, 12, 15, 18, 20, 25]), tot = a + b, ans = tot * (1 + p / 100);
      return { text: "Cost to date is " + money(a) + " and estimated cost to complete is " + money(b) + ". For " + art(p) + " " + p + "% profit (on cost), what should the contract price be?", answer: ans, choices: [ans, tot, b * (1 + p / 100) + a, tot / (1 - p / 100)], f: money0, work: "Total cost = " + money(a) + " + " + money(b) + " = " + money(tot) + "\nPrice = " + money(tot) + " × " + (1 + p / 100).toFixed(2) + " = " + money0(ans) };
    } },
    interest: { name: "Simple interest", make: function () {
      var P = rnd(2, 40) * 10000, r = pick([5, 6, 7, 7.5, 8, 9, 10, 12]), m = pick([3, 4, 6, 8, 9, 18]), i = P * r / 100 * m / 12;
      return { text: "A " + money(P) + " loan at " + r + "% annual interest is repaid after " + m + " months. How much interest is paid?", answer: i, choices: [i, P * r / 100, P * r / 100 * m, P * r / 100 * 12 / m], f: money0, work: "Principal × Rate × (Months ÷ 12)\n" + money(P) + " × " + (r / 100) + " × " + m + "/12 = " + money0(i) };
    } },
    current: { name: "Current ratio", make: function () {
      var cl = rnd(40, 400) * 1000, ca = Math.round(cl * rnd(80, 350) / 100 / 1000) * 1000, r = ca / cl;
      var f = function (v) { return v.toFixed(2) + " to 1"; };
      return { text: "Current assets are " + money(ca) + " and current liabilities are " + money(cl) + ". What is the current ratio?", answer: r, choices: [r, cl / ca, (ca - cl) / cl, ca / (ca + cl)], f: f, work: "Current assets ÷ Current liabilities\n" + money(ca) + " ÷ " + money(cl) + " = " + f(r) };
    } },
    margin: { name: "Sales needed for a profit margin", make: function () {
      var ni = rnd(10, 300) * 10000, m = pick([5, 8, 10, 12, 15, 20, 25, 30, 37]), s = ni / (m / 100);
      return { text: "A company expects net income of " + money(ni) + ". To achieve " + art(m) + " " + m + "% profit margin, what must sales be?", answer: s, choices: [s, ni * (1 + m / 100), ni / (1 - m / 100), ni * m / 10], f: money0, work: "Margin = Net income ÷ Sales  →  Sales = Net income ÷ Margin\n" + money(ni) + " ÷ " + (m / 100) + " = " + money0(s) };
    } },
    breakeven: { name: "Breakeven sales", make: function () {
      var fo = rnd(10, 90) * 10000, gm = pick([15, 18, 20, 22, 25, 30]), be = fo / (gm / 100);
      return { text: "Annual fixed overhead is " + money(fo) + " and gross profit is " + gm + "% of sales. What sales volume is needed to break even?", answer: be, choices: [be, fo * (1 + gm / 100), fo / (1 - gm / 100), fo * gm / 10], f: money0, work: "Breakeven sales = Fixed overhead ÷ Gross profit %\n" + money(fo) + " ÷ " + (gm / 100) + " = " + money0(be) };
    } },
    daypay: { name: "Day-rate pay & overtime", make: function () {
      var rate = pick([35, 45, 60, 80, 120, 160]), days = pick([5, 6]), hrs = pick(days === 5 ? [9, 9.5, 10] : [8, 8.5, 9, 10]), H = days * hrs, total = rate * days;
      var rr = total / H, ot = Math.max(0, H - 40), ans, work;
      if (rr < 7.25) { ans = 40 * 7.25 + ot * 7.25 * 1.5; work = "Regular rate = " + money(total) + " ÷ " + H + " hrs = " + money(rr, 2) + "/hr, below the $7.25 minimum, so use $7.25\n40 × $7.25 = $290.00\nOT: " + ot + " × $7.25 × 1.5 = " + money(ot * 10.875, 2) + "\nTotal = " + money(ans, 2); }
      else { ans = total + ot * rr * 0.5; work = "Day-rate pay = " + rate + " × " + days + " = " + money(total) + " (covers straight time for all hours)\nRegular rate = " + money(total) + " ÷ " + H + " = " + money(rr, 2) + "/hr\nOT premium = " + ot + " hrs × " + money(rr, 2) + " × 0.5 = " + money(ot * rr * 0.5, 2) + "\nTotal = " + money(ans, 2); }
      return { text: "A laborer is paid a day rate of " + money(rate) + " and works " + days + " days at " + hrs + " hours a day in one workweek. What is the minimum gross pay under the FLSA?", answer: ans, choices: [ans, total, total + ot * rr * 1.5, H * 7.25], f: function (v) { return money(v, 2); }, work: work };
    } },
    salestax: { name: "Sales tax journal entry", make: function () {
      var price = rnd(2, 90) * 50, r = pick([6, 6.5, 7, 7.5]), tax = price * r / 100;
      var kind = pick(["tax", "debit"]);
      if (kind === "tax") return { text: "You sell an item for " + money(price) + " to a non-exempt customer. Sales tax is " + r + "%. What is the credit to Sales Tax Payable?", answer: tax, choices: [tax, price + tax, price * r, 0], f: function (v) { return money(v, 2); }, work: "Dr Accounts Receivable " + money(price + tax, 2) + "\n   Cr Sales " + money(price, 2) + "\n   Cr Sales Tax Payable " + money(tax, 2) + "  (" + money(price) + " × " + r + "%)" };
      return { text: "You sell an item for " + money(price) + " on account. Sales tax is " + r + "%. What is the debit to Accounts Receivable?", answer: price + tax, choices: [price + tax, price, tax, price - tax], f: function (v) { return money(v, 2); }, work: "Dr Accounts Receivable " + money(price + tax, 2) + "\n   Cr Sales " + money(price, 2) + "\n   Cr Sales Tax Payable " + money(tax, 2) };
    } },
    deadlines: { name: "Deadline dates", make: function () {
      var base = new Date(new Date().getFullYear(), rnd(0, 11), rnd(1, 28));
      var fmt = function (d) { return d.toLocaleDateString("en-US", { month: "long", day: "numeric" }); };
      var add = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
      var kind = pick(["claim", "nto", "lien", "concealed"]);
      if (kind === "claim") {
        var disc = add(base, rnd(1, 9)), due = add(disc, 21);
        return { text: "Under A201, a condition giving rise to a claim occurs on " + fmt(base) + " and the contractor discovers it on " + fmt(disc) + ". By when must the claim be initiated?", answer: due.getTime(), choices: [due.getTime(), add(base, 21).getTime(), add(disc, 14).getTime(), add(disc, 30).getTime()], f: function (v) { return fmt(new Date(v)); }, work: "21 days from the later of the event or discovery\n" + fmt(disc) + " + 21 days = " + fmt(due) };
      }
      if (kind === "concealed") {
        var d2 = add(base, 14);
        return { text: "A contractor first observes a concealed subsurface condition on " + fmt(base) + ". Under A201, notice must be given no later than…", answer: d2.getTime(), choices: [d2.getTime(), add(base, 10).getTime(), add(base, 21).getTime(), add(base, 7).getTime()], f: function (v) { return fmt(new Date(v)); }, work: "Concealed conditions: notice to Owner and Architect within 14 days of first observing\n" + fmt(base) + " + 14 = " + fmt(d2) };
      }
      if (kind === "nto") {
        var d3 = add(base, 45);
        return { text: "A supplier with no direct contract with the owner first delivers materials on " + fmt(base) + ". What's the last day to serve the Notice to Owner?", answer: d3.getTime(), choices: [d3.getTime(), add(base, 40).getTime(), add(base, 90).getTime(), add(base, 30).getTime()], f: function (v) { return fmt(new Date(v)); }, work: "Notice to Owner: within 45 days of first furnishing\n" + fmt(base) + " + 45 = " + fmt(d3) };
      }
      var d4 = add(base, 90);
      return { text: "A subcontractor's final furnishing of labor was " + fmt(base) + ". What is the last day to record a claim of lien?", answer: d4.getTime(), choices: [d4.getTime(), add(base, 45).getTime(), add(base, 60).getTime(), add(base, 365).getTime()], f: function (v) { return fmt(new Date(v)); }, work: "Claim of lien: within 90 days after final furnishing\n" + fmt(base) + " + 90 = " + fmt(d4) };
    } },
    level: { name: "Equipment leveling", make: function () {
      var have = pick([10, 12, 15, 20, 24, 30]), months = 3, need = [];
      var total = have * months;
      var a = rnd(Math.round(total * 0.45), Math.round(total * 0.7)), b = Math.floor((total - a) / 2), c = total - a - b; need = [a, b, c];
      return { text: "An equipment schedule calls for " + need[0] + " trucks in month 1, " + need[1] + " in month 2 and " + need[2] + " in month 3. If the schedule is leveled across the 3 months, how many trucks are needed each month?", answer: have, choices: [have, need[0], Math.round(need[0] / 2), Math.max.apply(null, need) - Math.min.apply(null, need)], f: function (v) { return v + " trucks"; }, work: "(" + need.join(" + ") + ") ÷ 3 = " + total + " ÷ 3 = " + have + " trucks per month" };
    } }
  };
  A.GEN = GEN;
  /** Regenerate until the four choices are distinct once formatted. */
  A.makeProblem = function (t) {
    for (var guard = 0; guard < 40; guard++) {
      var p = GEN[t].make(), seen = {}, ok = true;
      p.choices.forEach(function (c) { var k = p.f(c); if (seen[k] || !isFinite(c)) ok = false; seen[k] = 1; });
      if (ok && p.choices.length === 4) return p;
    }
    return null;
  };
})();

  A.V.settings = function () {
    var s = S().settings, c = A.cloud;
    var seg = function (key, opts) { return '<div class="seg">' + opts.map(function (o) { return '<button data-act="setSeg" data-k="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (String(s[key]) === String(o[0])) + '">' + (o[2] ? icon(o[2]) : "") + "<span>" + o[1] + "</span></button>"; }).join("") + "</div>"; };
    return '<header class="page-head"><div class="eyebrow">Settings</div><h1>Settings</h1></header>' +
      '<section class="card stack lg"><h3>Look &amp; feel</h3><div class="setrow"><span><strong>Theme</strong><span class="small muted">Light, dark, or match your device</span></span>' + seg("theme", [["system", "Auto", "auto"], ["light", "Light", "sun"], ["dark", "Dark", "moon"]]) + '</div><div class="setrow"><span><strong>Layout</strong><span class="small muted">Phone layout puts navigation at the bottom. Desktop adds a sidebar.</span></span>' + seg("layout", [["auto", "Auto", "auto"], ["phone", "Phone", "phone"], ["desktop", "Desktop", "desktop"]]) + '</div><div class="setrow"><span><strong>Text size</strong><span class="small muted">Bigger text for easier reading</span></span>' + seg("text", [["md", "Normal", ""], ["lg", "Large", ""], ["xl", "Extra large", ""]]) + "</div></section>" +
      '<section class="card stack lg"><h3>Studying</h3><div class="grid2"><div class="field"><label for="sDate">Exam date</label><input type="date" id="sDate" data-change="setVal" data-k="examDate" value="' + esc(s.examDate) + '"></div><div class="field"><label for="sGoal">Daily question goal</label><input type="number" id="sGoal" min="5" max="400" step="5" data-change="setNum" data-k="goal" value="' + s.goal + '"></div><div class="field"><label for="sEd">Contractors Manual edition</label><select id="sEd" data-change="edition">' + ["2025", "2021", "2017"].map(function (e) { return "<option" + (s.edition === e ? " selected" : "") + ">" + e + "</option>"; }).join("") + '</select><span class="tiny muted">Sets the page numbers shown and the answers for the 2 edition-dependent questions.</span></div><div class="field"><label for="sName">Username (leaderboard &amp; shared results)</label><input type="text" id="sName" data-change="setName" value="' + esc(s.name) + '" maxlength="20" autocomplete="nickname"></div></div>' +
      '<div class="toggles"><label class="toggle"><input type="checkbox" data-change="setBool" data-k="coach"' + (s.coach ? " checked" : "") + '><span><strong>Lookup Coach</strong><span class="small muted">“Where do I look?” button in Study</span></span></label><label class="toggle"><input type="checkbox" data-change="setBool" data-k="traps"' + (s.traps ? " checked" : "") + '><span><strong>Highlight trap words</strong><span class="small muted">NOT, EXCEPT, never, least</span></span></label><label class="toggle"><input type="checkbox" data-change="setBool" data-k="shuffle"' + (s.shuffle ? " checked" : "") + '><span><strong>Shuffle answer choices</strong><span class="small muted">Printed practice exams always keep the original order</span></span></label></div></section>' +
      '<section class="card stack lg"><h3>Exam simulation</h3><p class="small muted" style="margin:0">Match these to your Candidate Information Bulletin.</p><div class="grid3"><div class="field"><label for="sCount">Questions</label><input type="number" id="sCount" min="20" max="300" data-change="setNum" data-k="simCount" value="' + s.simCount + '"></div><div class="field"><label for="sMin">Time limit (minutes)</label><input type="number" id="sMin" min="10" max="900" data-change="setNum" data-k="simMinutes" value="' + s.simMinutes + '"></div><div class="field"><label for="sPass">Passing score (%)</label><input type="number" id="sPass" min="50" max="100" data-change="setNum" data-k="passPct" value="' + s.passPct + '"></div></div></section>' +
      '<section class="card stack"><h3>Your saved progress</h3><p class="small" style="margin:0">' + (c && c.on ? icon("check") + " <strong>Saved to your account.</strong> Your progress follows you to any device where you open this app while signed in. A copy is also kept in this browser." : "<strong>Saved in this browser on this device.</strong> " + (A.storageOK ? "It’s remembered between visits." : "Storage is blocked here, so progress only lasts until you close the page.") + " To move to another device, copy a backup code and restore it there.") + '</p><div class="row tight"><button class="btn" data-act="exportCopy">' + icon("copy") + 'Copy backup code</button><button class="btn" data-act="exportShow">Show backup code</button>' + /*DL*/'<button class="btn" data-act="exportFile">Download backup file</button>' + /*/DL*/'</div><div class="field"><label for="importBox">Restore from a backup code</label><textarea id="importBox" rows="3" placeholder="Paste a backup code here"></textarea></div><div class="row tight"><button class="btn primary" data-act="importPaste">Restore</button><label class="btn">Restore from file<input type="file" accept=".json,application/json" data-change="importFile" hidden></label></div></section>' +
      '<section class="card stack"><h3>Start over</h3><p class="small muted" style="margin:0">Erases every answer, XP, badge, test, flag, note and tab check.</p><div><button class="btn danger" data-act="resetAll">Reset all progress</button></div></section>';
  };
  A.ACT.setSeg = function (el) { S().settings[el.dataset.k] = el.dataset.v; A.save(); A.rerenderKeep(); };
  A.CHANGE.setBool = function (el) { S().settings[el.dataset.k] = el.checked; A.save(); if (A.st.view === "run") A.render(); };
  A.CHANGE.setVal = function (el) { S().settings[el.dataset.k] = el.value; A.save(); A.toast("Saved", "info", "check"); };
  A.CHANGE.setNum = function (el) {
    var k = el.dataset.k, v = +el.value, lim = { goal: [5, 400, 40], simCount: [20, 330, 120], simMinutes: [10, 900, 420], passPct: [50, 100, 70] }[k];
    S().settings[k] = Math.min(lim[1], Math.max(lim[0], v || lim[2])); A.save();
  };
  A.CHANGE.edition = function (el) { S().settings.edition = el.value; A.save(); A.rerenderKeep(); A.toast("Edition set to " + el.value, "info", "book"); };
  function exportCode() { return JSON.stringify({ app: "fbf-study", v: 2, at: Date.now(), data: S() }); }
  A.ACT.exportCopy = function () { A.copy(exportCode(), "Backup code copied. Paste it somewhere safe."); };
  A.ACT.exportShow = function () { A.modal({ title: "Backup code", html: '<textarea class="copybox" id="copybox" readonly>' + esc(exportCode()) + '</textarea><p class="small muted">Select all and copy. Paste it into Settings on another device to restore.</p>', actions: [{ label: "Done", cls: "primary" }], noFocus: true }); setTimeout(function () { var b = document.getElementById("copybox"); if (b) { b.focus(); b.select(); } }, 30); };
  /*DL*/A.ACT.exportFile = function () { try { var blob = new Blob([exportCode()], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fl-bf-progress-" + A.todayKey() + ".json"; document.body.appendChild(a); a.click(); a.remove(); A.toast("Download started", "info"); } catch (e) { A.ACT.exportShow(); } };/*/DL*/
  A.ACT.importPaste = function () { doImport((document.getElementById("importBox") || {}).value || ""); };
  A.CHANGE.importFile = function (el) { var f = el.files && el.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { doImport(String(r.result)); }; r.readAsText(f); };
  function doImport(text) {
    try {
      var obj = JSON.parse(text.trim()), d = obj.data || obj;
      if (!d || typeof d.q !== "object") throw new Error("bad");
      A.confirm("Restore this backup?", "This replaces the progress here with the backup (" + Object.keys(d.q).length + " questions tracked).", "Restore", function () {
        A.S = d.v === 2 ? A.normalize(d) : (function () { try { localStorage.setItem("fbf-study-v1", JSON.stringify(d)); localStorage.removeItem("fbf-study-v2"); } catch (e) { /* ignore */ } return A.load(); })();
        A.save(); A.toast("Progress restored", "info", "check"); A.go("home");
      });
    } catch (e) { A.toast("That doesn’t look like a backup code. Copy the whole thing and try again.", "info"); }
  }
  A.ACT.resetAll = function () { A.confirm("Reset all progress?", "This erases everything: answers, XP, badges, tests, flags, notes and tabs. It can’t be undone.", "Erase everything", function () { var keep = S().settings; A.S = A.defaults(); A.S.settings = keep; A.save(); st.cards = null; st.math = null; st.fs = null; A.toast("Progress reset", "info"); A.go("home"); }, true); };
})();

</script>
<script>
/* Leaderboard + saved progress across devices.
   Three ways the crew board can work, picked automatically:
   1. "artifact": the app is opened from its claude.ai link. Progress is saved to the person's account and
      the board lives in the artifact's shared database.
   2. "server": a free Supabase project is configured in config.js (see LEADERBOARD.md). Usernames and
      scores are shared live between everyone who opens the GitHub Pages link.
   3. "cards": no server. Friends swap score-card codes and the board is built on each device.
   Rows are normalized to {id, name, me, xp, level, rank, streak, mastered, bestTest, tests, daily, recent}. */
(function () {
  "use strict";
  var A = window.FBF;
  var B = (A.board = { mode: "cards", status: "off", rows: [], error: "" });
  var C = (A.cloud = { on: false, uid: null, names: {}, colors: {} }); // artifact-only details

  /* ---------------------------------------------------------------- shared helpers */
  function myRow() {
    var S = A.S, lv = A.levelInfo(), o = A.overall(), tests = A.tests(), daily = {};
    Object.keys(S.daily).sort().slice(-14).forEach(function (k) { daily[k] = { s: S.daily[k].s, n: S.daily[k].n, ms: S.daily[k].ms }; });
    var recent = S.history.slice(-8).map(function (h) {
      var p = h.n ? Math.round((100 * h.right) / h.n) : 0;
      var txt = h.kind === "daily" ? "scored " + h.right + "/" + h.n + " on " + h.title : h.mode === "test" ? (h.partial ? "graded " + h.n + " questions of " + h.title + " (" + p + "%)" : "scored " + p + "% on " + h.title) : "studied " + h.answered + " questions (" + p + "% right)";
      return { txt: txt, at: h.at };
    });
    return { username: S.settings.name || "", xp: S.xp, level: lv.n, rank: lv.name, streak: A.streak(), mastered: o.mastered, seen: o.seen, bestTest: tests.reduce(function (m, t) { return Math.max(m, t.score); }, 0), tests: tests.length, daily: daily, recent: recent, badges: Object.keys(S.badges).length, updatedAt: Date.now() };
  }
  A.myRow = myRow;
  function rerenderBoard() { if (A.st.view === "crew") A.rerenderKeep(); }

  /* ---------------------------------------------------------------- 3. score cards (works everywhere) */
  function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }
  A.myCard = function () {
    var r = myRow(), k = A.todayKey(), d = A.S.daily[k];
    var o = { u: r.username || "Me", x: r.xp, l: r.level, s: r.streak, m: r.mastered, b: Math.round(r.bestTest * 100), t: r.tests, at: Date.now() };
    if (d) o.d = [k, d.s, d.n, d.ms];
    return "FBF1." + b64e(JSON.stringify(o));
  };
  A.addCards = function (text) {
    var found = String(text || "").match(/FBF1\.[A-Za-z0-9_-]+/g) || [], added = 0;
    A.S.friends = A.S.friends || {};
    found.forEach(function (code) {
      try {
        var o = JSON.parse(b64d(code.slice(5)));
        if (!o || typeof o.u !== "string" || typeof o.x !== "number") return;
        var key = o.u.trim().toLowerCase().slice(0, 24);
        if (key === (A.S.settings.name || "").toLowerCase()) return;
        var prev = A.S.friends[key];
        if (!prev || (prev.at || 0) <= (o.at || 0)) { A.S.friends[key] = o; added++; }
      } catch (e) { /* skip bad code */ }
    });
    A.save();
    return { found: found.length, added: added };
  };
  function cardRows() {
    var rows = [], me = myRow(), fr = A.S.friends || {};
    rows.push(Object.assign({ id: "me", name: me.username || "You", me: true }, me));
    Object.keys(fr).forEach(function (k) {
      var o = fr[k], daily = {};
      if (o.d) daily[o.d[0]] = { s: o.d[1], n: o.d[2], ms: o.d[3] };
      rows.push({ id: "card-" + k, name: o.u, me: false, xp: o.x, level: o.l, rank: (A.LEVELS[(o.l || 1) - 1] || [0, ""])[1], streak: o.s, mastered: o.m, bestTest: (o.b || 0) / 100, tests: o.t, daily: daily, recent: [], updatedAt: o.at, card: true });
    });
    return rows;
  }

  /* ---------------------------------------------------------------- 2. Supabase server (GitHub Pages link) */
  var CFG = window.FBF_LEADERBOARD || null;
  function serverOn() { return !!(CFG && CFG.url && CFG.key && /^https:\/\//.test(CFG.url)); }
  function player() {
    var p = A.S.player;
    if (!p || !p.id) {
      var hex = function (n) { var a = new Uint8Array(n); (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.random() * 256; }); return Array.from(a).map(function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); };
      var h = hex(16);
      p = A.S.player = { id: h.slice(0, 8) + "-" + h.slice(8, 12) + "-4" + h.slice(13, 16) + "-a" + h.slice(17, 20) + "-" + h.slice(20, 32), secret: hex(24) };
      A.saveLocal();
    }
    return p;
  }
  function api(path, opts) {
    opts = opts || {};
    return fetch(CFG.url.replace(/\/$/, "") + "/rest/v1/" + path, {
      method: opts.method || "GET",
      headers: Object.assign({ apikey: CFG.key, "Content-Type": "application/json", Accept: "application/json" }, /^eyJ/.test(CFG.key) ? { Authorization: "Bearer " + CFG.key } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
        if (!r.ok) { var err = new Error((j && (j.message || j.hint)) || "HTTP " + r.status); err.status = r.status; err.body = j; throw err; }
        return j;
      });
    });
  }
  var pollT = null, pubT = null, pubBusy = false, pubAgain = false;
  function serverFetch() {
    if (!serverOn()) return Promise.resolve();
    B.status = B.rows.length ? "on" : "connecting";
    return api("leaderboard?select=*&order=xp.desc&limit=300").then(function (rows) {
      var me = player().id;
      B.rows = (rows || []).map(function (r) { return { id: r.id, name: r.username, me: r.id === me, xp: r.xp, level: r.level, rank: r.rank, streak: r.streak, mastered: r.mastered, bestTest: r.best_test, tests: r.tests, daily: r.daily || {}, recent: r.recent || [], updatedAt: Date.parse(r.updated_at) || 0 }; });
      B.status = "on"; B.error = "";
      rerenderBoard();
    }).catch(function (e) { B.status = "error"; B.error = "Couldn’t reach the leaderboard (" + e.message + ")."; rerenderBoard(); });
  }
  function serverPublish() {
    if (!serverOn() || !A.S.settings.name) return;
    if (pubBusy) { pubAgain = true; return; }
    pubBusy = true;
    var p = player(), row = myRow();
    api("rpc/upsert_player", { method: "POST", body: { p_id: p.id, p_secret: p.secret, p_username: A.S.settings.name, p_data: row } }).then(function () {
      A.S.player.posted = A.S.settings.name; A.saveLocal(); B.taken = false; done(); serverFetch();
    }, function (e) {
      var msg = (e.body && e.body.message) || e.message || "";
      if (/username_taken/.test(msg)) { B.taken = true; A.toast("That username is taken on the leaderboard. Pick another in Crew.", "info", "crew"); rerenderBoard(); }
      else if (/not_owner/.test(msg)) { B.error = "This device’s leaderboard key doesn’t match. Restore your backup code to keep your spot."; }
      done();
    });
    function done() { pubBusy = false; if (pubAgain) { pubAgain = false; A.crewPublish(); } }
  }

  /* ---------------------------------------------------------------- 1. claude.ai artifact (account storage + shared db) */
  function capOK() { return window.claude && typeof window.claude.use === "function"; }
  function artifactInit() {
    B.status = "connecting";
    Promise.all([window.claude.use("user"), window.claude.use("db")]).then(function (res) {
      var user = res[0], db = res[1];
      if (!user || !db) return fallback();
      return user.id().then(function (uid) {
        if (!uid) return fallback();
        C.uid = uid; C.db = db; C.user = user;
        return user.me().then(function (me) {
          C.name = me.name || ""; C.avatar = me.avatarUrl || "";
          return db.doc("data/users/" + uid + "/progress").get();
        }).then(function (snap) {
          if (snap && snap.exists) {
            try {
              var d = snap.data(), remote = d && d.state ? JSON.parse(d.state) : null;
              if (remote && (remote.savedAt || 0) > (A.S.savedAt || 0) + 1000) { A.S = A.normalize(remote); A.saveLocal(); A.toast("Progress loaded from your account", "info", "check"); }
            } catch (e) { /* ignore a malformed copy */ }
          }
          C.on = true; B.mode = "artifact"; B.status = "on";
          C.unsub = db.collection("crew").limit(300).onSnapshot(function (qs) {
            var docs = qs.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); });
            resolveNames(docs).then(function () {
              B.rows = docs.map(function (r) { return { id: r.uid, name: r.username || C.names[r.uid] || "Crew member", color: C.colors[r.uid], me: r.uid === C.uid, xp: r.xp, level: r.level, rank: r.rank, streak: r.streak, mastered: r.mastered, bestTest: r.bestTest, tests: r.tests, daily: r.daily || {}, recent: r.recent || [], updatedAt: r.updatedAt }; });
              rerenderBoard();
            });
          }, function () { C.unsub = null; });
          A.cloudSave(true); A.crewPublish();
          if (A.st.view !== "run") A.rerenderKeep();
        });
      });
    }).catch(fallback);
    function fallback() { B.mode = serverOn() ? "server" : "cards"; B.status = serverOn() ? "connecting" : "off"; if (serverOn()) serverFetch(); }
  }
  function resolveNames(docs) {
    var ids = docs.map(function (r) { return r.uid; });
    if (!ids.length || !C.user) return Promise.resolve();
    return C.user.profiles(ids).then(function (ps) { ids.forEach(function (id) { var p = ps[id]; if (p) { C.names[id] = p.name || ""; C.colors[id] = p.color; } }); }).catch(function () { /* generic names */ });
  }
  var saveTimer = null, inFlight = false, again = false;
  A.cloudSave = function (now) {
    if (!C.on || C.readOnly) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, now ? 50 : 4000);
  };
  function snapshotState() {
    var json = JSON.stringify(A.S);
    if (json.length > 230000) {
      var copy = JSON.parse(json);
      copy.history = copy.history.slice(-40).map(function (h, i, arr) { if (i < arr.length - 10) h.items = []; return h; });
      json = JSON.stringify(copy);
    }
    return json;
  }
  function flush() {
    if (inFlight) { again = true; return; }
    inFlight = true;
    C.db.doc("data/users/" + C.uid + "/progress").set({ state: snapshotState(), savedAt: A.S.savedAt || Date.now() }).then(done, function (e) { if (e && e.code === "invalid_argument") C.readOnly = true; done(); });
    function done() { inFlight = false; if (again) { again = false; A.cloudSave(); } }
  }
  function artifactPublish() {
    if (pubBusy) { pubAgain = true; return; }
    pubBusy = true;
    C.db.doc("crew/" + C.uid).set(myRow()).then(fin, function (e) { if (e && e.code === "invalid_argument") C.crewRO = true; fin(); });
    function fin() { pubBusy = false; if (pubAgain) { pubAgain = false; A.crewPublish(); } }
  }
  window.addEventListener("pagehide", function () { if (C.on && !C.readOnly) { clearTimeout(saveTimer); flush(); } });

  /* ---------------------------------------------------------------- public API */
  A.crewPublish = function () {
    clearTimeout(pubT);
    pubT = setTimeout(function () {
      if (B.mode === "artifact" && C.on && !C.crewRO) artifactPublish();
      else if (B.mode === "server") serverPublish();
    }, 2000);
  };
  A.boardRows = function () { return B.mode === "cards" ? cardRows() : B.rows; };
  A.boardRefresh = function () { if (B.mode === "server") serverFetch(); };
  A.cloudInit = function () {
    if (capOK()) { artifactInit(); return; }
    if (serverOn()) {
      B.mode = "server"; B.status = "connecting";
      serverFetch(); A.crewPublish();
      clearInterval(pollT);
      pollT = setInterval(function () { if (!document.hidden && (A.st.view === "crew" || A.st.view === "home")) serverFetch(); }, 60000);
    }
  };
  A.AFTER.crew = function () { if (B.mode === "server" && Date.now() - (B.fetchedAt || 0) > 15000) { B.fetchedAt = Date.now(); serverFetch(); } };
})();

</script>
