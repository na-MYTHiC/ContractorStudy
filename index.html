<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FL Business &amp; Finance Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="B&amp;F Prep">

<meta name="description" content="Study app for the Florida contractor Business and Finance exam: 375 practice questions with plain-English explanations and where to find each answer, timed practice tests, missed-question review, XP and levels, daily challenges and crew scores.">
<meta name="theme-color" content="#1f5ad1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: app shell. Phone = top bar + bottom tab bar, one column. Desktop = left sidebar + centered column (max ~880px).
   Visual idea: blueprint blue for structure, safety-amber for rewards/XP, colored book tabs for references,
   highlighter marks for the one thing to remember. Condensed display type like jobsite signage. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --surface-2: #e8edf5;
  --surface-3: #dde4ef;
  --ink: #0e1a2e;
  --muted: #586579;
  --line: #d5dde9;
  --primary: #1f5ad1;
  --primary-ink: #ffffff;
  --primary-soft: #e2ebfc;
  --amber: #f2b705;
  --amber-ink: #2b2100;
  --amber-soft: #fff1c2;
  --ok: #12965f;
  --ok-soft: #dcf4e8;
  --bad: #d8402f;
  --bad-soft: #fde4e0;
  --warn: #9a5800;
  --tab-fcm: #1f5ad1;
  --tab-bga: #1c8a52;
  --tab-aia: #d0581a;
  --tab-fs: #7048c2;
  --tab-ink: #ffffff;
  --hero-1: #0b2350;
  --hero-2: #1a4cb0;
  --hl: #ffe680;
  --shadow-sm: 0 1px 2px rgba(14, 26, 46, .06);
  --shadow: 0 1px 2px rgba(14, 26, 46, .05), 0 6px 20px rgba(14, 26, 46, .07);
  --shadow-lg: 0 18px 50px rgba(14, 26, 46, .22);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 11px;
  --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080e18; --surface: #111a29; --surface-2: #182336; --surface-3: #1f2c42; --ink: #e9eef7; --muted: #94a2b8; --line: #243248;
    --primary: #6d9bff; --primary-ink: #06122a; --primary-soft: #18284a; --amber: #ffc93d; --amber-ink: #241a00; --amber-soft: #3a2f0c;
    --ok: #3fcf8e; --ok-soft: #0f3326; --bad: #ff6f5e; --bad-soft: #3e1a16; --warn: #f0a83a;
    --tab-fcm: #6d9bff; --tab-bga: #4fd18c; --tab-aia: #ff8f55; --tab-fs: #b394ff; --tab-ink: #06122a;
    --hero-1: #0a1a3c; --hero-2: #173f93; --hl: #5c4a00;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080e18; --surface: #111a29; --surface-2: #182336; --surface-3: #1f2c42; --ink: #e9eef7; --muted: #94a2b8; --line: #243248;
  --primary: #6d9bff; --primary-ink: #06122a; --primary-soft: #18284a; --amber: #ffc93d; --amber-ink: #241a00; --amber-soft: #3a2f0c;
  --ok: #3fcf8e; --ok-soft: #0f3326; --bad: #ff6f5e; --bad-soft: #3e1a16; --warn: #f0a83a;
  --tab-fcm: #6d9bff; --tab-bga: #4fd18c; --tab-aia: #ff8f55; --tab-fs: #b394ff; --tab-ink: #06122a;
  --hero-1: #0a1a3c; --hero-2: #173f93; --hl: #5c4a00;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6);
  color-scheme: dark;
}
html { font-size: 16px; }
html[data-text="lg"] { font-size: 18px; }
html[data-text="xl"] { font-size: 20px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.ico { width: 1.15em; height: 1.15em; flex: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .75rem; }
.strong { font-weight: 700; }
.center { justify-content: center; text-align: center; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .005em; text-wrap: balance; margin: 0; line-height: 1.08; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.28rem; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .13em; font-size: .78rem; font-weight: 600; color: var(--muted); }
.eyebrow.light { color: rgba(255,255,255,.78); }
mark.hl, .hl { background: linear-gradient(transparent 35%, var(--hl) 35%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .12em; }
mark.trap { background: none; color: var(--bad); font-weight: 800; text-decoration: underline wavy; text-decoration-color: var(--bad); text-underline-offset: 3px; }

/* ================================================================ shell */
.shell { min-height: 100vh; display: block; }
.sidebar { display: none; }
.content { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .spacer { flex: 1; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }
.brand-name.sm { font-size: 1.05rem; white-space: nowrap; }
.brand-sub { display: block; font-size: .72rem; color: var(--muted); margin-top: 3px; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 40px; height: 40px; display: inline-grid; place-items: center; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.on { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; }
.icon-btn .ico { width: 19px; height: 19px; }
.lvchip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; height: 40px; color: var(--ink); min-width: 0; }
.lvnum { width: 30px; height: 30px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; flex: none; }
.lvtxt { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; }
.lvname { font-family: var(--font-display); font-weight: 600; font-size: .9rem; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
.xpbar { display: block; height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; width: 72px; }
.xpbar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), #ff9d00); border-radius: inherit; transition: width .5s; }
.xpbar.lg { width: 100%; height: 8px; }
.xpbar.xl { width: 100%; height: 10px; background: rgba(255,255,255,.18); }
.streak { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; border-radius: 999px; color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.streak.on { color: #f06a1c; }
.streak .ico { width: 18px; height: 18px; }
@media (max-width: 390px) { .lvtxt { display: none; } .lvchip { padding-right: 4px; } .topbar .brand-name { display: none; } }

main {
  width: 100%; max-width: 880px; margin: 0 auto; min-width: 0;
  padding-block: 18px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.bottomnav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--nav-h); font-size: .7rem; font-weight: 600; color: var(--muted); min-width: 0; }
.bn-ico { position: relative; display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.bn-ico .ico { width: 22px; height: 22px; }
.bottomnav button[aria-current="page"] { color: var(--primary); }
.bottomnav button[aria-current="page"] .bn-ico { background: var(--primary-soft); }
.bn-ico .badge { position: absolute; top: -4px; right: 6px; }

/* desktop: sidebar */
.wide .shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
.wide .topbar, .wide .bottomnav { display: none; }
.wide main { padding-top: 34px; padding-bottom: 56px; gap: 22px; }
.wide .sidebar {
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 18px 14px 16px; background: var(--surface); border-right: 1px solid var(--line);
}
.sidebar .brand { padding: 4px 6px 12px; }
.side-level { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; margin-bottom: 8px; border-radius: var(--r); border: 0; color: #fff;
  background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); position: relative; overflow: hidden; }
.side-level::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 16px 16px; }
.side-level .streak { height: auto; padding: 0; color: #ffd27a; }
.side-level .xpbar { background: rgba(255,255,255,.18); }
.lvbadge { display: inline-flex; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: .82rem; letter-spacing: .06em; padding: 2px 9px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); }
.lvname-big { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.05; }
.side-level .tiny { color: rgba(255,255,255,.78); }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.navgroup { margin: 14px 10px 4px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .13em; font-size: .72rem; font-weight: 600; color: var(--muted); }
.navlink { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 11px; border: 0; background: none; color: var(--ink); text-align: left; font-size: .95rem; width: 100%; }
.navlink .ico { width: 19px; height: 19px; color: var(--muted); }
.navlink:hover { background: var(--surface-2); }
.navlink[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
.navlink[aria-current="page"] .ico { color: var(--primary); }
.navlink .badge { margin-left: auto; }
.side-foot { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }

/* phone layout forced on a wide screen: center it like a device */
.phone-frame body { background: var(--surface-3); }
.phone-frame .shell { max-width: 480px; margin: 0 auto; background: var(--bg); box-shadow: var(--shadow-lg); min-height: 100vh; }
.phone-frame .bottomnav { left: 50%; right: auto; width: 480px; transform: translateX(-50%); }

/* ================================================================ primitives */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack.lg { gap: 18px; }
.stack.tight { gap: 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.tight { gap: 6px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.actions-row { gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 600px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .grid3 { gap: 6px; } }
.page-head { display: flex; flex-direction: column; gap: 8px; }
.page-head p { color: var(--muted); max-width: 64ch; }
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; }
.sec-title .ico { color: var(--primary); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .ico { width: 34px; height: 34px; color: var(--ok); }
.callout { background: var(--amber-soft); color: var(--ink); border-radius: var(--r-sm); padding: 12px 14px; }
@media (max-width: 420px) { .hide-xs { display: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; font-weight: 650; line-height: 1.15; min-height: 44px; text-decoration: none; transition: transform .08s, background .15s, box-shadow .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 30%, transparent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--primary); }
.btn.amber { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.amber:hover { filter: brightness(1.05); background: var(--amber); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 11px; min-height: 36px; font-size: .88rem; border-radius: 10px; }
.btn.lg { padding: 13px 22px; min-height: 52px; font-size: 1.05rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn .kbd { color: inherit; border-color: currentColor; opacity: .7; }
.btn.back { align-self: flex-start; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; line-height: 1.2; min-height: 36px; color: var(--ink); }
.chip:hover { border-color: var(--primary); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 650; }
.chip .cnt { font-family: var(--font-mono); font-size: .72rem; opacity: .7; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .68rem; font-weight: 700; font-family: var(--font-mono); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 650; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--surface); }
.pill .ico { width: 13px; height: 13px; }
.pill.blue { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.amber { background: var(--amber-soft); color: var(--warn); border-color: transparent; }
.tab { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .74rem; font-weight: 600; padding: 3px 9px 3px 11px; border-radius: 3px 9px 9px 3px; color: var(--tab-ink); background: var(--tab-fcm); white-space: nowrap; box-shadow: inset 3px 0 0 rgba(0,0,0,.2); }
.tab.bga { background: var(--tab-bga); }
.tab.aia { background: var(--tab-aia); }
.tab.fs { background: var(--tab-fs); }
.kbd { font-family: var(--font-mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 9px; font-size: .84rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
.seg button .ico { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.side-foot .seg { display: flex; }
.side-foot .seg button { flex: 1; justify-content: center; padding: 6px 4px; font-size: .72rem; flex-direction: column; gap: 2px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label, .field > label { font-size: .76rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-display); }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px; width: 100%; min-height: 44px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; }
textarea { resize: vertical; min-height: 64px; }
.toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.toggle { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.toggle > span { display: flex; flex-direction: column; gap: 2px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px; flex: none; }
.toggle.compact { padding: 8px 12px; align-items: center; min-height: 44px; }
.bar { display: block; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar.thin { height: 5px; }
.bar > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .4s; }
.bar.ok > span { background: var(--ok); }
.bar.warn > span { background: var(--amber); }
.bar.bad > span { background: var(--bad); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; position: relative; }
.stat .ico { position: absolute; top: 14px; right: 14px; color: var(--muted); width: 18px; height: 18px; opacity: .7; }
.stat .v { font-family: var(--font-display); font-size: 1.95rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .76rem; color: var(--muted); }
.scroll-x { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.strong { min-width: 130px; }

/* ================================================================ home */

.mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.readiness { display: flex; flex-direction: column; gap: 12px; }

/* ================================================================ study / test setup */

.preset { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); transition: transform .12s, border-color .15s; }

/* ================================================================ run */

.qgrid button { height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: .76rem; position: relative; color: var(--ink); }

.qgrid button.right { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.qgrid button.miss { background: var(--bad-soft); border-color: transparent; color: var(--bad); }

.qcard { padding: 22px; }
@media (max-width: 480px) { .qcard { padding: 16px; } }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.opt:hover:not([disabled]) { border-color: var(--primary); background: var(--primary-soft); }

.letter { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; background: var(--surface-2); }
.otext { font-size: 1rem; min-width: 0; }

.coach { border: 1.5px dashed color-mix(in srgb, var(--primary) 45%, var(--line)); background: color-mix(in srgb, var(--primary-soft) 50%, var(--surface)); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* ================================================================ results */

.ap { border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }

/* ================================================================ crew */

window.QUESTIONS = [{"id":"1-1","exam":1,"num":1,"stem":"\"Hard Records\", such as payroll, employment contracts, sales & purchase records must be retained for __________ years.","options":["2","3","4","5"],"answer":1,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-30"},{"book":"FCM","eds":["2017"],"loc":"5-30"}],"exp":"\"Hard records\" (payroll, employment contracts, sales and purchase records) are kept **3 years**. \"Soft records\" such as timecards and time sheets only need **2 years**.","plain":"Payroll, contracts and buy/sell records are \"hard\" paperwork: you can't recreate them, so you keep them 3 years. Timecards are \"soft\" paperwork and only need 2 years.","look":"Recordkeeping – Payroll","tip":"Hard = 3, Soft = 2. Hard records are harder to replace, so they're kept longer.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-30  ·  Recordkeeping - Payroll","2017: 5-30  ·  Payroll - Records"],"lock":1},{"id":"1-2","exam":1,"num":2,"stem":"\"Soft Records\", such as timecards and time sheets must be retained for __________ years.","options":["2","3","4","5"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-30"},{"book":"FCM","eds":["2017"],"loc":"5-30"}],"exp":"Soft records (timecards, time sheets) are kept **2 years**. Hard records (payroll, contracts, sales and purchase records) are kept 3.","plain":"Timecards and time sheets are the \"soft\" stuff. Keep them 2 years. The heavier paperwork (payroll, contracts) gets 3.","look":"Recordkeeping – Payroll","tip":"Hard = 3, Soft = 2.","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-30  ·  Recordkeeping - Payroll","2017: 5-30  ·  Payroll - Records"],"lock":1},{"id":"1-3","exam":1,"num":3,"stem":"FS §489 requires complete financial and business records to be retained for __________ years.","options":["2","3","4","5"],"answer":1,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-102","stat":"489.124(1)"},{"book":"FCM","eds":["2021"],"loc":"2-78","stat":"489.124(1)"},{"book":"FCM","eds":["2017"],"loc":"2-20"},{"book":"FCM","eds":["2017"],"loc":"2-90","stat":"489.124(1)"}],"exp":"§489.124(1) requires licensed contractors to keep complete financial and business records for the immediately preceding **3 years**. Expect this one in several forms.","laws":[["Fla. Stat. § 489.124(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0489/Sections/0489.124.html"]],"plain":"The state licensing law says keep your business and money records for the last 3 years. Think of it as the license board's look-back window.","look":"Licensing – Record Keeping (§489.124)","tip":"Chapter 489 records = 3 years. IRS employment tax = 4. OSHA logs = 5.","ref":["Florida Contractors Manual  ·  2025: 2-102  ·  Licensing - Record Keeping","§489.124(1)","2021: 2-78  ·  Licensing - Record Keeping","§489.124(1)","2017: 2-20, 2-90  ·  Recordkeeping - Licensing, Const","§489.124(1)"],"lock":1},{"id":"1-4","exam":1,"num":4,"stem":"OSHA logs 300/300A must be retained for __________ calendar years.","options":["2","3","4","5"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-16"},{"book":"FCM","eds":["2017"],"loc":"7-16"}],"exp":"OSHA 300 logs, the 300A summary and the 301 forms are kept **5 years** after the end of the calendar year they cover, at each establishment.","laws":[["29 CFR § 1904.33","https://www.ecfr.gov/current/title-29/section-1904.33"]],"plain":"OSHA injury logs stay in the file 5 years after the year ends. OSHA keeps the longest memory of any record rule on this test.","look":"OSHA – Recordkeeping","tip":"OSHA = 5 years. Picture the 5 in \"300\".","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-16  ·  OSHA - Recordkeeping","2017: 7-16  ·  OSHA - Retention of Records"],"lock":1},{"id":"1-5","exam":1,"num":5,"stem":"Per the IRS, records of employment taxes must be retained for __________ years.","options":["2","3","4","5"],"answer":2,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"3-142"},{"book":"FCM","eds":["2021"],"loc":"3-160"},{"book":"FCM","eds":["2017"],"loc":"3-154"}],"exp":"The IRS requires employment tax records to be kept at least **4 years** after the tax is due or paid, whichever is later.","laws":[["26 CFR § 31.6001-1","https://www.ecfr.gov/current/title-26/section-31.6001-1"]],"plain":"The IRS wants your payroll tax records kept 4 years. Easy to mix up with 3 (state) and 5 (OSHA), so memorize the ladder: 2, 3, 4, 5.","look":"Recordkeeping – IRS, Taxes","tip":"Records ladder: soft 2 → hard 3 → Ch. 489 3 → IRS 4 → OSHA 5.","ref":["Florida Contractors Manual  ·  2025: 3-142  ·  Recordkeeping - IRS, Taxes","2021: 3-160  ·  Recordkeeping - IRS, Taxes","2017: 3-154  ·  Record Retention - IRS"],"lock":1},{"id":"1-6","exam":1,"num":6,"stem":"The Department, for the boards under its jurisdiction, shall have the authority to close and terminate deficient license application files __________ year (s) after the board or the department notifies the applicant of the deficiency.","options":["1","2","3","4"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.203(10)(a)"}],"exp":"Under §455.203(10), DBPR may close and terminate a deficient license application file **2 years** after it notifies the applicant of the deficiency.","laws":[["Fla. Stat. § 455.203(10)(a)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.203.html"]],"plain":"If your license application is missing something and you ignore the letter, the state can close the file after 2 years.","look":"Department – Powers & Duties (§455.203)","ref":["Florida Statute 455  ·  §455.203(10)(a)  ·  TOC: Department; Power & Duties"],"lock":1},{"id":"1-7","exam":1,"num":7,"stem":"I-9 Forms must be retained __________.","options":["3 years from date of hire","1 year from date employment ends","3 years from date employment ends","Either A or B, whichever is the latest date"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-58"},{"book":"FCM","eds":["2017"],"loc":"5-58"}],"exp":"Keep an I-9 for **3 years after the date of hire or 1 year after employment ends, whichever is later**. Both clocks apply, so the answer is \"either A or B, whichever is the latest date.\"","laws":[["8 CFR § 274a.2","https://www.ecfr.gov/current/title-8/section-274a.2"]],"plain":"An I-9 stays on file 3 years from hire or 1 year after they quit, whichever date is later. The \"whichever is later\" choice is the answer.","look":"Recordkeeping – Immigration Reform (I-9)","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-58  ·  Recordkeeping- Immigration Reform","2017: 5-58  ·  Forms - IRS - I-9"],"lock":1},{"id":"1-8","exam":1,"num":8,"stem":"Tests, inspections, and approvals of work shall be paid for by the __________; if tests are failed, additional costs shall be borne by __________.","options":["Owner, Owner","Owner, Contractor","Owner, Architect","Contractor, Contractor"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"13.4.1"},{"book":"A201","eds":null,"loc":"13.4.3"}],"exp":"A201 §13.4.1: the **Owner** pays for the tests, inspections and approvals the contract documents require. §13.4.3: if a test shows the work fails, the **Contractor** pays the extra costs.","plain":"The owner pays for the required inspections. If your work fails the test, you pay for the retest and the fix.","look":"A201 13.4 – Tests and Inspections","tip":"The owner pays to look. The contractor pays when it fails.","ref":["AIA Document A201, 2017  ·  13.4.1, 13.4.3  ·  Optional TAB: Tests and Inspections"]},{"id":"1-9","exam":1,"num":9,"stem":"The maximum hours of work allowed per week for a 16-year-old while school is in session is __________ hours.","options":["12","18","20","30"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-32"}],"exp":"Florida child labor law: 16- and 17-year-olds may work up to **30 hours a week** while school is in session (and no more than 8 hours on a day before a school day).","laws":[["Fla. Stat. § 450.081","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0450/Sections/0450.081.html"]],"plain":"A 16-year-old can work up to 30 hours a week during the school year. Same rule for 17-year-olds.","look":"Laws – Child Labor","tip":"16 and 17 both get 30 hours per school week.","ref":["Florida Contractors Manual  ·  5-32  ·  Child Labor (See) - Laws - Child labor"],"lock":1},{"id":"1-10","exam":1,"num":10,"stem":"A job has a cost to date of $34,000. The cost to complete is estimated to be $91,000. If the contractor wanted to make a 12% profit, the contract price would be __________.","options":["$125,000","$127,400","$140,000","$157,340"],"answer":2,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"87"}],"exp":"Total cost = cost to date + cost to complete = $34,000 + $91,000 = $125,000. Add the 12% profit: $125,000 × 1.12 = **$140,000**.","plain":"Add up all your cost (spent + still to spend = $125,000), then add 12% on top: $125,000 × 1.12 = $140,000.","look":"Markup / Contract Price","tip":"Total cost first, then multiply by (1 + profit %).","calc":1,"ref":["Builder's Guide to Accounting  ·  87","$34,000 + $91,000 = $125,000 (cost to date + cost to complete = total cost)","$125,000 x 1.12 (12%) = $140,000 total contract"],"lock":1},{"id":"1-11","exam":1,"num":11,"stem":"The __________ regulates the FLSA.","options":["Department of Labor","Department of Business and Professional Regulation","Construction Industry Licensing Board","Florida Department of State"],"answer":0,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"The Fair Labor Standards Act (minimum wage, overtime, child labor) is enforced by the U.S. **Department of Labor** through its Wage and Hour Division. DBPR and the CILB regulate licensing, not wages.","plain":"The federal wage-and-hour law (FLSA) is run by the U.S. Department of Labor, not the Florida license board.","look":"Acts – FLSA","ref":["Florida Contractors Manual  ·  5-15  ·  Acts - FLSA"]},{"id":"1-12","exam":1,"num":12,"stem":"An advantage of a bad debt reserve is that _________________________________.","options":["It reduces tax liability for earned profit","It increases assets","It increases profits","It simplifies accounting procedures"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"64"}],"exp":"Per the Builder's Guide, a bad debt reserve lets you write off expected uncollectible accounts against earnings, which **reduces tax liability on earned profit**. It does not increase assets or profit, and it adds an accounting step.","plain":"Setting aside a reserve for customers who won't pay lets you write that loss off, which lowers the tax on the profit you booked.","look":"Bad Debt Accounting","ref":["Builder's Guide to Accounting  ·  64  ·  Bad Debt Accounting - estimating"]},{"id":"1-13","exam":1,"num":13,"stem":"Employees __________ would probably not be subject to the overtime regulations.","options":["With fluctuating workweeks","Who are employed in the capacity of outside salesman","Who are piece workers","Who are salaried"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-17"}],"exp":"**Outside salespeople** are exempt from FLSA overtime. Being salaried alone does not make someone exempt; they must also pass the duties tests. Piece workers and employees on a fluctuating workweek still earn overtime.","laws":[["29 U.S.C. § 213","https://www.law.cornell.edu/uscode/text/29/213"]],"plain":"Outside salespeople don't get overtime. Being on salary alone doesn't get an employer out of paying it.","look":"Overtime Pay","tip":"Salaried ≠ exempt. Outside sales = exempt.","ref":["Florida Contractors Manual  ·  5-17  ·  Overtime Pay"]},{"id":"1-14","exam":1,"num":14,"stem":"The Buy American Act does not include __________.","options":["Mexico","Canada","Brazil","Europe"],"answer":2,"topic":"law","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-88"}],"exp":"The manual lists Mexico, Canada and European countries as covered by trade agreements under the Buy American Act. **Brazil** is the one that is not included.","plain":"Brazil is the country NOT covered. Mexico, Canada and Europe are on the list in the manual.","look":"Buy American Act","ref":["Florida Contractors Manual  ·  10-88  ·  TAB: Buy American Act"]},{"id":"1-15","exam":1,"num":15,"stem":"Per FLSA, an executive employee __________.","options":["Whose primary duty is management of the enterprise in which the employee is employed or of a customarily recognized department or subdivision","Customarily directs the work of 2 or more employees","Has the authority to hire or fire other employees","All of the above"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"5-19"},{"book":"FCM","eds":["2017"],"loc":"5-19"}],"exp":"The FLSA executive exemption requires **all** of these: the primary duty is managing the enterprise or a recognized department, the employee customarily directs 2 or more employees, and they can hire or fire (or their recommendations carry weight). There is also a salary test.","laws":[["29 CFR § 541.100","https://www.ecfr.gov/current/title-29/section-541.100"]],"plain":"To be an \"executive\" with no overtime, they have to manage, boss at least 2 people, and have hire/fire say. All three, so \"all of the above.\"","look":"FLSA – Executive Exemption","ref":["Florida Contractors Manual  ·  2025 & 2021: 5-19  ·  TOC: FLSA - Test for Executive","Exemption","2017: 5-19  ·  Employee - Executive"],"lock":1},{"id":"1-16","exam":1,"num":16,"stem":"An individual who smokes in a non-smoking area is subject to a fine of __________ for a repeat offense.","options":["$100","$250","$500","$1,000"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-49"}],"exp":"Under the Florida Clean Indoor Air Act, smoking in a no-smoking area carries a fine of up to $100 for a first violation and up to **$500 for each repeat violation**.","laws":[["Fla. Stat. § 386.208","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0300-0399/0386/Sections/0386.208.html"]],"plain":"Smoking where you shouldn't: $100 the first time, $500 for each time after that.","look":"Clean Indoor Air Act","ref":["Florida Contractors Manual  ·  5-49  ·  TAB: Clean Indoor Air Act"],"lock":1},{"id":"1-17","exam":1,"num":17,"stem":"A __________ would be most likely to receive a Limited License.","options":["Retired professional","Professional from another state","Trainee immediately following a natural disaster","Person who has failed the state test 5 times"],"answer":0,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"§455.214 limited licenses go to **retired professionals** (licensed at least 10 years) who will serve indigent, underserved or critical-need populations. They are not for trainees, out-of-state professionals, or people who keep failing the exam.","laws":[["Fla. Stat. § 455.214(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.214.html"]],"plain":"A limited license is for a retired pro (10+ years licensed) who wants to help people who can't afford it. Not for trainees or people who keep failing.","look":"Limited Licenses (§455.214)","ref":["Florida Statute 455  ·  §455.214(2)  ·  TOC: Limited Licenses"]},{"id":"1-18","exam":1,"num":18,"stem":"__________ is responsible to post OSHA posters on a multi-contractor project.","options":["The Owner","The General Contractor","Each Contractor","The Project Superintendent"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"On a multi-contractor project, **each contractor** (each employer) must post the required OSHA posters for its own employees. One GC can't post for everyone.","laws":[["29 CFR § 1903.2","https://www.ecfr.gov/current/title-29/section-1903.2"]],"plain":"Every employer on the job posts its own OSHA posters for its own crew. The GC can't post for the subs.","look":"OSHA – Employer Responsibilities","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"]},{"id":"1-19","exam":1,"num":19,"stem":"When __________, duly authorized agents and employees of DBPR may inspect premises of any establishment at all reasonable hours.","options":["There is a suspected OSHA violation","There are minors working on the premises","The services offered at the premises include authorization to prescribe controlled substances","Alcohol is served"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.243"}],"exp":"§455.243 lets DBPR agents inspect, at reasonable hours, any establishment whose **services include authority to prescribe controlled substances**. It's an odd fit for a contractor exam, but that's what the statute says.","laws":[["Fla. Stat. § 455.243","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.243.html"]],"plain":"DBPR can walk in and inspect places that are allowed to prescribe controlled substances. It's an odd fact, but the statute says it.","look":"Authority to Inspect (§455.243)","ref":["Florida Statute 455  ·  §455.243  ·  TOC: Authority to Inspect"]},{"id":"1-20","exam":1,"num":20,"stem":"Unless an applicant notifies the department at least __________ days prior to an examination hearing of the applicant's inability to attend, the department may require an applicant to pay reasonable attorney's fees, costs, and court costs of the department for the examination hearing.","options":["3","4","5","7"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.229(3)"}],"exp":"§455.229(3): if an applicant doesn't notify DBPR at least **5 days** before an examination hearing that they can't attend, the department may charge them attorney's fees and costs.","laws":[["Fla. Stat. § 455.229(3)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.229.html"]],"plain":"If you can't make your exam hearing, tell the state at least 5 days ahead or you may get stuck with their legal costs.","look":"Examination Hearing (§455.229)","ref":["Florida Statute 455  ·  §455.229(3)  ·  TOC: ... examination hearing"],"lock":1},{"id":"1-21","exam":1,"num":21,"stem":"If the circumstance of the violation meets the standard of a minor violation and __________ year (s) have passed since the issuance of a final order imposing discipline; the department shall reclassify that violation as inactive.","options":["1","2","3","5"],"answer":1,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2255(1)"}],"exp":"§455.2255: a minor violation is reclassified as inactive once **2 years** have passed since the final order imposing discipline.","laws":[["Fla. Stat. § 455.2255(1)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2255.html"]],"plain":"A minor violation goes \"inactive\" on your record 2 years after the final order.","look":"Classification of Disciplinary Actions (§455.2255)","ref":["Florida Statute 455  ·  §455.2255(1)  ·  TOC: Classification of Disciplinary","Actions"],"lock":1},{"id":"1-22","exam":1,"num":22,"stem":"The real turnover ratio is __________.","options":["Cost of sales over inventory at cost","Cost of sales minus retail sales","Retail sales over breakeven point","Overhead plus all costs"],"answer":0,"topic":"ratio","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"271"}],"exp":"Real turnover ratio = **cost of sales ÷ inventory at cost**. It shows how many times inventory turns over. Because it uses an income statement figure (cost of sales) and a balance sheet figure (inventory), it is a \"combined\" ratio.","plain":"Real turnover = what you sold at cost ÷ what's sitting in inventory at cost. It tells you how fast stock moves.","look":"Real Turnover Ratio","ref":["Builder's Guide to Accounting  ·  271  ·  Real Turnover Ratio"]},{"id":"1-23","exam":1,"num":23,"stem":"In order to obtain a limited license, a person should have been licensed for at least __________ years in any jurisdiction in the United States.","options":["3","5","7","10"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.214(2)"}],"exp":"A limited license (§455.214) requires a person to have been licensed for at least **10 years** in any U.S. jurisdiction.","laws":[["Fla. Stat. § 455.214(2)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.214.html"]],"plain":"You need 10 years of being licensed (anywhere in the U.S.) to get a limited license.","look":"Limited Licenses (§455.214)","tip":"Limited license = retired + 10 years + serving the indigent.","ref":["Florida Statute 455  ·  §455.214(2)  ·  TOC: Limited Licenses"],"lock":1},{"id":"1-24","exam":1,"num":24,"stem":"A request for additional investigative information shall be made within __________ days from the date of receipt by the probable cause panel of the investigative report of the department.","options":["5","10","15","30"],"answer":2,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.225(4)"}],"exp":"§455.225(4): the probable cause panel must request more investigative information within **15 days** of receiving the department's investigative report.","laws":[["Fla. Stat. § 455.225(4)","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.225.html"]],"plain":"The probable cause panel has 15 days after getting the investigation report to ask for more info.","look":"Disciplinary Proceedings (§455.225)","ref":["Florida Statute 455  ·  §455.225(4)  ·  TOC: Disciplinary Proceedings"],"lock":1},{"id":"1-25","exam":1,"num":25,"stem":"The theft or reproduction of an examination constitutes a __________.","options":["Misdemeanor","Felony of the first degree","Felony of the second degree","Felony of the third degree"],"answer":3,"topic":"dbpr","books":["FS455"],"cites":[{"book":"FS455","eds":null,"loc":"455.2175"}],"exp":"§455.2175: stealing or reproducing an examination is a **felony of the third degree**.","laws":[["Fla. Stat. § 455.2175","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0455/Sections/0455.2175.html"]],"plain":"Stealing or copying the state exam is a third-degree felony. Don't do it.","look":"Penalty for theft or reproduction of exam (§455.2175)","ref":["Florida Statute 455  ·  §455.2175  ·  TOC: Penalty for theft or reproduction"]},{"id":"1-26","exam":1,"num":26,"stem":"__________ is a foreseen condition that would not have an effect on production efficiency.","options":["Weather","Workload","Deadlines","Site Area"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-31"},{"book":"FCM","eds":null,"loc":"10-32"}],"exp":"In the manual's production-efficiency table (Fig. 12), weather, workload and site area all change productivity. **Deadlines** are the foreseen condition that does not.","plain":"Weather, workload and site size all slow a crew down. Deadlines are known ahead of time and don't change how fast the crew works.","look":"Production Efficiency (Figure 12)","ref":["Florida Contractors Manual  ·  10-31, 10-32  ·  Production Efficiency","Figure 12"]},{"id":"1-27","exam":1,"num":27,"stem":"Florida Diggers bought a tractor for $210,000. Its useful life is 12 years, and it has a salvage value of $30,000. If the tractor is sold at the end of year 6, the total depreciation would be __________.","options":["$90,000","$45,000","$60,000","$112,000"],"answer":0,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163-164"}],"exp":"Straight line: ($210,000 − $30,000 salvage) ÷ 12 years = $15,000 a year. After 6 years: $15,000 × 6 = **$90,000** total depreciation.","plain":"Take salvage off first: $210,000 − $30,000 = $180,000. Divide by 12 years = $15,000 a year. Six years = $90,000.","look":"Depreciation – Methods","tip":"Always subtract salvage first.","calc":1,"ref":["Builder's Guide to Accounting  ·  163-164  ·  Depreciation - Methods","Purchase value minus salvage value: $210,000 - $30,000 = $180,000","Note: when calculating depreciation with salvage value, always subtract salvage value from purchase price before starting calculations.","This value is used to determine annual depreciation (12) years: $180,000 ÷ 12 = $15,000 per year","Total depreciation after 6 years: $15,000 x 6 = $90,000"],"lock":1},{"id":"1-28","exam":1,"num":28,"stem":"The Bidder shall deliver the required bonds to the Owner not later than __________ following the date of execution of the Contract.","options":["24 hours","3 days","3 working days","7 days"],"answer":1,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"7.2.1"}],"exp":"A701 §7.2.1: the bidder delivers the required bonds to the **Owner** no later than **3 days** after the contract is executed.","plain":"Once the contract is signed, you've got 3 days to hand your bonds to the owner.","look":"A701 Art. 7 – Performance and Payment Bond","tip":"Bonds go to the Owner in 3 days.","ref":["AIA Document A701, 2018  ·  7.2.1  ·  TOC: Performance bond and payment bond"]},{"id":"1-29","exam":1,"num":29,"stem":"\"2% - 10 days, net 30\" is __________.","options":["An extra charge for shipping","A incentive discount of 2% if the customer pays the invoice within 10 days of the billing date","An incentive discount of 2% if the customer pays the invoice within 30 days of the billing date","An incentive discount or a penalty of 2%, depending on the date the invoice is paid"],"answer":1,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"59"}],"exp":"\"2% 10, net 30\" means the customer can take a **2% discount by paying within 10 days**. Otherwise the full amount is due in 30 days. It's an incentive, not a penalty.","plain":"\"2% 10, net 30\": pay within 10 days and knock 2% off. Otherwise the full bill is due in 30.","look":"Discounts","ref":["Builder's Guide to Accounting  ·  59  ·  Optional TAB: Discounts"]},{"id":"1-30","exam":1,"num":30,"stem":"Florida's Right to Work Laws __________.","options":["Prevent discrimination based on race, creed, or color","Allow non-resident aliens with proper documentation the right to work","Prevent employees from being forced to join a union","All of the above"],"answer":2,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"}],"exp":"Florida's Right to Work law (Art. I §6 of the Florida Constitution) **keeps employees from being forced to join, or pay, a union** as a condition of employment.","laws":[["Fla. Const. Art. I, § 6","https://www.flsenate.gov/Laws/Constitution#A1S06"]],"plain":"Right to Work means nobody can force you to join a union to keep your job.","look":"Laws – Florida Right to Work","ref":["Florida Contractors Manual  ·  5-14  ·  Laws - Florida Right to Work"],"lock":1},{"id":"1-31","exam":1,"num":31,"stem":"Under the Florida Worker's Compensation Act, a contractor may recover __________ from a subcontractor who has elected exemption from Chapter 440 if the subcontractor's exemption is invalid and has caused liability to the contractor or an employee.","options":["Benefits paid and interest due","A minimum of $1,500 and interest","Penalties up to 100% of their contract","A maximum of $2,500 per occurrence"],"answer":0,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"6-5"},{"book":"FCM","eds":["2017"],"loc":"6-5"}],"exp":"If a subcontractor's workers' comp exemption is invalid and that creates liability for the contractor, the contractor may recover the **benefits paid plus interest** from the subcontractor.","laws":[["Fla. Stat. § 440.10","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0440/Sections/0440.10.html"]],"plain":"If your sub's comp exemption turns out to be bogus and you get stuck paying, you can go after the sub for what you paid plus interest.","look":"Workers' Compensation – Exemptions","ref":["Florida Contractors Manual  ·  2025 & 2021: 6-5  ·  Workers Compensation -","Exemptions","2017: 6-5  ·  Acts - Workers Compensation"]},{"id":"1-32","exam":1,"num":32,"stem":"Construction project schedules should have progress posted at least __________.","options":["Daily","Weekly","Biweekly","Monthly"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-63"}],"exp":"Post schedule progress at least **weekly**. Short-term schedules look 2 weeks ahead.","plain":"Update the schedule with progress at least once a week.","look":"Scheduling – Guidelines","ref":["Florida Contractors Manual  ·  10-63  ·  Scheduling - Guidelines"]},{"id":"1-33","exam":1,"num":33,"stem":"A fine of up to ___________ can be imposed on a contractor for finishing a job without pulling a permit if it is their first offense","options":["$1,000","$3,000","$5,000","$10,000"],"answer":2,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"2-206"},{"book":"FCM","eds":["2021"],"loc":"2-31"},{"book":"FCM","eds":["2021"],"loc":"2-158"},{"book":"FCM","eds":["2017"],"loc":"2-24"},{"book":"FCM","eds":["2017"],"loc":"2-184"}],"exp":"Under the CILB disciplinary guidelines (61G4-17), a first offense of completing a job without pulling a required permit can carry a fine of up to **$5,000**.","laws":[["Fla. Admin. Code R. 61G4-17.001","https://www.flrules.org/gateway/ruleNo.asp?id=61G4-17.001"]],"plain":"Finishing a job without pulling the permit can cost up to $5,000 on a first offense.","look":"Penalties – Licensing (61G4-17)","ref":["Florida Contractors Manual  ·  2025: 2-206 (o)  ·  Penalties - Licensing, Construction","2021: 2-31, 2-158 (o) Penalties - Licensing, Construction","2017: 2-24, 2-184 (o) Penalties - Licensing"],"lock":1},{"id":"1-34","exam":1,"num":34,"stem":"An OSHA 300 safety log must be maintained by employers with at least __________ employees.","options":["5","7","10","11"],"answer":3,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"Employers with **more than 10 employees (11 or more)** must keep OSHA 300 logs. Employers with 10 or fewer are partially exempt.","laws":[["29 CFR § 1904.1","https://www.ecfr.gov/current/title-29/section-1904.1"]],"plain":"Got 11 or more employees? Keep the OSHA 300 log. 10 or fewer, you're off the hook.","look":"OSHA – Employer Responsibilities","tip":"10 or fewer = exempt. 11 or more = keep the log.","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"],"lock":1},{"id":"1-35","exam":1,"num":35,"stem":"Bidders and Sub-bidders requiring clarification of the Bidding Documents shall make a written request which shall reach the Architect at least __________ day(s) prior to the date for receipt of bids.","options":["10","3","5","7"],"answer":3,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"3.2.2"}],"exp":"A701 §3.2.2: written requests for clarification must reach the Architect at least **7 days** before bids are due.","plain":"Questions about the bid documents have to reach the architect in writing at least 7 days before bids are due.","look":"A701 Art. 3 – Bidding Documents","tip":"Questions in 7 days before bids. Owner-financing request 14 days. Clerical error notice 2 days.","ref":["AIA Document A701, 2018  ·  3.2.2  ·  TOC: Bidding Document"],"lock":1},{"id":"1-36","exam":1,"num":36,"stem":"__________ is a correct accounting formula.","options":["Assets - Liabilities = Equity","Assets + Liabilities = Owner's Equity","Assets = Owner's Equity - Depreciation","Owner's Equity = Liabilities - Depreciation"],"answer":0,"topic":"acct","books":["FCM","BGA"],"cites":[{"book":"FCM","eds":null,"loc":"3-12"},{"book":"BGA","eds":null,"loc":"247"}],"exp":"The accounting equation is Assets = Liabilities + Owner's Equity. Rearranged: **Assets − Liabilities = Equity** (net worth).","plain":"What you own minus what you owe = what you're worth (equity). Assets − Liabilities = Equity.","look":"Accounting – Equation","ref":["Florida Contractors Manual  ·  3-12  ·  CM: Accounting - Equation","247  ·  BGA: Financial Statements","Assets = Liabilities + Equity - therefore, Assets - Liabilities = Equity"]},{"id":"1-37","exam":1,"num":37,"stem":"The __________ method is an estimating method that is NOT recommended for lump sum contracts.","options":["Approximate estimated","Detailed survey","Square footage","Unit price"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-12"}],"exp":"The **square footage method** is a quick conceptual estimate. It's too rough for a lump-sum contract, which needs a detailed quantity takeoff.","plain":"Square-foot pricing is a ballpark number. A lump-sum bid needs a real takeoff, so square footage is the method NOT to use.","look":"Estimates – Types of","ref":["Florida Contractors Manual  ·  10-12  ·  Types of: Estimates"]},{"id":"1-38","exam":1,"num":38,"stem":"The three Cs of underwriting that the surety industry considers before a contractor can acquire a bond are __________.","options":["Character, cash, and contracts","Completion percentage, completed contracts and cash","Cash, completion, and contracts","Capital, character, and capacity"],"answer":3,"topic":"ins","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"4-15"}],"exp":"The surety's three Cs of underwriting are **Capital, Character and Capacity**: financial strength, reputation and integrity, and the ability to perform the work.","plain":"The bonding company checks Capital (money), Character (reputation) and Capacity (can you do the work).","look":"Bonds – Three C's of Underwriting","ref":["Florida Contractors Manual  ·  4-15  ·  Bonds - Three C's of underwriting"]},{"id":"1-39","exam":1,"num":39,"stem":"The Florida sales tax is reported on form __________.","options":["DR-15-CS and paid on a monthly basis","DR-15-CS and paid on a quarterly basis","941 and paid on a monthly basis","941 and paid on a quarterly basis"],"answer":0,"topic":"tax","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-27"},{"book":"FCM","eds":["2017"],"loc":"1-23"}],"exp":"Florida sales and use tax is reported on **Form DR-15** (DR-15CS in older materials) and is generally paid **monthly**. Form 941 is the federal quarterly payroll return.","laws":[["Fla. Stat. § 212.11","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0200-0299/0212/Sections/0212.11.html"]],"plain":"Florida sales tax goes on form DR-15 and is paid monthly. Form 941 is federal payroll, a different animal.","look":"Forms – DR-15 / Taxes – State Sales","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-27  ·  Forms - DR-15","2017: 1-23  ·  Taxes - State Sales"]},{"id":"1-40","exam":1,"num":40,"stem":"Expanding a business usually requires a great deal of capital to purchase new equipment, buildings, or to obtain long term financing. To qualify for expansion financing, financial institutes typically require that you have been in business at least __________ years, while __________ years is preferred.","options":["2; 4","2; 5","3; 5","3; 6"],"answer":1,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"3-72"},{"book":"FCM","eds":["2017"],"loc":"3-72"}],"exp":"For expansion financing, lenders typically want at least **2 years** in business and prefer **5**.","plain":"Banks want 2 years in business before lending for expansion, and they'd like to see 5.","look":"Capital – Sources of","ref":["Florida Contractors Manual  ·  2025 & 2021: 3-72  ·  Capital - Sources of","2017: 3-72  ·  Types of Capital"],"lock":1},{"id":"1-41","exam":1,"num":41,"stem":"If an employer conducts business in more than one location in Florida, completion of the Multiple Worksite Report BLS-3020 will be required on a __________ basis.","options":["Weekly","Monthly","Quarterly","Annual"],"answer":2,"topic":"wc","books":["FCM"],"cites":[{"book":"FCM","eds":["2025"],"loc":"5-267"},{"book":"FCM","eds":["2021"],"loc":"5-290"},{"book":"FCM","eds":["2017"],"loc":"5-292"}],"exp":"Employers operating at more than one Florida location file the Multiple Worksite Report (BLS-3020) **quarterly**, separately from the RT-6.","plain":"Run crews out of more than one Florida location? File the multiple worksite report every quarter.","look":"Forms – Multiple Worksite Report","ref":["Florida Contractors Manual  ·  2025: 5-267  ·  Optional TAB: Multiple Worksite","2021: 5-290  ·  Forms - Multiple worksite","2017: 5-292"]},{"id":"1-42","exam":1,"num":42,"stem":"A __________ is a special combination of two or more persons or entities jointly seeking a profit in some specific venture or for a specific job or undertaking without an actual partnership or corporate designation.","options":["Special limited partnership","S-type business","Joint venture","Sole proprietorship"],"answer":2,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-10"},{"book":"FCM","eds":["2017"],"loc":"1-12"}],"exp":"A **joint venture** is two or more people or entities teaming up for profit on one specific project, without forming a partnership or corporation.","plain":"Two companies teaming up for one job without forming a new company is a joint venture.","look":"Types of Business – Joint Venture","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-10  ·  Types of: Business","2017: 1-12"]},{"id":"1-43","exam":1,"num":43,"stem":"Fictitious names are valid for __________ years.","options":["2","3","4","5"],"answer":3,"topic":"org","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"1-14"},{"book":"FCM","eds":["2017"],"loc":"1-15"}],"exp":"A Florida fictitious name registration is valid **5 years** and expires December 31 of the fifth year.","laws":[["Fla. Stat. § 865.09","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0800-0899/0865/Sections/0865.09.html"]],"plain":"A DBA (fictitious name) is good for 5 years, ending December 31 of year five.","look":"Fictitious Name","ref":["Florida Contractors Manual  ·  2025 & 2021: 1-14  ·  Fictitious Name","2017: 1-15"],"lock":1},{"id":"1-44","exam":1,"num":44,"stem":"Which of the following agreements are prohibited by Florida's Right to Work Laws?","options":["Union Shop","Agency Shop","Maintenance of Membership","All the above are prohibited"],"answer":3,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-14"},{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"Florida's Right to Work law prohibits union shop, agency shop and maintenance-of-membership agreements. **All of them** are prohibited.","laws":[["Fla. Const. Art. I, § 6","https://www.flsenate.gov/Laws/Constitution#A1S06"]],"plain":"Union shop, agency shop and maintenance of membership deals are all banned in Florida. All of them.","look":"Laws – Florida Right to Work","ref":["Florida Contractors Manual  ·  5-14, 5-15  ·  Laws - Florida Right to Work"],"lock":1},{"id":"1-45","exam":1,"num":45,"stem":"When making a claim of lien, you must send a sworn statement of account within ___________.","options":["90 days after demand of statement has been made","30 days after demand of statement has been made","45 days before demand of statement has been made","15 days before demand of statement has been made"],"answer":1,"topic":"lien","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"9-36"},{"book":"FCM","eds":["2017"],"loc":"9-35"}],"exp":"§713.16: a lienor must send a sworn statement of account within **30 days after the demand** is made. Failing to do so can cost the lienor its lien rights.","laws":[["Fla. Stat. § 713.16","https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0713/Sections/0713.16.html"]],"plain":"When the owner demands a sworn statement of account, you have 30 days to send it, or you can lose lien rights.","look":"Requests for Sworn Statement (Lien Law)","ref":["Florida Contractors Manual  ·  2025 & 2021: 9-36  ·  TOC: Requests for Sworn Statement","2017: 9-35  ·  Liens- Sworn Statements"]},{"id":"1-46","exam":1,"num":46,"stem":"If the contractor defaults or neglects to carry out the Work and fails to do so within __________ of receipt of written notice from the Owner, the Owner may correct such deficiencies.","options":["10 days","7 business days","7 calendar days","3 days"],"answer":0,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"2.5"}],"exp":"A201 §2.5: if the Contractor defaults and doesn't begin correcting it within **10 days** of the Owner's written notice, the Owner may correct the work itself.","plain":"If the contractor drops the ball and doesn't start fixing it within 10 days of the owner's written notice, the owner can fix it and back-charge.","look":"A201 2.5 – Owner's Right to Carry Out the Work","tip":"Owner vs. contractor = 10 days (A201). Contractor vs. sub = 5 days (A401).","ref":["AIA Document A201, 2017  ·  2.5  ·  Owners right to carry out the work"]},{"id":"1-47","exam":1,"num":47,"stem":"The best way to accurately control petty cash is through a(n) __________.","options":["Imprest system","Separate bank account","A dedicated entry group within an accounting system","Lock box"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"208"}],"exp":"An **imprest system** keeps petty cash at a fixed amount. It is replenished for exactly the amount of the receipts turned in, so cash plus receipts always equals the fund total.","plain":"An imprest fund is a petty cash box with a fixed amount. You only refill what the receipts show was spent.","look":"Petty Cash – Imprest System","ref":["Builder's Guide to Accounting  ·  208  ·  Petty cash - imprest system"]},{"id":"1-48","exam":1,"num":48,"stem":"OSHA 300/300A, the Log on Summary of Occupational Injuries and Illnesses, is used to record __________.","options":["Accident investigations","All health claims","Incidents resulting in loss of consciousness","Non-work restricting injuries"],"answer":2,"topic":"osha","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"7-6"},{"book":"FCM","eds":["2017"],"loc":"7-6"}],"exp":"The OSHA 300 log records work-related injuries and illnesses that are serious enough to report. **Loss of consciousness** is one of the recording criteria. First-aid-only cases are not recorded.","laws":[["29 CFR § 1904.7","https://www.ecfr.gov/current/title-29/section-1904.7"]],"plain":"The 300 log is for serious injuries. Someone getting knocked out (loss of consciousness) counts. A band-aid doesn't.","look":"OSHA – Employer Responsibilities (300 Log)","ref":["Florida Contractors Manual  ·  2025 & 2021: 7-6  ·  OSHA - Employer Responsibilities","2017: 7-6  ·  OSHA - Responsibilities"]},{"id":"1-49","exam":1,"num":49,"stem":"ABC Construction buys a tractor for $157,000. They can depreciate the tractor over seven years. Using the straight-line method, the depreciation in the seventh year is __________.","options":["$10,575","$22,500","$16,275","$33,000"],"answer":1,"topic":"dep","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"163"}],"exp":"Straight-line depreciation is the same every year: $157,000 ÷ 7 ≈ $22,429. The closest choice is **$22,500**. (The official key shows $157,500 ÷ 7, a typo, but the answer is the same.)","plain":"Straight line is the same every year: $157,000 ÷ 7 is about $22,429. Closest choice: $22,500.","look":"Depreciation – Straight Line","tip":"Under straight line, year 7 equals year 1.","calc":1,"ref":["Builder's Guide to Accounting  ·  163  ·  Depreciation - straight line","$157,500 ÷ 7 = $22,429"],"lock":1},{"id":"1-50","exam":1,"num":50,"stem":"When a contractor must perform extra work for a subcontractor or material vendor, the contractor may proceed to recover the cost in the form of a(n) __________.","options":["Addendum","Back charge","Change order","Lien"],"answer":1,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-67"}],"exp":"A **back charge** recovers the cost of work the contractor had to do on behalf of a subcontractor or vendor. A change order changes the owner's contract. An addendum changes the bid documents.","plain":"When you have to do a sub's or supplier's work for them, you charge it back to them. That's a back charge.","look":"Backcharge","ref":["Florida Contractors Manual  ·  10-67  ·  Optional TAB: Backcharge"]},{"id":"1-51","exam":1,"num":51,"stem":"According to the Contractor's Manual, under the completed contract method, a contract is recognized as complete when it is in excess of __________ complete.","options":["75% to 80%","90%","98% or 99%","none of the above"],"answer":2,"topic":"job","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"3-80"}],"exp":"Under the completed contract method (per the manual), a contract counts as complete when it is **98% to 99%** done.","plain":"Under the completed contract method, a job counts as \"done\" at 98–99% complete.","look":"Completed Contract","ref":["Florida Contractors Manual  ·  3-80  ·  Completed contract"],"lock":1},{"id":"1-52","exam":1,"num":52,"stem":"A Change Order is a written instrument prepared by the Architect and signed by the __________.","options":["Owner","Architect","Owner and the Architect","Owner, Contractor, and Architect"],"answer":3,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"7.2.1"}],"exp":"A201 §7.2.1: the Architect prepares a Change Order, and it is signed by the **Owner, Contractor and Architect**. A Construction Change Directive needs only the Owner and Architect.","plain":"A change order needs three signatures: owner, contractor and architect.","look":"A201 7.2 – Change Orders","tip":"CO = 3 signatures. CCD = 2 (no contractor).","ref":["AIA Document A201, 2017  ·  7.2.1  ·  Change orders - Definition of"]},{"id":"1-53","exam":1,"num":53,"stem":"What percentage of the job is complete?","options":["66.67%","60%","75.5%","less than 50%"],"answer":0,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Percent complete = cost to date ÷ total estimated cost = $210,000 ÷ ($210,000 + $105,000) = $210,000 ÷ $315,000 = **66.67%**.","plain":"Percent complete = what you've spent ÷ total expected cost. $210,000 ÷ $315,000 = 66.67%.","look":"Percentage of Completion","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","$210,000 + $105,000 = $315,000","$210,000 ÷ $315,000 = .667 (66.67%)"]},{"id":"1-54","exam":1,"num":54,"stem":"Which of the following is the nearest to the amount of money that has been earned on this job?","options":["$129,870","$255,719","$260,013","$215,303"],"answer":2,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Earned revenue = % complete × contract price = 0.6667 × $390,000 ≈ **$260,013**.","plain":"Multiply percent complete by the contract price: 66.67% × $390,000 ≈ $260,013 earned.","look":"Percentage of Completion","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","Apply percentage complete to contract price - $.6667 x $390,000 = $260,013"],"lock":1},{"id":"1-55","exam":1,"num":55,"stem":"Which of the following is true?","options":["You have unearned income","You have earned more than you've been paid","You have earned exactly what you were paid","You have earned less than you have been paid"],"answer":1,"topic":"job","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"23"}],"exp":"Earned $260,013 but paid (billed) $220,000, so you've **earned more than you've been paid**. That's an underbilling, recorded as an asset (\"costs and earnings in excess of billings\").","plain":"You've earned $260,013 but only been paid $220,000, so you've earned more than you've been paid (underbilled).","look":"Percentage of Completion","scenario":"Your company, Perfect Plus Construction, is partway through a job. The cost of work completed is $210,000. It is estimated that completing the job will cost an additional $105,000. The total contract price of the job is $390,000. You have billed, and been paid, $220,000. Using the percentage of completion method, answer the following 3 questions.","calc":1,"ref":["Builder's Guide to Accounting  ·  23","Paid $220,000 Earned $260,013"]},{"id":"1-56","exam":1,"num":56,"stem":"The federal minimum wage is __________ per hour.","options":["$5.15","$7.25","$10.75","$12.35"],"answer":1,"topic":"labor","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"5-15"}],"exp":"The **federal** minimum wage is **$7.25** an hour and has been since 2009. Florida's state minimum wage is higher and goes up every September 30, but if a question says \"federal,\" answer $7.25.","laws":[["29 U.S.C. § 206","https://www.law.cornell.edu/uscode/text/29/206"]],"plain":"Federal minimum wage is $7.25 an hour. Florida's is higher, but the question says \"federal.\"","look":"Minimum Wage","ref":["Florida Contractors Manual  ·  5-15  ·  Minimum wage"],"lock":1},{"id":"1-57","exam":1,"num":57,"stem":"The job responsibilities of a Superintendent include __________.","options":["Actively participate in creation of a project schedule","Maintain change order log","Prepare back charges","Both A & C"],"answer":3,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-72"}],"exp":"The manual says a superintendent **actively helps create the project schedule and prepares back charges**. Keeping the change order log is a project manager or office task.","plain":"The super helps build the schedule and writes back charges. The change order log is the PM's or office's job.","look":"Job Responsibilities – Superintendent","ref":["Florida Contractors Manual  ·  10-72  ·  Job responsibilities"],"lock":1},{"id":"1-58","exam":1,"num":58,"stem":"Within 3 business days of the date the Contractor becomes aware of an impending or actual cancellation or expiration of any insurance, the Contractor shall provide notice to the __________.","options":["Subcontractor","Owner","Architect","Florida Department of Insurance Compliance"],"answer":1,"topic":"aia","books":["A201"],"cites":[{"book":"A201","eds":null,"loc":"11.1.4"}],"exp":"A201 §11.1.4: within 3 business days of learning of an impending or actual cancellation or expiration of required insurance, the Contractor notifies the **Owner**.","plain":"If your insurance is getting cancelled, tell the owner within 3 business days.","look":"A201 11.1.4 – Insurance – Notice of Cancellation","ref":["AIA Document A201, 2017  ·  11.1.4  ·  Insurance - Notice of Cancellation or Expiration"]},{"id":"1-59","exam":1,"num":59,"stem":"Contractors must send a notice of all demolition projects to Florida Department of Environmental Protection __________ working days before demolition, even if there is no asbestos containing material present.","options":["10","15","5","30"],"answer":0,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"10-97"},{"book":"FCM","eds":["2017"],"loc":"10-97"}],"exp":"FDEP must be notified at least **10 working days** before any demolition, even when no asbestos is present.","laws":[["40 CFR § 61.145","https://www.ecfr.gov/current/title-40/section-61.145"]],"plain":"Tell FDEP 10 working days before ANY demolition, even with no asbestos.","look":"Asbestos / Environmental Compliance","ref":["Florida Contractors Manual  ·  2025 & 2021:10-97  ·  Asbestos","2017:10-97  ·  Environmental compliance"],"lock":1},{"id":"1-60","exam":1,"num":60,"stem":"The check register shows at a glance __________.","options":["What expense categories you have and where your money goes","Your income and expense items by category","Your available balance on a cash basis","The income, expenses, and equity of your company"],"answer":0,"topic":"cash","books":["BGA"],"cites":[{"book":"BGA","eds":null,"loc":"101"}],"exp":"Per the Builder's Guide, the check register shows **what expense categories you have and where your money goes**.","plain":"The check register shows what you spend money on, by category. Basically, where the money goes.","look":"Check Register","ref":["Builder's Guide to Accounting  ·  101  ·  Check register"]},{"id":"1-61","exam":1,"num":61,"stem":"When estimating speeds of equipment for production purposes, they will usually average __________ percent of the speed limit.","options":["70 - 80","70 - 75","40 - 65","75 - 90"],"answer":2,"topic":"est","books":["FCM"],"cites":[{"book":"FCM","eds":null,"loc":"10-27"}],"exp":"For production estimates, equipment usually averages **40% to 65%** of the posted speed limit.","plain":"For planning, figure equipment averages 40–65% of the speed limit, not top speed.","look":"Equipment – Productivity","ref":["Florida Contractors Manual  ·  10-27  ·  Equipment - Productivity"],"lock":1},{"id":"1-62","exam":1,"num":62,"stem":"After the date and time designated for receipt of bids, a Bidder who discovers that it made a clerical error in its Bid shall notify the Architect of such error within __________ day (s).","options":["One","Two","Three","Four"],"answer":1,"topic":"aia","books":["A701"],"cites":[{"book":"A701","eds":null,"loc":"4.4.3"}],"exp":"A701 §4.4.3: a bidder who finds a clerical error in its bid after bids open must notify the Architect within **2 days**.","plain":"Found a typo in your bid after opening? You've got 2 days to tell the architect.","look":"A701 4.4.3 – Bidding Procedures","ref":["AIA Document A701, 2018  ·  4.4.3  ·  TOC: Bidding Procedures"]},{"id":"1-63","exam":1,"num":63,"stem":"A Plumbing Contractor would be required to carry Liability and Property insurance in the respective amounts of __________ and __________.","options":["300,000; 50,000","300,000; 100,000","100,000; 50,000","100,000; 25,000"],"answer":3,"topic":"lic","books":["FCM"],"cites":[{"book":"FCM","eds":["2025","2021"],"loc":"2-16"},{"book":"FCM","eds":["2017"],"loc":"2-19"}],"exp":"61G4-15.003: specialty trades such as plumbing carry **$100,000 public liability and $25,000 property damage**. General, building and residential contractors carry $300,000 and $50,000.","plain":"Plumbers and other specialty trades: $100,000 liability and $25,000 property damage. GCs carry more.","look":"Licensing – Public Liability Insurance","tip":"GC/building/residential = 300/50. Other trades = 100/25.","ref":["Florida Contractors Manual  ·  2025 & 2021: 2-16  ·  Licensing - Public liability","2017: 2-19  ·  Public liability insurance"],"lock":1},{"id":"1-64","exam":1,"num":64,"stem":"An(a) __________ is a valid oral contract.","options":["
